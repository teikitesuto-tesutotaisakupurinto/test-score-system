
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  解答用紙・枠設定 - テスト成績システム
</title>

<link
  rel="stylesheet"
  href="/css/common.css"
>


<style>

/* =========================================================
   BASE
========================================================= */

* {
  box-sizing: border-box;
}


body {
  margin: 0;
  background: #f3f5f7;
}


.main {
  width: 100%;
  max-width: 1500px;
  margin: 0 auto;
  padding: 20px;
}


/* =========================================================
   HEADER
========================================================= */

.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  margin-bottom: 15px;
}


.page-header h1 {
  margin: 0;
  font-size: 24px;
}


.page-description {
  margin: 5px 0 0;
  color: #666;
  font-size: 13px;
}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px;
  margin-bottom: 12px;
  background: #fff;
  border: 1px solid #d5dbe0;
}


.toolbar-file {
  display: flex;
  align-items: center;
  gap: 8px;
}


.toolbar input[type="file"] {
  max-width: 280px;
}


.toolbar-status {
  width: 100%;
  margin-top: 3px;
  padding: 9px 10px;
  background: #f5f6f7;
  border: 1px solid #e1e5e8;
  color: #555;
  font-size: 12px;
  line-height: 1.6;
}


/* =========================================================
   VIEWER
========================================================= */

.viewer {
  min-height: 600px;
  padding: 20px;
  background: #dfe3e8;
  border: 1px solid #ccd2d7;
  overflow: auto;
}


.page {
  position: relative;
  width: min(100%, 1000px);
  margin: 0 auto 25px;
  background: #fff;
  box-shadow:
    0 2px 10px rgba(0, 0, 0, .15);
}


.page canvas {
  display: block;
  width: 100%;
  height: auto;
}


.page .layer {
  position: absolute;
  inset: 0;
}


/* =========================================================
   BOX
========================================================= */

.box {
  position: absolute;
  min-width: 8px;
  min-height: 8px;
  cursor: move;
  z-index: 10;
}


.box.selected {
  outline: 3px solid #111;
  outline-offset: 1px;
}


.box-label {
  position: absolute;
  top: -25px;
  left: 0;
  padding: 3px 7px;
  background: #222;
  color: #fff;
  font-size: 11px;
  line-height: 1.3;
  white-space: nowrap;
  pointer-events: none;
}


.resize {
  position: absolute;
  right: -5px;
  bottom: -5px;
  width: 11px;
  height: 11px;
  background: #222;
  cursor: nwse-resize;
}


/* =========================================================
   EMPTY
========================================================= */

.empty-view {
  padding: 70px 20px;
  text-align: center;
  color: #666;
}


.empty-view strong {
  display: block;
  margin-bottom: 8px;
  color: #333;
}


/* =========================================================
   BOX SETTINGS PANEL
========================================================= */

.box-settings-panel {
  position: fixed;
  top: 85px;
  right: 20px;
  width: 320px;
  max-width: calc(100vw - 40px);
  background: #fff;
  border: 1px solid #cbd1d6;
  box-shadow:
    0 8px 28px rgba(0, 0, 0, .2);
  z-index: 1000;
}


.box-settings-panel[hidden] {
  display: none;
}


/* =========================================================
   PANEL HEADER
========================================================= */

.box-settings-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 14px;
  background: #f4f6f8;
  border-bottom: 1px solid #dfe3e6;
}


.box-settings-title {
  margin: 0;
  font-size: 15px;
  font-weight: 700;
}


.panel-close {
  border: 0;
  background: transparent;
  cursor: pointer;
  padding: 5px 8px;
  font-size: 12px;
}


.panel-close:hover {
  background: #e7eaed;
}


/* =========================================================
   PANEL BODY
========================================================= */

.box-settings-body {
  padding: 15px;
}


.setting-group {
  margin-bottom: 15px;
}


.setting-group label {
  display: block;
  margin-bottom: 6px;
  font-size: 12px;
  font-weight: 700;
}


.box-role-select,
.label-input {
  display: block;
  width: 100%;
  height: 40px;
  padding: 0 10px;
  border: 1px solid #c8ced4;
  border-radius: 3px;
  background: #fff;
  font-size: 14px;
}


.box-role-select:focus,
.label-input:focus {
  outline: 2px solid #d7e5f2;
  border-color: #6d8eaa;
}


/* =========================================================
   ROLE HELP
========================================================= */

.parent-info {
  padding: 10px;
  margin-bottom: 15px;
  background: #f6f7f8;
  border: 1px solid #e0e4e7;
  color: #666;
  font-size: 11px;
  line-height: 1.7;
}


.parent-info strong {
  color: #333;
}


/* =========================================================
   PANEL ACTIONS
========================================================= */

.setting-actions {
  display: flex;
  gap: 8px;
}


.setting-actions button {
  flex: 1;
  min-height: 40px;
}


.delete-box-button {
  border: 1px solid #c94b43;
  background: #fff;
  color: #b42318;
}


.delete-box-button:hover {
  background: #fff5f3;
}


/* =========================================================
   LEGEND
========================================================= */

.role-guide {
  margin-top: 15px;
  padding-top: 15px;
  border-top: 1px solid #e1e5e8;
}


.role-guide-title {
  margin-bottom: 8px;
  font-size: 12px;
  font-weight: 700;
}


.role-guide-row {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 4px 0;
  font-size: 11px;
}


.role-guide-row span:first-child {
  font-weight: 700;
}


.role-guide-row span:last-child {
  color: #666;
  text-align: right;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

  .main {
    padding: 12px;
  }


  .page-header {
    display: block;
  }


  .viewer {
    padding: 8px;
  }


  .box-settings-panel {
    top: auto;
    right: 10px;
    bottom: 10px;
    left: 10px;
    width: auto;
    max-width: none;
  }


  .toolbar {
    display: block;
  }


  .toolbar > * {
    margin-bottom: 7px;
  }

}

</style>

</head>


<body>


<!-- =======================================================
     HEADER
======================================================= -->

<header class="topbar">

  <div class="system-name">
    テスト成績システム
  </div>


  <div class="topbar-space"></div>


  <span id="teacherName">
    -
  </span>


  <button
    id="logoutButton"
    class="logout-button"
    type="button"
  >
    ログアウト
  </button>

</header>


<!-- =======================================================
     MAIN
======================================================= -->

<main class="main">


  <header class="page-header">

    <div>

      <h1>
        解答用紙・枠設定
      </h1>

      <p class="page-description">
        解答用紙を登録し、大問・小問・QR・小計・合計などの枠を設定します。
      </p>

    </div>

  </header>


  <!-- =====================================================
       TOOLBAR
  ===================================================== -->

  <section class="toolbar">


    <div
      class="toolbar-file"
    >

      <input
        id="answerFile"
        type="file"
        accept=".pdf,.jpg,.jpeg,.png,.webp"
      >

    </div>


    <button
      id="uploadButton"
      type="button"
      class="btn btn-primary"
    >
      解答用紙を登録
    </button>


    <button
      id="saveButton"
      type="button"
      class="btn btn-primary"
    >
      枠を保存
    </button>


    <button
      id="deleteButton"
      type="button"
      class="btn"
    >
      選択枠を削除
    </button>


    <button
      id="backButton"
      type="button"
      class="btn"
    >
      戻る
    </button>


    <div
      id="status"
      class="toolbar-status"
    >
      解答用紙を登録してください。
    </div>

  </section>


  <!-- =====================================================
       VIEWER
  ===================================================== -->

  <section
    id="viewer"
    class="viewer"
  >

    <div class="empty-view">

      <strong>
        解答用紙がありません
      </strong>

      PDFまたは画像の解答用紙を登録してください。

    </div>

  </section>


</main>


<!-- =======================================================
     BOX SETTINGS
     
     配点・設問IDはここには置かない。
     配点は後の配点設定で行う。
======================================================= -->

<aside
  id="panel"
  class="box-settings-panel"
  hidden
>


  <header
    class="box-settings-header"
  >

    <h2
      class="box-settings-title"
    >
      枠設定
    </h2>


    <button
      id="closeButton"
      class="panel-close"
      type="button"
    >
      閉じる
    </button>

  </header>


  <div
    class="box-settings-body"
  >


    <!-- =================================================
         BOX ROLE
    ================================================== -->

    <div
      class="setting-group"
    >

      <label
        for="boxRole"
      >
        枠種類
      </label>


      <select
        id="boxRole"
        class="box-role-select"
      >

        <option value="major">
          大問
        </option>

        <option value="minor">
          小問
        </option>

        <option value="qr">
          QR
        </option>

        <option value="subtotal">
          小計
        </option>

        <option value="total">
          合計
        </option>

        <option value="name">
          氏名
        </option>

        <option value="student_no">
          生徒番号
        </option>

        <option value="instruction">
          説明
        </option>

        <option value="other">
          その他
        </option>

      </select>

    </div>


    <!-- =================================================
         LABEL
    ================================================== -->

    <div
      class="setting-group"
    >

      <label
        for="label"
      >
        表示名
      </label>


      <input
        id="label"
        class="label-input"
        type="text"
        placeholder="例：大問1 / 問1 / QR"
      >

    </div>


    <!-- =================================================
         PARENT INFO
    ================================================== -->

    <div
      id="parentInfo"
      class="parent-info"
    >

      枠を選択してください。

    </div>


    <!-- =================================================
         ACTIONS
    ================================================== -->

    <div
      class="setting-actions"
    >

      <button
        id="applyButton"
        type="button"
        class="btn btn-primary"
      >
        反映
      </button>


      <button
        id="panelDeleteButton"
        type="button"
        class="delete-box-button"
      >
        選択枠を削除
      </button>

    </div>


    <!-- =================================================
         GUIDE
    ================================================== -->

    <div
      class="role-guide"
    >

      <div
        class="role-guide-title"
      >
        枠種類について
      </div>


      <div
        class="role-guide-row"
      >

        <span>
          大問
        </span>

        <span>
          大問の範囲
        </span>

      </div>


      <div
        class="role-guide-row"
      >

        <span>
          小問
        </span>

        <span>
          採点する解答欄
        </span>

      </div>


      <div
        class="role-guide-row"
      >

        <span>
          QR
        </span>

        <span>
          生徒特定用QR
        </span>

      </div>


      <div
        class="role-guide-row"
      >

        <span>
          小計
        </span>

        <span>
          大問などの小計
        </span>

      </div>


      <div
        class="role-guide-row"
      >

        <span>
          合計
        </span>

        <span>
          総合計
        </span>

      </div>


      <div
        class="role-guide-row"
      >

        <span>
          氏名
        </span>

        <span>
          氏名欄
        </span>

      </div>


      <div
        class="role-guide-row"
      >

        <span>
          生徒番号
        </span>

        <span>
          生徒番号欄
        </span>

      </div>

    </div>

  </div>

</aside>


<!-- =======================================================
     SCRIPTS
======================================================= -->

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script
  src="/js/config.js"
></script>


<script
  src="/js/auth.js"
></script>


<script
  src="/js/teacher/test-pages.js"
></script>


<script>

/* =========================================================
   PANEL DELETE BUTTON

   test-pages.jsの
   deleteSelectedBox() は
   IIFE内部なので直接呼べない。

   そのため、パネルの削除ボタンは
   上部の既存削除ボタンをクリックする。
========================================================= */

document
  .getElementById(
    "panelDeleteButton"
  )
  ?.addEventListener(
    "click",
    () => {

      document
        .getElementById(
          "deleteButton"
        )
        ?.click();

    }
  );


/* =========================================================
   パネル表示時の重複対策
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key ===
      "Escape"
    ) {

      document
        .getElementById(
          "closeButton"
        )
        ?.click();

    }

  }
);

</script>


</body>

</html>
