
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>答案アップロード - テスト成績システム</title>

<link
  rel="stylesheet"
  href="/css/common.css"
>


<style>

* {
  box-sizing: border-box;
}


body {
  margin: 0;
  background: #f3f5f7;
}


.main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px;
}


.card {
  background: #fff;
  border: 1px solid #d7dce1;
  padding: 20px;
}


.form-row {
  margin-bottom: 18px;
}


.form-row label {
  display: block;
  margin-bottom: 7px;
  font-weight: 700;
  font-size: 13px;
}


#test {
  width: 100%;
  height: 42px;
  padding: 0 10px;
  border: 1px solid #c8ced4;
  background: #fff;
}


.drop-zone {
  min-height: 180px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  border: 2px dashed #aeb6bd;
  background: #fafbfc;
  cursor: pointer;
  margin-bottom: 15px;
}


.drop-zone.dragover {
  border-color: #2468a8;
  background: #f1f6fa;
}


.drop-zone strong {
  display: block;
  margin-bottom: 8px;
}


.file-list {
  margin-top: 15px;
}


.file-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px;
  border: 1px solid #e0e4e7;
  margin-bottom: 7px;
  background: #fff;
}


.file-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}


.file-size {
  color: #777;
  font-size: 12px;
  white-space: nowrap;
}


.remove-file {
  border: 0;
  background: transparent;
  cursor: pointer;
  color: #a22;
}


.actions {
  display: flex;
  gap: 8px;
  margin-top: 18px;
}


button {
  min-height: 40px;
}


#msg {
  margin-top: 15px;
  padding: 10px;
  background: #f5f6f7;
  border: 1px solid #e1e5e8;
  font-size: 13px;
}


.spec {
  margin-top: 18px;
  padding: 12px;
  background: #f5f6f7;
  border: 1px solid #e1e5e8;
  color: #555;
  font-size: 12px;
  line-height: 1.7;
}

</style>

</head>


<body>


<header class="topbar">

  <div class="system-name">
    テスト成績システム
  </div>

  <div class="topbar-space"></div>

  <span id="teacherName">
    -
  </span>

  <button
    id="logoutButton"
    class="logout-button"
    type="button"
  >
    ログアウト
  </button>

</header>


<main class="main">

  <h1>
    答案アップロード
  </h1>


  <div class="card">


    <!-- ===============================================
         TEST
    ================================================ -->

    <div class="form-row">

      <label for="test">
        テスト
      </label>

      <select id="test">

        <option value="">
          テストを選択してください
        </option>

      </select>

    </div>


    <!-- ===============================================
         ANSWER TYPE
    ================================================ -->

    <div class="form-row">

      <label>
        答案種類
      </label>

      <select id="answerType">

        <option value="student">
          生徒答案
        </option>

        <option value="model">
          解答用紙・模範解答
        </option>

      </select>

    </div>


    <!-- ===============================================
         DROP
    ================================================ -->

    <div
      id="dropZone"
      class="drop-zone"
    >

      <div>

        <strong>
          ファイルをここへドロップ
        </strong>

        またはクリックして選択

        <div style="margin-top:8px;font-size:12px;color:#777;">
          PDF / JPG / JPEG / PNG / WEBP / ZIP
        </div>

      </div>

    </div>


    <input
      id="files"
      type="file"
      multiple
      accept=".pdf,.jpg,.jpeg,.png,.webp,.zip"
      hidden
    >


    <!-- ===============================================
         FILE LIST
    ================================================ -->

    <div
      id="fileList"
      class="file-list"
    ></div>


    <!-- ===============================================
         ACTIONS
    ================================================ -->

    <div class="actions">

      <button
        id="upload"
        type="button"
        class="btn btn-primary"
      >
        アップロード
      </button>


      <button
        id="clear"
        type="button"
        class="btn"
      >
        クリア
      </button>

    </div>


    <div
      id="msg"
      hidden
    ></div>


    <!-- ===============================================
         SPEC
    ================================================ -->

    <div class="spec">

      <strong>
        アップロード仕様
      </strong>

      <br>

      ・PDFはページ単位で処理します。

      <br>

      ・JPEG / JPG / PNG / WEBPは画像答案として処理します。

      <br>

      ・ZIPは内部の対応ファイルを展開して処理します。

      <br>

      ・複数ファイルを一度に選択できます。

      <br>

      ・生徒答案はアップロード後に答案紐付け処理を行います。

      <br>

      ・解答用紙・模範解答は模範解答Storageへ保存します。

    </div>

  </div>

</main>


<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="/js/config.js"></script>

<script src="/js/auth.js"></script>


<script>

(function () {

  "use strict";


  let selectedFiles = [];


  const test =
    document.getElementById(
      "test"
    );


  const answerType =
    document.getElementById(
      "answerType"
    );


  const files =
    document.getElementById(
      "files"
    );


  const dropZone =
    document.getElementById(
      "dropZone"
    );


  const fileList =
    document.getElementById(
      "fileList"
    );


  const upload =
    document.getElementById(
      "upload"
    );


  const clear =
    document.getElementById(
      "clear"
    );


  const msg =
    document.getElementById(
      "msg"
    );


  const teacherName =
    document.getElementById(
      "teacherName"
    );


  /* =====================================================
     INIT
  ===================================================== */

  async function init() {

    const profile =
      await requireTeacher();


    if (!profile) {
      return;
    }


    if (teacherName) {

      teacherName.textContent =
        profile.name ||
        "先生";

    }


    await loadTests();

    setupEvents();

  }


  /* =====================================================
     TESTS
  ===================================================== */

  async function loadTests() {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("tests")
        .select(`
          id,
          name,
          subject,
          grade,
          created_at
        `)
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (error) {

      showMessage(
        error.message,
        true
      );

      return;

    }


    test.innerHTML = `

      <option value="">
        テストを選択してください
      </option>

    `;


    (
      data || []
    ).forEach(
      item => {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          item.id;


        option.textContent =
          [
            item.name,
            item.subject
          ]
            .filter(Boolean)
            .join(
              " / "
            );


        test.appendChild(
          option
        );

      }
    );

  }


  /* =====================================================
     EVENTS
  ===================================================== */

  function setupEvents() {

    dropZone.addEventListener(
      "click",
      () => {

        files.click();

      }
    );


    files.addEventListener(
      "change",
      () => {

        addFiles(
          files.files
        );

        files.value =
          "";

      }
    );


    dropZone.addEventListener(
      "dragover",
      event => {

        event.preventDefault();

        dropZone.classList.add(
          "dragover"
        );

      }
    );


    dropZone.addEventListener(
      "dragleave",
      () => {

        dropZone.classList.remove(
          "dragover"
        );

      }
    );


    dropZone.addEventListener(
      "drop",
      event => {

        event.preventDefault();

        dropZone.classList.remove(
          "dragover"
        );


        addFiles(
          event.dataTransfer.files
        );

      }
    );


    clear.addEventListener(
      "click",
      clearFiles
    );


    upload.addEventListener(
      "click",
      uploadFiles
    );


    document
      .getElementById(
        "logoutButton"
      )
      ?.addEventListener(
        "click",
        logout
      );

  }


  /* =====================================================
     ADD FILES
  ===================================================== */

  function addFiles(
    fileListObject
  ) {

    const allowed = [
      "pdf",
      "jpg",
      "jpeg",
      "png",
      "webp",
      "zip"
    ];


    for (
      const file
      of Array.from(
        fileListObject || []
      )
    ) {

      const ext =
        getExtension(
          file.name
        );


      if (
        !allowed.includes(
          ext
        )
      ) {

        showMessage(
          `${file.name} は対応していない形式です。`,
          true
        );

        continue;

      }


      const exists =
        selectedFiles.some(
          item =>
            item.name ===
              file.name &&
            item.size ===
              file.size &&
            item.lastModified ===
              file.lastModified
        );


      if (!exists) {

        selectedFiles.push(
          file
        );

      }

    }


    renderFileList();

  }


  /* =====================================================
     FILE LIST
  ===================================================== */

  function renderFileList() {

    fileList.innerHTML =
      "";


    selectedFiles.forEach(
      (
        file,
        index
      ) => {

        const row =
          document.createElement(
            "div"
          );


        row.className =
          "file-item";


        const left =
          document.createElement(
            "div"
          );


        left.style.minWidth =
          "0";


        const name =
          document.createElement(
            "div"
          );


        name.className =
          "file-name";


        name.textContent =
          file.name;


        const size =
          document.createElement(
            "div"
          );


        size.className =
          "file-size";


        size.textContent =
          formatBytes(
            file.size
          );


        left.appendChild(
          name
        );


        left.appendChild(
          size
        );


        const remove =
          document.createElement(
            "button"
          );


        remove.type =
          "button";


        remove.className =
          "remove-file";


        remove.textContent =
          "削除";


        remove.addEventListener(
          "click",
          () => {

            selectedFiles.splice(
              index,
              1
            );


            renderFileList();

          }
        );


        row.appendChild(
          left
        );


        row.appendChild(
          remove
        );


        fileList.appendChild(
          row
        );

      }
    );

  }


  /* =====================================================
     UPLOAD
  ===================================================== */

  async function uploadFiles() {

    if (!test.value) {

      showMessage(
        "テストを選択してください。",
        true
      );

      return;

    }


    if (!selectedFiles.length) {

      showMessage(
        "アップロードするファイルを選択してください。",
        true
      );

      return;

    }


    try {

      upload.disabled =
        true;


      showMessage(
        "アップロードしています..."
      );


      for (
        let i = 0;
        i < selectedFiles.length;
        i++
      ) {

        const file =
          selectedFiles[i];


        const path =
          [
            "uploads",
            test.value,
            crypto.randomUUID(),
            sanitizeFileName(
              file.name
            )
          ].join("/");


        /*
          生徒答案
        */

        if (
          answerType.value ===
          "student"
        ) {

          const {
            error:
              storageError
          } =
            await supabaseClient
              .storage
              .from(
                "answers"
              )
              .upload(
                path,
                file,
                {
                  upsert:
                    false
                }
              );


          if (storageError) {

            throw storageError;

          }


          const {
            error:
              insertError
          } =
            await supabaseClient
              .from(
                "answer_sheets"
              )
              .insert({

                test_id:
                  test.value,

                file_path:
                  path,

                status:
                  "unmatched"

              });


          if (insertError) {

            throw insertError;

          }

        }


        /*
          解答用紙・模範解答
        */

        else {

          const {
            error:
              storageError
          } =
            await supabaseClient
              .storage
              .from(
                "model-answers"
              )
              .upload(
                path,
                file,
                {
                  upsert:
                    false
                }
              );


          if (storageError) {

            throw storageError;

          }

        }

      }


      showMessage(
        "アップロードしました。"
      );


      clearFiles();


    } catch (error) {

      console.error(
        "answer upload:",
        error
      );


      showMessage(
        error.message ||
        "アップロードに失敗しました。",
        true
      );

    } finally {

      upload.disabled =
        false;

    }

  }


  /* =====================================================
     CLEAR
  ===================================================== */

  function clearFiles() {

    selectedFiles =
      [];


    renderFileList();

  }


  /* =====================================================
     MESSAGE
  ===================================================== */

  function showMessage(
    text,
    isError = false
  ) {

    msg.hidden =
      false;


    msg.textContent =
      text;


    msg.style.color =
      isError
        ? "#b42318"
        : "#333";

  }


  /* =====================================================
     HELPERS
  ===================================================== */

  function getExtension(
    name
  ) {

    const parts =
      String(
        name || ""
      )
        .toLowerCase()
        .split(".");


    return parts.length > 1
      ? parts.pop()
      : "";

  }


  function sanitizeFileName(
    name
  ) {

    return String(
      name || "file"
    )
      .replace(
        /[\\/:*?"<>|]/g,
        "_"
      );

  }


  function formatBytes(
    bytes
  ) {

    if (
      !Number.isFinite(
        bytes
      )
    ) {

      return "";

    }


    if (
      bytes < 1024
    ) {

      return `${bytes} B`;

    }


    if (
      bytes < 1024 * 1024
    ) {

      return `${(
        bytes / 1024
      ).toFixed(1)} KB`;

    }


    return `${(
      bytes /
      1024 /
      1024
    ).toFixed(1)} MB`;

  }


  /* =====================================================
     START
  ===================================================== */

  init();

})();

</script>

</body>

</html>
