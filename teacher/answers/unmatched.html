<!DOCTYPE html>
<html lang="ja">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    未紐付け答案 - テスト成績システム
  </title>

  <link
    rel="stylesheet"
    href="/css/common.css"
  >

</head>

<body>

<header class="topbar">

  <div class="system-name">
    テスト成績システム
  </div>

  <div class="topbar-space"></div>

  <span id="teacherName">-</span>

  <button
    id="logoutButton"
    class="logout-button"
  >
    ログアウト
  </button>

</header>


<div class="teacher-layout">

  <aside class="sidebar">

    <div class="sidebar-title">
      答案
    </div>

    <a
      href="/teacher/answers/upload"
      class="menu-link"
    >
      答案アップロード
    </a>

    <a
      href="/teacher/answers/processing"
      class="menu-link"
    >
      処理状況
    </a>

    <a
      href="/teacher/answers/unmatched"
      class="menu-link active"
    >
      未紐付け答案
    </a>

    <a
      href="/teacher/answers/matched"
      class="menu-link"
    >
      紐付け済み答案
    </a>

  </aside>


  <main class="main-content">

    <div class="page-header">

      <h1>
        未紐付け答案
      </h1>

    </div>


    <div class="card">

      <p>
        QRが読み取れなかった答案です。
        生徒番号を選択して手動で紐付けできます。
      </p>

    </div>


    <div
      id="answerList"
    >

      <div class="card">
        読み込み中...
      </div>

    </div>

  </main>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="/js/config.js"></script>

<script src="/js/auth.js"></script>

<script src="/js/teacher/answer-unmatched.js"></script>

</body>
</html>
