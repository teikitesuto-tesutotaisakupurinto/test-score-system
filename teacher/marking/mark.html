
<!doctype html>
<html lang="ja">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
  テスト採点 - テスト成績システム
</title>

<link
  rel="stylesheet"
  href="/css/common.css"
>

<style>

.marking-main {
  max-width: 1500px;
  margin: 0 auto;
  padding: 22px;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 15px;
}

.status {
  padding: 10px 12px;
  margin-bottom: 15px;

  background: #f5f6f7;

  border: 1px solid #d5dbe0;

  font-size: 13px;
}

.progress {
  display: none;

  margin-bottom: 15px;
  padding: 14px;

  background: #fff;

  border: 1px solid #d0d6dc;
}

.progress.show {
  display: block;
}

.progress-track {
  height: 8px;

  background: #e1e5e8;

  border-radius: 4px;

  overflow: hidden;
}

.progress-bar {
  width: 0;
  height: 100%;

  background: #1769aa;

  transition: width .2s;
}

.progress-text {
  margin-top: 7px;

  color: #666;

  font-size: 12px;
}

.question-header {
  display: flex;
  flex-wrap: wrap;

  justify-content: space-between;
  align-items: center;

  gap: 12px;

  padding: 15px;
  margin-bottom: 15px;

  background: #fff;

  border: 1px solid #d0d6dc;
}

.question-title {
  font-size: 20px;
  font-weight: 700;
}

.question-meta {
  margin-top: 5px;

  color: #666;

  font-size: 13px;
}

.navigation {
  display: flex;
  gap: 8px;
}

.answer-table-wrap {
  overflow-x: auto;

  background: #fff;

  border: 1px solid #d0d6dc;
}

.answer-table {
  width: 100%;

  min-width: 1050px;

  border-collapse: collapse;
}

.answer-table th,
.answer-table td {
  border: 1px solid #d0d6dc;

  padding: 9px;

  vertical-align: top;

  font-size: 13px;
}

.answer-table th {
  background: #f3f5f7;

  font-weight: 700;
}

.student-cell {
  width: 150px;
  min-width: 150px;
}

.student-no {
  font-weight: 700;
}

.student-name {
  margin-top: 4px;

  color: #555;
}

.answer-cell {
  width: 520px;
  min-width: 520px;
}

.answer-viewer {
  position: relative;

  overflow: hidden;

  width: 100%;

  min-height: 160px;

  background: #f7f8f9;

  border: 1px solid #e0e3e6;
}

.answer-viewer img {
  position: absolute;

  max-width: none;
  max-height: none;

  margin: 0;

  user-select: none;
}

.answer-error {
  padding: 40px 10px;

  text-align: center;

  color: #b42318;
}

.score-cell {
  width: 150px;
  min-width: 150px;

  text-align: center;
}

.score-input {
  width: 90px;

  height: 40px;

  padding: 0 8px;

  font-size: 17px;

  text-align: center;
}

.score-save {
  margin-top: 7px;
}

.score-state {
  margin-top: 7px;

  color: #666;

  font-size: 12px;
}

.score-state.marked {
  color: #1769aa;

  font-weight: 700;
}

.score-state.error {
  color: #b42318;

  font-weight: 700;
}

.warning {
  display: none;

  margin-top: 7px;

  padding: 7px;

  color: #b42318;

  background: #fff4f2;

  border: 1px solid #efc2bc;

  font-size: 12px;
}

.warning.show {
  display: block;
}

.complete {
  display: none;

  margin-top: 15px;

  padding: 18px;

  background: #fff;

  border: 1px solid #d0d6dc;
}

.complete.show {
  display: block;
}

.complete-title {
  margin-bottom: 8px;

  font-size: 18px;

  font-weight: 700;
}

.empty {
  padding: 50px;

  text-align: center;

  color: #777;
}

</style>

</head>


<body>


<header class="topbar">

  <div class="system-name">
    テスト成績システム
  </div>


  <div class="topbar-space"></div>


  <span id="teacherName">
    -
  </span>


  <button
    id="logoutButton"
    class="logout-button"
    type="button"
  >
    ログアウト
  </button>

</header>


<main class="marking-main">


  <div class="toolbar">

    <a
      href="/teacher/marking"
      class="btn"
    >
      採点一覧へ戻る
    </a>


    <a
      id="pointsButton"
      href="#"
      class="btn"
    >
      配点設定
    </a>


    <button
      id="refreshButton"
      class="btn"
      type="button"
    >
      更新
    </button>

  </div>


  <div
    id="status"
    class="status"
  >
    JavaScriptを起動しています...
  </div>


  <div
    id="progress"
    class="progress"
  >

    <div
      id="progressText"
      class="progress-text"
    >
      -
    </div>


    <div class="progress-track">

      <div
        id="progressBar"
        class="progress-bar"
      ></div>

    </div>

  </div>


  <section
    class="question-header"
  >

    <div>

      <div
        id="questionTitle"
        class="question-title"
      >
        -
      </div>


      <div
        id="questionMeta"
        class="question-meta"
      >
        -
      </div>

    </div>


    <div class="navigation">

      <button
        id="previousButton"
        class="btn"
        type="button"
        disabled
      >
        前の問題
      </button>


      <button
        id="nextButton"
        class="btn btn-primary"
        type="button"
      >
        次の問題
      </button>

    </div>

  </section>


  <section
    id="answerTableWrap"
    class="answer-table-wrap"
  >

    <div class="empty">
      答案を読み込んでいます...
    </div>

  </section>


  <section
    id="complete"
    class="complete"
  >

    <div class="complete-title">
      全答案・全設問の採点が完了しました。
    </div>


    <div>
      成績・偏差値・順位の処理が完了するまで公開しません。
    </div>

  </section>


</main>


<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script src="/js/config.js"></script>

<script src="/js/auth.js"></script>


<script
  src="/js/teacher/marking.js?v=20261115"
></script>


<script>

"use strict";


(function () {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const testId =
    params.get(
      "test"
    );


  const pointsButton =
    document.getElementById(
      "pointsButton"
    );


  if (
    pointsButton &&
    testId
  ) {

    pointsButton.href =
      `/teacher/tests/points?test=${encodeURIComponent(
        testId
      )}`;

  }

})();

</script>


</body>

</html>
