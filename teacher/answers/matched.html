<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    紐付け済み答案 - テスト成績システム
  </title>

  <link
    rel="stylesheet"
    href="/css/common.css"
  >

</head>

<body>

<header class="topbar">

  <div class="system-name">
    テスト成績システム
  </div>

  <div class="topbar-space"></div>

  <span id="teacherName">-</span>

  <button
    id="logoutButton"
    class="logout-button"
  >
    ログアウト
  </button>

</header>


<div class="teacher-layout">

  <aside class="sidebar">

    <div class="sidebar-title">
      答案
    </div>

    <a
      href="/teacher/answers/upload"
      class="menu-link"
    >
      答案アップロード
    </a>

    <a
      href="/teacher/answers/processing"
      class="menu-link"
    >
      処理状況
    </a>

    <a
      href="/teacher/answers/unmatched"
      class="menu-link"
    >
      未紐付け答案
    </a>

    <a
      href="/teacher/answers/matched"
      class="menu-link active"
    >
      紐付け済み答案
    </a>

  </aside>


  <main class="main-content">

    <div class="page-header">

      <h1>
        紐付け済み答案
      </h1>

    </div>


    <div class="card">

      <div
        style="
          display:flex;
          gap:10px;
          flex-wrap:wrap;
        "
      >

        <select
          id="testFilter"
          style="max-width:300px;"
        >

          <option value="">
            全テスト
          </option>

        </select>


        <input
          id="studentSearch"
          type="search"
          placeholder="生徒番号・氏名で検索"
          style="max-width:300px;"
        >


        <button
          id="reloadButton"
          class="btn"
        >
          更新
        </button>

      </div>

    </div>


    <div class="card">

      <div style="overflow:auto;">

        <table class="table">

          <thead>

            <tr>

              <th>
                テスト
              </th>

              <th>
                生徒番号
              </th>

              <th>
                氏名
              </th>

              <th>
                紐付け方法
              </th>

              <th>
                状態
              </th>

              <th>
                操作
              </th>

            </tr>

          </thead>

          <tbody id="answerRows">

            <tr>

              <td
                colspan="6"
                style="text-align:center;"
              >
                読み込み中...
              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </main>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="/js/config.js"></script>

<script src="/js/auth.js"></script>

<script src="/js/teacher/answer-matched.js"></script>

</body>
</html>
