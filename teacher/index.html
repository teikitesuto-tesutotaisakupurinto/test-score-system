
<!doctype html>
<html lang="ja">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
  テスト管理 - テスト成績システム
</title>

<link
  rel="stylesheet"
  href="/css/common.css"
>

<style>

.teacher-home {
  max-width:1200px;

  margin:0 auto;

  padding:22px;
}


.teacher-actions {
  display:grid;

  grid-template-columns:
    repeat(
      3,
      minmax(0,1fr)
    );

  gap:12px;

  margin-top:15px;
}


.teacher-action {
  display:block;

  padding:18px;

  background:#fff;

  border:
    1px solid #d0d6dc;

  text-decoration:none;

  color:#222;

  border-radius:4px;
}


.teacher-action:hover {
  background:#f5f7f8;
}


.teacher-action-title {
  font-weight:700;

  font-size:16px;
}


.teacher-action-description {
  margin-top:5px;

  color:#666;

  font-size:12px;

  line-height:1.7;
}


@media(max-width:850px) {

  .teacher-actions {
    grid-template-columns:
      repeat(
        2,
        minmax(0,1fr)
      );
  }

}


@media(max-width:550px) {

  .teacher-home {
    padding:12px;
  }


  .teacher-actions {
    grid-template-columns:1fr;
  }

}

</style>

</head>


<body>


<header class="topbar">

<div class="system-name">
  テスト成績システム
</div>


<div class="topbar-space"></div>


<span id="teacherName">
  -
</span>


<button
id="logoutButton"
class="logout-button"
type="button"
>
  ログアウト
</button>

</header>


<main class="teacher-home">


<div class="page-header">

<h1>
  教師ダッシュボード
</h1>

</div>


<section class="teacher-actions">


<a
href="/teacher/students"
class="teacher-action"
>

<div class="teacher-action-title">
  生徒管理
</div>

<div class="teacher-action-description">
  生徒の登録・編集・一覧確認
</div>

</a>


<a
href="/teacher/classes"
class="teacher-action"
>

<div class="teacher-action-title">
  クラス管理
</div>

<div class="teacher-action-description">
  クラス作成と所属生徒の管理
</div>

</a>


<a
href="/teacher/tests"
class="teacher-action"
>

<div class="teacher-action-title">
  テスト管理
</div>

<div class="teacher-action-description">
  テスト作成・枠設定・配点設定
</div>

</a>


<a
href="/teacher/answers/upload"
class="teacher-action"
>

<div class="teacher-action-title">
  答案アップロード
</div>

<div class="teacher-action-description">
  生徒答案を登録しQRから自動紐付け
</div>

</a>


<a
href="/teacher/answers/processing"
class="teacher-action"
>

<div class="teacher-action-title">
  答案処理状況
</div>

<div class="teacher-action-description">
  未紐付け・採点待ち・採点済みを確認
</div>

</a>


<a
href="/teacher/marking"
class="teacher-action"
>

<div class="teacher-action-title">
  デジタル採点
</div>

<div class="teacher-action-description">
  同じ設問の答案をまとめて高速採点
</div>

</a>


<a
href="/teacher/results/summary"
class="teacher-action"
>

<div class="teacher-action-title">
  結果総括表
</div>

<div class="teacher-action-description">
  点数・平均・得点率・順位を確認
</div>

</a>


<a
href="/teacher/results/return"
class="teacher-action"
>

<div class="teacher-action-title">
  答案返却
</div>

<div class="teacher-action-description">
  採点済み答案を印刷・PDF・PNGで返却
</div>

</a>


<a
href="/teacher/tests/publish"
class="teacher-action"
>

<div class="teacher-action-title">
  公開状態
</div>

<div class="teacher-action-description">
  成績確定と生徒への自動公開状態を確認
</div>

</a>


</section>


</main>


<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script
src="/js/config.js"
></script>


<script
src="/js/auth.js"
></script>


<script>

"use strict";


document.addEventListener(
  "DOMContentLoaded",
  async () => {

    try {

      const auth =
        await requireRole(
          "teacher"
        );


      if (!auth) {

        return;

      }


      document.getElementById(
        "teacherName"
      ).textContent =
        auth.profile?.name ||
        "先生";


    } catch (error) {

      console.error(
        error
      );

    }

  }
);


document
  .getElementById(
    "logoutButton"
  )
  ?.addEventListener(
    "click",
    async () => {

      await logout();

    }
  );

</script>



<script src="/js/common-sidebar.js?v=20261126"></script>
</body>

</html>
