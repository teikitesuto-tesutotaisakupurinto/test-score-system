<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    解答用紙登録 - テスト成績システム
  </title>

  <link
    rel="stylesheet"
    href="/css/common.css"
  >

</head>


<body>


<header class="topbar">

  <div class="system-name">
    テスト成績システム
  </div>


  <div class="topbar-space"></div>


  <span id="teacherName">
    -
  </span>


  <button
    id="logoutButton"
    class="logout-button"
    type="button"
  >
    ログアウト
  </button>

</header>



<div class="teacher-layout">


  <!-- =========================
       サイドバー
  ========================== -->

  <aside class="sidebar">


    <div class="sidebar-title">
      テスト設定
    </div>


    <a
      href="/teacher/tests"
      class="menu-link"
    >
      テスト一覧
    </a>


    <a
      id="pagesLink"
      href="#"
      class="menu-link active"
    >
      解答用紙登録
    </a>


    <a
      id="layoutLink"
      href="#"
      class="menu-link"
    >
      枠設定
    </a>


    <a
      id="modelAnswerLink"
      href="#"
      class="menu-link"
    >
      模範解答
    </a>


    <a
      id="previewLink"
      href="#"
      class="menu-link"
    >
      テスト確認
    </a>


  </aside>



  <!-- =========================
       メイン
  ========================== -->

  <main class="main-content">


    <div class="page-header">

      <h1>
        解答用紙登録
      </h1>

    </div>



    <!-- テスト情報 -->

    <div
      id="testInformation"
      class="card"
    >

      読み込み中...

    </div>



    <!-- =========================
         アップロード
    ========================== -->

    <div class="card">


      <h3>
        解答用紙ファイル
      </h3>


      <p>
        解答用紙を登録してください。
      </p>


      <div
        style="
          background:#f3f5f7;
          border:1px solid #d0d6dc;
          border-radius:4px;
          padding:14px;
          margin-bottom:18px;
        "
      >

        <strong>
          対応ファイル
        </strong>


        <div
          style="
            margin-top:8px;
            line-height:1.8;
          "
        >

          JPG / JPEG / PNG / WEBP / GIF / BMP

          <br>

          PDF

          <br>

          ZIP

        </div>


        <div
          style="
            margin-top:8px;
            color:#666;
            font-size:13px;
          "
        >

          ZIPには複数の画像・PDFをまとめて入れられます。

          <br>

          PDFはページごとに自動分割されます。

          <br>

          画像はPNGへ統一して保存します。

        </div>

      </div>



      <div class="form-group">

        <label
          for="pageFile"
        >
          ファイル
        </label>


        <input
          id="pageFile"
          type="file"
          multiple
          accept="
            .jpg,
            .jpeg,
            .png,
            .webp,
            .gif,
            .bmp,
            .pdf,
            .zip,
            image/jpeg,
            image/png,
            image/webp,
            image/gif,
            image/bmp,
            application/pdf,
            application/zip
          "
        >

      </div>



      <div
        style="
          display:flex;
          gap:8px;
          flex-wrap:wrap;
        "
      >

        <button
          id="addPageButton"
          class="btn btn-primary"
          type="button"
        >
          解答用紙を登録
        </button>


        <button
          id="clearButton"
          class="btn"
          type="button"
        >
          選択解除
        </button>

      </div>



      <div
        id="message"
        style="
          margin-top:14px;
          min-height:24px;
        "
      >
      </div>


    </div>



    <!-- =========================
         登録済み
    ========================== -->

    <div class="card">


      <div
        style="
          display:flex;
          align-items:center;
          justify-content:space-between;
          margin-bottom:15px;
        "
      >

        <h3
          style="margin:0;"
        >
          登録済み解答用紙
        </h3>


        <span
          id="pageCount"
          style="
            color:#666;
            font-size:13px;
          "
        >
          0ページ
        </span>

      </div>



      <div
        id="pageList"
        style="
          display:grid;
          grid-template-columns:
            repeat(3,minmax(0,1fr));
          gap:15px;
        "
      >

        <div
          style="
            grid-column:1/-1;
            text-align:center;
            color:#777;
            padding:35px;
          "
        >
          読み込み中...
        </div>

      </div>


    </div>


  </main>


</div>



<!-- =====================================================
     外部ライブラリ
===================================================== -->

<!-- ZIP -->
<script
  src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"
></script>


<!-- Supabase -->
<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<!-- 共通設定 -->
<script src="/js/config.js"></script>


<!-- 認証 -->
<script src="/js/auth.js"></script>


<!-- PDF処理 -->
<script src="/js/lib/pdf-loader.js"></script>


<!-- ファイル処理 -->
<script src="/js/lib/file-parser.js"></script>


<!-- このページ -->
<script src="/js/teacher/test-pages.js"></script>


</body>
</html>
