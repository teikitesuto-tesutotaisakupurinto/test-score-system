
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
  テスト編集 - テスト成績システム
</title>

<link
  rel="stylesheet"
  href="/css/common.css"
>

<style>

.main {
  max-width:800px;

  margin:0 auto;

  padding:25px;
}


.card {
  background:#fff;

  border:
    1px solid #d5dbe0;

  padding:20px;
}


.field {
  margin-bottom:16px;
}


.field label {
  display:block;

  margin-bottom:6px;

  font-size:13px;

  font-weight:700;
}


.field input {
  width:100%;

  height:42px;

  padding:0 10px;

  box-sizing:border-box;
}


.actions {
  display:flex;

  gap:10px;

  flex-wrap:wrap;
}


.message {
  min-height:22px;

  margin-bottom:15px;

  white-space:pre-wrap;
}


.message.error {
  color:#b42318;
}


.message.success {
  color:#16834b;
}

</style>

</head>


<body>


<header class="topbar">

<div class="system-name">
  テスト成績システム
</div>


<div class="topbar-space"></div>


<span id="teacherName">
  -
</span>


<button
id="logoutButton"
class="logout-button"
type="button"
>
  ログアウト
</button>

</header>


<main class="main">


<h1 id="pageTitle">
  テスト編集
</h1>


<section class="card">


<div
id="message"
class="message"
aria-live="polite"
>
</div>


<div class="field">

<label for="name">
  テスト名
</label>


<input
id="name"
type="text"
required
maxlength="200"
>

</div>


<div class="field">

<label for="subject">
  教科
</label>


<input
id="subject"
type="text"
maxlength="50"
>

</div>


<div class="field">

<label for="grade">
  学年
</label>


<input
id="grade"
type="text"
maxlength="30"
>

</div>


<div class="field">

<label for="className">
  クラス
</label>


<input
id="className"
type="text"
maxlength="50"
>

</div>


<div class="field">

<label for="testDate">
  実施日
</label>


<input
id="testDate"
type="date"
>

</div>


<div class="field">

<label for="maxScore">
  満点
</label>


<input
id="maxScore"
type="number"
min="0"
step="0.1"
>

</div>


<div class="actions">


<button
id="saveButton"
class="btn btn-primary"
type="button"
>
保存
</button>


<button
id="pagesButton"
class="btn"
type="button"
>
解答用紙・枠設定
</button>


<button
id="pointsButton"
class="btn"
type="button"
>
配点設定
</button>


<button
id="backButton"
class="btn"
type="button"
>
戻る
</button>


</div>


</section>


</main>


<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script
src="/js/config.js"
></script>

<script
src="/js/auth.js"
></script>


<script>

"use strict";


let DB = null;

let testId = null;


document.addEventListener(
  "DOMContentLoaded",
  initialize
);


async function initialize() {

  try {

    DB =
      window.supabaseClient ||
      window.SB;


    const auth =
      await requireRole(
        "teacher"
      );


    if (!auth) {

      return;

    }


    document.getElementById(
      "teacherName"
    ).textContent =
      auth.profile?.name ||
      "先生";


    const params =
      new URLSearchParams(
        location.search
      );


    testId =
      params.get(
        "test"
      ) ||
      params.get(
        "id"
      );


    if (!testId) {

      throw new Error(
        "テストIDがありません。"
      );

    }


    document
      .getElementById(
        "logoutButton"
      )
      .addEventListener(
        "click",
        async () => {

          await logout();

        }
      );


    document
      .getElementById(
        "saveButton"
      )
      .addEventListener(
        "click",
        saveTest
      );


    document
      .getElementById(
        "pagesButton"
      )
      .addEventListener(
        "click",
        () => {

          location.href =
            `/teacher/tests/pages?test=${encodeURIComponent(
              testId
            )}`;

        }
      );


    document
      .getElementById(
        "pointsButton"
      )
      .addEventListener(
        "click",
        () => {

          location.href =
            `/teacher/tests/points?test=${encodeURIComponent(
              testId
            )}`;

        }
      );


    document
      .getElementById(
        "backButton"
      )
      .addEventListener(
        "click",
        () => {

          location.href =
            "/teacher/tests";

        }
      );


    await loadTest();


  } catch (error) {

    showMessage(
      error.message ||
      "テストを読み込めませんでした。",
      true
    );

  }

}


/* =========================================================
   LOAD
========================================================= */

async function loadTest() {

  const {
    data,
    error
  } =
    await DB
      .from(
        "tests"
      )
      .select(
        `
        id,
        name,
        subject,
        grade,
        class_name,
        test_date,
        max_score
        `
      )
      .eq(
        "id",
        testId
      )
      .maybeSingle();


  if (error) {

    throw error;

  }


  if (!data) {

    throw new Error(
      "指定されたテストが見つかりません。"
    );

  }


  document.getElementById(
    "name"
  ).value =
    data.name ||
    "";


  document.getElementById(
    "subject"
  ).value =
    data.subject ||
    "";


  document.getElementById(
    "grade"
  ).value =
    data.grade ||
    "";


  document.getElementById(
    "className"
  ).value =
    data.class_name ||
    "";


  document.getElementById(
    "testDate"
  ).value =
    data.test_date ||
    "";


  document.getElementById(
    "maxScore"
  ).value =
    data.max_score ??
    "";

}


/* =========================================================
   SAVE
========================================================= */

async function saveTest() {

  const button =
    document.getElementById(
      "saveButton"
    );


  const name =
    document.getElementById(
      "name"
    ).value.trim();


  const subject =
    document.getElementById(
      "subject"
    ).value.trim();


  const grade =
    document.getElementById(
      "grade"
    ).value.trim();


  const className =
    document.getElementById(
      "className"
    ).value.trim();


  const testDate =
    document.getElementById(
      "testDate"
    ).value;


  const maxScore =
    Number(
      document.getElementById(
        "maxScore"
      ).value
    );


  if (!name) {

    showMessage(
      "テスト名を入力してください。",
      true
    );

    return;

  }


  if (
    !Number.isFinite(
      maxScore
    ) ||
    maxScore < 0
  ) {

    showMessage(
      "満点を正しく入力してください。",
      true
    );

    return;

  }


  button.disabled =
    true;


  button.textContent =
    "保存中...";


  try {

    const {
      error
    } =
      await DB
        .from(
          "tests"
        )
        .update({

          name,

          subject:
            subject ||
            null,

          grade:
            grade ||
            null,

          class_name:
            className ||
            null,

          test_date:
            testDate ||
            null,

          max_score:
            maxScore

        })
        .eq(
          "id",
          testId
        );


    if (error) {

      throw error;

    }


    showMessage(
      "テスト情報を保存しました。",
      false
    );


  } catch (error) {

    showMessage(
      error.message ||
      "保存に失敗しました。",
      true
    );

  } finally {

    button.disabled =
      false;


    button.textContent =
      "保存";

  }

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
  text,
  error = false
) {

  const element =
    document.getElementById(
      "message"
    );


  element.textContent =
    text;


  element.className =
    error
      ? "message error"
      : (
          text
            ? "message success"
            : "message"
        );

}

</script>


</body>

</html>
