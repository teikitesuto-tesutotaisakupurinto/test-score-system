<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    デジタル採点 - テスト成績システム
  </title>

  <link
    rel="stylesheet"
    href="/css/common.css"
  >

  <link
    rel="stylesheet"
    href="/css/marking.css"
  >

</head>


<body>


<div class="marking-page">


  <!-- =====================================================
       上部ツールバー
  ====================================================== -->

  <header class="marking-toolbar">


    <!-- 1段目 -->

    <div class="marking-toolbar-row">


      <!-- 問題移動 -->

      <div class="toolbar-group">

        <button
          id="previousQuestion"
          class="mark-tool"
          type="button"
        >
          ← 前
        </button>


        <button
          id="nextQuestion"
          class="mark-tool"
          type="button"
        >
          次 →
        </button>

      </div>


      <!-- 選択 -->

      <div class="toolbar-group">

        <button
          class="mark-tool active"
          data-tool="select"
          type="button"
        >
          選択
        </button>

      </div>


      <!-- 採点記号 -->

      <div class="toolbar-group">

        <button
          class="mark-tool"
          data-tool="circle"
          type="button"
        >
          ○
        </button>


        <button
          class="mark-tool"
          data-tool="x"
          type="button"
        >
          ×
        </button>


        <button
          class="mark-tool"
          data-tool="triangle"
          type="button"
        >
          △
        </button>


        <button
          class="mark-tool"
          data-tool="double"
          type="button"
        >
          ◎
        </button>

      </div>


      <!-- 点数 -->

      <div class="toolbar-group">


        <button
          class="mark-tool"
          data-tool="number"
          type="button"
        >
          数字
        </button>


        <input
          id="scoreInput"
          type="number"
          min="0"
          step="0.5"
          inputmode="decimal"
          placeholder="点数"
          autocomplete="off"
        >


        <button
          id="scoreApply"
          class="mark-tool"
          type="button"
        >
          点数確定
        </button>

      </div>


      <!-- テキスト -->

      <div class="toolbar-group">


        <button
          class="mark-tool"
          data-tool="text"
          type="button"
        >
          テキスト
        </button>


        <input
          id="markText"
          type="text"
          placeholder="入力"
          autocomplete="off"
        >

      </div>


      <!-- 描画 -->

      <div class="toolbar-group">

        <button
          class="mark-tool"
          data-tool="pen"
          type="button"
        >
          描画
        </button>

      </div>


      <!-- 色 -->

      <div class="toolbar-group">

        <label
          class="toolbar-label"
          for="markColor"
        >
          色
        </label>


        <input
          id="markColor"
          type="color"
          value="#e53935"
        >

      </div>


      <!-- サイズ -->

      <div class="toolbar-group">

        <label
          class="toolbar-label"
          for="markSize"
        >
          サイズ
        </label>


        <input
          id="markSize"
          type="number"
          value="42"
          min="10"
          max="150"
          step="1"
        >

      </div>


      <!-- ショートカット -->

      <div class="toolbar-group shortcut-help">

        <strong>
          L
        </strong>

        <span>
          ○
        </span>

        <strong>
          K
        </strong>

        <span>
          ×
        </span>

        <span>
          数字
        </span>

        <span>
          Enter
        </span>

      </div>


    </div>


    <!-- 2段目 -->

    <div class="marking-toolbar-row">


      <button
        id="zoomOut"
        class="mark-tool"
        type="button"
      >
        −
      </button>


      <span
        id="zoomValue"
        class="zoom-value"
      >
        100%
      </span>


      <button
        id="zoomIn"
        class="mark-tool"
        type="button"
      >
        ＋
      </button>


      <button
        id="fitScreen"
        class="mark-tool"
        type="button"
      >
        全体表示
      </button>


      <span
        class="toolbar-separator"
      >
      </span>


      <span
        id="questionInfo"
        class="question-info"
      >
        -
      </span>


      <span
        id="pointInfo"
        class="point-info"
      >
        -
      </span>


      <span
        id="markingProgress"
        class="marking-progress"
      >
        0 / 0
      </span>


    </div>


  </header>



  <!-- =====================================================
       採点本体
  ====================================================== -->

  <main class="marking-content">


    <!-- 左：模範解答 -->

    <aside class="model-pane">


      <div class="model-title">
        模範解答
      </div>


      <div
        id="modelAnswer"
        class="model-image"
      >
        読み込み中...
      </div>


    </aside>



    <!-- 右：答案2列 -->

    <section class="answer-area">


      <div
        id="answerGrid"
        class="answer-grid"
      >
        読み込み中...
      </div>


    </section>


  </main>



  <!-- =====================================================
       下部
  ====================================================== -->

  <footer class="marking-footer">


    <div
      class="quick-score-group"
    >


      <button
        class="footer-score"
        data-score="0"
        type="button"
      >
        0
      </button>


      <button
        class="footer-score"
        data-score="1"
        type="button"
      >
        1
      </button>


      <button
        class="footer-score"
        data-score="2"
        type="button"
      >
        2
      </button>


      <button
        class="footer-score"
        data-score="3"
        type="button"
      >
        3
      </button>


      <button
        class="footer-score"
        data-score="4"
        type="button"
      >
        4
      </button>


      <button
        class="footer-score"
        data-score="5"
        type="button"
      >
        5
      </button>


    </div>


    <button
      id="nextUnmarked"
      class="btn btn-primary"
      type="button"
    >
      次の未採点
    </button>


    <button
      id="exitMarking"
      class="btn"
      type="button"
    >
      採点終了
    </button>


  </footer>


</div>



<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="/js/config.js"></script>

<script src="/js/auth.js"></script>

<script src="/js/teacher/marking.js"></script>


</body>

</html>
