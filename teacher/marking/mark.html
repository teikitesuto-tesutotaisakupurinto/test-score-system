
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>採点 - テスト成績システム</title>

<link
  rel="stylesheet"
  href="/css/common.css"
>

<style>

.main {
  max-width:1500px;
  margin:0 auto;
  padding:20px;
}

.toolbar {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
  margin-bottom:15px;
}

.toolbar select {
  min-width:320px;
  height:40px;
  padding:0 10px;
}

.status {
  padding:10px 12px;
  margin-bottom:15px;
  background:#f5f6f7;
  border:1px solid #d5dbe0;
}

.marking-table-wrap {
  background:#fff;
  border:1px solid #d5dbe0;
  overflow:auto;
}

.marking-table {
  width:100%;
  border-collapse:collapse;
  min-width:900px;
}

.marking-table th,
.marking-table td {
  border:1px solid #d5dbe0;
  padding:10px;
  font-size:13px;
  white-space:nowrap;
}

.marking-table th {
  background:#f3f5f7;
  font-weight:700;
}

.student-name {
  font-weight:700;
}

.question-marked {
  text-align:center;
}

.question-unmarked {
  text-align:center;
  color:#b42318;
}

.total-score {
  font-weight:700;
}

.detail-button {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:70px;
}

.empty {
  padding:50px;
  text-align:center;
  color:#777;
  background:#fff;
  border:1px solid #d0d6dc;
}

</style>

</head>


<body>

<header class="topbar">

  <div class="system-name">
    テスト成績システム
  </div>

  <div class="topbar-space"></div>

  <span id="teacherName">
    -
  </span>

  <button
    id="logoutButton"
    class="logout-button"
    type="button"
  >
    ログアウト
  </button>

</header>


<main class="main">


  <div class="toolbar">

    <select id="testSelect">

      <option value="">
        テストを選択してください
      </option>

    </select>


    <button
      id="refreshButton"
      class="btn"
      type="button"
    >
      更新
    </button>

  </div>


  <div
    id="status"
    class="status"
  >
    テストを選択してください。
  </div>


  <div
    id="markingTableWrap"
    class="marking-table-wrap"
  >

    <div class="empty">
      テストを選択してください。
    </div>

  </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="/js/config.js"></script>

<script src="/js/auth.js"></script>

<script src="/js/teacher/marking-index.js"></script>

</body>

</html>
