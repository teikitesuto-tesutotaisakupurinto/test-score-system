<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    テスト確認 - テスト成績システム
  </title>

  <link
    rel="stylesheet"
    href="/css/common.css"
  >

</head>

<body>

<header class="topbar">

  <div class="system-name">
    テスト成績システム
  </div>

  <div class="topbar-space"></div>

  <span id="teacherName">-</span>

  <button
    id="logoutButton"
    class="logout-button"
  >
    ログアウト
  </button>

</header>


<div class="teacher-layout">

  <aside class="sidebar">

    <div class="sidebar-title">
      テスト設定
    </div>

    <a
      id="pagesLink"
      href="#"
      class="menu-link"
    >
      解答用紙登録
    </a>

    <a
      id="layoutLink"
      href="#"
      class="menu-link"
    >
      枠設定
    </a>

    <a
      id="modelAnswerLink"
      href="#"
      class="menu-link"
    >
      模範解答
    </a>

    <a
      id="previewLink"
      href="#"
      class="menu-link active"
    >
      テスト確認
    </a>

  </aside>


  <main class="main-content">

    <div class="page-header">

      <h1>
        テスト確認
      </h1>

    </div>


    <div
      id="testInformation"
      class="card"
    >
      読み込み中...
    </div>


    <div class="card">

      <h3>
        解答用紙
      </h3>

      <div
        id="pagePreview"
        style="
          display:grid;
          grid-template-columns:
            repeat(3,minmax(0,1fr));
          gap:15px;
        "
      >
      </div>

    </div>


    <div class="card">

      <h3>
        設定済み枠
      </h3>

      <div
        id="boxPreview"
      >
        読み込み中...
      </div>

    </div>

  </main>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="/js/config.js"></script>

<script src="/js/auth.js"></script>

<script src="/js/teacher/test-preview.js"></script>

</body>
</html>
