<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    クラス生徒 - テスト成績システム
  </title>

  <link
    rel="stylesheet"
    href="/css/common.css"
  >

</head>

<body>

<header class="topbar">

  <div class="system-name">
    テスト成績システム
  </div>

  <div class="topbar-space"></div>

  <span id="teacherName">
    -
  </span>

  <button
    id="logoutButton"
    class="logout-button"
  >
    ログアウト
  </button>

</header>


<div class="teacher-layout">

  <aside class="sidebar">

    <div class="sidebar-title">
      クラス
    </div>

    <a
      href="/teacher/classes"
      class="menu-link active"
    >
      クラス管理
    </a>

    <a
      href="/teacher/classes/new"
      class="menu-link"
    >
      クラス作成
    </a>

  </aside>


  <main class="main-content">

    <div class="page-header">

      <h1 id="classTitle">
        クラス生徒
      </h1>

      <div style="margin-left:auto;">

        <a
          href="/teacher/students"
          class="btn"
        >
          生徒一覧
        </a>

      </div>

    </div>


    <div class="card">

      <div
        id="classInformation"
        style="
          margin-bottom:16px;
        "
      >
        読み込み中...
      </div>


      <div style="overflow:auto;">

        <table class="table">

          <thead>

            <tr>

              <th>
                生徒番号
              </th>

              <th>
                氏名
              </th>

              <th>
                学年
              </th>

              <th>
                クラス
              </th>

              <th>
                状態
              </th>

              <th>
                操作
              </th>

            </tr>

          </thead>


          <tbody id="studentRows">

            <tr>

              <td
                colspan="6"
                style="
                  text-align:center;
                "
              >
                読み込み中...
              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </main>

</div>


<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="/js/config.js"></script>

<script src="/js/auth.js"></script>

<script src="/js/teacher/class-students.js"></script>

</body>
</html>
