
<!doctype html>
<html lang="ja">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
  採点対象答案選択 - テスト成績システム
</title>

<link
  rel="stylesheet"
  href="/css/common.css"
>

<style>

.main {
  max-width:1200px;
  margin:0 auto;
  padding:22px;
}

.toolbar {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
  margin-bottom:15px;
}

.toolbar select {
  min-width:340px;
  height:40px;
  padding:0 10px;
}

.status {
  padding:10px 12px;
  margin-bottom:15px;

  background:#f5f6f7;

  border:1px solid #d5dbe0;

  font-size:13px;

  white-space:pre-wrap;
}

.status.error {
  color:#b42318;
}

.test-info {
  margin-bottom:15px;
  padding:15px;

  background:#fff;

  border:1px solid #d0d6dc;
}

.test-title {
  font-size:19px;
  font-weight:700;
}

.test-meta {
  margin-top:5px;
  color:#666;
  font-size:13px;
}

.answer-grid {
  display:grid;

  grid-template-columns:
    repeat(
      3,
      minmax(
        0,
        1fr
      )
    );

  gap:15px;
}

.answer-card {
  background:#fff;

  border:1px solid #d0d6dc;

  border-radius:5px;

  padding:16px;
}

.answer-title {
  font-weight:700;
  font-size:16px;
}

.answer-meta {
  margin-top:7px;

  color:#666;

  font-size:13px;

  line-height:1.8;
}

.answer-actions {
  margin-top:14px;
}

.answer-actions a {
  display:block;

  text-align:center;

  text-decoration:none;
}

.empty {
  grid-column:1 / -1;

  padding:50px;

  text-align:center;

  color:#777;

  background:#fff;

  border:1px solid #d0d6dc;
}

@media(max-width:900px) {

  .answer-grid {
    grid-template-columns:
      repeat(
        2,
        minmax(
          0,
          1fr
        )
      );
  }

}

@media(max-width:600px) {

  .main {
    padding:15px;
  }

  .toolbar select {
    width:100%;
    min-width:0;
  }

  .answer-grid {
    grid-template-columns:1fr;
  }

}

</style>

</head>


<body>


<header class="topbar">

<div class="system-name">
  テスト成績システム
</div>

<div class="topbar-space"></div>

<span id="teacherName">
  -
</span>

<button
id="logoutButton"
class="logout-button"
type="button"
>
  ログアウト
</button>

</header>


<main class="main">


<h1>
  採点対象答案
</h1>


<div class="toolbar">


<select
id="testSelect"
>

<option value="">
  テストを選択してください
</option>

</select>


<button
id="refreshButton"
class="btn"
type="button"
>
  更新
</button>


<a
href="/teacher/marking"
class="btn"
>
  採点一覧へ戻る
</a>


</div>


<div
id="status"
class="status"
>
テストを選択してください。
</div>


<div
id="testInfo"
class="test-info"
hidden
>

<div
id="testTitle"
class="test-title"
>
-
</div>

<div
id="testMeta"
class="test-meta"
>
-
</div>

</div>


<section
id="answerGrid"
class="answer-grid"
>

<div class="empty">
  テストを選択してください。
</div>

</section>


</main>


<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script
src="/js/config.js?v=20261116"
></script>

<script
src="/js/auth.js?v=20261116"
></script>


<script>

"use strict";


/* =====================================================
   CLIENT
===================================================== */

const DB =
  window.supabaseClient ||
  window.SB;


if (!DB) {

  throw new Error(
    "Supabase Clientが初期化されていません。"
  );

}


/* =====================================================
   DOM
===================================================== */

const testSelect =
  document.getElementById(
    "testSelect"
  );


const refreshButton =
  document.getElementById(
    "refreshButton"
  );


const statusElement =
  document.getElementById(
    "status"
  );


const answerGrid =
  document.getElementById(
    "answerGrid"
  );


const teacherName =
  document.getElementById(
    "teacherName"
  );


const testInfo =
  document.getElementById(
    "testInfo"
  );


const testTitle =
  document.getElementById(
    "testTitle"
  );


const testMeta =
  document.getElementById(
    "testMeta"
  );


/* =====================================================
   STATE
===================================================== */

let tests =
  [];


/* =====================================================
   INIT
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  initialize
);


async function initialize() {

  try {

    const result =
      await requireRole(
        "teacher"
      );


    if (!result) {
      return;
    }


    teacherName.textContent =
      result.profile?.name ||
      "先生";


    setupEvents();


    await loadTests();


    /*
     * ?test=UUID
     */

    const params =
      new URLSearchParams(
        location.search
      );


    const requestedTest =
      params.get(
        "test"
      );


    if (requestedTest) {

      const exists =
        tests.some(
          test =>
            test.id ===
            requestedTest
        );


      if (exists) {

        testSelect.value =
          requestedTest;


        await loadAnswers();

      }

    }

  } catch (error) {

    console.error(
      "marking select:",
      error
    );


    showError(
      error.message ||
      "採点対象答案を読み込めませんでした。"
    );

  }

}


/* =====================================================
   EVENTS
===================================================== */

function setupEvents() {

  testSelect.addEventListener(
    "change",
    loadAnswers
  );


  refreshButton.addEventListener(
    "click",
    loadAnswers
  );


  document
    .getElementById(
      "logoutButton"
    )
    .addEventListener(
      "click",
      async () => {

        if (
          typeof window.logout ===
          "function"
        ) {

          await window.logout();

          return;

        }


        await DB.auth.signOut();

        location.replace(
          "/login"
        );

      }
    );

}


/* =====================================================
   LOAD TESTS
===================================================== */

async function loadTests() {

  setStatus(
    "テスト一覧を読み込んでいます..."
  );


  const {
    data,
    error
  } =
    await DB
      .from(
        "tests"
      )
      .select(
        `
        id,
        name,
        subject,
        grade,
        class_name,
        created_at
        `
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if (error) {

    throw new Error(
      `テスト一覧取得エラー: ${error.message}`
    );

  }


  tests =
    data ||
    [];


  testSelect.innerHTML = `

    <option value="">
      テストを選択してください
    </option>

  `;


  tests.forEach(
    test => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        test.id;


      option.textContent =
        [
          test.name,
          test.subject,
          test.grade,
          test.class_name
        ]
          .filter(
            value =>
              value !== null &&
              value !== undefined &&
              String(
                value
              ).trim() !== ""
          )
          .join(
            " / "
          );


      testSelect.appendChild(
        option
      );

    }
  );


  if (!tests.length) {

    setStatus(
      "テストが登録されていません。"
    );

    return;

  }


  setStatus(
    "テストを選択してください。"
  );

}


/* =====================================================
   LOAD ANSWERS
===================================================== */

async function loadAnswers() {

  const testId =
    testSelect.value;


  answerGrid.innerHTML =
    "";


  testInfo.hidden =
    true;


  if (!testId) {

    answerGrid.innerHTML = `

      <div class="empty">
        テストを選択してください。
      </div>

    `;

    setStatus(
      "テストを選択してください。"
    );

    return;

  }


  try {

    setStatus(
      "答案を読み込んでいます..."
    );


    const test =
      tests.find(
        item =>
          item.id ===
          testId
      );


    if (!test) {

      throw new Error(
        "テストが見つかりません。"
      );

    }


    testInfo.hidden =
      false;


    testTitle.textContent =
      test.name ||
      "";


    testMeta.textContent =
      [
        test.subject,
        test.grade,
        test.class_name
      ]
        .filter(
          value =>
            value !== null &&
            value !== undefined &&
            String(
              value
            ).trim() !== ""
        )
        .join(
          " / "
        );


    /*
     * ANSWER SHEETS
     */

    const {
      data: answerData,
      error: answerError
    } =
      await DB
        .from(
          "answer_sheets"
        )
        .select(
          `
          id,
          test_id,
          student_id,
          qr_value,
          status,
          uploaded_at,
          created_at
          `
        )
        .eq(
          "test_id",
          testId
        )
        .order(
          "uploaded_at",
          {
            ascending:false
          }
        );


    if (answerError) {

      throw new Error(
        `答案取得エラー: ${answerError.message}`
      );

    }


    const answers =
      answerData ||
      [];


    if (!answers.length) {

      answerGrid.innerHTML = `

        <div class="empty">

          このテストには答案がありません。

          <br><br>

          <a
            href="/teacher/answers/upload?test=${encodeURIComponent(
              testId
            )}"
            class="btn"
          >
            答案アップロードへ
          </a>

        </div>

      `;


      setStatus(
        "答案が登録されていません。"
      );


      return;

    }


    /*
     * STUDENTS
     */

    const studentIds =
      [
        ...new Set(
          answers
            .map(
              answer =>
                answer.student_id
            )
            .filter(Boolean)
        )
      ];


    let studentMap =
      new Map();


    if (
      studentIds.length
    ) {

      const {
        data: studentData,
        error: studentError
      } =
        await DB
          .from(
            "students"
          )
          .select(
            `
            id,
            student_no,
            name
            `
          )
          .in(
            "id",
            studentIds
          );


      if (studentError) {

        throw new Error(
          `生徒情報取得エラー: ${studentError.message}`
        );

      }


      studentMap =
        new Map(
          (studentData || [])
            .map(
              student => [
                student.id,
                student
              ]
            )
        );

    }


    renderAnswers(
      answers,
      studentMap
    );


    setStatus(
      `${answers.length}件の答案があります。`
    );


  } catch (error) {

    console.error(
      "load answers:",
      error
    );


    showError(
      error.message ||
      "答案を読み込めませんでした。"
    );

  }

}


/* =====================================================
   RENDER ANSWERS
===================================================== */

function renderAnswers(
  answers,
  studentMap
) {

  answerGrid.innerHTML =
    "";


  answers.forEach(
    answer => {

      const student =
        studentMap.get(
          answer.student_id
        );


      const card =
        document.createElement(
          "article"
        );


      card.className =
        "answer-card";


      const title =
        document.createElement(
          "div"
        );


      title.className =
        "answer-title";


      title.textContent =
        student
          ? `${student.student_no || ""} / ${student.name || ""}`
          : "未紐付け答案";


      const meta =
        document.createElement(
          "div"
        );


      meta.className =
        "answer-meta";


      meta.innerHTML = `

        状態：
        ${escapeHtml(
          getStatusText(
            answer.status
          )
        )}

        <br>

        QR：
        ${escapeHtml(
          answer.qr_value ||
          "-"
        )}

        <br>

        答案ID：
        ${escapeHtml(
          answer.id
        )}

      `;


      const actions =
        document.createElement(
          "div"
        );


      actions.className =
        "answer-actions";


      const link =
        document.createElement(
          "a"
        );


      link.className =
        "btn btn-primary";


      link.href =
        `/teacher/marking/mark?answer=${encodeURIComponent(
          answer.id
        )}&test=${encodeURIComponent(
          answer.test_id
        )}`;


      link.textContent =
        "採点開始";


      actions.appendChild(
        link
      );


      card.append(
        title,
        meta,
        actions
      );


      answerGrid.appendChild(
        card
      );

    }
  );

}


/* =====================================================
   STATUS TEXT
===================================================== */

function getStatusText(
  status
) {

  switch (
    String(
      status ||
      ""
    ).toLowerCase()
  ) {

    case "matched":
      return "生徒紐付け済み・採点前";

    case "marked":
      return "採点済み";

    case "uploaded":
      return "アップロード済み・採点前";

    case "unmatched":
      return "未紐付け";

    default:
      return status ||
        "不明";

  }

}


/* =====================================================
   STATUS
===================================================== */

function setStatus(
  message,
  error = false
) {

  statusElement.textContent =
    message;


  statusElement.className =
    error
      ? "status error"
      : "status";

}


function showError(
  message
) {

  setStatus(
    message,
    true
  );


  answerGrid.innerHTML = `

    <div class="empty">

      ${escapeHtml(
        message
      )}

    </div>

  `;

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(
  value
) {

  return String(
    value ??
    ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}

</script>


</body>

</html>
