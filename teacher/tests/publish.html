
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>成績・答案公開 - テスト成績システム</title>

<link
  rel="stylesheet"
  href="/css/common.css"
>

<style>

.main {
  max-width:900px;
  margin:0 auto;
  padding:25px;
}

.card {
  background:#fff;
  border:1px solid #d5dbe0;
  padding:20px;
  margin-bottom:15px;
}

#testSelect {
  width:100%;
  height:44px;
  padding:0 10px;
}

.status {
  margin-top:15px;
  padding:12px;
  border:1px solid #d5dbe0;
  background:#f5f6f7;
}

.status.public {
  background:#edf8ef;
  border-color:#b7d9c0;
}

.status.private {
  background:#fff4f2;
  border-color:#efc2bc;
}

.actions {
  display:flex;
  gap:10px;
  margin-top:15px;
}

</style>
</head>


<body>

<header class="topbar">

<div class="system-name">
テスト成績システム
</div>

<div class="topbar-space"></div>

<span id="teacherName">-</span>

<button
id="logoutButton"
class="logout-button"
type="button"
>
ログアウト
</button>

</header>


<main class="main">

<section class="card">

<h1>
成績・答案公開
</h1>

<p>
公開したテストだけ、生徒本人が成績・答案を閲覧できます。
</p>

</section>


<section class="card">

<label>
テスト
</label>


<select id="testSelect">

<option value="">
テストを選択してください
</option>

</select>


<div
id="status"
class="status"
>
テストを選択してください。
</div>


<div class="actions">

<button
id="publishButton"
class="btn btn-primary"
type="button"
disabled
>
公開する
</button>


<button
id="unpublishButton"
class="btn"
type="button"
disabled
>
非公開にする
</button>

</div>

</section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/teacher/test-publish.js"></script>


<script>

/*
  Clean URL:
  /teacher/tests/publish?test=UUID

  test-publish.js側で
  URLパラメータを初期選択に使用可能。
*/

window.__INITIAL_TEST_ID__ =
  new URLSearchParams(
    window.location.search
  ).get("test");

</script>

</body>
</html>
