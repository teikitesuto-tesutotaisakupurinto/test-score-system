
<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    採点 - テスト成績システム
  </title>

  <link
    rel="stylesheet"
    href="/css/common.css"
  >

  <style>

    .marking-main {
      max-width: 1500px;
      margin: 0 auto;
      padding: 20px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 15px;
    }

    .toolbar select {
      height: 40px;
      min-width: 240px;
      padding: 0 10px;
    }

    .toolbar button {
      height: 40px;
    }

    .status {
      padding: 10px 12px;
      margin-bottom: 15px;
      border: 1px solid #d5dbe0;
      background: #f5f6f7;
      font-size: 13px;
    }

    .marking-layout {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      gap: 15px;
    }

    .question-list {
      background: #fff;
      border: 1px solid #d5dbe0;
      max-height: calc(100vh - 160px);
      overflow: auto;
    }

    .question-item {
      padding: 12px;
      border-bottom: 1px solid #e3e6e8;
      cursor: pointer;
    }

    .question-item:hover {
      background: #f6f7f8;
    }

    .question-item.selected {
      background: #eef4fb;
      border-left: 4px solid #2468a8;
    }

    .question-title {
      font-weight: 700;
      margin-bottom: 5px;
    }

    .question-score {
      font-size: 12px;
      color: #666;
    }

    .question-status {
      margin-top: 5px;
      font-size: 12px;
    }

    .answer-viewer {
      min-width: 0;
      background: #dfe3e8;
      padding: 20px;
      overflow: auto;
    }

    .answer-card {
      max-width: 1000px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #d0d6dc;
    }

    .answer-header {
      padding: 12px 15px;
      border-bottom: 1px solid #d5dbe0;
      background: #fff;
    }

    .answer-header-title {
      font-size: 18px;
      font-weight: 700;
    }

    .answer-header-meta {
      margin-top: 4px;
      color: #666;
      font-size: 12px;
    }

    .region-image-wrap {
      padding: 20px;
      text-align: center;
      background: #fff;
    }

    .region-image {
      display: block;
      max-width: 100%;
      width: auto;
      height: auto;
      margin: 0 auto;
    }

    .mark-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #d5dbe0;
      background: #f7f8f9;
    }

    .mark-button {
      min-width: 52px;
      height: 40px;
      padding: 0 12px;
      border: 1px solid #bfc6cc;
      background: #fff;
      cursor: pointer;
      font-weight: 700;
    }

    .mark-button.active {
      border-color: #333;
      background: #e9ecef;
    }

    .score-area {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      padding: 12px;
      border-top: 1px solid #d5dbe0;
      background: #fff;
    }

    .score-input {
      width: 110px;
      height: 40px;
      padding: 0 10px;
      font-size: 16px;
    }

    .warning {
      display: none;
      padding: 10px;
      margin: 0 12px 12px;
      border: 1px solid #efc2bc;
      background: #fff4f2;
      color: #b42318;
      font-size: 13px;
    }

    .warning.show {
      display: block;
    }

    .empty {
      padding: 50px;
      text-align: center;
      color: #777;
    }

    @media(max-width:900px) {

      .marking-layout {
        grid-template-columns: 1fr;
      }

      .question-list {
        max-height: 300px;
      }

    }

  </style>

</head>


<body>


<header class="topbar">

  <div class="system-name">
    テスト成績システム
  </div>

  <div class="topbar-space"></div>

  <span id="teacherName">
    -
  </span>

  <button
    id="logoutButton"
    class="logout-button"
    type="button"
  >
    ログアウト
  </button>

</header>


<main class="marking-main">


  <div class="toolbar">

    <select id="answerSelect">

      <option value="">
        答案を選択してください
      </option>

    </select>


    <button
      id="saveButton"
      class="btn btn-primary"
      type="button"
    >
      採点を保存
    </button>

  </div>


  <div
    id="status"
    class="status"
  >
    答案を選択してください。
  </div>


  <div class="marking-layout">


    <aside
      id="questionList"
      class="question-list"
    >

      <div class="empty">
        答案を選択してください。
      </div>

    </aside>


    <section
      id="answerViewer"
      class="answer-viewer"
    >

      <div class="empty">
        答案を選択してください。
      </div>

    </section>


  </div>


</main>


<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="/js/config.js"></script>

<script src="/js/auth.js"></script>

<script src="/js/teacher/marking.js"></script>


</body>

</html>
