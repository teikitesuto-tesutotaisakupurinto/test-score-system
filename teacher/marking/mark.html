
<!doctype html>
<html lang="ja">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
  デジタル採点
</title>

<link
  rel="stylesheet"
  href="/css/common.css"
>

<style>

* {
  box-sizing:border-box;
}


body {
  margin:0;
  background:#eef2f5;
  color:#222;
}


.marking-main {
  width:100%;
  max-width:1900px;
  margin:0 auto;
  padding:12px;
}


/* =====================================================
   TOOLBAR
===================================================== */

.toolbar {
  position:sticky;
  top:0;
  z-index:100;

  display:flex;
  align-items:center;
  gap:7px;

  padding:8px 10px;

  margin-bottom:8px;

  background:#fff;

  border:1px solid #d0d6dc;
}


.toolbar-title {
  font-size:18px;
  font-weight:700;
}


.toolbar-space {
  flex:1;
}


.mark-toolbar {
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:5px;

  padding:7px;

  margin-bottom:8px;

  background:#fff;

  border:1px solid #d0d6dc;
}


.mark-toolbar-title {
  font-size:12px;
  font-weight:700;
  margin-right:4px;
}


.mark-tool {
  min-width:44px;
  height:36px;

  padding:0 9px;

  background:#fff;

  border:1px solid #b8c1c9;

  border-radius:4px;

  cursor:pointer;

  font-weight:700;
}


.mark-tool.active {
  background:#e9ecef;
  border-color:#222;
}


.keyboard-help {
  margin-left:8px;

  color:#666;

  font-size:11px;
}


/* =====================================================
   STATUS
===================================================== */

.status {
  min-height:34px;

  margin-bottom:8px;

  padding:8px 10px;

  background:#fff;

  border:1px solid #d0d6dc;

  font-size:12px;
}


.status.error {
  color:#b42318;

  border-color:#efc2bc;

  background:#fff8f7;
}


/* =====================================================
   QUESTION
===================================================== */

.question-header {
  display:flex;

  align-items:center;

  gap:10px;

  margin-bottom:8px;

  padding:9px 11px;

  background:#fff;

  border:1px solid #d0d6dc;
}


.question-info {
  min-width:0;
}


.question-title {
  font-size:18px;

  font-weight:700;
}


.question-meta {
  margin-top:2px;

  color:#666;

  font-size:12px;
}


.question-space {
  flex:1;
}


.navigation {
  display:flex;

  gap:5px;
}


/* =====================================================
   PROGRESS
===================================================== */

.progress {
  margin-bottom:8px;

  padding:8px 10px;

  background:#fff;

  border:1px solid #d0d6dc;
}


.progress-text {
  color:#555;

  font-size:11px;

  margin-bottom:5px;
}


.progress-track {
  height:6px;

  overflow:hidden;

  background:#e1e5e8;

  border-radius:3px;
}


.progress-bar {
  width:0;

  height:100%;

  background:#1769aa;

  transition:width .12s;
}


/* =====================================================
   ANSWER GRID
===================================================== */

.answer-grid-wrap {
  width:100%;

  overflow:auto;

  padding:6px;

  background:#dfe4e8;

  border:1px solid #cbd2d8;
}


.answer-grid {
  display:grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(
        300px,
        1fr
      )
    );

  gap:7px;

  width:100%;
}


.answer-card {
  min-width:0;

  background:#fff;

  border:1px solid #c8ced4;

  border-radius:3px;

  overflow:hidden;
}


.answer-card.active {
  border:2px solid #1769aa;
}


.answer-card-head {
  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:6px;

  min-height:30px;

  padding:5px 7px;

  background:#f3f5f7;

  border-bottom:1px solid #d5dbe0;
}


.answer-label {
  font-size:11px;

  font-weight:700;
}


.answer-state {
  color:#777;

  font-size:10px;
}


.answer-state.marked {
  color:#16834b;

  font-weight:700;
}


.answer-image-area {
  position:relative;

  width:100%;

  min-height:160px;

  background:#f8f9fa;

  overflow:hidden;

  cursor:pointer;
}


.answer-image-area img {
  display:block;

  width:100%;

  height:auto;

  user-select:none;

  pointer-events:none;
}


.answer-error {
  min-height:160px;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:20px;

  color:#b42318;

  font-size:11px;

  text-align:center;
}


/* =====================================================
   MARK OBJECT
===================================================== */

.mark-object {
  position:absolute;

  z-index:20;

  color:#d00000;

  line-height:1;

  font-weight:700;

  user-select:none;

  pointer-events:auto;

  cursor:pointer;

  text-shadow:
    0 0 1px #fff,
    0 0 2px #fff;
}


.mark-object:hover {
  outline:1px dashed #d00000;
}


/* =====================================================
   SCORE
===================================================== */

.answer-score {
  display:flex;

  align-items:center;

  justify-content:center;

  gap:4px;

  padding:6px;

  border-top:1px solid #d5dbe0;
}


.score-input {
  width:68px;

  height:34px;

  padding:0 5px;

  border:1px solid #b8c1c9;

  border-radius:3px;

  text-align:center;

  font-size:16px;
}


.score-button {
  height:32px;

  min-width:36px;

  padding:0 7px;

  border:1px solid #b8c1c9;

  border-radius:3px;

  background:#fff;

  cursor:pointer;

  font-weight:700;
}


.score-button:hover {
  background:#f1f4f6;
}


.score-button.primary {
  background:#1769aa;

  border-color:#1769aa;

  color:#fff;
}


.score-status {
  padding:0 6px 5px;

  text-align:center;

  color:#777;

  font-size:10px;
}


.score-status.marked {
  color:#16834b;

  font-weight:700;
}


/* =====================================================
   COMPLETE
===================================================== */

.complete {
  display:none;

  margin-top:8px;

  padding:14px;

  background:#edf8ef;

  border:1px solid #b7d9c0;

  color:#176b35;
}


.complete.show {
  display:block;
}


.complete-title {
  font-weight:700;

  margin-bottom:3px;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:900px) {

  .marking-main {
    padding:7px;
  }


  .answer-grid {
    grid-template-columns:
      repeat(
        auto-fit,
        minmax(
          270px,
          1fr
        )
      );
  }


  .keyboard-help {
    width:100%;

    margin-left:0;
  }

}


@media(max-width:600px) {

  .answer-grid {
    grid-template-columns:
      1fr;
  }


  .question-header {
    align-items:flex-start;

    flex-direction:column;
  }


  .question-space {
    display:none;
  }

}

</style>

<style>
#markToolbar input[type="color"]{width:38px;height:34px;padding:2px;border:1px solid #b8c1c9;border-radius:4px;background:#fff;cursor:pointer}
#markToolbar select,#markToolbar input[type="text"]{min-height:34px;padding:5px 7px;border:1px solid #b8c1c9;border-radius:4px;background:#fff;color:#263746}
#markToolbar label{font-size:12px;color:#59636d}
</style>
</head>

<button
id="logoutButton"
class="logout-button"

</button>

</header>


<main class="marking-main">


<div class="toolbar">

<a
href="/teacher/marking"

<a

href="#"
class="btn"

</a>


<button
id="refreshButton"
class="btn"
type="button"
>
更新
</button>


<div class="toolbar-space"></div>


<span
id="teacherNameTop"
style="display:none;"
>
</span>


</div>

id="status"
class="status"

採点画面を起動しています...
</div>


<div
id="progress"
class="progress"
>

class="progress-text"
>
0 / 0
</div>


<div class="progress-track">

<div
id="progressBar"
class="progress-bar"

</div>

</div>

</div>

id="markToolbar"
class="mark-toolbar"
>

</span>


<button
type="button"
class="mark-tool"
data-mark="circle"
>

</button>


<button
type="button"
class="mark-tool"

>
×
</button>


<button
type="button"
class="mark-tool"
data-mark="triangle"
>
△
</button>


<button
type="button"
class="mark-tool"
data-mark="double_circle"

<button
type="button"

<label class="toolbar-label" for="markFontFamily">フォント</label>
