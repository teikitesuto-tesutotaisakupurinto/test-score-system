<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    問題設定 - テスト成績システム
  </title>

  <link
    rel="stylesheet"
    href="/css/common.css"
  >

</head>

<body>

<header class="topbar">

  <div class="system-name">
    テスト成績システム
  </div>

  <div class="topbar-space"></div>

  <span id="teacherName">
    -
  </span>

  <button
    id="logoutButton"
    class="logout-button"
  >
    ログアウト
  </button>

</header>


<div class="teacher-layout">

  <aside class="sidebar">

    <div class="sidebar-title">
      テスト設定
    </div>

    <a
      id="pagesLink"
      href="#"
      class="menu-link"
    >
      解答用紙登録
    </a>

    <a
      id="layoutLink"
      href="#"
      class="menu-link"
    >
      枠設定
    </a>

    <a
      id="questionsLink"
      href="#"
      class="menu-link active"
    >
      問題設定
    </a>

    <a
      id="modelAnswerLink"
      href="#"
      class="menu-link"
    >
      模範解答
    </a>

  </aside>


  <main class="main-content">

    <div class="page-header">

      <h1>
        問題設定
      </h1>

    </div>


    <div
      id="testInformation"
      class="card"
    >
      読み込み中...
    </div>


    <div class="card">

      <h3>
        問題を追加
      </h3>


      <form id="questionForm">

        <div
          style="
            display:grid;
            grid-template-columns:
              140px 120px 1fr 1fr;
            gap:12px;
          "
        >

          <div class="form-group">

            <label>
              設問番号
            </label>

            <input
              id="questionNo"
              placeholder="問1"
              required
            >

          </div>


          <div class="form-group">

            <label>
              配点
            </label>

            <input
              id="points"
              type="number"
              min="0"
              step="0.5"
              required
            >

          </div>


          <div class="form-group">

            <label>
              正答
            </label>

            <input
              id="correctAnswer"
              placeholder="例：○、12、A"
            >

          </div>


          <div class="form-group">

            <label>
              観点
            </label>

            <input
              id="viewpoint"
              placeholder="知識・技能"
            >

          </div>

        </div>


        <div class="form-group">

          <label>
            採点基準
          </label>

          <textarea
            id="rubric"
            placeholder="部分点や採点基準を入力"
          ></textarea>

        </div>


        <div
          style="
            display:grid;
            grid-template-columns:
              180px 180px;
            gap:12px;
          "
        >

          <div class="form-group">

            <label>
              採点方式
            </label>

            <select
              id="markingMode"
            >

              <option value="manual">
                手動採点
              </option>

              <option value="auto">
                自動採点
              </option>

              <option value="ai">
                AI補助
              </option>

            </select>

          </div>


          <div class="form-group">

            <label>
              ページ番号
            </label>

            <input
              id="pageNo"
              type="number"
              min="1"
              value="1"
            >

          </div>

        </div>


        <div
          id="questionMessage"
          style="
            min-height:22px;
            margin-bottom:10px;
          "
        ></div>


        <button
          id="addQuestionButton"
          type="submit"
          class="btn btn-primary"
        >
          問題を追加
        </button>

      </form>

    </div>


    <div class="card">

      <h3>
        登録済み問題
      </h3>


      <div style="overflow:auto;">

        <table class="table">

          <thead>

            <tr>

              <th>
                順番
              </th>

              <th>
                設問番号
              </th>

              <th>
                配点
              </th>

              <th>
                正答
              </th>

              <th>
                観点
              </th>

              <th>
                採点方式
              </th>

              <th>
                ページ
              </th>

            </tr>

          </thead>


          <tbody id="questionRows">

            <tr>

              <td
                colspan="7"
                style="
                  text-align:center;
                "
              >
                読み込み中...
              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </main>

</div>


<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="/js/config.js"></script>

<script src="/js/auth.js"></script>

<script src="/js/teacher/questions.js"></script>

</body>

</html>
