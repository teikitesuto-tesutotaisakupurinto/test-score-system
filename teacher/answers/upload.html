<!-- =====================================================
     答案処理用ライブラリ
====================================================== -->

<script
  src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"
></script>

<script
  src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"
></script>

<script
  src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"
></script>


<script>

"use strict";


/* =========================================================
   STATE
========================================================= */

let testPages = [];

let layoutBoxes = [];

let students = [];


/* =========================================================
   INITIALIZE
========================================================= */

requireRole("teacher")
  .then(
    load
  );


async function load() {

  try {

    const {
      data,
      error
    } =
      await SB
        .from("tests")
        .select(
          "id,name,subject"
        )
        .order(
          "created_at",
          {
            ascending:
              false
          }
        );


    if (error) {

      throw error;

    }


    const test =
      document.getElementById(
        "test"
      );


    test.innerHTML =
      `
        <option value="">
          テストを選択してください
        </option>
      `;


    for (
      const item
      of data || []
    ) {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        item.id;


      option.textContent =
        [
          item.name,
          item.subject
        ]
          .filter(Boolean)
          .join(
            " / "
          );


      test.appendChild(
        option
      );

    }

  } catch (error) {

    showError(
      error.message ||
      "テスト一覧を読み込めませんでした。"
    );

  }

}


/* =========================================================
   UPLOAD
========================================================= */

document
  .getElementById("upload")
  .addEventListener(
    "click",
    uploadAnswers
  );


async function uploadAnswers() {

  const testId =
    document
      .getElementById("test")
      .value;


  const input =
    document
      .getElementById("files");


  const files =
    Array.from(
      input.files || []
    );


  if (!testId) {

    showError(
      "テストを選択してください。"
    );

    return;

  }


  if (!files.length) {

    showError(
      "答案ファイルを選択してください。"
    );

    return;

  }


  const button =
    document.getElementById(
      "upload"
    );


  button.disabled =
    true;


  try {

    setMessage(
      "解答用紙の枠設定を読み込んでいます..."
    );


    /*
      =====================================================
      解答用紙と枠設定
      =====================================================
    */

    await loadTestLayout(
      testId
    );


    /*
      =====================================================
      生徒一覧
      =====================================================
    */

    await loadStudents();


    /*
      =====================================================
      ファイルを順番に処理
      =====================================================
    */

    for (
      let i = 0;
      i < files.length;
      i++
    ) {

      const file =
        files[i];


      setMessage(
        `${i + 1}/${files.length} 件目を処理しています...`
      );


      await processOneFile(
        testId,
        file
      );

    }


    setMessage(
      `${files.length}件の答案を処理しました。`
    );


    input.value =
      "";


  } catch (error) {

    console.error(
      "答案アップロードエラー:",
      error
    );


    showError(
      error.message ||
      "答案の処理に失敗しました。"
    );

  } finally {

    button.disabled =
      false;

  }

}


/* =========================================================
   LOAD TEST PAGES / LAYOUT BOXES
========================================================= */

async function loadTestLayout(
  testId
) {

  /*
    test_pages
  */

  const {
    data:
      pages,
    error:
      pagesError
  } =
    await SB
      .from("test_pages")
      .select(
        `
        id,
        test_id,
        page_no,
        image_path,
        width_px,
        height_px,
        original_name
        `
      )
      .eq(
        "test_id",
        testId
      )
      .order(
        "page_no",
        {
          ascending:
            true
        }
      );


  if (pagesError) {

    throw pagesError;

  }


  /*
    layout_boxes

    重要:
    source_page_idは使用しない。
    page_noだけで対応する。
  */

  const {
    data:
      boxes,
    error:
      boxesError
  } =
    await SB
      .from("layout_boxes")
      .select(
        `
        id,
        test_id,
        page_no,
        box_type,
        label,
        x,
        y,
        width,
        height,
        question_id,
        points,
        parent_box_id,
        major_no,
        minor_no,
        box_role,
        sort_order,
        subtotal_group
        `
      )
      .eq(
        "test_id",
        testId
      )
      .order(
        "page_no",
        {
          ascending:
            true
        }
      )
      .order(
        "sort_order",
        {
          ascending:
            true
        }
      );


  if (boxesError) {

    throw boxesError;

  }


  testPages =
    pages || [];


  layoutBoxes =
    boxes || [];

}


/* =========================================================
   STUDENTS
========================================================= */

async function loadStudents() {

  /*
    studentsの全列を取得して、
    QRの形式が既存システムと違っていても
    できるだけ対応する。

    select * なので、
    qr_token列の有無でSQL自体が失敗しない。
  */

  const {
    data,
    error
  } =
    await SB
      .from("students")
      .select("*")
      .eq(
        "active",
        true
      );


  if (error) {

    throw error;

  }


  students =
    data || [];

}


/* =========================================================
   PROCESS ONE FILE
========================================================= */

async function processOneFile(
  testId,
  file
) {

  /*
    PDF / ZIP / 画像
    ↓
    ページ画像
  */

  const pages =
    await expandFile(
      file
    );


  if (!pages.length) {

    throw new Error(
      `${file.name}から処理可能なページを取得できませんでした。`
    );

  }


  /*
    =====================================================
    QRを全ページから探す
    =====================================================
  */

  let qrValue =
    null;


  let qrPageNo =
    null;


  for (
    let index = 0;
    index < pages.length;
    index++
  ) {

    const pageNo =
      index + 1;


    const page =
      pages[index];


    const pageBoxes =
      getBoxesForPage(
        pageNo
      );


    const qr =
      readQrFromPage(
        page,
        pageBoxes
      );


    if (qr) {

      qrValue =
        qr;

      qrPageNo =
        pageNo;

      break;

    }

  }


  /*
    =====================================================
    QR → 生徒
    =====================================================
  */

  const student =
    qrValue
      ? findStudent(
          qrValue
        )
      : null;


  /*
    =====================================================
    答案ID
    =====================================================
  */

  const answerId =
    crypto.randomUUID();


  /*
    =====================================================
    全ページStorage保存
    =====================================================
  */

  const pageRecords =
    [];


  for (
    let index = 0;
    index < pages.length;
    index++
  ) {

    const pageNo =
      index + 1;


    const page =
      pages[index];


    const path =
      buildAnswerPath(
        testId,
        answerId,
        pageNo
      );


    await uploadPage(
      path,
      page
    );


    pageRecords.push({

      pageNo,

      path,

      width:
        page.width,

      height:
        page.height

    });

  }


  /*
    =====================================================
    answer_sheets
    =====================================================
  */

  const {
    data:
      insertedSheet,
    error:
      sheetError
  } =
    await SB
      .from("answer_sheets")
      .insert({

        id:
          answerId,

        test_id:
          testId,

        file_path:
          pageRecords[0].path,

        status:
          student
            ? "matched"
            : "unmatched"

      })
      .select(
        "id"
      )
      .single();


  if (sheetError) {

    throw sheetError;

  }


  /*
    =====================================================
    生徒が見つかった場合
    =====================================================

    answer_sheetsにstudent_idがある環境なら
    紐付ける。

    QR値そのものはanswer_sheetsに勝手に
    保存しない。
  */

  if (
    student &&
    Object.prototype.hasOwnProperty.call(
      student,
      "id"
    )
  ) {

    const {
      error:
        studentUpdateError
    } =
      await SB
        .from("answer_sheets")
        .update({

          student_id:
            student.id,

          status:
            "matched"

        })
        .eq(
          "id",
          insertedSheet.id
        );


    if (studentUpdateError) {

      /*
        student_idがDBにない古い構成でも
        答案自体は残す。
      */

      console.warn(
        "student_idの紐付け更新に失敗:",
        studentUpdateError
      );

    }

  }


  /*
    =====================================================
    answer_sheet_pages
    =====================================================
  */

  for (
    const page
    of pageRecords
  ) {

    const {
      error:
        pageError
    } =
      await SB
        .from(
          "answer_sheet_pages"
        )
        .upsert(
          {

            answer_sheet_id:
              answerId,

            page_no:
              page.pageNo,

            file_path:
              page.path,

            width_px:
              page.width,

            height_px:
              page.height

          },
          {
            onConflict:
              "answer_sheet_id,page_no"
          }
        );


    if (pageError) {

      throw pageError;

    }


    /*
      設問IDが既にある小問だけ
      answer_regionsを作る。

      この画面では設問IDを作らない。
    */

    await createAnswerRegions(
      answerId,
      page.pageNo
    );

  }


  /*
    =====================================================
    結果
    =====================================================
  */

  if (student) {

    setMessage(
      `${file.name}: ${student.student_no || ""} ${student.name || ""} に自動紐付けしました。`
    );

  } else if (qrValue) {

    setMessage(
      `${file.name}: QR「${qrValue}」は読み取りましたが、生徒を特定できませんでした。`
    );

  } else {

    setMessage(
      `${file.name}: QRを読み取れなかったため未紐付けで保存しました。`
    );

  }

}


/* =========================================================
   ANSWER REGIONS
========================================================= */

async function createAnswerRegions(
  answerSheetId,
  pageNo
) {

  const boxes =
    getBoxesForPage(
      pageNo
    );


  /*
    小問かつquestion_idがあるものだけ。

    勝手にquestion_idを生成しない。
  */

  const rows =
    boxes
      .filter(
        box =>
          box.box_role ===
            "minor" &&
          box.question_id
      )
      .map(
        box => ({

          answer_sheet_id:
            answerSheetId,

          question_id:
            box.question_id,

          page_no:
            pageNo,

          x:
            Number(
              box.x
            ),

          y:
            Number(
              box.y
            ),

          width:
            Number(
              box.width
            ),

          height:
            Number(
              box.height
            )

        })
      );


  if (!rows.length) {

    return;

  }


  const {
    error
  } =
    await SB
      .from(
        "answer_regions"
      )
      .insert(
        rows
      );


  if (error) {

    throw error;

  }

}


/* =========================================================
   GET BOXES FOR PAGE
========================================================= */

function getBoxesForPage(
  pageNo
) {

  return layoutBoxes.filter(
    box =>
      Number(
        box.page_no
      ) ===
      Number(
        pageNo
      )
  );

}


/* =========================================================
   QR
========================================================= */

function readQrFromPage(
  page,
  boxes
) {

  /*
    QR枠があれば、
    まずQR枠だけを見る。
  */

  const qrBoxes =
    boxes.filter(
      box =>
        box.box_role ===
          "qr" ||
        box.box_type ===
          "qr"
    );


  for (
    const box
    of qrBoxes
  ) {

    const cropped =
      cropCanvas(
        page.canvas,
        box
      );


    const result =
      decodeQr(
        cropped
      );


    if (
      result &&
      result.data
    ) {

      return normalizeQr(
        result.data
      );

    }

  }


  /*
    QR枠がなければ
    ページ全体。
  */

  const full =
    decodeQr(
      page.canvas
    );


  if (
    full &&
    full.data
  ) {

    return normalizeQr(
      full.data
    );

  }


  return null;

}


/* =========================================================
   QR DECODE
========================================================= */

function decodeQr(
  canvas
) {

  if (
    typeof jsQR !==
    "function"
  ) {

    return null;

  }


  if (
    canvas.width <= 0 ||
    canvas.height <= 0
  ) {

    return null;

  }


  const context =
    canvas.getContext(
      "2d",
      {
        willReadFrequently:
          true
      }
    );


  const image =
    context.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );


  return jsQR(
    image.data,
    image.width,
    image.height,
    {
      inversionAttempts:
        "attemptBoth"
    }
  );

}


/* =========================================================
   NORMALIZE QR
========================================================= */

function normalizeQr(
  value
) {

  const text =
    String(
      value ||
      ""
    ).trim();


  /*
    JSON
  */

  try {

    const json =
      JSON.parse(
        text
      );


    const keys = [
      "student_no",
      "studentNo",
      "student_id",
      "studentId",
      "id"
    ];


    for (
      const key
      of keys
    ) {

      if (
        json[key] !==
          undefined &&
        json[key] !==
          null
      ) {

        return String(
          json[key]
        ).trim();

      }

    }

  } catch (_) {}


  /*
    URL
  */

  try {

    const url =
      new URL(
        text
      );


    const keys = [
      "student_no",
      "studentNo",
      "student_id",
      "studentId",
      "student"
    ];


    for (
      const key
      of keys
    ) {

      const value =
        url.searchParams.get(
          key
        );


      if (value) {

        return value.trim();

      }

    }

  } catch (_) {}


  return text;

}


/* =========================================================
   FIND STUDENT
========================================================= */

function findStudent(
  qrValue
) {

  const value =
    normalizeStudentValue(
      qrValue
    );


  /*
    QR関連列を順番に確認。
  */

  const qrKeys = [
    "qr_token",
    "qr",
    "qr_code",
    "qr_value"
  ];


  for (
    const key
    of qrKeys
  ) {

    const student =
      students.find(
        item =>
          Object.prototype.hasOwnProperty.call(
            item,
            key
          ) &&
          normalizeStudentValue(
            item[key]
          ) ===
          value
      );


    if (student) {

      return student;

    }

  }


  /*
    生徒番号
  */

  let student =
    students.find(
      item =>
        normalizeStudentValue(
          item.student_no
        ) ===
        value
    );


  if (student) {

    return student;

  }


  /*
    ID
  */

  student =
    students.find(
      item =>
        normalizeStudentValue(
          item.id
        ) ===
        value
    );


  if (student) {

    return student;

  }


  /*
    数字なら先頭ゼロを無視。
  */

  if (
    /^\d+$/.test(
      value
    )
  ) {

    const normalized =
      value.replace(
        /^0+/,
        ""
      );


    student =
      students.find(
        item =>
          normalizeStudentValue(
            item.student_no
          ).replace(
            /^0+/,
            ""
          ) ===
          normalized
      );


    if (student) {

      return student;

    }

  }


  return null;

}


function normalizeStudentValue(
  value
) {

  return String(
    value ||
    ""
  )
    .trim()
    .replace(
      /[\s\-]/g,
      ""
    )
    .toLowerCase();

}


/* =========================================================
   FILE EXPANSION
========================================================= */

async function expandFile(
  file
) {

  const extension =
    getExtension(
      file.name
    );


  if (
    extension ===
    "pdf"
  ) {

    return pdfToPages(
      file
    );

  }


  if (
    extension ===
    "zip"
  ) {

    return zipToPages(
      file
    );

  }


  return [
    await imageToPage(
      file
    )
  ];

}


/* =========================================================
   PDF
========================================================= */

async function pdfToPages(
  file
) {

  const buffer =
    await file.arrayBuffer();


  const pdf =
    await pdfjsLib
      .getDocument({
        data:
          buffer
      })
      .promise;


  const pages =
    [];


  for (
    let pageNo = 1;
    pageNo <=
    pdf.numPages;
    pageNo++
  ) {

    const pdfPage =
      await pdf.getPage(
        pageNo
      );


    const base =
      pdfPage.getViewport({
        scale:
          1
      });


    /*
      元画像を必要以上に
      巨大化しない。
    */

    const scale =
      Math.min(
        3,
        Math.max(
          1,
          3000 /
          Math.max(
            base.width,
            base.height
          )
        )
      );


    const viewport =
      pdfPage.getViewport({
        scale
      });


    const canvas =
      document.createElement(
        "canvas"
      );


    canvas.width =
      Math.ceil(
        viewport.width
      );


    canvas.height =
      Math.ceil(
        viewport.height
      );


    await pdfPage
      .render({

        canvasContext:
          canvas.getContext(
            "2d"
          ),

        viewport

      })
      .promise;


    pages.push({

      canvas,

      width:
        canvas.width,

      height:
        canvas.height

    });

  }


  return pages;

}


/* =========================================================
   ZIP
========================================================= */

async function zipToPages(
  file
) {

  const zip =
    await JSZip.loadAsync(
      file
    );


  const entries =
    Object.values(
      zip.files
    )
      .filter(
        entry =>
          !entry.dir
      )
      .sort(
        (
          a,
          b
        ) =>
          a.name.localeCompare(
            b.name,
            undefined,
            {
              numeric:
                true
            }
          )
      );


  const pages =
    [];


  for (
    const entry
    of entries
  ) {

    const extension =
      getExtension(
        entry.name
      );


    if (
      extension ===
      "pdf"
    ) {

      const blob =
        await entry.async(
          "blob"
        );


      const pdfFile =
        new File(
          [
            blob
          ],
          entry.name,
          {
            type:
              "application/pdf"
          }
        );


      pages.push(
        ...await pdfToPages(
          pdfFile
        )
      );


      continue;

    }


    if (
      [
        "jpg",
        "jpeg",
        "png",
        "webp"
      ].includes(
        extension
      )
    ) {

      const blob =
        await entry.async(
          "blob"
        );


      const imageFile =
        new File(
          [
            blob
          ],
          entry.name,
          {
            type:
              extension ===
              "jpg"
                ? "image/jpeg"
                : `image/${extension}`
          }
        );


      pages.push(
        await imageToPage(
          imageFile
        )
      );

    }

  }


  return pages;

}


/* =========================================================
   IMAGE
========================================================= */

async function imageToPage(
  file
) {

  const url =
    URL.createObjectURL(
      file
    );


  try {

    const image =
      await loadImage(
        url
      );


    const canvas =
      document.createElement(
        "canvas"
      );


    canvas.width =
      image.naturalWidth;


    canvas.height =
      image.naturalHeight;


    canvas
      .getContext(
        "2d"
      )
      .drawImage(
        image,
        0,
        0
      );


    return {

      canvas,

      width:
        canvas.width,

      height:
        canvas.height

    };

  } finally {

    URL.revokeObjectURL(
      url
    );

  }

}


/* =========================================================
   STORAGE
========================================================= */

async function uploadPage(
  path,
  page
) {

  const blob =
    await canvasToBlob(
      page.canvas
    );


  const {
    error
  } =
    await SB
      .storage
      .from(
        "answers"
      )
      .upload(
        path,
        blob,
        {
          contentType:
            "image/png",

          cacheControl:
            "3600",

          upsert:
            true
        }
      );


  if (error) {

    throw error;

  }

}

/* =========================================================
   CROP
========================================================= */

function cropCanvas(
  source,
  box
) {

  const x =
    Math.max(
      0,
      Math.round(
        Number(
          box.x
        )
      )
    );


  const y =
    Math.max(
      0,
      Math.round(
        Number(
          box.y
        )
      )
    );


  const width =
    Math.max(
      1,
      Math.round(
        Number(
          box.width
        )
      )
    );


  const height =
    Math.max(
      1,
      Math.round(
        Number(
          box.height
        )
      )
    );


  const safeWidth =
    Math.max(
      1,
      Math.min(
        width,
        source.width -
        x
      )
    );


  const safeHeight =
    Math.max(
      1,
      Math.min(
        height,
        source.height -
        y
      )
    );


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    safeWidth;


  canvas.height =
    safeHeight;


  canvas
    .getContext(
      "2d"
    )
    .drawImage(
      source,

      x,
      y,
      safeWidth,
      safeHeight,

      0,
      0,
      safeWidth,
      safeHeight
    );


  return canvas;

}


/* =========================================================
   BLOB
========================================================= */

function canvasToBlob(
  canvas
) {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      canvas.toBlob(
        blob => {

          if (!blob) {

            reject(
              new Error(
                "画像変換に失敗しました。"
              )
            );

            return;

          }


          resolve(
            blob
          );

        },
        "image/png",
        .95
      );

    }
  );

}


/* =========================================================
   IMAGE
========================================================= */

function loadImage(
  src
) {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const image =
        new Image();


      image.onload =
        () =>
          resolve(
            image
          );


      image.onerror =
        () =>
          reject(
            new Error(
              "画像を読み込めませんでした。"
            )
          );


      image.src =
        src;

    }
  );

}

function getExtension(
  name
) {

  const parts =
    String(
      name ||

      .toLowerCase()
      .split(
