
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  模範解答登録 - テスト成績システム
</title>

<link
  rel="stylesheet"
  href="/css/common.css"
>

<style>

.model-main {
  max-width:1100px;

  margin:0 auto;

  padding:22px;
}


.model-information {
  margin-bottom:15px;

  padding:14px;

  background:#fff;

  border:
    1px solid #d0d6dc;
}


.model-toolbar {
  display:flex;

  flex-wrap:wrap;

  gap:8px;

  margin-bottom:15px;
}


.upload-card {
  margin-bottom:15px;

  padding:18px;

  background:#fff;

  border:
    1px solid #d0d6dc;
}


.model-page-list {
  display:grid;

  grid-template-columns:
    repeat(
      auto-fill,
      minmax(
        220px,
        1fr
      )
    );

  gap:12px;
}


.model-page {
  padding:12px;

  background:#fff;

  border:
    1px solid #d0d6dc;

  border-radius:4px;
}


.model-page-title {
  font-weight:700;

  font-size:14px;
}


.model-page-name {
  margin-top:5px;

  color:#666;

  font-size:11px;

  word-break:break-all;
}


.empty {
  padding:50px;

  color:#777;

  text-align:center;
}

</style>

</head>


<body>


<header class="topbar">

<div class="system-name">
  テスト成績システム
</div>


<div class="topbar-space"></div>


<span id="teacherName">
  -
</span>


<button
id="logoutButton"
class="logout-button"
type="button"
>
  ログアウト
</button>

</header>


<div class="teacher-layout">


<aside class="sidebar">


<div class="sidebar-title">
  テスト設定
</div>


<a
href="/teacher/tests"
class="menu-link"
>
  テスト一覧
</a>


<a
id="pagesLink"
href="#"
class="menu-link"
>
  解答用紙登録
</a>


<a
id="layoutLink"
href="#"
class="menu-link"
>
  枠設定
</a>


<a
href="#"
id="modelAnswerLink"
class="menu-link active"
>
  模範解答
</a>


<a
id="previewLink"
href="#"
class="menu-link"
>
  テスト確認
</a>


<a
id="pointsLink"
href="#"
class="menu-link"
>
  配点設定
</a>


</aside>


<main class="main-content model-main">


<div class="page-header">

<h1>
  模範解答登録
</h1>

</div>


<section
id="testInformation"
class="model-information"
>
読み込み中...
</section>


<section class="upload-card">


<h3>
  模範解答ファイル
</h3>


<p
style="
  color:#666;
  font-size:12px;
  line-height:1.8;
"
>

PDFまたは画像を登録できます。

<br>

複数ページの場合は選択した順にページとして登録します。

</p>


<input
id="modelAnswerFiles"
type="file"
multiple
accept=".pdf,.jpg,.jpeg,.png,.webp"
>


<div
style="
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px;
"
>

<button
id="uploadButton"
type="button"
class="btn btn-primary"
>
登録
</button>


<button
id="clearButton"
type="button"
class="btn"
>
登録済みをすべて削除
</button>

</div>


<div
id="message"
style="
  min-height:22px;
  margin-top:10px;
"
aria-live="polite"
>
</div>


</section>


<section class="upload-card">


<h3>

登録済み模範解答

<span
id="pageCount"
style="
  color:#777;
  font-size:12px;
  font-weight:400;
"
>
</span>

</h3>


<div
id="pageList"
class="model-page-list"
>

<div class="empty">
読み込み中...
</div>

</div>


</section>


</main>


</div>


<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script
src="/js/config.js?v=20261116"
></script>


<script
src="/js/auth.js?v=20261116"
></script>


<script
src="/js/lib/pdf-loader.js?v=20261116"
></script>


<script
src="/js/lib/file-parser.js?v=20261116"
></script>


<script
src="/js/teacher/model-answer.js?v=20261116"
></script>


</body>

</html>
