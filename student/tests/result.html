<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>
  テスト結果 - テスト成績システム
</title>

<link
  rel="stylesheet"
  href="/css/common.css?v=20261126completefix"
>

<link
  rel="stylesheet"
  href="/css/student-result.css"
>

<style>

.result-waiting {
  padding:30px;

  background:#fff;

  border:1px solid #d0d6dc;

  text-align:center;

  color:#666;
}


.result-score-grid {
  display:grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(
        180px,
        1fr
      )
    );

  gap:12px;

  margin-bottom:15px;
}


.result-score-card {
  padding:16px;

  background:#fff;

  border:1px solid #d0d6dc;
}


.result-score-label {
  color:#666;

  font-size:12px;
}


.result-score-value {
  margin-top:5px;

  font-size:28px;

  font-weight:700;
}


.result-score-sub {
  margin-top:3px;

  color:#666;

  font-size:12px;
}


.question-results-wrap {
  overflow:auto;
}


.question-results-table {
  width:100%;

  border-collapse:collapse;
}


.question-results-table th,
.question-results-table td {
  padding:9px;

  border:1px solid #d0d6dc;

  text-align:center;
}


.question-results-table th {
  background:#f3f5f7;
}


.question-results-table td.score {
  font-weight:700;
}


.student-answer-pages {
  display:flex;

  flex-direction:column;

  gap:18px;
}


.student-answer-page {
  padding:12px;

  background:#fff;

  border:1px solid #d0d6dc;
}


.student-answer-page-title {
  margin-bottom:8px;

  font-weight:700;
}


.student-answer-page img {
  display:block;

  width:100%;

  max-width:1100px;

  height:auto;

  margin:0 auto;
}


.hidden-before-publish {
  display:none;
}


</style>

</head>


<body>


<header class="topbar">

  <div class="system-name">
    テスト成績システム
  </div>


  <div class="topbar-space"></div>


  <span id="studentName">
    -
  </span>


  <button
    id="logoutButton"
    class="logout-button"
    type="button"
  >
    ログアウト
  </button>

</header>


<main class="student-main">


<div class="page-header">

  <div>

    <h1 id="testName">
      -
    </h1>


    <div
      id="testMeta"
      class="test-meta"
    >
    </div>

  </div>

</div>


<div class="student-result-actions"><button id="downloadPdfButton" class="btn btn-primary" type="button">成績表PDFダウンロード</button></div>

<section id="previousComparison" class="student-result-card" style="display:none"></section>

<section
  id="resultSummary"
  class="student-result-summary"
>
</section>


<section
  id="questionResultsCard"
  class="student-result-card"
>


<div class="student-result-card-title">
  設問別結果
</div>


<div
  id="questionResults"
  class="question-results-wrap"
>
</div>


</section>


<section
  class="student-result-card"
>


<div class="student-result-card-title">
  答案
</div>


<div
  id="answerStatus"
  class="result-waiting"
>
  結果を確認しています...
</div>


<div
  id="studentAnswerActions"
  class="student-result-actions hidden-before-publish"
>


<a
  id="originalAnswerLink"
  class="btn"
  href="#"
>
採点前答案を見る
</a>


</div>


</section>


<section
  id="markedAnswerCard"
  class="student-result-card hidden-before-publish"
>


<div class="student-result-card-title">
  採点済み答案
</div>


<div
  id="markedPages"
  class="student-answer-pages"
>
</div>


</section>


</main>


<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script
src="/js/config.js?v=20261116"
></script>


<script
src="/js/auth.js?v=20261126"
></script>


<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script
src="/js/student/result.js?v=20261126completefix"
></script>



<script src="/js/common-sidebar.js?v=20261126completefix"></script>
</body>

</html>
