
<!doctype html>
<html lang="ja">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
  デジタル採点 - テスト成績システム
</title>

<link
  rel="stylesheet"
  href="/css/marking.css"
>

<style>

.marking-page {
  min-height:100vh;
  background:#eef2f5;
}

.marking-header {
  position:sticky;
  top:0;
  z-index:20;

  display:flex;
  align-items:center;
  gap:10px;

  padding:12px 16px;

  background:#fff;

  border-bottom:1px solid #d0d6dc;
}

.marking-title {
  font-size:18px;
  font-weight:700;
}

.header-space {
  flex:1;
}

.test-select {
  min-width:320px;
  height:38px;

  padding:0 9px;

  border:1px solid #b8c1c9;

  border-radius:4px;

  background:#fff;
}

.marking-main {
  max-width:1500px;

  margin:0 auto;

  padding:20px;
}

.status {
  margin-bottom:15px;

  padding:10px 12px;

  background:#fff;

  border:1px solid #d0d6dc;

  font-size:13px;

  white-space:pre-wrap;
}

.status.error {
  color:#b42318;
}

.test-card {
  background:#fff;

  border:1px solid #d0d6dc;

  border-radius:6px;

  padding:18px;
}

.test-title {
  font-size:20px;

  font-weight:700;
}

.test-meta {
  margin-top:6px;

  color:#666;

  font-size:13px;
}

.test-actions {
  display:flex;

  flex-wrap:wrap;

  gap:8px;

  margin-top:18px;
}

.answer-summary {
  margin-top:15px;

  padding:12px;

  background:#f5f6f7;

  border:1px solid #d5dbe0;

  font-size:13px;
}

.question-summary {
  margin-top:15px;

  padding:12px;

  background:#f5f6f7;

  border:1px solid #d5dbe0;

  font-size:13px;
}

.empty {
  padding:50px;

  text-align:center;

  color:#777;

  background:#fff;

  border:1px solid #d0d6dc;
}

.error-box {
  padding:20px;

  background:#fff4f2;

  border:1px solid #efc2bc;

  color:#b42318;
}

@media(max-width:800px) {

  .marking-header {
    flex-wrap:wrap;
  }

  .test-select {
    width:100%;
    min-width:0;
  }

}

</style>

</head>


<body>


<div class="marking-page">


<header class="marking-header">


<div class="marking-title">
  デジタル採点
</div>


<div class="header-space"></div>


<select
  id="testSelect"
  class="test-select"
>

<option value="">
  テストを選択してください
</option>

</select>


<span id="teacherName">
  -
</span>


<button
  id="logoutButton"
  class="btn"
  type="button"
>
  ログアウト
</button>


</header>


<main class="marking-main">


<div
  id="status"
  class="status"
>
  起動しています...
</div>


<section
  id="testArea"
>


<div class="empty">
  テストを選択してください。
</div>


</section>


</main>


</div>


<!-- =====================================================
     Supabase
====================================================== -->

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<!-- =====================================================
     IMPORTANT
     /teacher/marking/index.html なので
     必ずルート絶対パスを使用
====================================================== -->

<script
  src="/js/config.js?v=20261116"
></script>


<script
  src="/js/auth.js?v=20261116"
></script>


<script>

"use strict";


/* =========================================================
   CLIENT
========================================================= */

const DB =
  window.supabaseClient ||
  window.SB;


if (!DB) {

  throw new Error(
    "Supabase Clientが初期化されていません。"
  );

}


/* =========================================================
   DOM
========================================================= */

const testSelect =
  document.getElementById(
    "testSelect"
  );


const testArea =
  document.getElementById(
    "testArea"
  );


const statusElement =
  document.getElementById(
    "status"
  );


const teacherName =
  document.getElementById(
    "teacherName"
  );


/* =========================================================
   STATE
========================================================= */

let tests =
  [];


/* =========================================================
   INIT
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  initialize
);


async function initialize() {

  try {

    /*
     * 認証
     */

    const result =
      await requireRole(
        "teacher"
      );


    if (!result) {

      return;

    }


    teacherName.textContent =
      result.profile?.name ||
      "先生";


    setupEvents();


    await loadTests();


  } catch (error) {

    console.error(
      "marking index:",
      error
    );


    showError(
      error.message ||
      "採点画面を起動できませんでした。"
    );

  }

}


/* =========================================================
   EVENTS
========================================================= */

function setupEvents() {

  testSelect.addEventListener(
    "change",
    async () => {

      const testId =
        testSelect.value;


      if (!testId) {

        testArea.innerHTML = `

          <div class="empty">
            テストを選択してください。
          </div>

        `;

        setStatus(
          "テストを選択してください。"
        );

        return;

      }


      try {

        await loadTestSummary(
          testId
        );

      } catch (error) {

        console.error(
          error
        );


        showError(
          error.message ||
          "テスト情報を取得できませんでした。"
        );

      }

    }
  );


  document
    .getElementById(
      "logoutButton"
    )
    .addEventListener(
      "click",
      async () => {

        if (
          typeof window.logout ===
          "function"
        ) {

          await window.logout();

          return;

        }


        await DB.auth.signOut();

        location.replace(
          "/login"
        );

      }
    );

}


/* =========================================================
   LOAD TESTS
========================================================= */

async function loadTests() {

  setStatus(
    "テスト一覧を読み込んでいます..."
  );


  const {
    data,
    error
  } =
    await DB
      .from(
        "tests"
      )
      .select(
        `
        id,
        name,
        subject,
        grade,
        class_name,
        created_at
        `
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if (error) {

    throw new Error(
      `テスト一覧取得エラー: ${error.message}`
    );

  }


  tests =
    data ||
    [];


  testSelect.innerHTML = `

    <option value="">
      テストを選択してください
    </option>

  `;


  tests.forEach(
    test => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        test.id;


      option.textContent =
        [
          test.name,
          test.subject,
          test.grade,
          test.class_name
        ]
          .filter(
            value =>
              value !== null &&
              value !== undefined &&
              String(
                value
              ).trim() !== ""
          )
          .join(
            " / "
          );


      testSelect.appendChild(
        option
      );

    }
  );


  /*
   * URL ?test=UUID に対応
   */

  const params =
    new URLSearchParams(
      location.search
    );


  const requestedTest =
    params.get(
      "test"
    );


  if (
    requestedTest
  ) {

    const exists =
      tests.some(
        test =>
          test.id ===
          requestedTest
      );


    if (exists) {

      testSelect.value =
        requestedTest;


      await loadTestSummary(
        requestedTest
      );


      return;

    }

  }


  if (!tests.length) {

    setStatus(
      "テストが登録されていません。"
    );

    testArea.innerHTML = `

      <div class="empty">

        テストがありません。

        <br><br>

        <a
          href="/teacher/tests"
          class="btn"
        >
          テスト管理へ
        </a>

      </div>

    `;

    return;

  }


  setStatus(
    `${tests.length}件のテストから選択してください。`
  );

}


/* =========================================================
   TEST SUMMARY
========================================================= */

async function loadTestSummary(
  testId
) {

  const test =
    tests.find(
      item =>
        item.id ===
        testId
    );


  if (!test) {

    throw new Error(
      "テストが見つかりません。"
    );

  }


  setStatus(
    "採点対象を確認しています..."
  );


  /*
   * 答案数
   */

  const {
    count: answerCount,
    error: answerError
  } =
    await DB
      .from(
        "answer_sheets"
      )
      .select(
        "id",
        {
          count:
            "exact",
          head:
            true
        }
      )
      .eq(
        "test_id",
        testId
      );


  if (answerError) {

    throw new Error(
      `答案取得エラー: ${answerError.message}`
    );

  }


  /*
   * 枠
   */

  const {
    data: boxData,
    error: boxError
  } =
    await DB
      .from(
        "layout_boxes"
      )
      .select(
        `
        id,
        box_type,
        label,
        points,
        page_no,
        sort_order
        `
      )
      .eq(
        "test_id",
        testId
      )
      .order(
        "page_no",
        {
          ascending:true
        }
      )
      .order(
        "sort_order",
        {
          ascending:true
        }
      );


  if (boxError) {

    throw new Error(
      `採点枠取得エラー: ${boxError.message}`
    );

  }


  /*
   * 現在のDB構造
   *
   * question_idは使わない。
   *
   * answer枠のみ。
   */

  const excluded =
    new Set([
      "QR",
      "氏名",
      "合計",
      "小計"
    ]);


  const questions =
    (boxData || [])
      .filter(
        box => {

          const type =
            String(
              box.box_type ||
              ""
            )
            .trim()
            .toLowerCase();


          if (
            type !==
            "answer"
          ) {

            return false;

          }


          const label =
            String(
              box.label ||
              ""
            ).trim();


          if (
            excluded.has(
              label
            )
          ) {

            return false;

          }


          return true;

        }
      );


  const totalPoints =
    questions.reduce(
      (
        total,
        box
      ) =>
        total +
        (
          Number(
            box.points
          ) || 0
        ),
      0
    );


  renderTestSummary({

    test,

    answerCount:
      answerCount ||
      0,

    questions,

    totalPoints

  });


  setStatus(
    `${test.name} を選択しました。`
  );

}


/* =========================================================
   RENDER SUMMARY
========================================================= */

function renderTestSummary({
  test,
  answerCount,
  questions,
  totalPoints
}) {

  const encoded =
    encodeURIComponent(
      test.id
    );


  testArea.innerHTML = `

    <section class="test-card">


      <div class="test-title">

        ${escapeHtml(
          test.name
        )}

      </div>


      <div class="test-meta">

        ${escapeHtml(
          [
            test.subject,
            test.grade,
            test.class_name
          ]
            .filter(
              value =>
                value !== null &&
                value !== undefined &&
                String(
                  value
                ).trim() !== ""
            )
            .join(
              " / "
            )
        )}

      </div>


      <div class="answer-summary">

        答案：
        <strong>
          ${answerCount}件
        </strong>

      </div>


      <div class="question-summary">

        採点対象：
        <strong>
          ${questions.length}問
        </strong>

        ／

        合計配点：
        <strong>
          ${formatNumber(
            totalPoints
          )}点
        </strong>

      </div>


      <div class="test-actions">

        <a
          class="btn btn-primary"
          href="/teacher/marking/select?test=${encoded}"
        >
          採点開始
        </a>


        <a
          class="btn"
          href="/teacher/tests/layout?test=${encoded}"
        >
          枠設定
        </a>


        <a
          class="btn"
          href="/teacher/tests/points?test=${encoded}"
        >
          配点設定
        </a>

      </div>


    </section>

  `;

}


/* =========================================================
   STATUS
========================================================= */

function setStatus(
  message,
  error = false
) {

  statusElement.textContent =
    message;


  statusElement.className =
    error
      ? "status error"
      : "status";

}


function showError(
  message
) {

  setStatus(
    message,
    true
  );


  testArea.innerHTML = `

    <div class="error-box">

      ${escapeHtml(
        message
      )}

    </div>

  `;

}


/* =========================================================
   FORMAT
========================================================= */

function formatNumber(
  value
) {

  const number =
    Number(
      value
    );


  if (
    !Number.isFinite(
      number
    )
  ) {

    return "0";

  }


  return Number.isInteger(
    number
  )
    ? String(
        number
      )
    : number.toFixed(
        1
      );

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(
  value
) {

  return String(
    value ??
    ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}

</script>


</body>

</html>
