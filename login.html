
<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="robots"
    content="noindex,nofollow"
  >

  <title>
    ログイン - テスト成績システム
  </title>


  <style>

    * {
      box-sizing:
        border-box;
    }


    html,
    body {

      margin:
        0;

      padding:
        0;

      min-height:
        100%;

    }


    body {

      min-height:
        100vh;

      background:
        #f3f5f7;

      color:
        #222;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        Meiryo,
        sans-serif;

    }


    .login-page {

      min-height:
        100vh;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      padding:
        20px;

    }


    .login-card {

      width:
        100%;

      max-width:
        420px;

      padding:
        32px;

      background:
        #fff;

      border:
        1px solid #d5dbe0;

      border-radius:
        6px;

      box-shadow:
        0 4px 18px
        rgba(
          0,
          0,
          0,
          .06
        );

    }


    .login-title {

      margin:
        0;

      text-align:
        center;

      font-size:
        25px;

      line-height:
        1.4;

    }


    .login-description {

      margin:
        8px 0 28px;

      text-align:
        center;

      color:
        #666;

      font-size:
        13px;

    }


    .field {

      margin-bottom:
        18px;

    }


    .field label {

      display:
        block;

      margin-bottom:
        7px;

      font-size:
        13px;

      font-weight:
        700;

    }


    .field input {

      display:
        block;

      width:
        100%;

      height:
        46px;

      padding:
        0 12px;

      border:
        1px solid #c8ced4;

      border-radius:
        4px;

      background:
        #fff;

      color:
        #222;

      font-size:
        15px;

      outline:
        none;

    }


    .field input:focus {

      border-color:
        #555;

    }


    #loginError {

      display:
        none;

      margin-bottom:
        15px;

      padding:
        11px 12px;

      border:
        1px solid #e2b8b2;

      border-radius:
        4px;

      background:
        #fff4f2;

      color:
        #b42318;

      font-size:
        13px;

      line-height:
        1.6;

    }


    #loginButton {

      width:
        100%;

      height:
        46px;

      border:
        0;

      border-radius:
        4px;

      background:
        #333;

      color:
        #fff;

      font-size:
        15px;

      font-weight:
        700;

      cursor:
        pointer;

    }


    #loginButton:disabled {

      opacity:
        .55;

      cursor:
        default;

    }


    .login-footer {

      margin-top:
        22px;

      text-align:
        center;

      color:
        #888;

      font-size:
        11px;

    }


    @media (
      max-width: 480px
    ) {

      .login-page {

        padding:
          12px;

      }


      .login-card {

        padding:
          24px 18px;

      }


      .login-title {

        font-size:
          21px;

      }

    }

  </style>

</head>


<body>


<main
  class="login-page"
>

  <section
    class="login-card"
  >

    <h1
      class="login-title"
    >
      テスト成績システム
    </h1>


    <p
      class="login-description"
    >
      ログインしてください
    </p>


    <form
      id="loginForm"
      method="post"
      action="/login"
      autocomplete="on"
      novalidate
    >


      <div
        class="field"
      >

        <label
          for="email"
        >
          メールアドレス
        </label>


        <input
          id="email"
          name="email"
          type="email"
          autocomplete="username"
          inputmode="email"
          autocapitalize="none"
          autocorrect="off"
          spellcheck="false"
          required
        >

      </div>



      <div
        class="field"
      >

        <label
          for="password"
        >
          パスワード
        </label>


        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        >

      </div>



      <div
        id="loginError"
        role="alert"
        aria-live="polite"
      ></div>



      <button
        id="loginButton"
        type="submit"
      >
        ログイン
      </button>


    </form>


    <div
      class="login-footer"
    >
      テスト成績システム
    </div>

  </section>

</main>



<!-- =======================================================
     1. Supabase SDK
======================================================= -->

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<!-- =======================================================
     2. Config
======================================================= -->

<script
  src="/js/config.js"
></script>


<!-- =======================================================
     3. Auth
======================================================= -->

<script
  src="/js/auth.js"
></script>


<!-- =======================================================
     4. Login
======================================================= -->

<script
  src="/js/login.js"
></script>


</body>

</html>
