
<!doctype html>
<html lang="ja">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
  デジタル採点 - テスト成績システム
</title>

<link
  rel="stylesheet"
  href="/css/common.css"
>

<link
  rel="stylesheet"
  href="/css/marking.css?v=20261116"
>

</head>


<body>


<div class="marking-page">


<header class="marking-toolbar">


  <div class="marking-toolbar-row">


    <strong>
      デジタル採点
    </strong>


    <span
      id="questionTitle"
      class="question-info"
    >
      -
    </span>


    <span
      id="questionMeta"
      class="point-info"
    >
      -
    </span>


    <span
      id="progressText"
      class="marking-progress"
    >
      0 / 0
    </span>


    <a
      href="/teacher/marking"
      class="btn"
    >
      戻る
    </a>


    <a
      id="pointsButton"
      href="#"
      class="btn"
    >
      配点
    </a>


    <button
      id="refreshButton"
      type="button"
      class="btn"
    >
      更新
    </button>


    <button
      id="logoutButton"
      type="button"
      class="btn"
    >
      ログアウト
    </button>


  </div>


  <div class="marking-toolbar-row">


    <div class="toolbar-group">


      <span class="toolbar-label">
        記号
      </span>


      <button
        type="button"
        class="mark-tool symbol"
        data-mark="circle"
      >
        ○
      </button>


      <button
        type="button"
        class="mark-tool symbol"
        data-mark="x"
      >
        ×
      </button>


      <button
        type="button"
        class="mark-tool symbol"
        data-mark="triangle"
      >
        △
      </button>


      <button
        type="button"
        class="mark-tool symbol"
        data-mark="double_circle"
      >
        ◎
      </button>


      <button
        type="button"
        class="mark-tool"
        data-mark="text"
      >
        文字
      </button>


      <button
        type="button"
        class="mark-tool"
        data-mark="pen"
      >
        ペン
      </button>


      <button
        type="button"
        class="mark-tool"
        data-mark="eraser"
      >
        消しゴム
      </button>


    </div>


    <div class="toolbar-group">


      <span class="toolbar-label">
        点数
      </span>


      <button
        type="button"
        class="quick-score full"
        data-quick-score="full"
      >
        L 満点
      </button>


      <button
        type="button"
        class="quick-score zero"
        data-quick-score="zero"
      >
        K 0点
      </button>


      <div
        id="numberToolbar"
        class="number-toolbar"
      ></div>


    </div>


    <div class="toolbar-group">


      <input
        id="markText"
        type="text"
        placeholder="文字"
        autocomplete="off"
      >


      <input
        id="markSize"
        type="number"
        min="10"
        max="120"
        value="42"
        title="文字サイズ"
      >


      <input
        id="markColor"
        type="color"
        value="#d00000"
        title="色"
      >


    </div>


    <span class="shortcut-help">

      L：満点　K：0点　数字：部分点　
      Backspace：削除　Enter：保存　Escape：解除

    </span>


  </div>


  <div
    id="status"
    class="status"
  >
    採点画面を起動しています...
  </div>


  <div
    id="progress"
    class="progress"
  >

    <div
      id="progressTextBar"
      class="progress-text"
    >
      0 / 0
    </div>


    <div class="progress-track">

      <div
        id="progressBar"
        class="progress-bar"
      ></div>

    </div>

  </div>


</header>


<main class="marking-content">


  <section
    id="answerArea"
    class="answer-area"
  >

    <div
      id="answerTableWrap"
      class="answer-grid"
    >

      <div class="no-answer">
        答案を読み込んでいます...
      </div>

    </div>

  </section>


</main>


<footer class="marking-footer">


  <button
    id="previousButton"
    type="button"
    class="btn"
  >
    前の問題
  </button>


  <button
    id="nextButton"
    type="button"
    class="btn btn-primary"
  >
    次の問題
  </button>


  <button
    id="nextUnmarked"
    type="button"
    class="btn"
  >
    未採点へ
  </button>


  <span
    id="teacherName"
    class="toolbar-label"
  >
    -
  </span>


</footer>


<div
  id="complete"
  class="marking-complete"
>

  採点が完了しました。成績処理を開始します。

</div>


<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script
  src="/js/config.js?v=20261116"
></script>


<script
  src="/js/auth.js?v=20261116"
></script>


<script
  src="/js/teacher/marking.js?v=20261116"
></script>


<script>

"use strict";


/* =========================================================
   URL
========================================================= */

const markingParams =
  new URLSearchParams(
    location.search
  );


const markingTestId =
  markingParams.get(
    "test"
  );


/* =========================================================
   POINTS
========================================================= */

const pointsButton =
  document.getElementById(
    "pointsButton"
  );


if (
  pointsButton &&
  markingTestId
) {

  pointsButton.href =
    `/teacher/tests/points?test=${encodeURIComponent(
      markingTestId
    )}`;

}


/* =========================================================
   NUMBER BUTTONS
========================================================= */

const numberToolbar =
  document.getElementById(
    "numberToolbar"
  );


const maxNumbers =
  100;


for (
  let number = 0;
  number <= maxNumbers;
  number++
) {

  const button =
    document.createElement(
      "button"
    );


  button.type =
    "button";


  button.className =
    "number-button";


  button.dataset.score =
    String(
      number
    );


  button.textContent =
    String(
      number
    );


  numberToolbar.appendChild(
    button
  );

}


/* =========================================================
   TOOLBAR STATE
========================================================= */

document
  .querySelectorAll(
    ".mark-tool"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(
              ".mark-tool"
            )
            .forEach(
              item =>
                item.classList.remove(
                  "active"
                )
            );


          button.classList.add(
            "active"
          );


          window.selectedMarkType =
            button.dataset.mark;

        }
      );

    }
  );


/* =========================================================
   QUICK SCORE
========================================================= */

document
  .querySelectorAll(
    "[data-quick-score]"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          window.quickScoreAction =
            button.dataset.quickScore;

        }
      );

    }
  );


/* =========================================================
   NUMBER
========================================================= */

numberToolbar.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(
        "[data-score]"
      );


    if (!button) {

      return;

    }


    window.quickScoreValue =
      Number(
        button.dataset.score
      );

  }
);

</script>


</div>


</body>

</html>
