<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    答案切り出し - テスト成績システム
  </title>

  <link
    rel="stylesheet"
    href="/css/common.css"
  >

</head>

<body>

<header class="topbar">

  <div class="system-name">
    テスト成績システム
  </div>

  <div class="topbar-space"></div>

  <span id="teacherName">-</span>

  <button
    id="logoutButton"
    class="logout-button"
  >
    ログアウト
  </button>

</header>


<div class="teacher-layout">

  <aside class="sidebar">

    <div class="sidebar-title">
      答案処理
    </div>

    <a
      href="/teacher/answers/upload"
      class="menu-link"
    >
      答案アップロード
    </a>

    <a
      href="/teacher/answers/processing"
      class="menu-link"
    >
      処理状況
    </a>

    <a
      href="/teacher/answers/regions"
      class="menu-link active"
    >
      答案切り出し
    </a>

    <a
      href="/teacher/answers/unmatched"
      class="menu-link"
    >
      未紐付け答案
    </a>

    <a
      href="/teacher/answers/matched"
      class="menu-link"
    >
      紐付け済み答案
    </a>

  </aside>


  <main class="main-content">

    <div class="page-header">

      <h1>
        答案切り出し
      </h1>

    </div>


    <div class="card">

      <div class="form-group">

        <label>
          テスト
        </label>

        <select id="testSelect">

          <option value="">
            選択してください
          </option>

        </select>

      </div>


      <div
        id="testInformation"
        style="
          margin-top:10px;
        "
      ></div>

    </div>


    <div
      id="summary"
      class="card"
      style="display:none;"
    >
    </div>


    <div class="card">

      <button
        id="executeButton"
        class="btn btn-primary"
        disabled
      >
        答案を問題別に切り出す
      </button>

      <div
        id="message"
        style="
          margin-top:12px;
          min-height:22px;
        "
      ></div>

    </div>


    <div class="card">

      <h3>
        処理結果
      </h3>

      <div
        id="resultList"
      >
      </div>

    </div>

  </main>

</div>


<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="/js/config.js"></script>

<script src="/js/auth.js"></script>

<script src="/js/teacher/answer-regions.js"></script>

</body>

</html>
