<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>模範解答 - テスト成績システム</title>
  <link rel="stylesheet" href="/css/common.css">
</head>

<body>

<header class="topbar">
  <div class="system-name">テスト成績システム</div>
  <div class="topbar-space"></div>
  <span id="teacherName">-</span>
  <button id="logoutButton" class="logout-button">ログアウト</button>
</header>

<div class="teacher-layout">

  <aside class="sidebar">

    <div class="sidebar-title">テスト設定</div>

    <a id="pagesLink" href="#" class="menu-link">
      解答用紙登録
    </a>

    <a id="layoutLink" href="#" class="menu-link">
      枠設定
    </a>

    <a id="modelAnswerLink" href="#" class="menu-link active">
      模範解答
    </a>

    <a id="previewLink" href="#" class="menu-link">
      テスト確認
    </a>

  </aside>

  <main class="main-content">

    <div class="page-header">
      <h1>模範解答登録</h1>
    </div>

    <div id="testInformation" class="card">
      読み込み中...
    </div>

    <div class="card">

      <h3>模範解答</h3>

      <p>
        採点時に左側へ表示する模範解答画像を登録します。
      </p>

      <div class="form-group">

        <label>
          模範解答画像
        </label>

        <input
          id="modelAnswerFile"
          type="file"
          accept="image/*"
        >

      </div>

      <button
        id="uploadButton"
        class="btn btn-primary"
      >
        模範解答を登録
      </button>

      <div
        id="message"
        style="margin-top:12px;min-height:22px;"
      ></div>

    </div>

    <div class="card">

      <h3>登録済み模範解答</h3>

      <div
        id="modelAnswerPreview"
        style="
          min-height:300px;
          border:1px solid #d0d6dc;
          background:#f5f6f7;
          display:flex;
          align-items:center;
          justify-content:center;
          overflow:auto;
        "
      >
        登録されていません。
      </div>

    </div>

  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/teacher/model-answer.js"></script>

</body>
</html>
