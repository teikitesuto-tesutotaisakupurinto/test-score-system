
<!doctype html>
<html lang="ja">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
  デジタル採点 - テスト成績システム
</title>

<link
  rel="stylesheet"
  href="/css/marking.css"
>

<link
  rel="stylesheet"
  href="/css/common.css"
>

<style>

.marking-page {
  min-height:100vh;
  background:#eef2f5;
}


.marking-header {
  position:sticky;
  top:0;
  z-index:20;

  display:flex;
  align-items:center;
  gap:10px;

  padding:12px 16px;

  background:#fff;

  border-bottom:
    1px solid #d0d6dc;
}


.marking-header-title {
  font-size:18px;
  font-weight:700;
}


.marking-header-space {
  flex:1;
}


.marking-main {
  max-width:1200px;

  margin:0 auto;

  padding:24px;
}


.test-select-card {
  padding:20px;

  background:#fff;

  border:
    1px solid #d0d6dc;

  border-radius:5px;
}


.test-select-card label {
  display:block;

  margin-bottom:7px;

  font-size:13px;

  font-weight:700;
}


.test-select-card select {
  width:100%;

  height:46px;

  padding:0 10px;

  border:
    1px solid #b8c1c9;

  background:#fff;

  font-size:14px;
}


.test-select-actions {
  display:flex;

  gap:8px;

  margin-top:14px;
}


.marking-status {
  min-height:22px;

  margin-top:12px;

  color:#666;

  font-size:13px;
}


.marking-status.error {
  color:#b42318;
}


.test-list {
  margin-top:15px;

  display:grid;

  gap:8px;
}


.test-row {
  display:flex;

  align-items:center;

  gap:12px;

  padding:12px;

  background:#fff;

  border:
    1px solid #d0d6dc;
}


.test-row-info {
  flex:1;

  min-width:0;
}


.test-row-name {
  font-weight:700;
}


.test-row-meta {
  margin-top:3px;

  color:#666;

  font-size:12px;
}


@media(max-width:650px) {

  .marking-main {
    padding:12px;
  }

  .test-row {
    align-items:stretch;

    flex-direction:column;
  }

}

</style>

</head>


<body>


<div class="marking-page">


<header class="marking-header">


<div class="marking-header-title">
  デジタル採点
</div>


<div class="marking-header-space"></div>


<span id="teacherName">
  -
</span>


<button
id="logoutButton"
class="btn"
type="button"
>
  ログアウト
</button>


</header>


<main class="marking-main">


<div class="test-select-card">


<h1
style="
  margin:0 0 18px;
  font-size:22px;
"
>
  テストを選択してください
</h1>


<label for="testSelect">
  テスト
</label>


<select id="testSelect">

<option value="">
  テストを選択してください
</option>

</select>


<div class="test-select-actions">


<button
id="startButton"
class="btn btn-primary"
type="button"
disabled
>
  採点を開始
</button>


<a
href="/teacher/tests"
class="btn"
>
  テスト管理へ
</a>


</div>


<div
id="status"
class="marking-status"
>
テストを選択してください。
</div>


</div>


<div
id="testList"
class="test-list"
>
</div>


</main>


</div>


<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script
src="/js/config.js?v=20261116"
></script>


<script
src="/js/auth.js?v=20261126"
></script>


<script
src="/js/teacher/marking-index.js?v=20261116"
></script>



<script src="/js/common-sidebar.js?v=20261126"></script>
</body>

</html>
