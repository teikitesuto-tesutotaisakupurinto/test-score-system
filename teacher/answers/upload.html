
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>答案アップロード</title>
<link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="app">

  <aside class="side">

    <h2>
      答案管理
    </h2>

    <a href="/teacher.html">
      ダッシュボード
    </a>

    <a
      class="active"
      href="/teacher/answers/upload.html"
    >
      アップロード
    </a>

    <a href="/teacher-answers-unmatched.html">
      未紐付け
    </a>

    <a href="/teacher-marking.html">
      採点
    </a>

  </aside>


  <main class="main">

    <h1>
      答案アップロード
    </h1>


    <div class="card">

      <div class="form-row">

        <label>
          テスト
        </label>

        <select id="test"></select>

      </div>


      <input
        id="files"
        type="file"
        multiple
        accept="image/*,.pdf"
      >


      <p class="small">

        QR読み取り・PDFページ分割・生徒紐付けの本処理は、スキャナ形式とPDF構造を確定した後に接続します。

      </p>


      <button
        class="primary"
        id="upload"
        type="button"
      >
        アップロード
      </button>


      <p id="msg"></p>

    </div>

  </main>

</div>


<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="/js/config.js"></script>

<script src="/js/auth.js"></script>


<script>

requireRole(
  "teacher"
).then(
  load
);


async function load() {

  const {
    data
  } =
    await SB
      .from("tests")
      .select(
        "id,name"
      )
      .order(
        "created_at",
        {
          ascending:
            false
        }
      );


  document
    .getElementById("test")
    .innerHTML =
      (data || [])
        .map(
          test =>
            `<option value="${test.id}">${test.name}</option>`
        )
        .join("");

}


document
  .getElementById("upload")
  .addEventListener(
    "click",
    async () => {

      const files =
        [
          ...
          document
            .getElementById("files")
            .files
        ];


      if (!files.length) {

        return;

      }


      const message =
        document
          .getElementById("msg");


      const test =
        document
          .getElementById("test");


      message.textContent =
        "アップロード中...";


      for (
        const file
        of files
      ) {

        const path =
          `uploads/${crypto.randomUUID()}-${file.name}`;


        const {
          error
        } =
          await SB
            .storage
            .from("answers")
            .upload(
              path,
              file
            );


        if (error) {

          message.textContent =
            error.message;

          return;

        }


        await SB
          .from("answer_sheets")
          .insert({

            test_id:
              test.value,

            file_path:
              path,

            status:
              "unmatched"

          });

      }


      message.textContent =
        "アップロードしました。QR紐付け待ちです。";

    }
  );

</script>

</body>
</html>
