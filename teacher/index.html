
<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>教師ホーム - テスト成績システム</title>

<link rel="stylesheet" href="/css/common.css">

<style>

.main {
  max-width:1200px;
  margin:0 auto;
  padding:25px;
}

.header {
  margin-bottom:25px;
}

.header h1 {
  margin:0;
  font-size:24px;
}

.header p {
  margin:8px 0 0;
  color:#666;
  font-size:13px;
}

.grid {
  display:grid;
  grid-template-columns:
    repeat(3,minmax(0,1fr));
  gap:15px;
}

.card {
  display:block;
  padding:20px;
  background:#fff;
  border:1px solid #d5dbe0;
  border-radius:5px;
  color:#222;
  text-decoration:none;
}

.card:hover {
  border-color:#777;
}

.card-title {
  font-size:17px;
  font-weight:700;
  margin-bottom:8px;
}

.card-description {
  color:#666;
  font-size:13px;
  line-height:1.7;
}

@media(max-width:900px) {
  .grid {
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }
}

@media(max-width:600px) {
  .main {
    padding:15px;
  }

  .grid {
    grid-template-columns:1fr;
  }
}

</style>
</head>


<body>

<header class="topbar">

  <div class="system-name">
    テスト成績システム
  </div>

  <div class="topbar-space"></div>

  <span id="teacherName">-</span>

  <button
    id="logoutButton"
    class="logout-button"
    type="button"
  >
    ログアウト
  </button>

</header>


<main class="main">

  <section class="header">

    <h1>
      教師ホーム
    </h1>

    <p>
      テスト・答案・採点・成績を管理します。
    </p>

  </section>


  <section class="grid">

    <a
      class="card"
      href="/teacher/tests"
    >
      <div class="card-title">
        テスト管理
      </div>
      <div class="card-description">
        テストの作成・編集を行います。
      </div>
    </a>


    <a
      class="card"
      href="/teacher/tests/pages"
    >
      <div class="card-title">
        解答用紙・枠設定
      </div>
      <div class="card-description">
        解答用紙を登録し、設問ごとの解答欄と配点を設定します。
      </div>
    </a>


    <a
      class="card"
      href="/teacher/tests/publish"
    >
      <div class="card-title">
        成績・答案公開
      </div>
      <div class="card-description">
        生徒への公開・非公開を切り替えます。
      </div>
    </a>


    <a
      class="card"
      href="/teacher/answers/upload"
    >
      <div class="card-title">
        答案アップロード
      </div>
      <div class="card-description">
        PDF・画像・ZIPの答案をアップロードします。
      </div>
    </a>


    <a
      class="card"
      href="/teacher/answers/matched"
    >
      <div class="card-title">
        答案確認・紐付け
      </div>
      <div class="card-description">
        QRによる自動紐付けと未紐付け答案を確認します。
      </div>
    </a>


    <a
      class="card"
      href="/teacher/marking"
    >
      <div class="card-title">
        採点
      </div>
      <div class="card-description">
        自動クロップされた解答欄を採点します。
      </div>
    </a>


    <a
      class="card"
      href="/teacher/results/summary"
    >
      <div class="card-title">
        結果総括表
      </div>
      <div class="card-description">
        生徒番号・氏名・各設問点・合計・平均・順位を確認します。
      </div>
    </a>

  </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<script src="/js/auth.js"></script>

<script>

(async function () {

  const profile =
    await requireTeacher();

  if (!profile) {
    return;
  }

  document.getElementById(
    "teacherName"
  ).textContent =
    profile.name || "先生";


  document.getElementById(
    "logoutButton"
  ).addEventListener(
    "click",
    logout
  );

})();

</script>

</body>
</html>
