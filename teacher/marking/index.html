
<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>
    採点 - テスト成績システム
  </title>

  <link
    rel="stylesheet"
    href="/css/common.css"
  >

  <style>

    .marking-main {
      max-width: 1500px;
      margin: 0 auto;
      padding: 22px;
    }

    .page-header {
      margin-bottom: 20px;
    }

    .page-header h1 {
      margin: 0;
      font-size: 24px;
    }

    .page-header p {
      margin: 7px 0 0;
      color: #666;
      font-size: 13px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 15px;
    }

    .toolbar select {
      min-width: 360px;
      height: 40px;
      padding: 0 10px;
    }

    .status {
      padding: 10px 12px;
      margin-bottom: 15px;
      background: #f5f6f7;
      border: 1px solid #d5dbe0;
      font-size: 13px;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      background: #fff;
      border: 1px solid #d0d6dc;
    }

    .marking-table {
      width: 100%;
      min-width: 900px;
      border-collapse: collapse;
    }

    .marking-table th,
    .marking-table td {
      border: 1px solid #d0d6dc;
      padding: 9px 10px;
      font-size: 13px;
      text-align: left;
      white-space: nowrap;
    }

    .marking-table th {
      background: #f3f5f7;
      font-weight: 700;
    }

    .student-no {
      font-weight: 700;
    }

    .score-cell {
      text-align: center;
    }

    .unmarked {
      color: #b42318;
    }

    .marked {
      color: #1769aa;
      font-weight: 700;
    }

    .total-cell {
      font-weight: 700;
    }

    .empty {
      padding: 50px;
      text-align: center;
      color: #777;
      background: #fff;
    }

    .detail-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 70px;
    }

    @media (max-width: 700px) {

      .marking-main {
        padding: 14px;
      }

      .toolbar select {
        width: 100%;
        min-width: 0;
      }

    }

  </style>

</head>


<body>


<header class="topbar">

  <div class="system-name">
    テスト成績システム
  </div>

  <div class="topbar-space"></div>

  <span id="teacherName">
    -
  </span>

  <button
    id="logoutButton"
    class="logout-button"
    type="button"
  >
    ログアウト
  </button>

</header>


<main class="marking-main">


  <div class="page-header">

    <h1>
      採点
    </h1>

    <p>
      テストを選択すると、そのテストの答案を生徒ごとに一覧表示します。
    </p>

  </div>


  <div class="toolbar">

    <select id="testSelect">

      <option value="">
        テストを選択してください
      </option>

    </select>


    <button
      id="refreshButton"
      class="btn"
      type="button"
    >
      更新
    </button>

  </div>


  <div
    id="status"
    class="status"
  >
    テストを選択してください。
  </div>


  <div
    id="markingTableWrap"
    class="table-wrap"
  >

    <div class="empty">
      テストを選択してください。
    </div>

  </div>


</main>


<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="/js/config.js"></script>

<script src="/js/auth.js"></script>

<script src="/js/teacher/marking-index.js"></script>


</body>

</html>
