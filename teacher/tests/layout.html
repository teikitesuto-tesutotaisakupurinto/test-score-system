
<!doctype html>
<html lang="ja">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
  解答登録・枠設定 - テスト成績システム
</title>

<link
  rel="stylesheet"
  href="/css/style.css"
>

<style>

.layout-main {
  max-width: 1400px;
  margin: 0 auto;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 15px;
}

.status {
  padding: 10px 12px;
  margin-bottom: 15px;

  background: #f5f6f7;

  border: 1px solid #d5dbe0;

  font-size: 13px;
}

.status.error {
  color: #b42318;
}

.layout-canvas {
  position: relative;

  overflow: auto;

  min-height: 500px;

  background: #e7ebef;

  border: 1px solid #cbd2d8;
}

.layout-image {
  display: block;

  max-width: none;

  user-select: none;
}

.draw-layer {
  position: absolute;

  inset: 0;

  cursor: crosshair;
}

.rect {
  position: absolute;

  border: 2px solid #1769aa;

  background: rgba(
    23,
    105,
    170,
    .12
  );

  pointer-events: none;
}

.rect.qr {
  border-color: #333;

  background: rgba(
    0,
    0,
    0,
    .08
  );
}

.rect-label {
  position: absolute;

  left: 2px;
  top: 2px;

  padding: 2px 5px;

  background: #fff;

  font-size: 11px;

  font-weight: 700;
}

.question-card {
  margin-top: 12px;

  padding: 15px;

  background: #fff;

  border: 1px solid #d0d6dc;

  border-radius: 5px;
}

.question-grid {
  display: grid;

  grid-template-columns:
    120px
    120px
    2fr
    1fr;

  gap: 10px;

  align-items: end;
}

.question-grid label {
  display: block;

  margin-bottom: 5px;

  font-size: 12px;

  font-weight: 700;
}

.question-grid input {
  width: 100%;

  height: 38px;

  padding: 7px 9px;

  border: 1px solid #b8c1c9;

  border-radius: 4px;

  background: #fff;
}

.question-actions {
  margin-top: 10px;

  display: flex;

  justify-content: flex-end;

  gap: 7px;
}

.box-list {
  margin-top: 15px;
}

.box-row {
  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 10px;

  padding: 10px;

  border-bottom: 1px solid #e1e5e8;
}

.box-info {
  min-width: 0;
}

.box-title {
  font-weight: 700;

  font-size: 13px;
}

.box-meta {
  margin-top: 4px;

  color: #666;

  font-size: 12px;
}

.total {
  margin-top: 15px;

  padding: 12px;

  background: #f5f6f7;

  border: 1px solid #d5dbe0;

  font-weight: 700;
}

.empty {
  padding: 40px;

  text-align: center;

  color: #777;
}


@media (max-width: 900px) {

  .question-grid {
    grid-template-columns:
      1fr 1fr;
  }

}


@media (max-width: 600px) {

  .question-grid {
    grid-template-columns: 1fr;
  }

}

</style>

</head>

<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script src="/js/config.js"></script>

<script src="/js/auth.js"></script>


<script>

"use strict";


const DB =
  window.SB ||
  window.supabaseClient;


const params =
  new URLSearchParams(
    location.search
  );


const testId =
  params.get(
    "test"
  );


let mode =
  "question";


let image =
  null;


let imageNaturalWidth =
  0;


let imageNaturalHeight =
  0;


let boxes =
  [];


let drawing =
  false;


let startPoint =
  null;


const statusElement =
  document.getElementById(
    "status"
  );


const canvasWrap =
  document.getElementById(
    "canvasWrap"
  );


const questionList =
  document.getElementById(
    "questionList"
  );


const boxList =
  document.getElementById(
    "boxList"
  );


/* =====================================================
   INIT
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  initialize
);


async function initialize() {

  try {

    if (!DB) {

      throw new Error(
        "Supabase接続がありません。"
      );

    }


    if (!testId) {

      throw new Error(
        "テストIDがありません。"
      );

    }


    /*
     * 認証
     */

    if (
      typeof window.requireRole ===
      "function"
    ) {

      await window.requireRole(
        "teacher"
      );

    }


    /*
     * 次の画面
     */

    const encoded =
      encodeURIComponent(
        testId
      );


    document.getElementById(
      "pointsLink"
    ).href =
      `/teacher/tests/points?test=${encoded}`;


    document.getElementById(
      "nextPoints"
    ).href =
      `/teacher/tests/points?test=${encoded}`;


    setupEvents();


    await loadExistingBoxes();


  } catch (error) {

    showError(
      error.message ||
      "枠設定を読み込めませんでした。"
    );

  }

}


/* =====================================================
   EVENTS
===================================================== */

function setupEvents() {


  document.getElementById(
    "questionMode"
  ).addEventListener(
    "click",
    () => {

      mode =
        "question";


      document
        .getElementById(
          "questionMode"
        )
        .classList.add(
          "btn-primary"
        );


      document
        .getElementById(
          "qrMode"
        )
        .classList.remove(
          "btn-primary"
        );


      setStatus(
        "解答欄モードです。画像上をドラッグしてください。"
      );

    }
  );


  document.getElementById(
    "qrMode"
  ).addEventListener(
    "click",
    () => {

      mode =
        "qr";


      document
        .getElementById(
          "qrMode"
        )
        .classList.add(
          "btn-primary"
        );


      document
        .getElementById(
          "questionMode"
        )
        .classList.remove(
          "btn-primary"
        );


      setStatus(
        "QRコードシール欄モードです。画像上をドラッグしてください。"
      );

    }
  );


  document.getElementById(
    "file"
  ).addEventListener(
    "change",
    handleFile
  );


  document.getElementById(
    "addQuestion"
  ).addEventListener(
    "click",
    addQuestion
  );


  document.getElementById(
    "saveButton"
  ).addEventListener(
    "click",
    saveAll
  );


  document
    .getElementById(
      "logoutButton"
    )
    ?.addEventListener(
      "click",
      async () => {

        if (
          typeof logout ===
          "function"
        ) {

          await logout();

        }

      }
    );

}


/* =====================================================
   LOAD EXISTING BOXES
===================================================== */

async function loadExistingBoxes() {

  setStatus(
    "既存の枠設定を読み込んでいます..."
  );


  const {
    data,
    error
  } =
    await DB
      .from(
        "layout_boxes"
      )
      .select(
        `
        id,
        test_id,
        page_no,
        box_type,
        label,
        x,
        y,
        width,
        height,
        question_id,
        points,
        sort_order
        `
      )
      .eq(
        "test_id",
        testId
      )
      .order(
        "page_no",
        {
          ascending:
            true
        }
      )
      .order(
        "sort_order",
        {
          ascending:
            true
        }
      );


  if (error) {

    throw error;

  }


  boxes =
    data ||
    [];


  renderBoxList();


  setStatus(
    `${boxes.length}個の枠を読み込みました。`
  );

}


/* =====================================================
   FILE
===================================================== */

function handleFile(
  event
) {

  const file =
    event.target.files[0];


  if (!file) {

    return;

  }


  if (
    !file.type.startsWith(
      "image/"
    )
  ) {

    showError(
      "現在の枠設定では画像ファイルを選択してください。"
    );

    return;

  }


  const url =
    URL.createObjectURL(
      file
    );


  canvasWrap.innerHTML =
    "";


  image =
    document.createElement(
      "img"
    );


  image.className =
    "layout-image";


  image.src =
    url;


  image.draggable =
    false;


  canvasWrap.appendChild(
    image
  );


  image.onload =
    () => {

      imageNaturalWidth =
        image.naturalWidth;


      imageNaturalHeight =
        image.naturalHeight;


      const layer =
        document.createElement(
          "div"
        );


      layer.className =
        "draw-layer";


      canvasWrap.appendChild(
        layer
      );


      setupDrawing(
        layer
      );


      renderBoxes();


      setStatus(
        "画像を読み込みました。画像上をドラッグして枠を設定できます。"
      );

    };

}


/* =====================================================
   DRAW
===================================================== */

function setupDrawing(
  layer
) {

  layer.onmousedown =
    event => {

      if (!image) {

        return;

      }


      const rect =
        image.getBoundingClientRect();


      drawing =
        true;


      startPoint = {

        x:
          event.clientX -
          rect.left,

        y:
          event.clientY -
          rect.top

      };

    };


  layer.onmouseup =
    event => {

      if (
        !drawing ||
        !startPoint
      ) {

        return;

      }


      const rect =
        image.getBoundingClientRect();


      const endX =
        event.clientX -
        rect.left;


      const endY =
        event.clientY -
        rect.top;


      const scaleX =
        imageNaturalWidth /
        image.clientWidth;


      const scaleY =
        imageNaturalHeight /
        image.clientHeight;


      const x =
        Math.min(
          startPoint.x,
          endX
        ) *
        scaleX;


      const y =
        Math.min(
          startPoint.y,
          endY
        ) *
        scaleY;


      const width =
        Math.abs(
          endX -
          startPoint.x
        ) *
        scaleX;


      const height =
        Math.abs(
          endY -
          startPoint.y
        ) *
        scaleY;


      drawing =
        false;


      startPoint =
        null;


      if (
        width < 10 ||
        height < 10
      ) {

        return;

      }


      const qr =
        mode ===
        "qr";


      const questionCount =
        boxes.filter(
          box =>
            box.box_type !==
            "qr"
        ).length;


      boxes.push({

        id:
          null,

        test_id:
          testId,

        page_no:
          1,

        box_type:
          qr
            ? "qr"
            : "answer",

        label:
          qr
            ? "QR"
            : `問${
                questionCount +
                1
              }`,

        x,

        y,

        width,

        height,

        question_id:
          qr
            ? null
            : crypto.randomUUID(),

        points:
          0,

        sort_order:
          boxes.length +
          1

      });


      renderBoxes();


      renderQuestionList();


      setStatus(
        qr
          ? "QR欄を追加しました。"
          : "解答欄を追加しました。"
      );

    };


  layer.onmouseleave =
    () => {

      drawing =
        false;

      startPoint =
        null;

    };

}


/* =====================================================
   RENDER BOXES
===================================================== */

function renderBoxes() {

  if (image) {

    canvasWrap
      .querySelectorAll(
        ".rect"
      )
      .forEach(
        element =>
          element.remove()
      );


    const scaleX =
      image.clientWidth /
      imageNaturalWidth;


    const scaleY =
      image.clientHeight /
      imageNaturalHeight;


    boxes.forEach(
      box => {

        const rect =
          document.createElement(
            "div"
          );


        rect.className =
          "rect";


        if (
          box.box_type ===
          "qr"
        ) {

          rect.classList.add(
            "qr"
          );

        }


        rect.style.left =
          `${box.x * scaleX}px`;


        rect.style.top =
          `${box.y * scaleY}px`;


        rect.style.width =
          `${box.width * scaleX}px`;


        rect.style.height =
          `${box.height * scaleY}px`;


        const label =
          document.createElement(
            "span"
          );


        label.className =
          "rect-label";


        label.textContent =
          box.label ||
          "枠";


        rect.appendChild(
          label
        );


        canvasWrap.appendChild(
          rect
        );

      }
    );

  }


  renderBoxList();

}


/* =====================================================
   QUESTION LIST
===================================================== */

function renderQuestionList() {

  questionList.innerHTML =
    "";


  const questions =
    boxes.filter(
      box =>
        box.box_type !==
        "qr"
    );


  if (!questions.length) {

    questionList.innerHTML = `

      <div class="empty">
        解答欄を追加してください。
      </div>

    `;

    updateTotal();

    return;

  }


  questions.forEach(
    (
      box,
      index
    ) => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "question-card";


      const grid =
        document.createElement(
          "div"
        );


      grid.className =
        "question-grid";


      /*
       * 設問番号
       */

      const labelGroup =
        document.createElement(
          "div"
        );


      const labelLabel =
        document.createElement(
          "label"
        );


      labelLabel.textContent =
        "設問番号";


      const labelInput =
        document.createElement(
          "input"
        );


      labelInput.value =
        box.label ||
        `問${index + 1}`;


      labelInput.addEventListener(
        "input",
        () => {

          box.label =
            labelInput.value;

          renderBoxes();

        }
      );


      labelGroup.append(
        labelLabel,
        labelInput
      );


      /*
       * 配点
       */

      const pointsGroup =
        document.createElement(
          "div"
        );


      const pointsLabel =
        document.createElement(
          "label"
        );


      pointsLabel.textContent =
        "配点";


      const pointsInput =
        document.createElement(
          "input"
        );


      pointsInput.type =
        "number";


      pointsInput.min =
        "0";


      pointsInput.step =
        "0.1";


      pointsInput.value =
        Number(
          box.points
        ) || 0;


      pointsInput.addEventListener(
        "input",
        () => {

          box.points =
            Number(
              pointsInput.value
            ) || 0;

          updateTotal();

          renderBoxList();

        }
      );


      pointsGroup.append(
        pointsLabel,
        pointsInput
      );


      /*
       * 模範解答
       */

      const answerGroup =
        document.createElement(
          "div"
        );


      const answerLabel =
        document.createElement(
          "label"
        );


      answerLabel.textContent =
        "模範解答";


      const answerInput =
        document.createElement(
          "input"
        );


      answerInput.value =
        box.answer ||
        "";


      answerInput.placeholder =
        "正解";


      answerInput.addEventListener(
        "input",
        () => {

          box.answer =
            answerInput.value;

        }
      );


      answerGroup.append(
        answerLabel,
        answerInput
      );


      /*
       * 観点
       */

      const viewpointGroup =
        document.createElement(
          "div"
        );


      const viewpointLabel =
        document.createElement(
          "label"
        );


      viewpointLabel.textContent =
        "観点";


      const viewpointInput =
        document.createElement(
          "input"
        );


      viewpointInput.value =
        box.viewpoint ||
        "";


      viewpointInput.placeholder =
        "知識・技能など";


      viewpointInput.addEventListener(
        "input",
        () => {

          box.viewpoint =
            viewpointInput.value;

        }
      );


      viewpointGroup.append(
        viewpointLabel,
        viewpointInput
      );


      grid.append(
        labelGroup,
        pointsGroup,
        answerGroup,
        viewpointGroup
      );


      const actions =
        document.createElement(
          "div"
        );


      actions.className =
        "question-actions";


      const remove =
        document.createElement(
          "button"
        );


      remove.type =
        "button";


      remove.className =
        "btn";


      remove.textContent =
        "この設問を削除";


      remove.addEventListener(
        "click",
        () => {

          const index =
            boxes.indexOf(
              box
            );


          if (
            index >=
            0
          ) {

            boxes.splice(
              index,
              1
            );

          }


          renderBoxes();

          renderQuestionList();

        }
      );


      actions.append(
        remove
      );


      card.append(
        grid,
        actions
      );


      questionList.appendChild(
        card
      );

    }
  );


  updateTotal();

}


/* =====================================================
   ADD QUESTION
===================================================== */

function addQuestion() {

  const questionCount =
    boxes.filter(
      box =>
        box.box_type !==
        "qr"
    ).length;


  boxes.push({

    id:
      null,

    test_id:
      testId,

    page_no:
      1,

    box_type:
      "answer",

    label:
      `問${
        questionCount +
        1
      }`,

    x:
      0,

    y:
      0,

    width:
      100,

    height:
      100,

    question_id:
      crypto.randomUUID(),

    points:
      0,

    answer:
      "",

    viewpoint:
      "",

    sort_order:
      boxes.length +
      1

  });


  renderBoxes();

  renderQuestionList();

}


/* =====================================================
   SAVE ALL
===================================================== */

async function saveAll() {

  const saveButton =
    document.getElementById(
      "saveButton"
    );


  saveButton.disabled =
    true;


  saveButton.textContent =
    "保存中...";


  try {

    /*
     * 既存設定を削除。
     */

    const {
      error:
        deleteError
    } =
      await DB
        .from(
          "layout_boxes"
        )
        .delete()
        .eq(
          "test_id",
          testId
        );


    if (deleteError) {

      throw deleteError;

    }


    const rows =
      boxes.map(
        (
          box,
          index
        ) => ({

          test_id:
            testId,

          page_no:
            box.page_no ||
            1,

          box_type:
            box.box_type,

          label:
            box.label,

          x:
            box.x,

          y:
            box.y,

          width:
            box.width,

          height:
            box.height,

          question_id:
            box.box_type ===
              "qr"
              ? null
              : box.question_id,

          points:
            Number(
              box.points
            ) || 0,

          sort_order:
            index + 1

        })
      );


    const {
      data,
      error
    } =
      await DB
        .from(
          "layout_boxes"
        )
        .insert(
          rows
        )
        .select();


    if (error) {

      throw error;

    }


    boxes =
      data ||
      [];


    renderBoxes();

    renderQuestionList();


    setStatus(
      "枠設定と配点を保存しました。"
    );


    /*
     * 配点設定専用画面へ。
     */

    location.href =
      `/teacher/tests/points?test=${encodeURIComponent(
        testId
      )}`;


  } catch (error) {

    console.error(
      error
    );


    showError(
      `保存に失敗しました: ${error.message}`
    );


  } finally {

    saveButton.disabled =
      false;


    saveButton.textContent =
      "枠設定を保存";

  }

}


/* =====================================================
   TOTAL
===================================================== */

function updateTotal() {

  const questions =
    boxes.filter(
      box =>
        box.box_type !==
        "qr"
    );


  const total =
    questions.reduce(
      (
        sum,
        box
      ) =>
        sum +
        (
          Number(
            box.points
          ) ||
          0
        ),
      0
    );


  const totalElement =
    document.getElementById(
      "total"
    );


  totalElement.textContent =
    `合計配点：${
      Number.isInteger(
        total
      )
        ? total
        : total.toFixed(
            1
          )
    }点`;

}


/* =====================================================
   STATUS
===================================================== */

function setStatus(
  message
) {

  statusElement.textContent =
    message;


  statusElement.classList.remove(
    "error"
  );

}


function showError(
  message
) {

  statusElement.textContent =
    message;


  statusElement.classList.add(
    "error"
  );

}

</script>


</body>
