
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  答案確認・紐付け - テスト成績システム
</title>

<link
  rel="stylesheet"
  href="/css/common.css"
>

<style>

.matched-main {
  max-width:1400px;
  margin:0 auto;
  padding:20px;
}

.toolbar {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
  margin-bottom:15px;
}

.toolbar select {
  min-width:280px;
  height:40px;
  padding:0 10px;
}

.status {
  padding:10px 12px;
  margin-bottom:15px;
  background:#f5f6f7;
  border:1px solid #d5dbe0;
  font-size:13px;
  white-space:pre-wrap;
}

.status.error {
  color:#b42318;
  background:#fff8f7;
  border-color:#efc2bc;
}

.answer-table-wrap {
  overflow:auto;
  background:#fff;
  border:1px solid #d5dbe0;
}

.answer-table {
  width:100%;
  min-width:900px;
  border-collapse:collapse;
}

.answer-table th,
.answer-table td {
  padding:9px 10px;
  border-bottom:1px solid #e3e6e8;
  vertical-align:middle;
}

.answer-table th {
  background:#f1f3f5;
  text-align:left;
  white-space:nowrap;
}

.status-badge {
  display:inline-block;
  padding:4px 8px;
  border-radius:3px;
  font-size:12px;
}

.status-matched {
  color:#26743b;
  background:#edf8ef;
  border:1px solid #b7d9c0;
}

.status-unmatched {
  color:#b42318;
  background:#fff4f2;
  border:1px solid #efc2bc;
}

.student-select {
  min-width:220px;
  height:36px;
  padding:0 8px;
}

.answer-id {
  max-width:250px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-family:monospace;
  font-size:11px;
}

.qr-value {
  max-width:220px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-family:monospace;
  font-size:11px;
}

.actions {
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.empty {
  padding:50px;
  text-align:center;
  color:#777;
}

</style>

</head>


<body>


<header class="topbar">

<div class="system-name">
  テスト成績システム
</div>

<div class="topbar-space"></div>

<span id="teacherName">
  -
</span>

<button
id="logoutButton"
class="logout-button"
type="button"
>
  ログアウト
</button>

</header>


<main class="matched-main">


<div class="page-header">

<h1>
  答案確認・紐付け
</h1>

</div>


<div class="toolbar">


<select id="testSelect">

<option value="all">
  すべてのテスト
</option>

</select>


<select id="statusSelect">

<option value="unmatched" selected>
  未紐付け
</option>

<option value="all">
  すべて
</option>

<option value="matched">
  紐付け済み
</option>

</select>


<button
id="reloadButton"
class="btn"
type="button"
>
  更新
</button>


<a
id="uploadLink"
href="/teacher/answers/upload"
class="btn"
>
  答案アップロード
</a>


<a
id="processingLink"
href="/teacher/answers/processing"
class="btn"
>
  処理状況
</a>

</div>


<div
id="status"
class="status"
>
テストを選択してください。
</div>


<div class="answer-table-wrap">

<table class="answer-table">

<thead>

<tr>

<th>
  状態
</th>

<th>
  生徒
</th>

<th>
  QR
</th>

<th>
  答案ID
</th>

<th>
  登録日時
</th>

<th>
  操作
</th>

</tr>

</thead>


<tbody
id="answerTableBody"
>

<tr>

<td
colspan="6"
class="empty"
>
  テストを選択してください。
</td>

</tr>

</tbody>

</table>

</div>


</main>


<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script
src="/js/config.js?v=20261116"
></script>

<script
src="/js/auth.js?v=20261126"
></script>

<script
src="/js/teacher/answer-matched.js?v=20261126qrfix"
></script>


<script src="/js/common-sidebar.js?v=20261126"></script>
</body>

</html>
