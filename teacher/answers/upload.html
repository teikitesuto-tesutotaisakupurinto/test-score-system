<!doctype html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
  答案アップロード

<link

  href="css/style.css"
>

<style>

  max-width: 1000px;
}

  align-items: center;

  justify-content: center;

  text-align: center;

.drop-zone.dragover {

  background: #f1f6fa;
}

  margin-top: 15px;
}

.file-item {

}

<body>


<div class="app">


<aside class="side">

  <h2>
    答案管理
  </h2>

  <a href="teacher.html">
    ダッシュボード
  </a>

  <a
    class="active"
    href="teacher-answers-upload.html"
  >
    アップロード
  </a>

  <a href="teacher-answers-unmatched.html">

  </a>

  <a href="teacher-marking.html">
    採点
  </a>

</aside>


<main class="main">


<h1>
  答案アップロード
</h1>


<div class="card upload-card">


<div class="form-row">

<label for="test">
  テスト
</label>

<select
  id="test"
>
  <option value="">
    テストを選択してください
  </option>
</select>

</div>


<div class="form-row">

<label for="answerType">
  答案種類
</label>

<select
  id="answerType"
>

<option value="student">
  生徒答案
</option>

</option>

</div>

  id="dropZone"

>

<div>

<strong>

</strong>

<div>

</div>

></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<script src="js/config.js"></script>

<script src="js/auth.js"></script>


<script>

"use strict";


/* =========================================================
   STATE
========================================================= */

let selectedFiles = [];

let teacher = null;


/* =========================================================
   DOM
========================================================= */

const testSelect =
  document.getElementById(
    "test"
  );


const answerType =
  document.getElementById(
    "answerType"
  );


const filesInput =
  document.getElementById(
    "files"
  );


const dropZone =
  document.getElementById(
    "dropZone"
  );


const fileList =
  document.getElementById(
    "fileList"
  );


const uploadButton =
  document.getElementById(
    "upload"
  );


const clearButton =
  document.getElementById(
    "clear"
  );


const progressBar =
  document.getElementById(
    "progressBar"
  );


const resultBox =
  document.getElementById(
    "result"
  );


/* =========================================================
   INIT
========================================================= */

async function init() {

  teacher =
    await requireTeacher();


  if (!teacher) {
    return;
  }


  await loadTests();


  setupEvents();

}


/* =========================================================
   TESTS
========================================================= */

async function loadTests() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("tests")
      .select(`
        id,
        name,
        subject,
        grade,
        created_at
      `)
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {
    throw error;
  }


  testSelect.innerHTML = `

    <option value="">
      テストを選択してください
    </option>

  `;


  for (
    const test
    of data || []
  ) {

    const option =
      document.createElement(
        "option"
      );


    option.value =
      test.id;


    option.textContent =
      [
        test.name,
        test.subject
      ]
        .filter(Boolean)
        .join(
          " / "
        );


    testSelect.appendChild(
      option
    );

  }

}


/* =========================================================
   EVENTS
========================================================= */

function setupEvents() {

  dropZone.addEventListener(
    "click",
    () =>
      filesInput.click()
  );


  filesInput.addEventListener(
    "change",
    () => {

      addFiles(
        filesInput.files
      );

      filesInput.value =
        "";

    }
  );


  dropZone.addEventListener(
    "dragover",
    event => {

      event.preventDefault();

      dropZone.classList.add(
        "dragover"
      );

    }
  );


  dropZone.addEventListener(
    "dragleave",
    () => {

      dropZone.classList.remove(
        "dragover"
      );

    }
  );


  dropZone.addEventListener(
    "drop",
    event => {

      event.preventDefault();

      dropZone.classList.remove(
        "dragover"
      );


      addFiles(
        event.dataTransfer.files
      );

    }
  );


  uploadButton.addEventListener(
    "click",
    processUploads
  );


  clearButton.addEventListener(
    "click",
    clearFiles
  );


  document
    .getElementById(
      "logoutButton"
    )
    ?.addEventListener(
      "click",
      logout
    );

}


/* =========================================================
   FILES
========================================================= */

function addFiles(
  list
) {

  for (
    const file
    of Array.from(
      list || []
    )
  ) {

    const ext =
      getExtension(
        file.name
      );


    if (
      ![
        "pdf",
        "jpg",
        "jpeg",
        "png",
        "webp",
        "zip"
      ].includes(
        ext
      )
    ) {

      continue;

    }


    const duplicate =
      selectedFiles.some(
        item =>
          item.name ===
            file.name &&
          item.size ===
            file.size &&
          item.lastModified ===
            file.lastModified
      );


    if (!duplicate) {

      selectedFiles.push(
        file
      );

    }

  }


  renderFileList();

}


function renderFileList() {

  fileList.innerHTML =
    "";


  selectedFiles.forEach(
    (
      file,
      index
    ) => {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "file-item";


      const name =
        document.createElement(
          "span"
        );


      name.textContent =
        `${file.name} (${formatBytes(file.size)})`;


      const remove =
        document.createElement(
          "button"
        );


      remove.type =
        "button";


      remove.textContent =
        "削除";


      remove.onclick =
        () => {

          selectedFiles.splice(
            index,
            1
          );

          renderFileList();

        };


      row.appendChild(
        name
      );


      row.appendChild(
        remove
      );


      fileList.appendChild(
        row
      );

    }
  );

}


function clearFiles() {

  selectedFiles =
    [];


  renderFileList();


  setProgress(
    0
  );


  showResult(
    "",
    false
  );

}


/* =========================================================
   MAIN PROCESS
========================================================= */

async function processUploads() {

  const testId =
    testSelect.value;


  if (!testId) {

    showResult(
      "テストを選択してください。",
      true
    );

    return;

  }


  if (!selectedFiles.length) {

    showResult(
      "ファイルを選択してください。",
      true
    );

    return;

  }


  try {

    uploadButton.disabled =
      true;


    clearButton.disabled =
      true;


    showResult(
      "答案を処理しています。",
      false
    );


    /*
      模範解答
    */

    if (
      answerType.value ===
      "model"
    ) {

      await processModelAnswers(
        testId
      );

    }

    /*
      生徒答案
    */

    else {

      await processStudentAnswers(
        testId
      );

    }


    showResult(
      "答案の処理が完了しました。",
      false
    );


    selectedFiles =
      [];


    renderFileList();


  } catch (error) {

    console.error(
      "ANSWER PROCESS ERROR",
      error
    );


    showResult(
      error.message ||
      "答案処理に失敗しました。",
      true
    );

  } finally {

    uploadButton.disabled =
      false;


    clearButton.disabled =
      false;

  }

}


/* =========================================================
   STUDENT ANSWERS
========================================================= */

async function processStudentAnswers(
  testId
) {

  /*
    枠設定を取得。
  */

  const layout =
    await loadLayout(
      testId
    );


  let processed =
    0;


  for (
    const file
    of selectedFiles
  ) {

    setProgress(
      Math.round(
        processed /
        selectedFiles.length *
        100
      )
    );


    const pages =
      await expandFile(
        file
      );


    if (!pages.length) {
      continue;
    }


    /*
      1答案につき1レコード
    */

    const answerId =
      crypto.randomUUID();


    const firstPath =
      buildAnswerPath(
        testId,
        answerId,
        1
      );


    /*
      まず1ページ目をStorageへ。
      その後answer_sheets作成。
    */

    const firstPage =
      pages[0];


    await uploadPageImage(
      firstPath,
      firstPage
    );


    /*
      QRを全ページから検索。
    */

    let qrResult =
      null;


    for (
      let i = 0;
      i < pages.length;
      i++
    ) {

      const page =
        pages[i];


      const pageNo =
        i + 1;


      const pageLayout =
        getPageLayout(
          layout,
          pageNo
        );


      qrResult =
        await readPageQr(
          page,
          pageLayout
        );


      if (qrResult) {
        break;
      }

    }


    /*
      QRから生徒を特定
    */

    let student =
      null;


    if (qrResult) {

      student =
        await findStudentByQr(
          qrResult
        );

    }


    /*
      answer_sheets
    */

    const {
      error:
        sheetError
    } =
      await supabaseClient
        .from(
          "answer_sheets"
        )
        .insert({

          id:
            answerId,

          test_id:
            testId,

          student_id:
            student?.id ||
            null,

          qr_token:
            qrResult ||
            null,

          file_path:
            firstPath,

          status:
            student
              ? "matched"
              : "unmatched"

        });


    if (sheetError) {
      throw sheetError;
    }


    /*
      全ページ保存
    */

    for (
      let i = 0;
      i < pages.length;
      i++
    ) {

      const page =
        pages[i];


      const pageNo =
        i + 1;


      const path =
        buildAnswerPath(
          testId,
          answerId,
          pageNo
        );


      if (pageNo !== 1) {

        await uploadPageImage(
          path,
          page
        );

      }


      /*
        answer_sheet_pages
      */

      const {
        error:
          pageInsertError
      } =
        await supabaseClient
          .from(
            "answer_sheet_pages"
          )
          .insert({

            answer_sheet_id:
              answerId,

            page_no:
              pageNo,

            file_path:
              path,

            width_px:
              page.width,

            height_px:
              page.height

          });


      if (pageInsertError) {
        throw pageInsertError;
      }


      /*
        枠から答案領域を生成
      */

      await createAnswerRegions(
        answerId,
        testId,
        pageNo,
        page,
        getPageLayout(
          layout,
          pageNo
        )
      );

    }


    processed++;

    setProgress(
      Math.round(
        processed /
        selectedFiles.length *
        100
      )
    );

  }

}


/* =========================================================
   MODEL ANSWER
========================================================= */

async function processModelAnswers(
  testId
) {

  for (
    const file
    of selectedFiles
  ) {

    const pages =
      await expandFile(
        file
      );


    let pageNo =
      1;


    for (
      const page
      of pages
    ) {

      const path =
        [
          testId,
          "model-answer",
          `page-${String(
            pageNo
          ).padStart(
            3,
            "0"
          )}.png`
        ].join("/");


      const blob =
        await canvasToBlob(
          page.canvas
        );


      const {
        error
      } =
        await supabaseClient
          .storage
          .from(
            "model-answers"
          )
          .upload(
            path,
            blob,
            {
              contentType:
                "image/png",

              upsert:
                true
            }
          );


      if (error) {
        throw error;
      }


      pageNo++;

    }

  }

}


/* =========================================================
   LOAD LAYOUT
========================================================= */

async function loadLayout(
  testId
) {

  const {
    data:
      pages,
    error:
      pageError
  } =
    await supabaseClient
      .from(
        "test_pages"
      )
      .select(`
        id,
        test_id,
        page_no,
        image_path,
        width_px,
        height_px
      `)
      .eq(
        "test_id",
        testId
      )
      .order(
        "page_no",
        {
          ascending:
            true
        }
      );


  if (pageError) {
    throw pageError;
  }


  const {
    data:
      boxes,
    error:
      boxError
  } =
    await supabaseClient
      .from(
        "layout_boxes"
      )
      .select(`
        id,
        test_id,
        page_no,
        box_type,
        label,
        x,
        y,
        width,
        height,
        points,
        parent_box_id,
        major_no,
        minor_no,
        box_role,
        sort_order,
        subtotal_group
      `)
      .eq(
        "test_id",
        testId
      )
      .order(
        "page_no",
        {
          ascending:
            true
        }
      )
      .order(
        "sort_order",
        {
          ascending:
            true
        }
      );


  if (boxError) {
    throw boxError;
  }


  return {

    pages:
      pages || [],

    boxes:
      boxes || []

  };

}


/* =========================================================
   PAGE LAYOUT
========================================================= */

function getPageLayout(
  layout,
  pageNo
) {

  return {

    page:
      layout.pages.find(
        page =>
          Number(
            page.page_no
          ) ===
          Number(
            pageNo
          )
      ) || null,

    boxes:
      layout.boxes.filter(
        box =>
          Number(
            box.page_no
          ) ===
          Number(
            pageNo
          )
      )

  };

}


/* =========================================================
   QR
========================================================= */

async function readPageQr(
  page,
  pageLayout
) {

  const qrBoxes =
    pageLayout.boxes.filter(
      box =>
        box.box_role ===
        "qr" ||
        box.box_type ===
        "qr"
    );


  /*
    QR枠が設定されている場合
    その範囲を優先。
  */

  for (
    const box
    of qrBoxes
  ) {

    const result =
      decodeQrInBox(
        page.canvas,
        box
      );


    if (
      result?.data
    ) {

      return normalizeQr(
        result.data
      );

    }

  }


  /*
    QR枠がない場合も
    ページ全体を一度探索。
  */

  const result =
    decodeQrFullPage(
      page.canvas
    );


  return result
    ? normalizeQr(
        result.data
      )
    : null;

}


/* =========================================================
   QR BOX
========================================================= */

function decodeQrInBox(
  canvas,
  box
) {

  const image =
    cropCanvas(
      canvas,
      box
    );


  return decodeQrCanvas(
    image
  );

}


/* =========================================================
   QR FULL PAGE
========================================================= */

function decodeQrFullPage(
  canvas
) {

  return decodeQrCanvas(
    canvas
  );

}


/* =========================================================
   QR DECODE
========================================================= */

function decodeQrCanvas(
  canvas
) {

  const ctx =
    canvas.getContext(
      "2d",
      {
        willReadFrequently:
          true
      }
    );


  const image =
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );


  return jsQR(
    image.data,
    image.width,
    image.height,
    {
      inversionAttempts:
        "attemptBoth"
    }
  );

}


/* =========================================================
   QR TOKEN
========================================================= */

function normalizeQr(
  value
) {

  return String(
    value || ""
  )
    .trim();

}


/* =========================================================
   STUDENT
========================================================= */

async function findStudentByQr(
  qrToken
) {

  /*
    QRはstudents.qr_tokenを
    基準にする。
  */

  const {
    data,
    error
  } =
    await supabaseClient
      .from(
        "students"
      )
      .select(`
        id,
        student_no,
        name,
        qr_token,
        active
      `)
      .eq(
        "qr_token",
        qrToken
      )
      .eq(
        "active",
        true
      )
      .maybeSingle();


  if (error) {
    throw error;
  }


  return data || null;

}


/* =========================================================
   ANSWER REGIONS
========================================================= */

async function createAnswerRegions(
  answerSheetId,
  testId,
  pageNo,
  page,
  pageLayout
) {

  /*
    現在の枠設定では
    小問枠にquestion_idを
    設定しない仕様。

    そのため、question_idを
    勝手に生成しない。

    後の配点/設問設定で
    questionsと紐付いた段階で
    answer_regionsを生成する。
  */

  const minorBoxes =
    pageLayout.boxes.filter(
      box =>
        box.box_role ===
        "minor"
    );


  if (!minorBoxes.length) {
    return;
  }


  /*
    question_idが既に存在する
    古い枠だけ対応。
  */

  const rows =
    minorBoxes
      .filter(
        box =>
          box.question_id
      )
      .map(
        box => ({

          answer_sheet_id:
            answerSheetId,

          question_id:
            box.question_id,

          page_no:
            pageNo,

          x:
            Number(
              box.x
            ),

          y:
            Number(
              box.y
            ),

          width:
            Number(
              box.width
            ),

          height:
            Number(
              box.height
            )

        })
      );


  if (!rows.length) {
    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from(
        "answer_regions"
      )
      .insert(
        rows
      );


  if (error) {
    throw error;
  }

}


/* =========================================================
   FILE EXPANSION
========================================================= */

async function expandFile(
  file
) {

  const ext =
    getExtension(
      file.name
    );


  if (
    ext ===
    "zip"
  ) {

    return expandZip(
      file
    );

  }


  if (
    ext ===
    "pdf"
  ) {

    return pdfToPages(
      file
    );

  }


  return [
    await imageToPage(
      file
    )
  ];

}


/* =========================================================
   ZIP
========================================================= */

async function expandZip(
  file
) {

  const zip =
    await JSZip.loadAsync(
      file
    );


  const entries =
    Object.values(
      zip.files
    )
      .filter(
        entry =>
          !entry.dir
      )
      .sort(
        (
          a,
          b
        ) =>
          a.name.localeCompare(
            b.name,
            undefined,
            {
              numeric:
                true
            }
          )
      );


  const pages =
    [];


  for (
    const entry
    of entries
  ) {

    const ext =
      getExtension(
        entry.name
      );


    if (
      ext ===
      "pdf"
    ) {

      const blob =
        await entry.async(
          "blob"
        );


      const pdfFile =
        new File(
          [
            blob
          ],
          entry.name,
          {
            type:
              "application/pdf"
          }
        );


      const pdfPages =
        await pdfToPages(
          pdfFile
        );


      pages.push(
        ...pdfPages
      );


      continue;

    }


    if (
      [
        "jpg",
        "jpeg",
        "png",
        "webp"
      ].includes(
        ext
      )
    ) {

      const blob =
        await entry.async(
          "blob"
        );


      const imageFile =
        new File(
          [
            blob
          ],
          entry.name,
          {
            type:
              `image/${ext === "jpg" ? "jpeg" : ext}`
          }
        );


      pages.push(
        await imageToPage(
          imageFile
        )
      );

    }

  }


  return pages;

}


/* =========================================================
   PDF
========================================================= */

async function pdfToPages(
  file
) {

  const buffer =
    await file.arrayBuffer();


  const pdf =
    await pdfjsLib
      .getDocument({
        data:
          buffer
      })
      .promise;


  const result =
    [];


  for (
    let pageNo = 1;
    pageNo <=
    pdf.numPages;
    pageNo++
  ) {

    const pdfPage =
      await pdf.getPage(
        pageNo
      );


    const base =
      pdfPage.getViewport({
        scale: 1
      });


    const scale =
      Math.min(
        3,
        Math.max(
          1,
          3000 /
          Math.max(
            base.width,
            base.height
          )
        )
      );


    const viewport =
      pdfPage.getViewport({
        scale
      });


    const canvas =
      document.createElement(
        "canvas"
      );


    canvas.width =
      Math.ceil(
        viewport.width
      );


    canvas.height =
      Math.ceil(
        viewport.height
      );


    await pdfPage
      .render({

        canvasContext:
          canvas.getContext(
            "2d"
          ),

        viewport

      })
      .promise;


    result.push({

      canvas,

      width:
        canvas.width,

      height:
        canvas.height

    });

  }


  return result;

}


/* =========================================================
   IMAGE
========================================================= */

async function imageToPage(
  file
) {

  const url =
    URL.createObjectURL(
      file
    );


  try {

    const image =
      await loadImage(
        url
      );


    const canvas =
      document.createElement(
        "canvas"
      );


    canvas.width =
      image.naturalWidth;


    canvas.height =
      image.naturalHeight;


    canvas
      .getContext(
        "2d"
      )
      .drawImage(
        image,
        0,
        0
      );


    return {

      canvas,

      width:
        canvas.width,

      height:
        canvas.height

    };

  } finally {

    URL.revokeObjectURL(
      url
    );

  }

}


/* =========================================================
   UPLOAD PAGE IMAGE
========================================================= */

async function uploadPageImage(
  path,
  page
) {

  const blob =
    await canvasToBlob(
      page.canvas
    );


  const {
    error
  } =
    await supabaseClient
      .storage
      .from(
        "answers"
      )
      .upload(
        path,
        blob,
        {
          contentType:
            "image/png",

          upsert:
            true
        }
      );


  if (error) {
    throw error;
  }

}


/* =========================================================
   PATH
========================================================= */

function buildAnswerPath(
  testId,
  answerId,
  pageNo
) {

  return [
    testId,
    answerId,
    `page-${String(
      pageNo
    ).padStart(
      3,
      "0"
    )}.png`
  ].join("/");

}


/* =========================================================
   CROP
========================================================= */

function cropCanvas(
  source,
  box
) {

  const x =
    Math.max(
      0,
      Math.round(
        Number(box.x)
      )
    );


  const y =
    Math.max(
      0,
      Math.round(
        Number(box.y)
      )
    );


  const width =
    Math.max(
      1,
      Math.round(
        Number(box.width)
      )
    );


  const height =
    Math.max(
      1,
      Math.round(
        Number(box.height)
      )
    );


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    Math.min(
      width,
      source.width -
      x
    );


  canvas.height =
    Math.min(
      height,
      source.height -
      y
    );


  canvas
    .getContext(
      "2d"
    )
    .drawImage(
      source,

      x,
      y,
      canvas.width,
      canvas.height,

      0,
      0,
      canvas.width,
      canvas.height
    );


  return canvas;

}


/* =========================================================
   BLOB
========================================================= */

function canvasToBlob(
  canvas
) {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      canvas.toBlob(
        blob => {

          if (!blob) {

            reject(
              new Error(
                "画像変換に失敗しました。"
              )
            );

            return;

          }


          resolve(
            blob
          );

        },
        "image/png"
      );

    }
  );

}


/* =========================================================
   IMAGE
========================================================= */

function loadImage(
  src
) {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const image =
        new Image();


      image.onload =
        () =>
          resolve(
            image
          );


      image.onerror =
        () =>
          reject(
            new Error(
              "画像の読み込みに失敗しました。"
            )
          );


      image.src =
        src;

    }
  );

}


/* =========================================================
   HELPERS
========================================================= */

function getExtension(
  name
) {

  const parts =
    String(
      name || ""
    )
      .toLowerCase()
      .split(".");


  return parts.length > 1
    ? parts.pop()
    : "";

}


function formatBytes(
  bytes
) {

  if (
    bytes <
    1024
  ) {

    return `${bytes} B`;

  }


  if (
    bytes <
    1024 *
    1024
  ) {

    return `${(
      bytes /
      1024
    ).toFixed(1)} KB`;

  }


  return `${(
    bytes /
    1024 /
    1024
  ).toFixed(1)} MB`;

}


function setProgress(
  value
) {

  progressBar.style.width =
    `${Math.max(
      0,
      Math.min(
        100,
        value
      )
    )}%`;

}


function showResult(
  message,
  error
) {

  resultBox.hidden =
    !message;


  resultBox.textContent =
    message;


  resultBox.className =
    `result ${
      error
        ? "error"
        : "success"
    }`;

}
