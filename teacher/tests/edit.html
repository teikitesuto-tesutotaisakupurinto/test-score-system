
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
  テスト編集 - テスト成績システム
</title>

<link
  rel="stylesheet"
  href="/css/common.css"
>

<style>

.main {
  max-width:800px;

  margin:0 auto;

  padding:25px;
}


.card {
  background:#fff;

  border:
    1px solid #d5dbe0;

  padding:20px;
}


.field {
  margin-bottom:16px;
}


.field label {
  display:block;

  margin-bottom:6px;

  font-size:13px;

  font-weight:700;
}


.field input {
  width:100%;

  height:42px;

  padding:0 10px;

  box-sizing:border-box;
}


.actions {
  display:flex;

  gap:8px;

  flex-wrap:wrap;
}


.message {
  min-height:22px;

  margin-bottom:15px;

  padding:10px;

  display:none;
}


.message.error {
  display:block;

  background:#fff4f2;

  color:#b42318;

  border:
    1px solid #efc2bc;
}


.message.success {
  display:block;

  background:#f1faf5;

  color:#16834b;

  border:
    1px solid #a9d8bd;
}


</style>

</head>


<body>

<header class="topbar">

  <div class="system-name">
    テスト成績システム
  </div>

  <div class="topbar-space"></div>

  <span id="teacherName">
    -
  </span>

  <button
    id="logoutButton"
    class="logout-button"
    type="button"
  >
    ログアウト
  </button>

</header>


<main class="main">

  <h1 id="pageTitle">
    テスト編集
  </h1>


  <section class="card">

    <div
      id="message"
      class="message"
      aria-live="polite"
    ></div>


    <div class="field">

      <label for="name">
        テスト名
      </label>

      <input
        id="name"
        type="text"
        maxlength="200"
        required
      >

    </div>


    <div class="field">

      <label for="subject">
        教科
      </label>

      <input
        id="subject"
        type="text"
        maxlength="50"
      >

    </div>


    <div class="field">

      <label for="grade">
        学年
      </label>

      <input
        id="grade"
        type="text"
        maxlength="30"
      >

    </div>


    <div class="field">

      <label for="className">
        クラス
      </label>

      <input
        id="className"
        type="text"
        maxlength="50"
      >

    </div>


    <div class="field">

      <label for="testDate">
        実施日
      </label>

      <input
        id="testDate"
        type="date"
      >

    </div>


    <div class="field">

      <label for="maxScore">
        満点
      </label>

      <input
        id="maxScore"
        type="number"
        min="0"
        step="0.5"
      >

    </div>


    <div class="actions">

      <button
        id="saveButton"
        class="btn btn-primary"
        type="button"
      >
        保存
      </button>


      <button
        id="pagesButton"
        class="btn"
        type="button"
      >
        解答用紙・ページ設定
      </button>


      <button
        id="layoutButton"
        class="btn"
        type="button"
      >
        枠設定
      </button>


      <button
        id="pointsButton"
        class="btn"
        type="button"
      >
        配点設定
      </button>


      <button
        id="backButton"
        class="btn"
        type="button"
      >
        戻る
      </button>

    </div>

  </section>

</main>


<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script
  src="/js/config.js?v=20261116"
></script>

<script
  src="/js/auth.js?v=20261116"
></script>


<script>

"use strict";


(async function () {

  const profile =
    await requireTeacher();


  if (!profile) {

    return;

  }


  document.getElementById(
    "teacherName"
  ).textContent =
    profile.name ||
    "先生";


  document
    .getElementById(
      "logoutButton"
    )
    .addEventListener(
      "click",
      logout
    );


  const params =
    new URLSearchParams(
      window.location.search
    );


  const testId =
    params.get(
      "id"
    ) ||
    params.get(
      "test"
    );


  const nameInput =
    document.getElementById(
      "name"
    );


  const subjectInput =
    document.getElementById(
      "subject"
    );


  const gradeInput =
    document.getElementById(
      "grade"
    );


  const classInput =
    document.getElementById(
      "className"
    );


  const dateInput =
    document.getElementById(
      "testDate"
    );


  const maxScoreInput =
    document.getElementById(
      "maxScore"
    );


  const message =
    document.getElementById(
      "message"
    );


  const saveButton =
    document.getElementById(
      "saveButton"
    );


  const pagesButton =
    document.getElementById(
      "pagesButton"
    );


  const layoutButton =
    document.getElementById(
      "layoutButton"
    );


  const pointsButton =
    document.getElementById(
      "pointsButton"
    );


  function showMessage(
    text,
    type = "error"
  ) {

    message.textContent =
      text;

    message.className =
      `message ${type}`;

  }


  function clearMessage() {

    message.textContent =
      "";

    message.className =
      "message";

  }


  async function loadTest() {

    if (!testId) {

      document.getElementById(
        "pageTitle"
      ).textContent =
        "テスト作成";


      return;

    }


    const {
      data,
      error
    } =
      await supabaseClient
        .from(
          "tests"
        )
        .select(
          `
          id,
          name,
          subject,
          grade,
          class_name,
          test_date,
          max_score
          `
        )
        .eq(
          "id",
          testId
        )
        .maybeSingle();


    if (error) {

      throw error;

    }


    if (!data) {

      throw new Error(
        "指定されたテストが見つかりません。"
      );

    }


    document.getElementById(
      "pageTitle"
    ).textContent =
      "テスト編集";


    nameInput.value =
      data.name ||
      "";


    subjectInput.value =
      data.subject ||
      "";


    gradeInput.value =
      data.grade ||
      "";


    classInput.value =
      data.class_name ||
      "";


    dateInput.value =
      data.test_date ||
      "";


    maxScoreInput.value =
      data.max_score ??
      "";


    pagesButton.disabled =
      false;


    layoutButton.disabled =
      false;


    pointsButton.disabled =
      false;

  }


  saveButton.addEventListener(
    "click",
    async () => {

      clearMessage();


      const name =
        nameInput.value.trim();


      if (!name) {

        showMessage(
          "テスト名を入力してください。"
        );

        return;

      }


      const maxScoreText =
        maxScoreInput.value.trim();


      const maxScore =
        maxScoreText ===
          ""
          ? null
          : Number(
              maxScoreText
            );


      if (
        maxScoreText !==
          "" &&
        (
          !Number.isFinite(
            maxScore
          ) ||
          maxScore < 0
        )
      ) {

        showMessage(
          "満点を正しく入力してください。"
        );

        return;

      }


      const payload = {

        name,

        subject:
          subjectInput.value.trim() ||
          null,

        grade:
          gradeInput.value.trim() ||
          null,

        class_name:
          classInput.value.trim() ||
          null,

        test_date:
          dateInput.value ||
          null,

        max_score:
          maxScore

      };


      saveButton.disabled =
        true;


      try {

        let result;


        if (testId) {

          result =
            await supabaseClient
              .from(
                "tests"
              )
              .update(
                payload
              )
              .eq(
                "id",
                testId
              )
              .select(
                "id"
              )
              .single();

        } else {

          result =
            await supabaseClient
              .from(
                "tests"
              )
              .insert(
                payload
              )
              .select(
                "id"
              )
              .single();

        }


        if (result.error) {

          throw result.error;

        }


        const savedId =
          result.data.id;


        showMessage(
          "保存しました。",
          "success"
        );


        /*
         * 新規作成の場合は
         * 編集画面へ移動。
         */

        if (!testId) {

          location.href =
            `/teacher/tests/edit?id=${encodeURIComponent(
              savedId
            )}`;

        }

      } catch (error) {

        console.error(
          error
        );


        showMessage(
          error.message ||
          "保存できませんでした。"
        );

      } finally {

        saveButton.disabled =
          false;

      }

    }
  );


  pagesButton.addEventListener(
    "click",
    () => {

      if (!testId) {

        showMessage(
          "先にテストを保存してください。"
        );

        return;

      }


      location.href =
        `/teacher/tests/pages?test=${encodeURIComponent(
          testId
        )}`;

    }
  );


  layoutButton.addEventListener(
    "click",
    () => {

      if (!testId) {

        showMessage(
          "先にテストを保存してください。"
        );

        return;

      }


      location.href =
        `/teacher/tests/layout?test=${encodeURIComponent(
          testId
        )}`;

    }
  );


  pointsButton.addEventListener(
    "click",
    () => {

      if (!testId) {

        showMessage(
          "先にテストを保存してください。"
        );

        return;

      }


      location.href =
        `/teacher/tests/points?test=${encodeURIComponent(
          testId
        )}`;

    }
  );


  document
    .getElementById(
      "backButton"
    )
    .addEventListener(
      "click",
      () => {

        location.href =
          "/teacher/tests";

      }
    );


  try {

    await loadTest();

  } catch (error) {

    showMessage(
      error.message ||
      "テストを読み込めませんでした。"
    );

  }

})();

</script>


</body>

</html>
