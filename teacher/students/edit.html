<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    生徒編集 - テスト成績システム
  </title>

  <link
    rel="stylesheet"
    href="/css/common.css"
  >

</head>

<body>

<header class="topbar">

  <div class="system-name">
    テスト成績システム
  </div>

  <div class="topbar-space"></div>

  <span id="teacherName">
    -
  </span>

  <button
    id="logoutButton"
    class="logout-button"
  >
    ログアウト
  </button>

</header>


<div class="teacher-layout">

  <aside class="sidebar">

    <div class="sidebar-title">
      生徒
    </div>

    <a
      href="/teacher/students"
      class="menu-link"
    >
      生徒一覧
    </a>

    <a
      href="/teacher/students/new"
      class="menu-link"
    >
      生徒登録
    </a>

    <a
      href="/teacher/students/qr"
      class="menu-link"
    >
      QRシール発行
    </a>

  </aside>


  <main class="main-content">

    <div class="page-header">

      <h1>
        生徒編集
      </h1>

    </div>


    <div
      id="loading"
      class="card"
    >
      読み込み中...
    </div>


    <div
      id="editArea"
      class="card"
      style="display:none;"
    >

      <div
        style="
          display:grid;
          grid-template-columns:
            repeat(2,minmax(0,1fr));
          gap:15px;
        "
      >

        <div class="form-group">

          <label>
            生徒番号
          </label>

          <input
            id="studentNo"
            type="text"
            disabled
          >

        </div>


        <div class="form-group">

          <label>
            氏名
          </label>

          <input
            id="studentName"
            type="text"
            maxlength="100"
            required
          >

        </div>


        <div class="form-group">

          <label>
            学年
          </label>

          <input
            id="studentGrade"
            type="text"
            maxlength="30"
          >

        </div>


        <div class="form-group">

          <label>
            クラス
          </label>

          <input
            id="studentClass"
            type="text"
            maxlength="30"
          >

        </div>

      </div>


      <div class="form-group">

        <label>
          在籍状態
        </label>

        <select id="studentActive">

          <option value="true">
            在籍
          </option>

          <option value="false">
            無効
          </option>

        </select>

      </div>


      <div
        id="editMessage"
        style="
          min-height:22px;
          margin-bottom:10px;
          color:#c62828;
        "
      ></div>


      <div
        style="
          display:flex;
          gap:8px;
        "
      >

        <button
          id="saveButton"
          class="btn btn-primary"
        >
          保存する
        </button>

        <a
          href="/teacher/students"
          class="btn"
        >
          戻る
        </a>

      </div>

    </div>

  </main>

</div>


<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="/js/config.js"></script>

<script src="/js/auth.js"></script>

<script src="/js/teacher/student-edit.js"></script>

</body>

</html>
