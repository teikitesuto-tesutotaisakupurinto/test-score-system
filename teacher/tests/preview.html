
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  テスト確認 - テスト成績システム
</title>

<link
  rel="stylesheet"
  href="/css/common.css"
>

<style>

.preview-main {
  max-width:1400px;

  margin:0 auto;

  padding:20px;
}


.preview-information {
  margin-bottom:15px;

  padding:14px;

  background:#fff;

  border:
    1px solid #d0d6dc;

  line-height:1.8;
}


.preview-toolbar {
  display:flex;

  flex-wrap:wrap;

  gap:8px;

  margin-bottom:15px;
}


.preview-section {
  margin-bottom:18px;

  padding:15px;

  background:#fff;

  border:
    1px solid #d0d6dc;
}


.preview-pages {
  padding:15px;

  background:#dfe4e8;

  border:
    1px solid #cbd2d8;
}


.preview-box-summary {
  overflow:auto;
}


.empty {
  padding:50px;

  text-align:center;

  color:#777;
}

</style>

</head>


<body>


<header class="topbar">

<div class="system-name">
  テスト成績システム
</div>


<div class="topbar-space"></div>


<span id="teacherName">
  -
</span>


<button
id="logoutButton"
class="logout-button"
type="button"
>
  ログアウト
</button>

</header>


<div class="teacher-layout">


<aside class="sidebar">


<div class="sidebar-title">
  テスト設定
</div>


<a
id="pagesLink"
href="#"
class="menu-link"
>
  解答用紙登録
</a>


<a
id="layoutLink"
href="#"
class="menu-link"
>
  枠設定
</a>


<a
id="modelAnswerLink"
href="#"
class="menu-link"
>
  模範解答
</a>


<a
id="previewLink"
href="#"
class="menu-link active"
>
  テスト確認
</a>


<a
href="#"
id="pointsLink"
class="menu-link"
>
  配点設定
</a>


</aside>


<main class="main-content preview-main">


<div class="page-header">

<h1>
  テスト確認
</h1>

</div>


<section
id="testInformation"
class="preview-information"
>
読み込み中...
</section>


<div class="preview-toolbar">

<a
href="/teacher/tests"
class="btn"
>
テスト一覧
</a>


<a
id="pagesLinkTop"
href="#"
class="btn"
>
解答用紙・枠設定
</a>


<a
id="pointsLinkTop"
href="#"
class="btn"
>
配点設定
</a>


<a
id="markingLink"
href="#"
class="btn btn-primary"
>
採点へ
</a>

</div>


<section class="preview-section">


<h2>
  解答用紙
</h2>


<div
id="pagePreview"
class="preview-pages"
>

<div class="empty">
読み込み中...
</div>

</div>


</section>


<section class="preview-section">


<h2>
  解答欄・配点
</h2>


<div
id="boxPreview"
class="preview-box-summary"
>

<div class="empty">
読み込み中...
</div>

</div>


</section>


</main>


</div>


<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script
src="/js/config.js?v=20261116"
></script>


<script
src="/js/auth.js?v=20261126"
></script>


<script
src="/js/teacher/test-preview.js?v=20261116"
></script>


<script>

"use strict";


const params =
  new URLSearchParams(
    location.search
  );


const testId =
  params.get(
    "test"
  ) ||
  params.get(
    "id"
  );


if (testId) {

  const encoded =
    encodeURIComponent(
      testId
    );


  document.getElementById(
    "pagesLinkTop"
  ).href =
    `/teacher/tests/pages?test=${encoded}`;


  document.getElementById(
    "pointsLinkTop"
  ).href =
    `/teacher/tests/points?test=${encoded}`;


  document.getElementById(
    "markingLink"
  ).href =
    `/teacher/marking?test=${encoded}`;

}

</script>


<script src="/js/common-sidebar.js?v=20261126"></script>
</body>

</html>
