
<!doctype html>
<html lang="ja">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
  配点設定 - テスト成績システム
</title>

<link
  rel="stylesheet"
  href="/css/common.css"
>

<style>

.points-main {
  max-width:1200px;
  margin:0 auto;
  padding:22px;
}

.toolbar {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:15px;
}

.status {
  padding:10px 12px;
  margin-bottom:15px;

  background:#f5f6f7;

  border:1px solid #d5dbe0;

  font-size:13px;

  white-space:pre-wrap;
}

.status.error {
  color:#b42318;
}

.test-info {
  margin-bottom:15px;
  padding:15px;

  background:#fff;

  border:1px solid #d0d6dc;

  border-radius:6px;
}

.test-name {
  font-size:18px;
  font-weight:700;
}

.test-meta {
  margin-top:5px;

  color:#666;

  font-size:13px;
}

.table-wrap {
  overflow-x:auto;

  background:#fff;

  border:1px solid #d0d6dc;
}

.points-table {
  width:100%;

  border-collapse:collapse;
}

.points-table th,
.points-table td {
  border:1px solid #d0d6dc;

  padding:9px 10px;

  font-size:13px;

  vertical-align:middle;
}

.points-table th {
  background:#f3f5f7;

  font-weight:700;

  text-align:left;
}

.points-input {
  width:110px;

  height:38px;

  padding:0 8px;

  border:1px solid #b8c1c9;

  border-radius:4px;

  text-align:right;

  background:#fff;
}

.points-input:focus {
  outline:none;

  border-color:#1769aa;
}

.total-row td {
  background:#f8fafb;

  font-weight:700;
}

.total-points {
  font-size:18px;
}

.empty {
  padding:50px;

  text-align:center;

  color:#777;
}

.next-area {
  display:flex;

  flex-wrap:wrap;

  gap:8px;

  margin-top:15px;

  padding-top:15px;

  border-top:1px solid #d0d6dc;
}

</style>

</head>


<body>


<header class="topbar">

  <div class="system-name">
    テスト成績システム
  </div>


  <div class="topbar-space"></div>


  <span id="teacherName">
    -
  </span>


  <button
    id="logoutButton"
    class="logout-button"
    type="button"
  >
    ログアウト
  </button>

</header>


<main class="points-main">


<div class="page-header">

<h1>
  配点設定
</h1>

</div>


<div
id="status"
class="status"
>
読み込み中...
</div>


<section
id="testInfo"
class="test-info"
>

<div
id="testName"
class="test-name"
>
-
</div>


<div
id="testMeta"
class="test-meta"
>
-
</div>

</section>


<div class="toolbar">


<a
id="layoutButton"
class="btn"
href="#"
>
枠設定へ戻る
</a>


<a
href="/teacher/students/qr"
class="btn"
>
生徒QR発行
</a>


<a
id="markingButton"
class="btn btn-primary"
href="#"
>
採点へ
</a>


</div>


<div
id="tableWrap"
class="table-wrap"
>

<div class="empty">
設問を読み込んでいます...
</div>

</div>


<div class="next-area">


<a
href="/teacher/tests"
class="btn"
>
テスト一覧へ戻る
</a>


<a
href="/teacher/students/qr"
class="btn btn-primary"
>
配点設定完了・生徒QR発行へ
</a>


</div>


</main>


<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script
src="/js/config.js?v=20261116"
></script>


<script
src="/js/auth.js?v=20261116"
></script>


<script>

"use strict";


/* =========================================================
   DB
========================================================= */

const DB =
  window.supabaseClient ||
  window.SB;


if (!DB) {

  throw new Error(
    "Supabase Clientが初期化されていません。"
  );

}


/* =========================================================
   STATE
========================================================= */

let testId =
  null;

let boxes =
  [];


/* =========================================================
   DOM
========================================================= */

const statusElement =
  document.getElementById(
    "status"
  );


const tableWrap =
  document.getElementById(
    "tableWrap"
  );


const teacherName =
  document.getElementById(
    "teacherName"
  );


/* =========================================================
   INIT
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  initialize
);


async function initialize() {

  try {

    /*
     * 認証
     */

    const result =
      await requireRole(
        "teacher"
      );


    if (!result) {

      return;

    }


    teacherName.textContent =
      result.profile?.name ||
      "先生";


    /*
     * URL
     */

    const params =
      new URLSearchParams(
        window.location.search
      );


    testId =
      params.get(
        "test"
      );


    if (!testId) {

      throw new Error(
        "テストIDがありません。"
      );

    }


    setLinks();


    await load();


  } catch (error) {

    console.error(
      "points initialize:",
      error
    );


    showError(
      error.message ||
      "配点設定を読み込めませんでした。"
    );

  }

}


/* =========================================================
   LINKS
========================================================= */

function setLinks() {

  const encoded =
    encodeURIComponent(
      testId
    );


  document.getElementById(
    "layoutButton"
  ).href =
    `/teacher/tests/layout?test=${encoded}`;


  document.getElementById(
    "markingButton"
  ).href =
    `/teacher/marking?test=${encoded}`;

}


/* =========================================================
   LOAD
========================================================= */

async function load() {

  /*
   * -------------------------------------------------------
   * TEST
   * -------------------------------------------------------
   */

  setStatus(
    "テスト情報を取得しています..."
  );


  const {
    data: test,
    error: testError
  } =
    await DB
      .from(
        "tests"
      )
      .select(
        `
        id,
        name,
        subject,
        grade,
        class_name
        `
      )
      .eq(
        "id",
        testId
      )
      .maybeSingle();


  if (testError) {

    throw testError;

  }


  if (!test) {

    throw new Error(
      "指定されたテストが見つかりません。"
    );

  }


  document.getElementById(
    "testName"
  ).textContent =
    test.name ||
    "";


  document.getElementById(
    "testMeta"
  ).textContent =
    [
      test.subject,
      test.grade,
      test.class_name
    ]
      .filter(
        value =>
          value !== null &&
          value !== undefined &&
          String(
            value
          ).trim() !== ""
      )
      .join(
        " / "
      );


  /*
   * -------------------------------------------------------
   * LAYOUT BOXES
   * -------------------------------------------------------
   */

  setStatus(
    "設問枠を取得しています..."
  );


  const {
    data,
    error
  } =
    await DB
      .from(
        "layout_boxes"
      )
      .select(
        `
        id,
        page_no,
        box_type,
        label,
        question_id,
        points,
        sort_order,
        created_at
        `
      )
      .eq(
        "test_id",
        testId
      )
      .order(
        "page_no",
        {
          ascending:true
        }
      )
      .order(
        "sort_order",
        {
          ascending:true
        }
      );


  if (error) {

    throw error;

  }


  /*
   * =====================================================
   * 現在のDB構造に合わせる
   *
   * question_id はNULLでもOK。
   *
   * answer枠を配点対象にする。
   *
   * 除外:
   *   QR
   *   氏名
   *   合計
   *   小計
   * =====================================================
   */

  const excludedLabels =
    new Set([
      "QR",
      "氏名",
      "合計",
      "小計"
    ]);


  boxes =
    (data || [])
      .filter(
        box => {

          const type =
            String(
              box.box_type ||
              ""
            )
            .trim()
            .toLowerCase();


          /*
           * answer以外は対象外。
           */

          if (
            type !==
            "answer"
          ) {

            return false;

          }


          const label =
            String(
              box.label ||
              ""
            ).trim();


          /*
           * 集計・識別枠は除外。
           */

          if (
            excludedLabels.has(
              label
            )
          ) {

            return false;

          }


          return true;

        }
      );


  render();


  setStatus(
    `${boxes.length}問の配点を設定できます。`
  );

}


/* =========================================================
   RENDER
========================================================= */

function render() {

  if (!boxes.length) {

    tableWrap.innerHTML = `

      <div class="empty">

        採点対象の設問枠がありません。

        <br><br>

        枠設定で「解答欄」を作成してください。

        <br><br>

        <a
          href="/teacher/tests/layout?test=${encodeURIComponent(
            testId
          )}"
          class="btn"
        >
          枠設定へ戻る
        </a>

      </div>

    `;


    setStatus(
      "採点対象の解答欄がありません。",
      true
    );


    return;

  }


  const table =
    document.createElement(
      "table"
    );


  table.className =
    "points-table";


  table.innerHTML = `

    <thead>

      <tr>

        <th>
          No.
        </th>

        <th>
          設問
        </th>

        <th>
          ページ
        </th>

        <th>
          配点
        </th>

        <th>
          操作
        </th>

      </tr>

    </thead>


    <tbody></tbody>


    <tfoot>

      <tr class="total-row">

        <td colspan="3">
          合計配点
        </td>

        <td>

          <span
            id="totalPoints"
            class="total-points"
          >
            0
          </span>

        </td>

        <td>
          点
        </td>

      </tr>

    </tfoot>

  `;


  const tbody =
    table.querySelector(
      "tbody"
    );


  boxes.forEach(
    (
      box,
      index
    ) => {

      const row =
        document.createElement(
          "tr"
        );


      /*
       * No.
       */

      const numberCell =
        document.createElement(
          "td"
        );


      numberCell.textContent =
        index + 1;


      /*
       * 設問
       */

      const labelCell =
        document.createElement(
          "td"
        );


      labelCell.textContent =
        box.label ||
        `問${index + 1}`;


      /*
       * ページ
       */

      const pageCell =
        document.createElement(
          "td"
        );


      pageCell.textContent =
        `${Number(
          box.page_no
        ) || 1}ページ`;


      /*
       * 配点
       */

      const pointsCell =
        document.createElement(
          "td"
        );


      const input =
        document.createElement(
          "input"
        );


      input.type =
        "number";


      input.min =
        "0";


      input.step =
        "0.1";


      input.className =
        "points-input";


      input.value =
        Number(
          box.points
        ) || 0;


      input.addEventListener(
        "input",
        updateTotal
      );


      pointsCell.appendChild(
        input
      );


      /*
       * 保存
       */

      const actionCell =
        document.createElement(
          "td"
        );


      const saveButton =
        document.createElement(
          "button"
        );


      saveButton.type =
        "button";


      saveButton.className =
        "btn";


      saveButton.textContent =
        "保存";


      saveButton.addEventListener(
        "click",
        async () => {

          await savePoint(
            box,
            input,
            saveButton
          );

        }
      );


      actionCell.appendChild(
        saveButton
      );


      row.append(
        numberCell,
        labelCell,
        pageCell,
        pointsCell,
        actionCell
      );


      tbody.appendChild(
        row
      );

    }
  );


  tableWrap.innerHTML =
    "";


  tableWrap.appendChild(
    table
  );


  updateTotal();

}


/* =========================================================
   SAVE POINT
========================================================= */

async function savePoint(
  box,
  input,
  button
) {

  const value =
    Number(
      input.value
    );


  if (
    !Number.isFinite(
      value
    )
  ) {

    showError(
      "配点を入力してください。"
    );

    return;

  }


  if (
    value < 0
  ) {

    showError(
      "配点は0以上にしてください。"
    );

    return;

  }


  button.disabled =
    true;


  button.textContent =
    "保存中...";


  try {

    const {
      error
    } =
      await DB
        .from(
          "layout_boxes"
        )
        .update({

          points:
            value

        })
        .eq(
          "id",
          box.id
        );


    if (error) {

      throw error;

    }


    box.points =
      value;


    button.textContent =
      "保存済み";


    updateTotal();


    setStatus(
      `${box.label || "設問"} の配点を ${formatNumber(
        value
      )}点で保存しました。`
    );


  } catch (error) {

    console.error(
      "save point:",
      error
    );


    button.textContent =
      "保存";


    showError(
      `配点保存エラー: ${error.message}`
    );


  } finally {

    button.disabled =
      false;

  }

}


/* =========================================================
   TOTAL
========================================================= */

function updateTotal() {

  const inputs =
    Array.from(
      document.querySelectorAll(
        ".points-input"
      )
    );


  let total =
    0;


  inputs.forEach(
    input => {

      const value =
        Number(
          input.value
        );


      if (
        Number.isFinite(
          value
        )
      ) {

        total +=
          value;

      }

    }
  );


  const totalElement =
    document.getElementById(
      "totalPoints"
    );


  if (!totalElement) {

    return;

  }


  totalElement.textContent =
    formatNumber(
      total
    );

}


/* =========================================================
   STATUS
========================================================= */

function setStatus(
  message,
  error = false
) {

  statusElement.textContent =
    message;


  statusElement.className =
    error
      ? "status error"
      : "status";

}


function showError(
  message
) {

  setStatus(
    message,
    true
  );

}


/* =========================================================
   FORMAT
========================================================= */

function formatNumber(
  value
) {

  const number =
    Number(
      value
    );


  if (
    !Number.isFinite(
      number
    )
  ) {

    return "0";

  }


  if (
    Number.isInteger(
      number
    )
  ) {

    return String(
      number
    );

  }


  return number.toFixed(
    1
  );

}


/* =========================================================
   LOGOUT
========================================================= */

document
  .getElementById(
    "logoutButton"
  )
  ?.addEventListener(
    "click",
    async () => {

      if (
        typeof window.logout ===
        "function"
      ) {

        await window.logout();

        return;

      }


      if (
        typeof window.signOut ===
        "function"
      ) {

        await window.signOut();

      }

    }
  );

</script>


</body>

</html>
