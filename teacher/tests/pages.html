
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  解答用紙・枠設定 - テスト成績システム
</title>


<link
  rel="stylesheet"
  href="/css/common.css"
>


<style>

/* =========================================================
   BASE
========================================================= */

* {
  box-sizing: border-box;
}


html,
body {
  margin: 0;
  padding: 0;
}


body {
  background: #f3f5f7;
  color: #222;
}


/* =========================================================
   MAIN
========================================================= */

.main {
  width: 100%;
  max-width: 1500px;
  margin: 0 auto;
  padding: 20px;
}


/* =========================================================
   PAGE HEADER
========================================================= */

.page-header {
  margin-bottom: 14px;
}


.page-header h1 {
  margin: 0;
  font-size: 24px;
  line-height: 1.4;
}


.page-description {
  margin: 5px 0 0;
  color: #666;
  font-size: 13px;
  line-height: 1.6;
}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;

  padding: 12px;

  margin-bottom: 12px;

  background: #fff;

  border:
    1px solid #d5dbe0;
}


.toolbar input[type="file"] {
  max-width: 300px;
}


.toolbar-status {
  width: 100%;

  padding:
    8px 10px;

  margin-top: 2px;

  background:
    #f5f6f7;

  border:
    1px solid #e1e5e8;

  color:
    #555;

  font-size:
    12px;

  line-height:
    1.6;
}


/* =========================================================
   VIEWER
========================================================= */

.viewer {
  position: relative;

  min-height: 600px;

  padding: 20px;

  background:
    #dfe3e8;

  border:
    1px solid #ccd2d7;

  overflow:
    auto;
}


.page {
  position: relative;

  width:
    min(100%, 1000px);

  margin:
    0 auto 30px;

  background:
    #fff;

  box-shadow:
    0 2px 12px
    rgba(0, 0, 0, .15);
}


.page canvas {
  display: block;

  width: 100%;

  height: auto;
}


.page .layer {
  position: absolute;

  inset: 0;

  user-select: none;
}


/* =========================================================
   BOX
========================================================= */

.box {
  position: absolute;

  min-width: 8px;

  min-height: 8px;

  cursor: move;

  z-index: 10;
}


.box.selected {
  outline:
    3px solid #111;

  outline-offset:
    1px;
}


.box-label {
  position: absolute;

  top: -25px;

  left: 0;

  padding:
    3px 7px;

  background:
    #222;

  color:
    #fff;

  font-size:
    11px;

  line-height:
    1.3;

  white-space:
    nowrap;

  pointer-events:
    none;
}


.resize {
  position: absolute;

  right: -5px;

  bottom: -5px;

  width: 11px;

  height: 11px;

  background:
    #222;

  cursor:
    nwse-resize;
}


/* =========================================================
   DRAGGING PREVIEW
========================================================= */

.drawing-box {
  position: absolute !important;

  display: block !important;

  border:
    2px dashed #d00000 !important;

  background:
    rgba(208, 0, 0, .10) !important;

  pointer-events:
    none !important;

  z-index:
    9999 !important;

  box-shadow:
    0 0 0 1px
    rgba(255,255,255,.8);
}


/* =========================================================
   EMPTY
========================================================= */

.empty-view {
  padding:
    80px 20px;

  text-align:
    center;

  color:
    #666;
}


.empty-view strong {
  display:
    block;

  margin-bottom:
    8px;

  color:
    #333;
}


/* =========================================================
   BOX SETTINGS PANEL
   上部固定
========================================================= */

.box-settings-panel {
  position: fixed;

  top: 64px;

  left: 0;

  right: 0;

  width: 100%;

  background:
    #fff;

  border-bottom:
    1px solid #cbd1d6;

  box-shadow:
    0 3px 14px
    rgba(0, 0, 0, .14);

  z-index:
    1000;
}


.box-settings-panel[hidden] {
  display: none;
}


/* =========================================================
   PANEL HEADER
========================================================= */

.box-settings-header {
  display: flex;

  align-items: center;

  gap: 14px;

  min-height: 42px;

  padding:
    7px 16px;

  background:
    #f4f6f8;

  border-bottom:
    1px solid #e0e4e7;
}


.box-settings-title {
  margin: 0;

  font-size:
    15px;

  font-weight:
    700;

  white-space:
    nowrap;
}


.panel-close {
  margin-left: auto;

  padding:
    5px 10px;

  border:
    0;

  background:
    transparent;

  color:
    #555;

  cursor:
    pointer;

  font-size:
    12px;
}


.panel-close:hover {
  background:
    #e7eaed;
}


/* =========================================================
   PANEL BODY
========================================================= */

.box-settings-body {
  display: flex;

  align-items: center;

  flex-wrap: wrap;

  gap: 10px;

  padding:
    9px 16px;
}


/* =========================================================
   ROLE
========================================================= */

.setting-group {
  display: flex;

  align-items: center;

  gap: 7px;
}


.setting-group label {
  font-size:
    12px;

  font-weight:
    700;

  white-space:
    nowrap;
}


.box-role-select {
  width:
    150px;

  height:
    36px;

  padding:
    0 9px;

  border:
    1px solid #c8ced4;

  background:
    #fff;

  font-size:
    13px;
}


.box-role-select:focus {
  outline:
    2px solid #dce8f2;

  border-color:
    #6d8eaa;
}


/* =========================================================
   PARENT INFO
========================================================= */

.parent-info {
  min-width:
    230px;

  max-width:
    400px;

  padding:
    7px 10px;

  background:
    #f5f6f7;

  border:
    1px solid #e0e4e7;

  color:
    #666;

  font-size:
    11px;

  line-height:
    1.5;
}


/* =========================================================
   ACTIONS
========================================================= */

.setting-actions {
  display:
    flex;

  align-items:
    center;

  gap:
    7px;
}


.setting-actions button {
  min-height:
    36px;

  white-space:
    nowrap;
}


.delete-box-button {
  border:
    1px solid #c94b43;

  background:
    #fff;

  color:
    #b42318;
}


.delete-box-button:hover {
  background:
    #fff5f3;
}


/* =========================================================
   HIDDEN OLD ELEMENTS
   配点・設問ID・表示名はこの画面では使用しない
========================================================= */

#label,
#points,
#questionId,
#labelGroup,
#pointsGroup,
#questionIdGroup {
  display: none !important;
}


/* =========================================================
   MOBILE
========================================================= */

@media (
  max-width: 700px
) {

  .main {
    padding:
      12px;
  }


  .viewer {
    padding:
      8px;
  }


  .box-settings-panel {
    top:
      56px;
  }


  .box-settings-body {
    align-items:
      stretch;

    flex-direction:
      column;
  }


  .setting-group {
    width:
      100%;
  }


  .box-role-select {
    flex:
      1;

    width:
      auto;
  }


  .parent-info {
    width:
      100%;

    max-width:
      none;
  }


  .setting-actions {
    width:
      100%;
  }


  .setting-actions button {
    flex:
      1;
  }

}

</style>

</head>


<body>


<!-- =======================================================
     TOPBAR
======================================================= -->

<header class="topbar">

  <div class="system-name">
    テスト成績システム
  </div>


  <div class="topbar-space"></div>


  <span id="teacherName">
    -
  </span>


  <button
    id="logoutButton"
    class="logout-button"
    type="button"
  >
    ログアウト
  </button>

</header>


<!-- =======================================================
     BOX SETTINGS
     上部固定
======================================================= -->

<aside
  id="panel"
  class="box-settings-panel"
  hidden
>


  <header
    class="box-settings-header"
  >

    <h2
      class="box-settings-title"
    >
      枠設定
    </h2>


    <button
      id="closeButton"
      class="panel-close"
      type="button"
    >
      閉じる
    </button>

  </header>


  <div
    class="box-settings-body"
  >


    <!-- =================================================
         枠種類
    ================================================== -->

    <div
      class="setting-group"
    >

      <label
        for="boxRole"
      >
        枠種類
      </label>


      <select
        id="boxRole"
        class="box-role-select"
      >

        <option value="major">
          大問
        </option>

        <option value="minor">
          小問
        </option>

        <option value="qr">
          QR
        </option>

        <option value="subtotal">
          小計
        </option>

        <option value="total">
          合計
        </option>

        <option value="name">
          氏名
        </option>

        <option value="student_no">
          生徒番号
        </option>

        <option value="instruction">
          説明
        </option>

        <option value="other">
          その他
        </option>

      </select>

    </div>


    <!-- =================================================
         親大問情報
    ================================================== -->

    <div
      id="parentInfo"
      class="parent-info"
    >
      枠を設定してください。
    </div>


    <!-- =================================================
         ACTIONS
    ================================================== -->

    <div
      class="setting-actions"
    >

      <button
        id="applyButton"
        type="button"
        class="btn btn-primary"
      >
        反映
      </button>


      <button
        id="deleteButton"
        type="button"
        class="delete-box-button"
      >
        選択枠を削除
      </button>

    </div>

  </div>

</aside>


<!-- =======================================================
     MAIN
======================================================= -->

<main class="main">


  <header
    class="page-header"
  >

    <h1>
      解答用紙・枠設定
    </h1>


    <p
      class="page-description"
    >
      解答用紙を登録し、大問・小問・QR・小計・合計などの枠を設定します。
    </p>

  </header>


  <!-- =====================================================
       TOOLBAR
  ====================================================== -->

  <section
    class="toolbar"
  >


    <input
      id="answerFile"
      type="file"
      accept=".pdf,.jpg,.jpeg,.png,.webp"
    >


    <button
      id="uploadButton"
      type="button"
      class="btn btn-primary"
    >
      解答用紙を登録
    </button>


    <button
      id="saveButton"
      type="button"
      class="btn btn-primary"
    >
      枠を保存
    </button>


    <button
      id="backButton"
      type="button"
      class="btn"
    >
      戻る
    </button>


    <div
      id="status"
      class="toolbar-status"
    >
      解答用紙を登録してください。
    </div>

  </section>


  <!-- =====================================================
       VIEWER
  ====================================================== -->

  <section
    id="viewer"
    class="viewer"
  >

    <div
      class="empty-view"
    >

      <strong>
        解答用紙がありません
      </strong>

      PDFまたは画像の解答用紙を登録してください。

    </div>

  </section>


</main>


<!-- =======================================================
     SCRIPTS
======================================================= -->

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script
  src="/js/config.js"
></script>


<script
  src="/js/auth.js"
></script>


<script
  src="/js/teacher/test-pages.js"
></script>


<script>

/* =========================================================
   UI

   ・表示名は存在しない
   ・配点は存在しない
   ・設問IDは存在しない
   ・枠種類変更時の説明だけ更新
========================================================= */

(function () {

  const roleSelect =
    document.getElementById(
      "boxRole"
    );


  const parentInfo =
    document.getElementById(
      "parentInfo"
    );


  function updateRoleInfo() {

    if (!roleSelect ||
        !parentInfo) {

      return;

    }


    const role =
      roleSelect.value;


    switch (
      role
    ) {

      case "major":

        parentInfo.textContent =
          "大問の範囲をドラッグしてください。";

        break;


      case "minor":

        parentInfo.textContent =
          "大問の内側に置いた場合、その大問の小問として自動登録されます。";

        break;


      case "qr":

        parentInfo.textContent =
          "答案のQRコードを読み取る範囲を設定します。";

        break;


      case "subtotal":

        parentInfo.textContent =
          "小問の点数から小計を自動計算する範囲です。";

        break;


      case "total":

        parentInfo.textContent =
          "小計などから合計点を自動計算する範囲です。";

        break;


      case "name":

        parentInfo.textContent =
          "氏名を読み取る範囲です。";

        break;


      case "student_no":

        parentInfo.textContent =
          "生徒番号を読み取る範囲です。";

        break;


      case "instruction":

        parentInfo.textContent =
          "説明・指示などの範囲です。";

        break;


      default:

        parentInfo.textContent =
          "その他の範囲です。";

        break;

    }

  }


  roleSelect?.addEventListener(
    "change",
    updateRoleInfo
  );


  updateRoleInfo();


  /*
    Escapeでパネルを閉じる。
  */

  document.addEventListener(
    "keydown",
    event => {

      if (
        event.key ===
        "Escape"
      ) {

        document
          .getElementById(
            "closeButton"
          )
          ?.click();

      }

    }
  );

})();

</script>


</body>

</html>
