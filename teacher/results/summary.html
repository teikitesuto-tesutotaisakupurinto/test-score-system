
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  結果総括表 - テスト成績システム
</title>

<link
  rel="stylesheet"
  href="/css/common.css?v=20261126completefix"
>

<style>

.results-main {
  max-width:1600px;
  margin:0 auto;
  padding:20px;
}


.results-toolbar {
  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

  margin-bottom:12px;

  flex-wrap:wrap;
}


.results-actions {
  display:flex;

  gap:7px;

  flex-wrap:wrap;
}


.results-table-wrap {
  overflow:auto;

  border:
    1px solid #d0d6dc;
}


.results-table {
  width:100%;

  min-width:900px;

  border-collapse:collapse;
}


.results-table th,
.results-table td {
  padding:8px 10px;

  border-bottom:
    1px solid #e1e5e8;

  white-space:nowrap;

  text-align:right;
}


.results-table th {
  background:#f3f5f7;

  font-weight:700;
}


.results-table th:first-child,
.results-table td:first-child,
.results-table th:nth-child(2),
.results-table td:nth-child(2) {
  text-align:left;
}


.summary-grid {
  display:grid;

  grid-template-columns:
    repeat(
      4,
      minmax(0,1fr)
    );

  gap:10px;
}


.summary-card {
  padding:14px;

  background:#f5f6f7;

  border:
    1px solid #d5dbe0;
}


.summary-label {
  color:#666;

  font-size:12px;
}


.summary-value {
  margin-top:4px;

  font-size:22px;

  font-weight:700;
}


.test-information {
  line-height:1.8;
}


.status {
  margin-top:10px;

  padding:10px;

  background:#f5f6f7;

  border:
    1px solid #d5dbe0;

  color:#666;
}


.status.error {
  color:#b42318;

  background:#fff8f7;

  border-color:#efc2bc;
}


.empty {
  padding:40px;

  text-align:center;

  color:#777;
}


@media(max-width:900px) {

  .summary-grid {
    grid-template-columns:
      repeat(
        2,
        minmax(0,1fr)
      );
  }

}


@media(max-width:600px) {

  .results-main {
    padding:10px;
  }


  .summary-grid {
    grid-template-columns:1fr;
  }

}


@media print {

  .topbar,
  .sidebar,
  .results-actions,
  .page-header,
  .test-select-card {
    display:none !important;
  }


  .teacher-layout {
    display:block;
  }


  .main-content {
    margin:0;
    padding:0;
  }

}

</style>

</head>


<body>


<header class="topbar">

<div class="system-name">
  テスト成績システム
</div>


<div class="topbar-space"></div>


<span id="teacherName">
  -
</span>


<button
id="logoutButton"
class="logout-button"
type="button"
>
  ログアウト
</button>

</header>


<div class="teacher-layout">


<aside class="sidebar">

<div class="sidebar-title">
  成績
</div>


<a
href="/teacher/results/summary"
class="menu-link active"
>
  結果総括表
</a>


<a
href="/teacher/results/return"
class="menu-link"
>
  答案返却
</a>


<a
href="/teacher/tests/publish"
class="menu-link"
>
  公開状態
</a>

</aside>


<main class="main-content results-main">


<div class="page-header">

<h1>
  結果総括表
</h1>

</div>


<section
class="card test-select-card"
>


<div class="form-group">

<label for="testSelect">
  テスト
</label>


<select
id="testSelect"
>

<option value="">
  テストを選択してください
</option>

</select>

</div>


<div
id="status"
class="status"
>
テストを選択してください。
</div>


</section>


<section
id="testInformation"
class="card test-information"
style="display:none;"
>
</section>


<section
id="summaryCards"
class="card"
style="display:none;"
>

<div
id="summaryCardGrid"
class="summary-grid"
>
</div>

</section>


<section
id="summaryTableCard"
class="card"
style="display:none;"
>


<div class="results-toolbar">

<h3>
  結果総括表
</h3>


<div class="results-actions">


<button
id="exportCsvButton"
class="btn"
type="button"
>
CSV出力
</button>


<button
id="downloadPdfButton"
class="btn btn-primary"
type="button"
>
正式な結果総括表PDF
</button>

<button
id="printButton"
class="btn"
type="button"
>
印刷
</button>


</div>

</div>


<div class="results-table-wrap">

<table
id="summaryTable"
class="results-table"
>

<thead>
</thead>


<tbody
id="resultBody"
>
</tbody>


</table>

</div>


</section>


</main>


</div>


<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script
src="/js/config.js?v=20261116"
></script>


<script
src="/js/auth.js?v=20261126"
></script>


<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script
src="/js/teacher/results-summary.js?v=20261126completefix"
></script>



<script src="/js/common-sidebar.js?v=20261126completefix"></script>
</body>

</html>
