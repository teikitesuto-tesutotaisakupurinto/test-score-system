
<!doctype html>
<html lang="ja">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
  デジタル採点
</title>

<link
  rel="stylesheet"
  href="/css/common.css"
>

</head>


<body>


<main
  style="
    max-width:700px;
    margin:80px auto;
    padding:20px;
    text-align:center;
  "
>


<h1>
  デジタル採点
</h1>


<p
  style="
    color:#666;
    line-height:1.8;
  "
>

採点対象の答案を個別に選択する方式は終了しました。

<br>

テストを選択すると、
同じ設問の答案をまとめて採点できます。

</p>


<a
id="markingLink"
href="/teacher/marking"
class="btn btn-primary"
>
採点画面へ
</a>


</main>


<script>

"use strict";


const params =
  new URLSearchParams(
    location.search
  );


const testId =
  params.get(
    "test"
  );


const link =
  document.getElementById(
    "markingLink"
  );


if (testId) {

  link.href =
    `/teacher/marking?test=${encodeURIComponent(
      testId
    )}`;

}


</script>


</body>

</html>
