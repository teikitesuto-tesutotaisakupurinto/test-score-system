
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  解答用紙・枠設定 - テスト成績システム
</title>

<link
  rel="stylesheet"
  href="/css/common.css"
>


<style>

/* =====================================================
   BASE
===================================================== */

* {
  box-sizing: border-box;
}


body {
  margin: 0;
  background: #f3f5f7;
}


.main {
  width: 100%;
  max-width: 1500px;
  margin: 0 auto;
  padding: 20px;
}


/* =====================================================
   HEADER
===================================================== */

.page-header {
  margin-bottom: 12px;
}


.page-header h1 {
  margin: 0;
  font-size: 24px;
}


.page-description {
  margin: 5px 0 0;
  color: #666;
  font-size: 13px;
}


/* =====================================================
   TOOLBAR
===================================================== */

.toolbar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px;
  margin-bottom: 12px;
  background: #fff;
  border: 1px solid #d5dbe0;
}


.toolbar input[type="file"] {
  max-width: 280px;
}


.toolbar-status {
  width: 100%;
  margin-top: 3px;
  padding: 8px 10px;
  background: #f5f6f7;
  border: 1px solid #e1e5e8;
  color: #555;
  font-size: 12px;
}


/* =====================================================
   VIEWER
===================================================== */

.viewer {
  min-height: 600px;
  padding: 20px;
  background: #dfe3e8;
  border: 1px solid #ccd2d7;
  overflow: auto;
}


.page {
  position: relative;
  width: min(100%, 1000px);
  margin: 0 auto 25px;
  background: #fff;
  box-shadow:
    0 2px 10px rgba(0, 0, 0, .15);
}


.page canvas {
  display: block;
  width: 100%;
  height: auto;
}


.page .layer {
  position: absolute;
  inset: 0;
}


/* =====================================================
   BOX
===================================================== */

.box {
  position: absolute;
  min-width: 8px;
  min-height: 8px;
  cursor: move;
  z-index: 10;
}


.box.selected {
  outline: 3px solid #111;
  outline-offset: 1px;
}


.box-label {
  position: absolute;
  top: -24px;
  left: 0;
  padding: 3px 6px;
  background: #222;
  color: #fff;
  font-size: 11px;
  line-height: 1.3;
  white-space: nowrap;
  pointer-events: none;
}


.resize {
  position: absolute;
  right: -5px;
  bottom: -5px;
  width: 11px;
  height: 11px;
  background: #222;
  cursor: nwse-resize;
}


/* =====================================================
   EMPTY
===================================================== */

.empty-view {
  padding: 70px 20px;
  text-align: center;
  color: #666;
}


.empty-view strong {
  display: block;
  margin-bottom: 8px;
  color: #333;
}


/* =====================================================
   BOX SETTINGS
   上部固定
===================================================== */

.box-settings-panel {

  position: fixed;

  top: 64px;

  left: 0;

  right: 0;

  width: 100%;

  background: #fff;

  border-bottom:
    1px solid #cbd1d6;

  box-shadow:
    0 3px 12px rgba(0, 0, 0, .12);

  z-index: 1000;

}


.box-settings-panel[hidden] {
  display: none;
}


/* =====================================================
   PANEL HEADER
===================================================== */

.box-settings-header {

  display: flex;

  align-items: center;

  gap: 18px;

  padding:
    9px 16px;

  background:
    #f4f6f8;

  border-bottom:
    1px solid #e0e4e7;

}


.box-settings-title {

  margin: 0;

  font-size: 15px;

  white-space: nowrap;

}


.panel-close {

  margin-left: auto;

  border: 0;

  background: transparent;

  cursor: pointer;

  padding: 5px 8px;

  font-size: 12px;

}


/* =====================================================
   PANEL BODY
===================================================== */

.box-settings-body {

  display: flex;

  align-items: center;

  flex-wrap: wrap;

  gap: 12px;

  padding:
    10px 16px;

}


.setting-group {

  display: flex;

  align-items: center;

  gap: 7px;

}


.setting-group label {

  font-size: 12px;

  font-weight: 700;

  white-space: nowrap;

}


.box-role-select {

  width: 150px;

  height: 36px;

  padding:
    0 8px;

  border:
    1px solid #c8ced4;

  background: #fff;

  font-size: 13px;

}


.label-group {

  display: none;

  align-items: center;

  gap: 7px;

}


.label-group.show {

  display: flex;

}


.label-input {

  width: 180px;

  height: 36px;

  padding:
    0 8px;

  border:
    1px solid #c8ced4;

  background: #fff;

  font-size: 13px;

}


.parent-info {

  min-width: 220px;

  padding:
    7px 9px;

  background:
    #f5f6f7;

  border:
    1px solid #e0e4e7;

  color: #666;

  font-size: 11px;

}


.setting-actions {

  display: flex;

  gap: 7px;

}


.setting-actions button {

  min-height: 36px;

}


/* =====================================================
   ROLE GUIDEは表示しない
===================================================== */

.role-guide {

  display: none;

}


/* =====================================================
   MOBILE
===================================================== */

@media (
  max-width: 700px
) {

  .box-settings-panel {

    top: 56px;

  }


  .box-settings-body {

    align-items: stretch;

    flex-direction: column;

  }


  .setting-group,
  .label-group {

    width: 100%;

  }


  .box-role-select,
  .label-input {

    flex: 1;

    width: auto;

  }


  .parent-info {

    width: 100%;

  }


  .setting-actions {

    width: 100%;

  }


  .setting-actions button {

    flex: 1;

  }

}

</style>

</head>


<body>


<!-- =====================================================
     TOPBAR
===================================================== -->

<header class="topbar">

  <div class="system-name">
    テスト成績システム
  </div>


  <div class="topbar-space"></div>


  <span id="teacherName">
    -
  </span>


  <button
    id="logoutButton"
    class="logout-button"
    type="button"
  >
    ログアウト
  </button>

</header>


<!-- =====================================================
     BOX SETTINGS
     上部に表示
===================================================== -->

<aside
  id="panel"
  class="box-settings-panel"
  hidden
>


  <div class="box-settings-header">

    <h2
      class="box-settings-title"
    >
      枠設定
    </h2>


    <button
      id="closeButton"
      class="panel-close"
      type="button"
    >
      閉じる
    </button>

  </div>


  <div class="box-settings-body">


    <!-- 枠種類 -->

    <div class="setting-group">

      <label
        for="boxRole"
      >
        枠種類
      </label>


      <select
        id="boxRole"
        class="box-role-select"
      >

        <option value="major">
          大問
        </option>

        <option value="minor">
          小問
        </option>

        <option value="qr">
          QR
        </option>

        <option value="subtotal">
          小計
        </option>

        <option value="total">
          合計
        </option>

        <option value="name">
          氏名
        </option>

        <option value="student_no">
          生徒番号
        </option>

        <option value="instruction">
          説明
        </option>

        <option value="other">
          その他
        </option>

      </select>

    </div>


    <!-- 表示名
         大問・小問だけ表示 -->

    <div
      id="labelGroup"
      class="label-group"
    >

      <label
        for="label"
      >
        表示名
      </label>


      <input
        id="label"
        class="label-input"
        type="text"
        placeholder="大問1 / 問1"
      >

    </div>


    <!-- 親大問情報 -->

    <div
      id="parentInfo"
      class="parent-info"
    >
      枠を選択してください。
    </div>


    <!-- 操作 -->

    <div class="setting-actions">

      <button
        id="applyButton"
        type="button"
        class="btn btn-primary"
      >
        反映
      </button>


      <button
        id="deleteButton"
        type="button"
        class="btn"
      >
        選択枠を削除
      </button>

    </div>

  </div>

</aside>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="main">


  <header class="page-header">

    <h1>
      解答用紙・枠設定
    </h1>

    <p class="page-description">
      解答用紙を登録し、大問・小問・QR・小計・合計などの位置を設定します。
    </p>

  </header>


  <!-- ===================================================
       TOOLBAR
  ==================================================== -->

  <section class="toolbar">


    <input
      id="answerFile"
      type="file"
      accept=".pdf,.jpg,.jpeg,.png,.webp"
    >


    <button
      id="uploadButton"
      type="button"
      class="btn btn-primary"
    >
      解答用紙を登録
    </button>


    <button
      id="saveButton"
      type="button"
      class="btn btn-primary"
    >
      枠を保存
    </button>


    <button
      id="deleteButton"
      type="button"
      class="btn"
    >
      選択枠を削除
    </button>


    <button
      id="backButton"
      type="button"
      class="btn"
    >
      戻る
    </button>


    <div
      id="status"
      class="toolbar-status"
    >
      解答用紙を登録してください。
    </div>

  </section>


  <!-- ===================================================
       VIEWER
  ==================================================== -->

  <section
    id="viewer"
    class="viewer"
  >

    <div class="empty-view">

      <strong>
        解答用紙がありません
      </strong>

      PDFまたは画像の解答用紙を登録してください。

    </div>

  </section>


</main>


<!-- =====================================================
     SCRIPTS
===================================================== -->

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script
  src="/js/config.js"
></script>


<script
  src="/js/auth.js"
></script>


<script
  src="/js/teacher/test-pages.js"
></script>


<script>

/* =========================================================
   UI制御
========================================================= */

(function () {

  const roleSelect =
    document.getElementById(
      "boxRole"
    );


  const labelGroup =
    document.getElementById(
      "labelGroup"
    );


  const labelInput =
    document.getElementById(
      "label"
    );


  const parentInfo =
    document.getElementById(
      "parentInfo"
    );


  const deleteButton =
    document.getElementById(
      "deleteButton"
    );


  /*
    大問・小問だけ表示名を出す。
  */

  function updateRoleUI() {

    const role =
      roleSelect?.value ||
      "";


    const showLabel =
      role === "major" ||
      role === "minor";


    if (showLabel) {

      labelGroup?.classList.add(
        "show"
      );

    } else {

      labelGroup?.classList.remove(
        "show"
      );


      if (labelInput) {

        labelInput.value =
          "";

      }

    }


    if (
      role === "minor"
    ) {

      parentInfo.textContent =
        "大問枠の内側に置いた小問だけ、その大問へ自動登録されます。";

    } else if (
      role === "major"
    ) {

      parentInfo.textContent =
        "大問の範囲を設定します。";

    } else if (
      role === "qr"
    ) {

      parentInfo.textContent =
        "答案のQR読み取り範囲です。";

    } else if (
      role === "subtotal"
    ) {

      parentInfo.textContent =
        "小問の点数から小計を自動計算します。";

    } else if (
      role === "total"
    ) {

      parentInfo.textContent =
        "小計などから合計点を自動計算します。";

    } else {

      parentInfo.textContent =
        "";

    }

  }


  roleSelect?.addEventListener(
    "change",
    updateRoleUI
  );


  /*
    初期状態
  */

  updateRoleUI();


  /*
    非問題枠の削除ボタンも
    上部の共通削除ボタンを利用。
  */

  /*
    Escapeでパネルを閉じる
  */

  document.addEventListener(
    "keydown",
    event => {

      if (
        event.key ===
        "Escape"
      ) {

        document
          .getElementById(
            "closeButton"
          )
          ?.click();

      }

    }
  );


})();

</script>


</body>

</html>
