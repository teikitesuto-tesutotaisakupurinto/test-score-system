<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>採点対象生徒 - テスト成績システム</title><link rel="stylesheet" href="/css/common.css"><style>
.select-main{max-width:1100px;margin:0 auto;padding:24px}.select-card{background:#fff;border:1px solid #d0d6dc;border-radius:6px;padding:20px;margin-bottom:14px}.student-list{display:grid;gap:9px}.student-row{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid #d0d6dc;border-radius:5px;background:#fff}.student-info{flex:1;min-width:0}.student-name{font-weight:700}.student-meta{font-size:12px;color:#68727b;margin-top:4px}.student-status{font-size:12px;color:#68727b}.student-status.done{color:#16834b;font-weight:700}.empty{padding:24px;background:#fff;text-align:center;color:#68727b}@media(max-width:650px){.select-main{padding:12px}.student-row{align-items:stretch;flex-direction:column}}
</style></head><body>
<header class="topbar"><div class="system-name">テスト成績システム</div><div class="topbar-space"></div><span id="teacherName">-</span><button id="logoutButton" class="logout-button" type="button">ログアウト</button></header>
<main class="select-main"><div class="page-header"><h1>採点対象の生徒</h1></div><section class="select-card"><div id="testTitle">テスト情報を読み込んでいます...</div><p>生徒を選択すると、その生徒の答案を1人ずつ採点できます。</p><a class="btn" href="/teacher/marking">テスト選択へ戻る</a></section><section id="studentList" class="student-list"><div class="empty">読み込み中...</div></section><div id="status" class="status"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/js/config.js"></script><script src="/js/auth.js"></script><script>
"use strict";
(async()=>{
 const list=document.getElementById("studentList"),status=document.getElementById("status");
 const params=new URLSearchParams(location.search),testId=params.get("test");
 const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
 try{
  const auth=await requireRole("teacher");if(!auth)return;
  document.getElementById("teacherName").textContent=auth.profile?.name||"先生";
  document.getElementById("logoutButton").addEventListener("click",logout);
  if(!testId)throw new Error("テストIDが指定されていません。");
  const {data:test,error:te}=await supabaseClient.from("tests").select("id,name,subject,grade,class_name").eq("id",testId).maybeSingle();
  if(te)throw te;if(!test)throw new Error("テストが見つかりません。");
  document.getElementById("testTitle").textContent=[test.name,test.subject,test.grade,test.class_name].filter(Boolean).join(" / ");
  const {data:sheets,error:ae}=await supabaseClient.from("answer_sheets").select("id,student_id,status,created_at").eq("test_id",testId).not("student_id","is",null).in("status",["uploaded","marking","marked"]).order("created_at",{ascending:false});
  if(ae)throw ae;
  const latest=new Map();(sheets||[]).forEach(s=>{if(!latest.has(s.student_id))latest.set(s.student_id,s)});
  const ids=[...latest.keys()];if(!ids.length){list.innerHTML='<div class="empty">採点対象の答案がありません。</div>';return;}
  const {data:students,error:se}=await supabaseClient.from("students").select("id,student_no,name,grade,class_name").in("id",ids).order("student_no");
  if(se)throw se;
  const ordered=(students||[]).sort((a,b)=>String(a.student_no||"").localeCompare(String(b.student_no||""),"ja",{numeric:true}));
  list.innerHTML=ordered.map(s=>{const sheet=latest.get(s.id),done=sheet.status==="marked";return '<article class="student-row"><div class="student-info"><div class="student-name">'+esc(s.name)+'</div><div class="student-meta">'+esc([s.student_no,s.grade,s.class_name].filter(Boolean).join(" / "))+'</div></div><div class="student-status '+(done?"done":"")+'">'+(done?"採点済み":sheet.status==="marking"?"採点中":"未採点")+'</div><a class="btn btn-primary" href="/teacher/marking/mark?test='+encodeURIComponent(testId)+'&student='+encodeURIComponent(s.id)+'">この生徒を採点</a></article>'}).join("");
  status.textContent="答案が登録されている生徒："+ordered.length+"名";
 }catch(e){console.error(e);list.innerHTML='<div class="empty">'+esc(e.message||"読み込みに失敗しました。")+'</div>';}
})();
</script><script src="/js/common-sidebar.js?v=20261126"></script></body></html>
