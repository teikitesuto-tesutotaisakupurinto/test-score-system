
<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="robots"
    content="noindex,nofollow"
  >

  <title>ログイン - テスト成績システム</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }


    body {

      min-height: 100vh;

      background: #f3f5f7;

      color: #222;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        Meiryo,
        sans-serif;

    }


    .login-page {

      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 20px;

    }


    .login-card {

      width: 100%;

      max-width: 420px;

      background: #fff;

      border: 1px solid #d5dbe0;

      border-radius: 6px;

      padding: 32px;

      box-shadow:
        0 4px 18px rgba(0,0,0,.06);

    }


    h1 {

      margin: 0;

      text-align: center;

      font-size: 25px;

      line-height: 1.4;

    }


    .description {

      margin: 8px 0 28px;

      text-align: center;

      color: #666;

      font-size: 13px;

    }


    .field {

      margin-bottom: 18px;

    }


    .field label {

      display: block;

      margin-bottom: 7px;

      font-size: 13px;

      font-weight: 700;

    }


    .field input {

      display: block;

      width: 100%;

      height: 46px;

      padding: 0 12px;

      border: 1px solid #c8ced4;

      border-radius: 4px;

      background: #fff;

      color: #222;

      font-size: 15px;

      outline: none;

    }


    .field input:focus {

      border-color: #555;

    }


    #loginError {

      display: none;

      margin-bottom: 15px;

      padding: 11px 12px;

      border: 1px solid #e2b8b2;

      border-radius: 4px;

      background: #fff4f2;

      color: #b42318;

      font-size: 13px;

      line-height: 1.6;

    }


    #loginButton {

      width: 100%;

      height: 46px;

      border: 0;

      border-radius: 4px;

      background: #333;

      color: #fff;

      font-size: 15px;

      font-weight: 700;

      cursor: pointer;

    }


    #loginButton:disabled {

      opacity: .55;

      cursor: default;

    }


    .footer {

      margin-top: 22px;

      text-align: center;

      color: #888;

      font-size: 11px;

    }

  </style>

</head>


<body>


<div class="login-page">


  <main class="login-card">


    <h1>
      テスト成績システム
    </h1>


    <p class="description">
      ログインしてください
    </p>


    <!--
      GET送信を絶対にしない。
      JSでsubmitを捕捉する。
    -->

    <form
      id="loginForm"
      method="post"
      action="/login"
      autocomplete="on"
    >


      <div class="field">

        <label for="email">
          メールアドレス
        </label>

        <input
          id="email"
          name="email"
          type="email"
          autocomplete="username"
          autocapitalize="none"
          autocorrect="off"
          spellcheck="false"
          required
        >

      </div>


      <div class="field">

        <label for="password">
          パスワード
        </label>

        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        >

      </div>


      <div
        id="loginError"
        role="alert"
      ></div>


      <button
        id="loginButton"
        type="submit"
      >
        ログイン
      </button>


    </form>


    <div class="footer">
      テスト成績システム
    </div>


  </main>


</div>



<!-- Supabase -->

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<!-- 既存設定 -->

<script src="/js/config.js"></script>


<!-- 共通認証 -->

<script src="/js/auth.js"></script>


<script>

(function () {

  "use strict";


  const form =
    document.getElementById(
      "loginForm"
    );


  const email =
    document.getElementById(
      "email"
    );


  const password =
    document.getElementById(
      "password"
    );


  const button =
    document.getElementById(
      "loginButton"
    );


  const error =
    document.getElementById(
      "loginError"
    );


  function showError(
    message
  ) {

    error.textContent =
      message;

    error.style.display =
      "block";

  }


  function clearError() {

    error.textContent =
      "";

    error.style.display =
      "none";

  }


  function setLoading(
    value
  ) {

    button.disabled =
      value;

    button.textContent =
      value
        ? "ログイン中..."
        : "ログイン";

  }


  form.addEventListener(
    "submit",
    async function (event) {

      /*
        絶対に通常フォーム送信させない。

        これで

        /login?email=...
        /login?password=...

        にはならない。
      */

      event.preventDefault();

      event.stopPropagation();


      clearError();


      const emailValue =
        email.value.trim();


      const passwordValue =
        password.value;


      if (!emailValue) {

        showError(
          "メールアドレスを入力してください。"
        );

        email.focus();

        return;

      }


      if (!passwordValue) {

        showError(
          "パスワードを入力してください。"
        );

        password.focus();

        return;

      }


      /*
        Supabase Client確認
      */

      if (
        typeof supabaseClient ===
        "undefined"
      ) {

        showError(
          "Supabaseの設定を読み込めませんでした。"
        );

        console.error(
          "supabaseClient is undefined"
        );

        return;

      }


      setLoading(
        true
      );


      try {

        /*
          Supabase Auth
        */

        const {
          data,
          error: loginError
        } =
          await supabaseClient
            .auth
            .signInWithPassword({

              email:
                emailValue,

              password:
                passwordValue

            });


        if (loginError) {

          throw loginError;

        }


        if (
          !data?.session
        ) {

          throw new Error(
            "ログインセッションを取得できませんでした。"
          );

        }


        /*
          auth.jsのRole判定へ
        */

        if (
          typeof redirectAfterLogin !==
          "function"
        ) {

          throw new Error(
            "認証処理を読み込めませんでした。"
          );

        }


        await redirectAfterLogin();


      } catch (e) {

        console.error(
          "LOGIN ERROR:",
          e
        );


        const message =
          String(
            e?.message ||
            ""
          ).toLowerCase();


        if (
          message.includes(
            "invalid login credentials"
          )
        ) {

          showError(
            "メールアドレスまたはパスワードが正しくありません。"
          );

        } else if (
          message.includes(
            "email not confirmed"
          )
        ) {

          showError(
            "メールアドレスの確認が完了していません。"
          );

        } else {

          showError(
            e?.message ||
            "ログインできませんでした。"
          );

        }


        setLoading(
          false
        );

      }

    },
    true
  );

})();

</script>


</body>

</html>
