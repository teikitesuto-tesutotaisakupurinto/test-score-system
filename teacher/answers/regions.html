
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  答案クロップ処理 - テスト成績システム
</title>

<link
  rel="stylesheet"
  href="/css/common.css"
>


<style>

* {
  box-sizing:border-box;
}


body {
  margin:0;

  background:#eef2f5;
}


.regions-main {
  max-width:1400px;

  margin:0 auto;

  padding:20px;
}


.toolbar {
  display:flex;

  flex-wrap:wrap;

  align-items:center;

  gap:8px;

  margin-bottom:12px;
}


.toolbar select {
  min-width:330px;

  height:40px;

  padding:0 9px;

  border:
    1px solid #aeb7bf;

  border-radius:4px;

  background:#fff;
}


.status {
  min-height:40px;

  margin-bottom:12px;

  padding:10px 12px;

  background:#fff;

  border:
    1px solid #d0d6dc;

  font-size:13px;

  white-space:pre-wrap;
}


.status.error {
  color:#b42318;

  background:#fff8f7;

  border-color:#efc2bc;
}


.test-information {
  margin-bottom:12px;

  padding:14px;

  background:#fff;

  border:
    1px solid #d0d6dc;
}


.progress-box {
  display:none;

  margin-bottom:12px;

  padding:12px;

  background:#fff;

  border:
    1px solid #d0d6dc;
}


.progress-box.show {
  display:block;
}


.progress {
  width:100%;

  height:9px;

  margin-top:8px;

  accent-color:#1769aa;
}


.progress-text {
  font-size:12px;

  color:#555;
}


.summary {
  display:none;

  margin-bottom:12px;

  padding:14px;

  background:#fff;

  border:
    1px solid #d0d6dc;
}


.result-list {
  max-height:500px;

  overflow:auto;

  background:#fff;

  border:
    1px solid #d0d6dc;
}


.result-item {
  padding:8px 10px;

  border-bottom:
    1px solid #e1e5e8;

  font-size:12px;
}


.result-item.success {
  color:#16834b;
}


.result-item.error {
  color:#b42318;
}


.explain {
  margin-top:12px;

  color:#666;

  font-size:12px;
}


</style>

</head>


<body>


<header class="topbar">

  <div class="system-name">
    テスト成績システム
  </div>


  <div class="topbar-space"></div>


  <span id="teacherName">
    -
  </span>


  <button
    id="logoutButton"
    class="logout-button"
    type="button"
  >
    ログアウト
  </button>

</header>


<main class="regions-main">


<h1>
  答案クロップ処理
</h1>


<div class="toolbar">


<select
  id="testSelect"
>

<option value="">
  テストを選択してください
</option>

</select>


<button
  id="saveButton"
  class="btn btn-primary"
  type="button"
>
クロップ開始
</button>


<a
  href="/teacher/marking"
  class="btn"
>
採点へ
</a>


</div>


<div
  id="status"
  class="status"
>
テストを選択してください。
</div>


<div
  id="testInformation"
  class="test-information"
>
</div>


<div
  id="summary"
  class="summary"
>
</div>


<div
  id="cropProgressBox"
  class="progress-box"
>

<div
  id="cropCounter"
  class="progress-text"
>
0 / 0
</div>


<progress
  id="cropProgress"
  class="progress"
  value="0"
  max="1"
>
</progress>

</div>


<div
  id="resultList"
  class="result-list"
>
</div>


<div class="explain">

テストを選択すると、登録済みの答案を
設問枠ごとに自動で切り出します。
クロップ済み画像は採点画面で使用します。

</div>


</main>


<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script
  src="/js/config.js?v=20261116"
></script>


<script
  src="/js/auth.js?v=20261116"
></script>


<!--
  重要:
  旧 answers-regions.js は使用しない。
-->
<script
  src="/js/teacher/answer-regions.js?v=20261116"
></script>


</body>

</html>
