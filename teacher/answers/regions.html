<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    答案切り出し - テスト成績システム
  </title>

  <link
    rel="stylesheet"
    href="/css/common.css"
  >

</head>

<body>

<header class="topbar">

  <div class="system-name">
    テスト成績システム
  </div>

  <div class="topbar-space"></div>

  <span id="teacherName">
    -
  </span>

  <button
    id="logoutButton"
    class="logout-button"
    type="button"
  >
    ログアウト
  </button>

</header>


<div class="teacher-layout">

  <aside class="sidebar">

    <div class="sidebar-title">
      答案処理
    </div>

    <a
      href="/teacher/answers/upload"
      class="menu-link"
    >
      答案アップロード
    </a>

    <a
      href="/teacher/answers/processing"
      class="menu-link"
    >
      処理状況
    </a>

    <a
      href="/teacher/answers/regions"
      class="menu-link active"
    >
      答案切り出し
    </a>

    <a
      href="/teacher/answers/unmatched"
      class="menu-link"
    >
      未紐付け答案
    </a>

    <a
      href="/teacher/answers/matched"
      class="menu-link"
    >
      紐付け済み答案
    </a>

  </aside>


  <main class="main-content">

    <div class="page-header">

      <h1>
        答案切り出し
      </h1>

    </div>


    <!-- テスト選択 -->

    <div class="card">

      <div class="form-group">

        <label for="testSelect">
          テスト
        </label>

        <select
          id="testSelect"
        >

          <option value="">
            テストを選択してください
          </option>

        </select>

      </div>


      <div
        id="testInformation"
        style="
          margin-top:10px;
          line-height:1.8;
        "
      >
      </div>

    </div>


    <!-- 処理対象 -->

    <div
      id="summary"
      class="card"
      style="display:none;"
    >
    </div>


    <!-- 実行 -->

    <div class="card">

      <h3>
        答案画像の切り出し
      </h3>

      <p>
        登録済みの解答欄設定に従って、
        生徒答案から各解答欄を切り出します。
      </p>

      <p
        style="
          color:#666;
          font-size:13px;
        "
      >
        元答案はそのまま保持されます。
        切り出した画像は生徒答案用Storageへ保存されます。
      </p>


      <button
        id="executeButton"
        class="btn btn-primary"
        type="button"
        disabled
      >
        答案を問題別に切り出す
      </button>


      <div
        id="message"
        style="
          margin-top:14px;
          min-height:24px;
        "
      >
      </div>

    </div>


    <!-- 処理結果 -->

    <div class="card">

      <div
        style="
          display:flex;
          align-items:center;
          justify-content:space-between;
          margin-bottom:12px;
        "
      >

        <h3 style="margin:0;">
          処理結果
        </h3>

        <span
          id="resultCount"
          style="
            color:#666;
            font-size:13px;
          "
        >
          0件
        </span>

      </div>


      <div
        id="resultList"
      >
      </div>

    </div>

  </main>

</div>


<!-- ZIP -->

<script
  src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"
></script>


<!-- QR -->

<script
  src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"
></script>


<!-- Supabase -->

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script src="/js/config.js"></script>

<script src="/js/auth.js"></script>

<script src="/js/teacher/answer-regions.js"></script>

</body>

</html>
