
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
  成績・答案公開状態 - テスト成績システム
</title>

<link
  rel="stylesheet"
  href="/css/common.css"
>

<style>

.main {
  max-width: 900px;
  margin: 0 auto;
  padding: 25px;
}

.card {
  margin-bottom: 15px;
  padding: 20px;
  background: #fff;
  border: 1px solid #d5dbe0;
}

#testSelect {
  width: 100%;
  height: 44px;
  padding: 0 10px;
}

.status {
  margin-top: 15px;
  padding: 14px;
  border: 1px solid #d5dbe0;
  background: #f5f6f7;
  line-height: 1.8;
}

.status.processing {
  background: #fff8e8;
  border-color: #e6c979;
  color: #7a4b00;
}

.status.public {
  background: #edf8ef;
  border-color: #b7d9c0;
  color: #176b35;
}

.status.error {
  background: #fff4f2;
  border-color: #efc2bc;
  color: #b42318;
}

.status-title {
  font-weight: 700;
  font-size: 16px;
}

.info-grid {
  display: grid;
  grid-template-columns:
    repeat(
      2,
      minmax(0, 1fr)
    );
  gap: 10px;
  margin-top: 15px;
}

.info-item {
  padding: 12px;
  background: #f5f6f7;
  border: 1px solid #dfe3e6;
}

.info-label {
  color: #666;
  font-size: 12px;
}

.info-value {
  margin-top: 3px;
  font-weight: 700;
}

.notice {
  margin-top: 15px;
  color: #666;
  font-size: 13px;
  line-height: 1.8;
}

@media(max-width:650px) {

  .info-grid {
    grid-template-columns: 1fr;
  }

}

</style>

</head>


<body>


<header class="topbar">

<div class="system-name">
  テスト成績システム
</div>

<div class="topbar-space"></div>

<span id="teacherName">
  -
</span>

<button
id="logoutButton"
class="logout-button"
type="button"
>
ログアウト
</button>

</header>


<main class="main">


<section class="card">

<h1>
  成績・答案公開状態
</h1>

<p>
  成績処理が完了したテストは自動的に生徒へ公開されます。
</p>

</section>


<section class="card">


<label for="testSelect">
  テスト
</label>


<select
id="testSelect"
>

<option value="">
  テストを選択してください
</option>

</select>


<div
id="status"
class="status"
>
テストを選択してください。
</div>


<div
id="testInformation"
class="info-grid"
style="display:none;"
>

<div class="info-item">

<div class="info-label">
  テスト
</div>

<div
id="testName"
class="info-value"
>
-
</div>

</div>


<div class="info-item">

<div class="info-label">
  教科
</div>

<div
id="testSubject"
class="info-value"
>
-
</div>

</div>


<div class="info-item">

<div class="info-label">
  成績処理
</div>

<div
id="processingStatus"
class="info-value"
>
-
</div>

</div>


<div class="info-item">

<div class="info-label">
  公開状態
</div>

<div
id="publishedStatus"
class="info-value"
>
-
</div>

</div>


</div>


<div class="notice">

結果が確定するまでは、生徒側には点数・採点済み答案を表示しません。

<br>

全答案・全設問の採点と成績処理が完了すると、自動的に公開されます。

</div>


</section>


</main>


<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script
src="/js/config.js?v=20261116"
></script>

<script
src="/js/auth.js?v=20261116"
></script>

<script
src="/js/teacher/test-publish.js?v=20261116"
></script>

</body>

</html>
