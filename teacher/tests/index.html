
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>テスト管理 - テスト成績システム</title>

<link
  rel="stylesheet"
  href="/css/common.css"
>

<style>

.main {
  max-width:1200px;
  margin:0 auto;
  padding:25px;
}

.toolbar {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:15px;
}

.table-wrap {
  overflow:auto;
  background:#fff;
  border:1px solid #d5dbe0;
}

table {
  width:100%;
  border-collapse:collapse;
  min-width:900px;
}

th,
td {
  padding:10px;
  border-bottom:1px solid #e1e5e8;
  text-align:left;
}

th {
  background:#f3f5f7;
}

.actions {
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.empty {
  padding:40px;
  text-align:center;
  color:#777;
}

</style>
</head>


<body>

<header class="topbar">

  <div class="system-name">
    テスト成績システム
  </div>

  <div class="topbar-space"></div>

  <span id="teacherName">-</span>

  <button
    id="logoutButton"
    class="logout-button"
    type="button"
  >
    ログアウト
  </button>

</header>


<main class="main">

  <h1>
    テスト管理
  </h1>


  <div class="toolbar">

    <button
      id="newButton"
      class="btn btn-primary"
      type="button"
    >
      新しいテスト
    </button>

    <button
      id="refreshButton"
      class="btn"
      type="button"
    >
      更新
    </button>

  </div>


  <div class="table-wrap">

    <table>

      <thead>

        <tr>
          <th>テスト名</th>
          <th>教科</th>
          <th>学年</th>
          <th>公開</th>
          <th>操作</th>
        </tr>

      </thead>

      <tbody id="testBody">

        <tr>
          <td
            colspan="5"
            class="empty"
          >
            読み込み中...
          </td>
        </tr>

      </tbody>

    </table>

  </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<script src="/js/auth.js"></script>


<script>

(async function () {

  const profile =
    await requireTeacher();

  if (!profile) {
    return;
  }


  document.getElementById(
    "teacherName"
  ).textContent =
    profile.name || "先生";


  document.getElementById(
    "logoutButton"
  ).addEventListener(
    "click",
    logout
  );


  const body =
    document.getElementById(
      "testBody"
    );


  async function loadTests() {

    body.innerHTML = `

      <tr>
        <td colspan="5" class="empty">
          読み込み中...
        </td>
      </tr>

    `;


    const {
      data,
      error
    } =
      await supabaseClient
        .from("tests")
        .select(`
          id,
          name,
          subject,
          grade,
          results_published,
          created_at
        `)
        .order(
          "created_at",
          {
            ascending:false
          }
        );


    if (error) {

      body.innerHTML = `

        <tr>
          <td colspan="5" class="empty">
            ${escapeHtml(error.message)}
          </td>
        </tr>

      `;

      return;

    }


    if (!data?.length) {

      body.innerHTML = `

        <tr>
          <td colspan="5" class="empty">
            テストがありません。
          </td>
        </tr>

      `;

      return;

    }


    body.innerHTML =
      data.map(
        test => `

          <tr>

            <td>
              ${escapeHtml(test.name)}
            </td>

            <td>
              ${escapeHtml(test.subject || "-")}
            </td>

            <td>
              ${escapeHtml(test.grade || "-")}
            </td>

            <td>
              ${
                test.results_published
                  ? "公開中"
                  : "非公開"
              }
            </td>

            <td>

              <div class="actions">

                <button
                  type="button"
                  class="btn"
                  data-edit="${test.id}"
                >
                  編集
                </button>

                <button
                  type="button"
                  class="btn"
                  data-pages="${test.id}"
                >
                  解答用紙
                </button>

                <button
                  type="button"
                  class="btn"
                  data-publish="${test.id}"
                >
                  公開設定
                </button>

              </div>

            </td>

          </tr>

        `
      ).join("");


    body
      .querySelectorAll("[data-edit]")
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              location.href =
                `/teacher/tests/edit?id=${encodeURIComponent(
                  button.dataset.edit
                )}`;

            }
          );

        }
      );


    body
      .querySelectorAll("[data-pages]")
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              location.href =
                `/teacher/tests/pages?test=${encodeURIComponent(
                  button.dataset.pages
                )}`;

            }
          );

        }
      );


    body
      .querySelectorAll("[data-publish]")
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              location.href =
                `/teacher/tests/publish?test=${encodeURIComponent(
                  button.dataset.publish
                )}`;

            }
          );

        }
      );

  }


  document.getElementById(
    "newButton"
  ).addEventListener(
    "click",
    () => {

      location.href =
        "/teacher/tests/edit";

    }
  );


  document.getElementById(
    "refreshButton"
  ).addEventListener(
    "click",
    loadTests
  );


  function escapeHtml(value) {

    return String(value ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");

  }


  await loadTests();

})();

</script>

</body>
</html>
