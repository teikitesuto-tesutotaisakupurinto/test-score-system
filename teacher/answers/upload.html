<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    答案アップロード - テスト成績システム
  </title>

  <link
    rel="stylesheet"
    href="/css/common.css"
  >

</head>

<body>

<header class="topbar">

  <div class="system-name">
    テスト成績システム
  </div>

  <div class="topbar-space"></div>

  <span id="teacherName">
    -
  </span>

  <button
    id="logoutButton"
    class="logout-button"
  >
    ログアウト
  </button>

</header>


<div class="teacher-layout">

  <aside class="sidebar">

    <div class="sidebar-title">
      答案
    </div>

    <a
      href="/teacher/answers/upload"
      class="menu-link active"
    >
      答案アップロード
    </a>

    <a
      href="/teacher/answers/processing"
      class="menu-link"
    >
      処理状況
    </a>

    <a
      href="/teacher/answers/regions"
      class="menu-link"
    >
      答案切り出し
    </a>

    <a
      href="/teacher/answers/unmatched"
      class="menu-link"
    >
      未紐付け答案
    </a>

    <a
      href="/teacher/answers/matched"
      class="menu-link"
    >
      紐付け済み答案
    </a>

  </aside>


  <main class="main-content">

    <div class="page-header">

      <h1>
        答案アップロード
      </h1>

    </div>


    <div class="card">

      <div class="form-group">

        <label>
          テスト
        </label>

        <select id="testSelect">

          <option value="">
            読み込み中...
          </option>

        </select>

      </div>


      <div class="form-group">

        <label>
          答案ファイル
        </label>

        <input
          id="answerFiles"
          type="file"
          multiple
          accept="
            .jpg,
            .jpeg,
            .png,
            .webp,
            .gif,
            .bmp,
            .pdf,
            .zip,
            image/jpeg,
            image/png,
            image/webp,
            image/gif,
            image/bmp,
            application/pdf,
            application/zip
          "
        >

      </div>


      <div
        style="
          background:#f3f5f7;
          border:1px solid #d0d6dc;
          padding:14px;
          margin-bottom:16px;
        "
      >

        <strong>
          対応形式
        </strong>

        <p>
          JPG / JPEG / PNG / WEBP / GIF / BMP / PDF / ZIP
        </p>

        <p>
          ZIPには複数の画像・PDFをまとめて入れられます。
        </p>

        <p>
          複数ページ答案にも対応します。
        </p>

      </div>


      <button
        id="uploadButton"
        class="btn btn-primary"
      >
        アップロード開始
      </button>


      <div
        id="message"
        style="
          margin-top:14px;
          min-height:22px;
        "
      ></div>

    </div>


    <div class="card">

      <h3>
        処理状況
      </h3>

      <div id="uploadList"></div>

    </div>

  </main>

</div>


<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script
  src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"
></script>

<script
  src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"
></script>

<script src="/js/config.js"></script>

<script src="/js/auth.js"></script>

<script src="/js/teacher/answer-upload.js"></script>

</body>

</html>
