}

.upload-card {

.form-row {

.form-row label {

  background: #fafbfc;

  cursor: pointer;

  transition:
    border-color .15s,

}

.drop-zone.dragover {
  border-color: #2468a8;

  background: #f1f6fa;
}

.drop-zone strong {

}

}

}

  white-space: nowrap;
}

.file-size {

}

.actions {

  gap: 8px;

}

.progress-wrap {
  margin-top: 18px;
}

.progress {
  height: 8px;

  overflow: hidden;

  background: #e5e7eb;
}

.progress-bar {
  width: 0;

  height: 100%;

  background: #2468a8;

  transition: width .2s;
}

.progress-text {
  margin-top: 6px;

  font-size: 12px;

  color: #666;
}

.result {
  margin-top: 15px;

  padding: 12px;

  border: 1px solid #dfe3e6;

  background: #f5f6f7;

  font-size: 13px;

  line-height: 1.7;

  white-space: pre-line;
}

.result.error {
  color: #a22;
}

.result.success {

}

.processing-list {
  margin-top: 15px;
}

.processing-item {
  padding: 9px 10px;

  margin-bottom: 5px;

  background: #f7f8f9;

  border: 1px solid #e3e6e8;

}

.processing-item.matched {
  border-left: 4px solid #267a42;
}

.processing-item.unmatched {
  border-left: 4px solid #b66a00;
}

.small {
  color: #666;

  font-size: 12px;

  line-height: 1.7;
}

</style>

  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

  src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"
></script>

  src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"
></script>

  src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"

<script>

"use strict";


/* =========================================================
   SUPABASE
========================================================= */

const client =
  window.SB ||
  window.supabaseClient;


if (!client) {

  throw new Error(
    "Supabaseクライアントが初期化されていません。"
  );

}


/* =========================================================
   STATE
========================================================= */

let selectedFiles = [];

let currentStudents = [];

let currentLayout = null;


/* =========================================================
   DOM
========================================================= */

const testSelect =
  document.getElementById(
    "test"
  );


const answerType =
  document.getElementById(
    "answerType"
  );


const filesInput =
  document.getElementById(
    "files"
  );


const dropZone =
  document.getElementById(
    "dropZone"
  );


const fileList =
  document.getElementById(
    "fileList"
  );


const uploadButton =
  document.getElementById(
    "upload"
  );


const clearButton =
  document.getElementById(
    "clear"
  );


const progressBar =
  document.getElementById(
    "progressBar"
  );


const progressText =
  document.getElementById(
    "progressText"
  );


const resultBox =
  document.getElementById(
    "result"
  );


const processingList =
  document.getElementById(
    "processingList"
  );


const teacherName =
  document.getElementById(
    "teacherName"
  );


/* =========================================================
   INIT
========================================================= */

async function init() {

  try {

    const profile =
      await requireTeacher();


    if (!profile) {
      return;
    }


    if (teacherName) {

      teacherName.textContent =
        profile.name ||
        "先生";

    }


    setupEvents();


    await loadTests();


  } catch (error) {

    console.error(
      "INIT ERROR",
      error
    );


    showResult(
      error.message ||
      "初期化に失敗しました。",
      true
    );

  }

}


/* =========================================================
   EVENTS
========================================================= */

function setupEvents() {

  dropZone.addEventListener(
    "click",
    () => {

      filesInput.click();

    }
  );


  filesInput.addEventListener(
    "change",
    () => {

      addFiles(
        filesInput.files
      );

      filesInput.value =
        "";

    }
  );


  dropZone.addEventListener(
    "dragover",
    event => {

      event.preventDefault();

      dropZone.classList.add(
        "dragover"
      );

    }
  );


  dropZone.addEventListener(
    "dragleave",
    () => {

      dropZone.classList.remove(
        "dragover"
      );

    }
  );


  dropZone.addEventListener(
    "drop",
    event => {

      event.preventDefault();

      dropZone.classList.remove(
        "dragover"
      );


      addFiles(
        event.dataTransfer.files
      );

    }
  );


  uploadButton.addEventListener(
    "click",
    processUploads
  );


  clearButton.addEventListener(
    "click",
    clearFiles
  );


  document
    .getElementById(
      "logoutButton"
    )
    ?.addEventListener(
      "click",
      async () => {

        if (
          typeof logout ===
          "function"
        ) {

          await logout();

        }

      }
    );

}


/* =========================================================
   TESTS
========================================================= */

async function loadTests() {

  const {
    data,
    error
  } =
    await client
      .from(
        "tests"
      )
      .select(`
        id,
        name,
        subject,
        grade,
        created_at
      `)
      .order(
        "created_at",
        {
          ascending:
            false
        }
      );


  if (error) {
    throw error;
  }


  testSelect.innerHTML = `

    <option value="">
      テストを選択してください
    </option>

  `;


  for (
    const test
    of data || []
  ) {

    const option =
      document.createElement(
        "option"
      );


    option.value =
      test.id;


    option.textContent =
      [
        test.name,
        test.subject
      ]
        .filter(Boolean)
        .join(
          " / "
        );


    testSelect.appendChild(
      option
    );

  }

}


/* =========================================================
   FILES
========================================================= */

function addFiles(
  list
) {

  const allowed = [
    "pdf",
    "jpg",
    "jpeg",
    "png",
    "webp",
    "zip"
  ];


  for (
    const file
    of Array.from(
      list || []
    )
  ) {

    const extension =
      getExtension(
        file.name
      );


    if (
      !allowed.includes(
        extension
      )
    ) {

      showResult(
        `${file.name} は対応していない形式です。`,
        true
      );

      continue;

    }


    const duplicate =
      selectedFiles.some(
        existing =>
          existing.name ===
            file.name &&
          existing.size ===
            file.size &&
          existing.lastModified ===
            file.lastModified
      );


    if (!duplicate) {

      selectedFiles.push(
        file
      );

    }

  }


  renderFileList();

}


function renderFileList() {

  fileList.innerHTML =
    "";


  selectedFiles.forEach(
    (
      file,
      index
    ) => {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "file-item";


      const info =
        document.createElement(
          "div"
        );


      info.style.minWidth =
        "0";


      const name =
        document.createElement(
          "div"
        );


      name.className =
        "file-name";


      name.textContent =
        file.name;


      const size =
        document.createElement(
          "div"
        );


      size.className =
        "file-size";


      size.textContent =
        formatBytes(
          file.size
        );


      info.appendChild(
        name
      );


      info.appendChild(
        size
      );


      const remove =
        document.createElement(
          "button"
        );


      remove.type =
        "button";


      remove.className =
        "remove-file";


      remove.textContent =
        "削除";


      remove.addEventListener(
        "click",
        () => {

          selectedFiles.splice(
            index,
            1
          );


          renderFileList();

        }
      );


      row.appendChild(
        info
      );


      row.appendChild(
        remove
      );


      fileList.appendChild(
        row
      );

    }
  );

}


/* =========================================================
   MAIN
========================================================= */

async function processUploads() {

  const testId =
    testSelect.value;


  if (!testId) {

    showResult(
      "テストを選択してください。",
      true
    );

    return;

  }


  if (!selectedFiles.length) {

    showResult(
      "ファイルを選択してください。",
      true
    );

    return;

  }


  try {

    uploadButton.disabled =
      true;


    clearButton.disabled =
      true;


    processingList.innerHTML =
      "";


    setProgress(
      0,
      "レイアウトを読み込んでいます..."
    );


    /*
      生徒答案なら
      枠設定と生徒一覧を先に取得。
    */

    if (
      answerType.value ===
      "student"
    ) {

      currentLayout =
        await loadLayout(
          testId
        );


      currentStudents =
        await loadStudents();

    }


    if (
      answerType.value ===
      "model"
    ) {

      await processModelAnswers(
        testId
      );

    } else {

      await processStudentAnswers(
        testId
      );

    }


    setProgress(
      100,
      "処理完了"
    );


    showResult(
      "答案の処理が完了しました。",
      false
    );


    selectedFiles =
      [];


    renderFileList();


  } catch (error) {

    console.error(
      "ANSWER PROCESS ERROR",
      error
    );


    showResult(
      error.message ||
      "答案処理に失敗しました。",
      true
    );


  } finally {

    uploadButton.disabled =
      false;


    clearButton.disabled =
      false;

  }

}


/* =========================================================
   LOAD LAYOUT
========================================================= */

async function loadLayout(
  testId
) {

  const {
    data:
      pages,
    error:
      pageError
  } =
    await client
      .from(
        "test_pages"
      )
      .select(`
        id,
        test_id,
        page_no,
        image_path,
        width_px,
        height_px,
        original_name
      `)
      .eq(
        "test_id",
        testId
      )
      .order(
        "page_no",
        {
          ascending:
            true
        }
      );


  if (pageError) {
    throw pageError;
  }


  const {
    data:
      boxes,
    error:
      boxError
  } =
    await client
      .from(
        "layout_boxes"
      )
      .select(`
        id,
        test_id,
        page_no,
        box_type,
        label,
        x,
        y,
        width,
        height,
        points,
        question_id,
        parent_box_id,
        major_no,
        minor_no,
        box_role,
        sort_order,
        subtotal_group
      `)
      .eq(
        "test_id",
        testId
      )
      .order(
        "page_no",
        {
          ascending:
            true
        }
      )
      .order(
        "sort_order",
        {
          ascending:
            true
        }
      );


  if (boxError) {
    throw boxError;
  }


  return {

    pages:
      pages || [],

    boxes:
      boxes || []

  };

}


/* =========================================================
   LOAD STUDENTS
========================================================= */

async function loadStudents() {

  const {
    data,
    error
  } =
    await client
      .from(
        "students"
      )
      .select(`
        id,
        student_no,
        name,
        active
      `)
      .eq(
        "active",
        true
      );


  if (error) {
    throw error;
  }


  return data || [];

}


/* =========================================================
   STUDENT ANSWERS
========================================================= */

async function processStudentAnswers(
  testId
) {

  let completed =
    0;


  for (
    const file
    of selectedFiles
  ) {

    setProgress(
      Math.round(
        completed /
        selectedFiles.length *
        100
      ),
      `${file.name} を処理しています...`
    );


    const pages =
      await expandFile(
        file
      );


    if (!pages.length) {

      addProcessing(
        file.name,
        "ページを取得できませんでした。",
        false
      );

      continue;

    }


    /*
      ===================================================
      QR読取
      ===================================================
    */

    let qrValue =
      null;


    let qrPageNo =
      null;


    for (
      let index = 0;
      index < pages.length;
      index++
    ) {

      const page =
        pages[index];


      const pageNo =
        index + 1;


      const pageLayout =
        getPageLayout(
          currentLayout,
          pageNo
        );


      qrValue =
        await readQrFromPage(
          page,
          pageLayout
        );


      if (qrValue) {

        qrPageNo =
          pageNo;

        break;

      }

    }


    /*
      ===================================================
      生徒特定
      ===================================================
    */

    const student =
      qrValue
        ? findStudentFromQr(
            qrValue,
            currentStudents
          )
        : null;


    /*
      ===================================================
      answer_sheets
      ===================================================
    */

    const answerId =
      crypto.randomUUID();


    const firstPath =
      buildAnswerPath(
        testId,
        answerId,
        1
      );


    /*
      先に1ページ目をStorage
    */

    await uploadAnswerPage(
      firstPath,
      pages[0]
    );


    const {
      error:
        sheetError
    } =
      await client
        .from(
          "answer_sheets"
        )
        .insert({

          id:
            answerId,

          test_id:
            testId,

          student_id:
            student?.id ||
            null,

          qr_token:
            qrValue ||
            null,

          file_path:
            firstPath,

          status:
            student
              ? "matched"
              : "unmatched"

        });


    if (sheetError) {
      throw sheetError;
    }


    /*
      ===================================================
      全ページ
      ===================================================
    */

    for (
      let index = 0;
      index < pages.length;
      index++
    ) {

      const page =
        pages[index];


      const pageNo =
        index + 1;


      const path =
        buildAnswerPath(
          testId,
          answerId,
          pageNo
        );


      /*
        1ページ目は既に保存済み
      */

      if (
        pageNo !== 1
      ) {

        await uploadAnswerPage(
          path,
          page
        );

      }


      /*
        answer_sheet_pages
      */

      const {
        error:
          pageError
      } =
        await client
          .from(
            "answer_sheet_pages"
          )
          .insert({

            answer_sheet_id:
              answerId,

            page_no:
              pageNo,

            file_path:
              path,

            width_px:
              page.width,

            height_px:
              page.height

          });


      if (pageError) {
        throw pageError;
      }


      /*
        answer_regions

        question_idが実際に設定されている
        小問だけ作成する。
      */

      await createAnswerRegions(
        answerId,
        pageNo,
        getPageLayout(
          currentLayout,
          pageNo
        )
      );

    }


    /*
      結果表示
    */

    if (student) {

      addProcessing(
        file.name,
        `生徒紐付け: ${student.student_no} ${student.name} / QR: ${qrValue}`,
        true
      );

    } else {

      addProcessing(
        file.name,
        qrValue
          ? `QRは読み取れましたが、生徒を特定できませんでした: ${qrValue}`
          : "QRコードを読み取れませんでした。未紐付けに登録しました。",
        false
      );

    }


    completed++;


    setProgress(
      Math.round(
        completed /
        selectedFiles.length *
        100
      ),
      `${completed}/${selectedFiles.length} 件処理完了`
    );

  }

}


/* =========================================================
   ANSWER REGIONS
========================================================= */

async function createAnswerRegions(
  answerSheetId,
  pageNo,
  pageLayout
) {

  if (!pageLayout) {
    return;
  }


  const rows =
    pageLayout.boxes
      .filter(
        box =>
          box.box_role ===
            "minor" &&
          box.question_id
      )
      .map(
        box => ({

          answer_sheet_id:
            answerSheetId,

          question_id:
            box.question_id,

          page_no:
            pageNo,

          x:
            Number(
              box.x
            ),

          y:
            Number(
              box.y
            ),

          width:
            Number(
              box.width
            ),

          height:
            Number(
              box.height
            )

        })
      );


  if (!rows.length) {
    return;
  }


  const {
    error
  } =
    await client
      .from(
        "answer_regions"
      )
      .insert(
        rows
      );


  if (error) {
    throw error;
  }

}


/* =========================================================
   MODEL ANSWER
========================================================= */

async function processModelAnswers(
  testId
) {

  let completed =
    0;


  for (
    const file
    of selectedFiles
  ) {

    const pages =
      await expandFile(
        file
      );


    let pageNo =
      1;


    for (
      const page
      of pages
    ) {

      const path =
        [
          testId,
          "model-answer",
          `page-${String(
            pageNo
          ).padStart(
            3,
            "0"
          )}.png`
        ].join("/");


      const blob =
        await canvasToBlob(
          page.canvas
        );


      const {
        error
      } =
        await client
          .storage
          .from(
            "model-answers"
          )
          .upload(
            path,
            blob,
            {
              contentType:
                "image/png",

              upsert:
                true
            }
          );


      if (error) {
        throw error;
      }


      pageNo++;

    }


    completed++;


    setProgress(
      Math.round(
        completed /
        selectedFiles.length *
        100
      ),
      `${completed}/${selectedFiles.length} 件処理完了`
    );

  }

}


/* =========================================================
   QR
========================================================= */

async function readQrFromPage(
  page,
  pageLayout
) {

  /*
    1. 設定済みQR枠
  */

  const qrBoxes =
    (
      pageLayout?.boxes ||
      []
    ).filter(
      box =>
        box.box_role ===
          "qr" ||
        box.box_type ===
          "qr"
    );


  for (
    const box
    of qrBoxes
  ) {

    const cropped =
      cropCanvas(
        page.canvas,
        box
      );


    const result =
      decodeQr(
        cropped
      );


    if (
      result?.data
    ) {

      return normalizeQr(
        result.data
      );

    }

  }


  /*
    2. QR枠がない場合
       ページ全体
  */

  const fullPage =
    decodeQr(
      page.canvas
    );


  if (
    fullPage?.data
  ) {

    return normalizeQr(
      fullPage.data
    );

  }


  return null;

}


/* =========================================================
   QR DECODE
========================================================= */

function decodeQr(
  canvas
) {

  if (
    typeof jsQR !==
    "function"
  ) {

    return null;

  }


  const context =
    canvas.getContext(
      "2d",
      {
        willReadFrequently:
          true
      }
    );


  const image =
    context.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );


  return jsQR(
    image.data,
    image.width,
    image.height,
    {
      inversionAttempts:
        "attemptBoth"
    }
  );

}


/* =========================================================
   QR NORMALIZE
========================================================= */

function normalizeQr(
  value
) {

  let text =
    String(
      value ||
      ""
    ).trim();


  /*
    JSON QR
  */

  try {

    const parsed =
      JSON.parse(
        text
      );


    if (
      parsed.student_no
    ) {

      return String(
        parsed.student_no
      ).trim();

    }


    if (
      parsed.studentNo
    ) {

      return String(
        parsed.studentNo
      ).trim();

    }


    if (
      parsed.student_id
    ) {

      return String(
        parsed.student_id
      ).trim();

    }


    if (
      parsed.studentId
    ) {

      return String(
        parsed.studentId
      ).trim();

    }

  } catch (_) {}


  /*
    URL形式
  */

  try {

    const url =
      new URL(
        text
      );


    const keys = [
      "student_no",
      "studentNo",
      "student_id",
      "studentId",
      "student"
    ];


    for (
      const key
      of keys
    ) {

      const value =
        url.searchParams.get(
          key
        );


      if (value) {

        return value.trim();

      }

    }

  } catch (_) {}


  return text;

}


/* =========================================================
   STUDENT MATCH
========================================================= */

function findStudentFromQr(
  qrValue,
  students
) {

  const normalized =
    normalizeStudentValue(
      qrValue
    );


  /*
    まず生徒番号完全一致
  */

  let student =
    students.find(
      item =>
        normalizeStudentValue(
          item.student_no
        ) ===
        normalized
    );


  if (student) {
    return student;
  }


  /*
    QRが数字だけなら
    先頭ゼロを除いて再比較
  */

  if (
    /^\d+$/.test(
      normalized
    )
  ) {

    const withoutZero =
      normalized.replace(
        /^0+/,
        ""
      );


    student =
      students.find(
        item =>
          normalizeStudentValue(
            item.student_no
          ).replace(
            /^0+/,
            ""
          ) ===
          withoutZero
      );


    if (student) {
      return student;
    }

  }


  /*
    QRがUUIDならstudent.id
  */

  student =
    students.find(
      item =>
        String(
          item.id
        ).toLowerCase() ===
        String(
          qrValue
        ).trim().toLowerCase()
    );


  return student || null;

}


function normalizeStudentValue(
  value
) {

  return String(
    value ||
    ""
  )
    .trim()
    .replace(
      /[\s\-]/g,
      ""
    )
    .toLowerCase();

}


/* =========================================================
   PAGE LAYOUT
========================================================= */

function getPageLayout(
  layout,
  pageNo
) {

  if (!layout) {
    return null;
  }


  return {

    page:
      (
        layout.pages ||
        []
      ).find(
        page =>
          Number(
            page.page_no
          ) ===
          Number(
            pageNo
          )
      ) || null,

    boxes:
      (
        layout.boxes ||
        []
      ).filter(
        box =>
          Number(
            box.page_no
          ) ===
          Number(
            pageNo
          )
      )

  };

}


/* =========================================================
   FILE EXPANSION
========================================================= */

async function expandFile(
  file
) {

  const extension =
    getExtension(
      file.name
    );


  if (
    extension ===
    "zip"
  ) {

    return expandZip(
      file
    );

  }


  if (
    extension ===
    "pdf"
  ) {

    return pdfToPages(
      file
    );

  }


  return [
    await imageToPage(
      file
    )
  ];

}


/* =========================================================
   ZIP
========================================================= */

async function expandZip(
  file
) {

  const zip =
    await JSZip.loadAsync(
      file
    );


  const entries =
    Object.values(
      zip.files
    )
      .filter(
        entry =>
          !entry.dir
      )
      .sort(
        (
          a,
          b
        ) =>
          a.name.localeCompare(
            b.name,
            undefined,
            {
              numeric:
                true
            }
          )
      );


  const pages =
    [];


  for (
    const entry
    of entries
  ) {

    const extension =
      getExtension(
        entry.name
      );


    if (
      extension ===
      "pdf"
    ) {

      const blob =
        await entry.async(
          "blob"
        );


      const pdfFile =
        new File(
          [blob],
          entry.name,
          {
            type:
              "application/pdf"
          }
        );


      const pdfPages =
        await pdfToPages(
          pdfFile
        );


      pages.push(
        ...pdfPages
      );


      continue;

    }


    if (
      [
        "jpg",
        "jpeg",
        "png",
        "webp"
      ].includes(
        extension
      )
    ) {

      const blob =
        await entry.async(
          "blob"
        );


      const imageFile =
        new File(
          [blob],
          entry.name,
          {
            type:
              extension ===
              "jpg"
                ? "image/jpeg"
                : `image/${extension}`
          }
        );


      pages.push(
        await imageToPage(
          imageFile
        )
      );

    }

  }


  return pages;

}


/* =========================================================
   PDF
========================================================= */

async function pdfToPages(
  file
) {

  const buffer =
    await file.arrayBuffer();


  const pdf =
    await pdfjsLib
      .getDocument({
        data:
          buffer
      })
      .promise;


  const result =
    [];


  for (
    let pageNo = 1;
    pageNo <=
    pdf.numPages;
    pageNo++
  ) {

    const pdfPage =
      await pdf.getPage(
        pageNo
      );


    const base =
      pdfPage.getViewport({
        scale: 1
      });


    const scale =
      Math.min(
        3,
        Math.max(
          1,
          3000 /
          Math.max(
            base.width,
            base.height
          )
        )
      );


    const viewport =
      pdfPage.getViewport({
        scale
      });


    const canvas =
      document.createElement(
        "canvas"
      );


    canvas.width =
      Math.ceil(
        viewport.width
      );


    canvas.height =
      Math.ceil(
        viewport.height
      );


    await pdfPage
      .render({

        canvasContext:
          canvas.getContext(
            "2d"
          ),

        viewport

      })
      .promise;


    result.push({

      canvas,

      width:
        canvas.width,

      height:
        canvas.height

    });

  }


  return result;

}


/* =========================================================
   IMAGE
========================================================= */

async function imageToPage(
  file
) {

  const url =
    URL.createObjectURL(
      file
    );


  try {

    const image =
      await loadImage(
        url
      );


    const canvas =
      document.createElement(
        "canvas"
      );


    canvas.width =
      image.naturalWidth;


    canvas.height =
      image.naturalHeight;


    canvas
      .getContext(
        "2d"
      )
      .drawImage(
        image,
        0,
        0
      );


    return {

      canvas,

      width:
        canvas.width,

      height:
        canvas.height

    };

  } finally {

    URL.revokeObjectURL(
      url
    );

  }

}


/* =========================================================
   STORAGE
========================================================= */

async function uploadAnswerPage(
  path,
  page
) {

  const blob =
    await canvasToBlob(
      page.canvas
    );


  const {
    error
  } =
    await client
      .storage
      .from(
        "answers"
      )
      .upload(
        path,
        blob,
        {
          contentType:
            "image/png",

          cacheControl:
            "3600",

          upsert:
            true
        }
      );


  if (error) {
    throw error;
  }

}


/* =========================================================
   ANSWER PATH
========================================================= */

function buildAnswerPath(
  testId,
  answerId,
  pageNo
) {

  return [
    testId,
    answerId,
    `page-${String(
      pageNo
    ).padStart(
      3,
      "0"
    )}.png`
  ].join("/");

}


/* =========================================================
   CROP
========================================================= */

function cropCanvas(
  source,
  box
) {

  const x =
    Math.max(
      0,
      Math.round(
        Number(
          box.x
        )
      )
    );


  const y =
    Math.max(
      0,
      Math.round(
        Number(
          box.y
        )
      )
    );


  const width =
    Math.max(
      1,
      Math.round(
        Number(
          box.width
        )
      )
    );


  const height =
    Math.max(
      1,
      Math.round(
        Number(
          box.height
        )
      )
    );


  const safeWidth =
    Math.max(
      1,
      Math.min(
        width,
        source.width -
        x
      )
    );


  const safeHeight =
    Math.max(
      1,
      Math.min(
        height,
        source.height -
        y
      )
    );


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    safeWidth;


  canvas.height =
    safeHeight;


  canvas
    .getContext(
      "2d"
    )
    .drawImage(
      source,

      x,
      y,
      safeWidth,
      safeHeight,

      0,
      0,
      safeWidth,
      safeHeight
    );


  return canvas;

}


/* =========================================================
   BLOB
========================================================= */

function canvasToBlob(
  canvas
) {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      canvas.toBlob(
        blob => {

          if (!blob) {

            reject(
              new Error(
                "画像変換に失敗しました。"
              )
            );

            return;

          }


          resolve(
            blob
          );

        },
        "image/png",
        .95
      );

    }
  );

}


/* =========================================================
   IMAGE
========================================================= */

function loadImage(
  src
) {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const image =
        new Image();


      image.onload =
        () =>
          resolve(
            image
          );


      image.onerror =
        () =>
          reject(
            new Error(
              "画像の読み込みに失敗しました。"
            )
          );


      image.src =
        src;

    }
  );

}


/* =========================================================
   UI
========================================================= */

function setProgress(
  value,
  text
) {

  const safe =
    Math.max(
      0,
      Math.min(
        100,
        value
      )
    );


  progressBar.style.width =
    `${safe}%`;


  if (text) {

    progressText.textContent =
      text;

  }

}


function showResult(
  message,
  isError
) {

  resultBox.hidden =
    !message;


  resultBox.textContent =
    message || "";


  resultBox.className =
    isError
      ? "result error"
      : "result success";

}


function addProcessing(
  fileName,
  message,
  matched
) {

  const item =
    document.createElement(
      "div"
    );


  item.className =
    matched
      ? "processing-item matched"
      : "processing-item unmatched";


  item.textContent =
    `${fileName}: ${message}`;


  processingList.appendChild(
    item
  );

}


function getExtension(
  name
) {

  const parts =
    String(
      name || ""
    )
      .toLowerCase()
      .split(".");


  return parts.length > 1
    ? parts.pop()
    : "";

}


function formatBytes(
  bytes
) {

  if (
    bytes < 1024
  ) {

    return `${bytes} B`;

  }


  if (
    bytes <
    1024 * 1024
  ) {

    return `${(
      bytes /
      1024
    ).toFixed(1)} KB`;

  }


  return `${(
    bytes /
    1024 /
    1024
  ).toFixed(1)} MB`;

}


function clearFiles() {

  selectedFiles =
    [];


  renderFileList();


  processingList.innerHTML =
    "";


  setProgress(
    0,
    "待機中"
  );


  showResult(
    "",
    false
  );

}


/* =========================================================
   START
========================================================= */

init();
