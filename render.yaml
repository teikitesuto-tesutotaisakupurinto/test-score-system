
services:

  - type: web
    name: test-score-system
    env: static

    staticPublishPath: .

    routes:

      # =====================================================
      # Login
      # =====================================================

      - type: rewrite
        source: /login
        destination: /login.html


      # =====================================================
      # Teacher
      # =====================================================

      - type: rewrite
        source: /teacher
        destination: /teacher/index.html


      # =====================================================
      # Teacher / Tests
      # =====================================================

      - type: rewrite
        source: /teacher/tests
        destination: /teacher/tests/index.html


      - type: rewrite
        source: /teacher/tests/edit
        destination: /teacher/tests/edit.html


      - type: rewrite
        source: /teacher/tests/pages
        destination: /teacher/tests/pages.html


      - type: rewrite
        source: /teacher/tests/publish
        destination: /teacher/tests/publish.html


      # =====================================================
      # Teacher / Answers
      # =====================================================

      - type: rewrite
        source: /teacher/answers/upload
        destination: /teacher/answers/upload.html


      - type: rewrite
        source: /teacher/answers/matched
        destination: /teacher/answers/matched.html


      - type: rewrite
        source: /teacher/answers/regions
        destination: /teacher/answers/regions.html


      # =====================================================
      # Teacher / Marking
      # =====================================================

      - type: rewrite
        source: /teacher/marking
        destination: /teacher/marking/index.html


      - type: rewrite
        source: /teacher/marking/mark
        destination: /teacher/marking/mark.html


      # =====================================================
      # Teacher / Results
      # =====================================================

      - type: rewrite
        source: /teacher/results/summary
        destination: /teacher/results/summary.html


      # =====================================================
      # Student
      # =====================================================

      - type: rewrite
        source: /student/tests
        destination: /student/tests/index.html


      - type: rewrite
        source: /student/answer
        destination: /student/answer.html
