<script>

"use strict";


/* =========================================================
   STATE
========================================================= */

let tests = [];

let layoutPages = [];

let layoutBoxes = [];

let students = [];


/* =========================================================
   INIT
========================================================= */

requireRole(
  "teacher"
).then(
  load
);


/* =========================================================
   LOAD
========================================================= */

async function load() {

  try {

    const {
      data,
      error
    } =
      await SB
        .from(
          "tests"
        )
        .select(
          "id,name,subject,grade,created_at"
        )
        .order(
          "created_at",
          {
            ascending:
              false
          }
        );


    if (error) {

      throw error;

    }


    tests =
      data || [];


    const select =
      document.getElementById(
        "test"
      );


    select.innerHTML = `

      <option value="">
        テストを選択してください
      </option>

    `;


    tests.forEach(
      test => {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          test.id;


        option.textContent =
          [
            test.name,
            test.subject
          ]
            .filter(Boolean)
            .join(
              " / "
            );


        select.appendChild(
          option
        );

      }
    );


  } catch (error) {

    showError(
      error.message ||
      "テスト一覧を読み込めませんでした。"
    );

  }

}


/* =========================================================
   UPLOAD
========================================================= */

document
  .getElementById(
    "upload"
  )
  .addEventListener(
    "click",
    upload
  );


async function upload() {

  const testId =
    document
      .getElementById(
        "test"
      )
      .value;


  const files =
    [
      ...
      document
        .getElementById(
          "files"
        )
        .files
    ];


  if (!testId) {

    showError(
      "テストを選択してください。"
    );

    return;

  }


  if (!files.length) {

    showError(
      "ファイルを選択してください。"
    );

    return;

  }


  const button =
    document.getElementById(
      "upload"
    );


  button.disabled =
    true;


  try {

    showMessage(
      "解答用紙の枠設定を読み込んでいます..."
    );


    /*
      =====================================================
      現在の解答用紙ページ
      =====================================================
    */

    await loadTestLayout(
      testId
    );


    /*
      =====================================================
      生徒一覧
      =====================================================
    */

    await loadStudents();


    let complete =
      0;


    for (
      const file
      of files
    ) {

      showMessage(
        `${file.name} を処理しています...`
      );


      /*
        PDF / ZIP / 画像
        → ページ画像
      */

      const pages =
        await expandFile(
          file
        );


      if (!pages.length) {

        throw new Error(
          `${file.name} からページを取得できませんでした。`
        );

      }


      /*
        QR
      */

      const qr =
        await findQr(
          pages
        );


      /*
        生徒
      */

      const student =
        qr
          ? findStudent(
              qr
            )
          : null;


      /*
        答案ID
      */

      const answerId =
        crypto.randomUUID();


      /*
        Storage
      */

      const pagePaths =
        [];


      for (
        let i = 0;
        i < pages.length;
        i++
      ) {

        const pageNo =
          i + 1;


        const path =
          buildAnswerPath(
            testId,
            answerId,
            pageNo
          );


        await uploadPage(
          path,
          pages[i]
        );


        pagePaths.push(
          {

            pageNo,

            path,

            width:
              pages[i].width,

            height:
              pages[i].height

          }
        );

      }


      /*
        answer_sheets
      */

      const {
        error:
          sheetError
      } =
        await SB
          .from(
            "answer_sheets"
          )
          .insert({

            id:
              answerId,

            test_id:
              testId,

            student_id:
              student?.id ||
              null,

            qr_token:
              qr ||
              null,

            file_path:
              pagePaths[0].path,

            status:
              student
                ? "matched"
                : "unmatched"

          });


      if (sheetError) {

        throw sheetError;

      }


      /*
        answer_sheet_pages
      */

      for (
        const page
        of pagePaths
      ) {

        const {
          error:
            pageError
        } =
          await SB
            .from(
              "answer_sheet_pages"
            )
            .upsert(
              {

                answer_sheet_id:
                  answerId,

                page_no:
                  page.pageNo,

                file_path:
                  page.path,

                width_px:
                  page.width,

                height_px:
                  page.height

              },
              {
                onConflict:
                  "answer_sheet_id,page_no"
              }
            );


        if (pageError) {

          throw pageError;

        }


        /*
          設問IDが既に設定されている
          小問だけ答案領域を作る。

          枠設定画面では
          設問IDを設定しないため、
          勝手な設問は作らない。
        */

        await createAnswerRegions(
          answerId,
          page.pageNo
        );

      }


      complete++;


      showMessage(
        `${complete}/${files.length} 件処理しました。`
      );

    }


    if (complete === files.length) {

      if (students.length) {

        const matched =
          files.filter(
            () => true
          ).length;


        showMessage(
          `${complete}件の答案をアップロードしました。`
        );

      } else {

        showMessage(
          `${complete}件の答案をアップロードしました。`
        );

      }

    }


  } catch (error) {

    console.error(
      "ANSWER UPLOAD ERROR",
      error
    );


    showError(
      error.message ||
      "答案のアップロードに失敗しました。"
    );

  } finally {

    button.disabled =
      false;

  }

}


/* =========================================================
   LOAD TEST LAYOUT
========================================================= */

async function loadTestLayout(
  testId
) {

  /*
    test_pages
  */

  const {
    data:
      pages,
    error:
      pagesError
  } =
    await SB
      .from(
        "test_pages"
      )
      .select(
        `
        id,
        test_id,
        page_no,
        image_path,
        width_px,
        height_px,
        original_name
        `
      )
      .eq(
        "test_id",
        testId
      )
      .order(
        "page_no",
        {
          ascending:
            true
        }
      );


  if (pagesError) {

    throw pagesError;

  }


  /*
    layout_boxes

    source_page_idは
    絶対に使わない。
  */

  const {
    data:
      boxes,
    error:
      boxesError
  } =
    await SB
      .from(
        "layout_boxes"
      )
      .select(
        `
        id,
        test_id,
        page_no,
        box_type,
        label,
        x,
        y,
        width,
        height,
        question_id,
        points,
        parent_box_id,
        major_no,
        minor_no,
        box_role,
        sort_order,
        subtotal_group
        `
      )
      .eq(
        "test_id",
        testId
      )
      .order(
        "page_no",
        {
          ascending:
            true
        }
      )
      .order(
        "sort_order",
        {
          ascending:
            true
        }
      );


  if (boxesError) {

    throw boxesError;

  }


  layoutPages =
    pages || [];


  layoutBoxes =
    boxes || [];

}


/* =========================================================
   STUDENTS
========================================================= */

async function loadStudents() {

  const {
    data,
    error
  } =
    await SB
      .from(
        "students"
      )
      .select(
        `
        id,
        student_no,
        name,
        qr_token,
        active
        `
      )
      .eq(
        "active",
        true
      );


  if (error) {

    throw error;

  }


  students =
    data || [];

}


/* =========================================================
   FILE EXPANSION
========================================================= */

async function expandFile(
  file
) {

  const extension =
    getExtension(
      file.name
    );


  if (
    extension ===
    "pdf"
  ) {

    return pdfToPages(
      file
    );

  }


  if (
    extension ===
    "zip"
  ) {

    return zipToPages(
      file
    );

  }


  return [
    await imageToPage(
      file
    )
  ];

}


/* =========================================================
   PDF
========================================================= */

async function pdfToPages(
  file
) {

  const buffer =
    await file.arrayBuffer();


  const pdf =
    await pdfjsLib
      .getDocument({
        data:
          buffer
      })
      .promise;


  const result =
    [];


  for (
    let pageNo = 1;
    pageNo <=
    pdf.numPages;
    pageNo++
  ) {

    const pdfPage =
      await pdf.getPage(
        pageNo
      );


    const base =
      pdfPage.getViewport({
        scale:
          1
      });


    const scale =
      Math.min(
        3,
        Math.max(
          1,
          3000 /
          Math.max(
            base.width,
            base.height
          )
        )
      );


    const viewport =
      pdfPage.getViewport({
        scale
      });


    const canvas =
      document.createElement(
        "canvas"
      );


    canvas.width =
      Math.ceil(
        viewport.width
      );


    canvas.height =
      Math.ceil(
        viewport.height
      );


    await pdfPage
      .render({

        canvasContext:
          canvas.getContext(
            "2d"
          ),

        viewport

      })
      .promise;


    result.push({

      canvas,

      width:
        canvas.width,

      height:
        canvas.height

    });

  }


  return result;

}


/* =========================================================
   ZIP
========================================================= */

async function zipToPages(
  file
) {

  const zip =
    await JSZip.loadAsync(
      file
    );


  const entries =
    Object.values(
      zip.files
    )
      .filter(
        item =>
          !item.dir
      )
      .sort(
        (
          a,
          b
        ) =>
          a.name.localeCompare(
            b.name,
            undefined,
            {
              numeric:
                true
            }
          )
      );


  const result =
    [];


  for (
    const entry
    of entries
  ) {

    const extension =
      getExtension(
        entry.name
      );


    if (
      extension ===
      "pdf"
    ) {

      const blob =
        await entry.async(
          "blob"
        );


      const pdfFile =
        new File(
          [blob],
          entry.name,
          {
            type:
              "application/pdf"
          }
        );


      result.push(
        ...await pdfToPages(
          pdfFile
        )
      );


      continue;

    }


    if (
      [
        "jpg",
        "jpeg",
        "png",
        "webp"
      ].includes(
        extension
      )
    ) {

      const blob =
        await entry.async(
          "blob"
        );


      const imageFile =
        new File(
          [blob],
          entry.name,
          {
            type:
              extension === "jpg"
                ? "image/jpeg"
                : `image/${extension}`
          }
        );


      result.push(
        await imageToPage(
          imageFile
        )
      );

    }

  }


  return result;

}


/* =========================================================
   IMAGE
========================================================= */

async function imageToPage(
  file
) {

  const url =
    URL.createObjectURL(
      file
    );


  try {

    const image =
      await loadImage(
        url
      );


    const canvas =
      document.createElement(
        "canvas"
      );


    canvas.width =
      image.naturalWidth;


    canvas.height =
      image.naturalHeight;


    canvas
      .getContext(
        "2d"
      )
      .drawImage(
        image,
        0,
        0
      );


    return {

      canvas,

      width:
        canvas.width,

      height:
        canvas.height

    };

  } finally {

    URL.revokeObjectURL(
      url
    );

  }

}


/* =========================================================
   QR
========================================================= */

async function findQr(
  pages
) {

  /*
    QR枠を優先。
  */

  for (
    let index = 0;
    index < pages.length;
    index++
  ) {

    const page =
      pages[index];


    const pageNo =
      index + 1;


    const qrBoxes =
      layoutBoxes.filter(
        box =>
          Number(
            box.page_no
          ) ===
          pageNo &&
          (
            box.box_role ===
              "qr" ||
            box.box_type ===
              "qr"
          )
      );


    for (
      const box
      of qrBoxes
    ) {

      const cropped =
        cropCanvas(
          page.canvas,
          box
        );


      const result =
        decodeQr(
          cropped
        );


      if (
        result?.data
      ) {

        return normalizeQr(
          result.data
        );

      }

    }

  }


  /*
    QR枠がなければ
    全ページを探索。
  */

  for (
    const page
    of pages
  ) {

    const result =
      decodeQr(
        page.canvas
      );


    if (
      result?.data
    ) {

      return normalizeQr(
        result.data
      );

    }

  }


  return null;

}


/* =========================================================
   QR DECODE
========================================================= */

function decodeQr(
  canvas
) {

  if (
    typeof jsQR !==
    "function"
  ) {

    return null;

  }


  const context =
    canvas.getContext(
      "2d",
      {
        willReadFrequently:
          true
      }
    );


  const image =
    context.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );


  return jsQR(
    image.data,
    image.width,
    image.height,
    {
      inversionAttempts:
        "attemptBoth"
    }
  );

}


/* =========================================================
   QR NORMALIZE
========================================================= */

function normalizeQr(
  value
) {

  const text =
    String(
      value ||
      ""
    ).trim();


  /*
    JSON QR
  */

  try {

    const data =
      JSON.parse(
        text
      );


    for (
      const key
      of [
        "student_no",
        "studentNo",
        "student_id",
        "studentId"
      ]
    ) {

      if (
        data[key] !==
        undefined
      ) {

        return String(
          data[key]
        ).trim();

      }

    }

  } catch (_) {}


  /*
    URL QR
  */

  try {

    const url =
      new URL(
        text
      );


    for (
      const key
      of [
        "student_no",
        "studentNo",
        "student_id",
        "studentId",
        "student"
      ]
    ) {

      const value =
        url.searchParams.get(
          key
        );


      if (value) {

        return value.trim();

      }

    }

  } catch (_) {}


  return text;

}


/* =========================================================
   STUDENT MATCH
========================================================= */

function findStudent(
  qr
) {

  const value =
    normalizeStudentValue(
      qr
    );


  /*
    qr_token
  */

  let student =
    students.find(
      item =>
        normalizeStudentValue(
          item.qr_token
        ) ===
        value
    );


  if (student) {

    return student;

  }


  /*
    student_no
  */

  student =
    students.find(
      item =>
        normalizeStudentValue(
          item.student_no
        ) ===
        value
    );


  if (student) {

    return student;

  }


  /*
    UUID
  */

  student =
    students.find(
      item =>
        String(
          item.id
        ).toLowerCase() ===
        String(
          qr
        ).trim().toLowerCase()
    );


  return student || null;

}


function normalizeStudentValue(
  value
) {

  return String(
    value ||
    ""
  )
    .trim()
    .replace(
      /[\s\-]/g,
      ""
    )
    .toLowerCase();

}


/* =========================================================
   ANSWER REGIONS
========================================================= */

async function createAnswerRegions(
  answerId,
  pageNo
) {

  const boxes =
    layoutBoxes.filter(
      box =>
        Number(
          box.page_no
        ) ===
        Number(
          pageNo
        ) &&
        box.box_role ===
          "minor" &&
        box.question_id
    );


  if (!boxes.length) {

    return;

  }


  const rows =
    boxes.map(
      box => ({

        answer_sheet_id:
          answerId,

        question_id:
          box.question_id,

        page_no:
          pageNo,

        x:
          Number(
            box.x
          ),

        y:
          Number(
            box.y
          ),

        width:
          Number(
            box.width
          ),

        height:
          Number(
            box.height
          )

      })
    );


  const {
    error
  } =
    await SB
      .from(
        "answer_regions"
      )
      .insert(
        rows
      );


  if (error) {

    throw error;

  }

}


/* =========================================================
   STORAGE
========================================================= */

async function uploadPage(
  path,
  page
) {

  const blob =
    await canvasToBlob(
      page.canvas
    );


  const {
    error
  } =
    await SB
      .storage
      .from(
        "answers"
      )
      .upload(
        path,
        blob,
        {
          contentType:
            "image/png",

          cacheControl:
            "3600",

          upsert:
            true
        }
      );


  if (error) {

    throw error;

  }

}


/* =========================================================
   PATH
========================================================= */

function buildAnswerPath(
  testId,
  answerId,
  pageNo
) {

  return [
    testId,
    answerId,
    `page-${String(
      pageNo
    ).padStart(
      3,
      "0"
    )}.png`
  ].join(
    "/"
  );

}


/* =========================================================
   CROP
========================================================= */

function cropCanvas(
  source,
  box
) {

  const x =
    Math.max(
      0,
      Math.round(
        Number(
          box.x
        )
      )
    );


  const y =
    Math.max(
      0,
      Math.round(
        Number(
          box.y
        )
      )
    );


  const width =
    Math.max(
      1,
      Math.round(
        Number(
          box.width
        )
      )
    );


  const height =
    Math.max(
      1,
      Math.round(
        Number(
          box.height
        )
      )
    );


  const safeWidth =
    Math.min(
      width,
      source.width -
      x
    );


  const safeHeight =
    Math.min(
      height,
      source.height -
      y
    );


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    Math.max(
      1,
      safeWidth
    );


  canvas.height =
    Math.max(
      1,
      safeHeight
    );


  canvas
    .getContext(
      "2d"
    )
    .drawImage(
      source,

      x,
      y,
      canvas.width,
      canvas.height,

      0,
      0,
      canvas.width,
      canvas.height
    );


  return canvas;

}


/* =========================================================
   BLOB
========================================================= */

function canvasToBlob(
  canvas
) {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      canvas.toBlob(
        blob => {

          if (!blob) {

            reject(
              new Error(
                "画像変換に失敗しました。"
              )
            );

            return;

          }


          resolve(
            blob
          );

        },
        "image/png",
        .95
      );

    }
  );

}


/* =========================================================
   IMAGE
========================================================= */

function loadImage(
  src
) {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const image =
        new Image();


      image.onload =
        () =>
          resolve(
            image
          );


      image.onerror =
        () =>
          reject(
            new Error(
              "画像を読み込めませんでした。"
            )
          );


      image.src =
        src;

    }
  );

}


/* =========================================================
   MODEL ANSWER
========================================================= */

async function processModelAnswers(
  testId
) {

  const files =
    [
      ...
      document
        .getElementById(
          "files"
        )
        .files
    ];


  for (
    const file
    of files
  ) {

    const pages =
      await expandFile(
        file
      );


    for (
      let i = 0;
      i < pages.length;
      i++
    ) {

      const path =
        [
          testId,
          "model-answer",
          `page-${String(
            i + 1
          ).padStart(
            3,
            "0"
          )}.png`
        ].join(
          "/"
        );


      const blob =
        await canvasToBlob(
          pages[i].canvas
        );


      const {
        error
      } =
        await SB
          .storage
          .from(
            "model-answers"
          )
          .upload(
            path,
            blob,
            {
              contentType:
                "image/png",

              upsert:
                true
            }
          );


      if (error) {

        throw error;

      }

    }

  }

}


/* =========================================================
   UI
========================================================= */

function showMessage(
  text
) {

  document
    .getElementById(
      "msg"
    )
    .textContent =
      text;

}


function showError(
  text
) {

  const element =
    document.getElementById(
      "msg"
    );


  element.textContent =
    text;


  element.className =
    "error";

}


function getExtension(
  name
) {

  const parts =
    String(
      name ||
      ""
    )
      .toLowerCase()
      .split(
        "."
      );


  return parts.length > 1
    ? parts.pop()
    : "";

}


function formatBytes(
  bytes
) {

  if (
    bytes <
    1024
  ) {

    return `${bytes} B`;

  }


  if (
    bytes <
    1024 * 1024
  ) {

    return `${(
      bytes /
      1024
    ).toFixed(
      1
    )} KB`;

  }


  return `${(
    bytes /
    1024 /
    1024
  ).toFixed(
    1
  )} MB`;

}


function setProgress(
  value,
  text
) {

  progressArea.classList.remove(
    "hidden"
  );


  progressBar.style.width =
    `${Math.max(
      0,
      Math.min(
        100,
        value
      )
    )}%`;


  progressText.textContent =
    text || "";

}

</script>
