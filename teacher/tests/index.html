
<!doctype html>
<html lang="ja">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
  テスト管理
</title>

<link
  rel="stylesheet"
  href="css/style.css"
>

</head>


<body>


<div class="app">


<aside class="side">

<h2>
テスト管理
</h2>


<a href="teacher.html">
ダッシュボード
</a>


<a href="teacher-students.html">
生徒管理
</a>


<a href="teacher-qr.html">
QR発行
</a>


<a
  class="active"
  href="teacher-tests.html"
>
テスト管理
</a>


<a href="teacher-answers-upload.html">
答案アップロード
</a>


<a href="teacher-marking.html">
採点
</a>

</aside>


<main class="main">


<div class="top">

<h1>
テスト管理
</h1>

</div>


<!-- =====================================================
     新規テスト
====================================================== -->

<div class="card">


<div class="form-row">

<label>
テスト名
</label>


<input
  id="testName"
  type="text"
>

</div>


<div class="form-row">

<label>
教科
</label>


<input
  id="subject"
  type="text"
>

</div>


<div class="form-row">

<label>
学年
</label>


<input
  id="grade"
  type="text"
>

</div>


<button
  class="primary"
  id="createButton"
  type="button"
>
新しいテストを作成
</button>


</div>


<!-- =====================================================
     状態
====================================================== -->

<p
  id="message"
  class="small"
></p>


<!-- =====================================================
     テスト一覧
====================================================== -->

<table class="table">

<thead>

<tr>

<th>
テスト
</th>


<th>
教科
</th>


<th>
学年
</th>


<th>
操作
</th>

</tr>

</thead>


<tbody id="rows">

<tr>

<td
  colspan="4"
>
読み込み中...
</td>

</tr>

</tbody>

</table>


</main>

</div>


<!-- =====================================================
     Supabase
====================================================== -->

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script src="js/config.js"></script>


<script src="js/auth.js"></script>


<script>

"use strict";


/* =========================================================
   Supabase
========================================================= */

/*
 * auth.js が正常に読み込まれていれば
 * window.SB が存在する。
 *
 * 存在しない場合はAPP_CONFIGから
 * このページ自身で接続する。
 */

let DB =
  window.SB ||
  null;


if (
  !DB &&
  window.APP_CONFIG &&
  window.supabase
) {

  const url =
    window.APP_CONFIG.SUPABASE_URL;


  const key =
    window.APP_CONFIG.SUPABASE_ANON_KEY;


  if (
    url &&
    key
  ) {

    DB =
      window.supabase.createClient(
        url,
        key
      );

  }

}


/* =========================================================
   DOM
========================================================= */

const rows =
  document.getElementById(
    "rows"
  );


const message =
  document.getElementById(
    "message"
  );


const createButton =
  document.getElementById(
    "createButton"
  );


/* =========================================================
   STATE
========================================================= */

let currentUser =
  null;


/* =========================================================
   START
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  initialize
);


async function initialize() {

  try {

    if (!DB) {

      throw new Error(
        "Supabaseに接続できません。js/config.jsを確認してください。"
      );

    }


    /*
     * auth.jsのrequireRoleには依存しない。
     */

    await checkLogin();


    await loadTests();


    setupEvents();


  } catch (error) {

    console.error(
      "teacher-tests:",
      error
    );


    showMessage(
      error.message ||
      "テスト管理を読み込めませんでした。",
      true
    );

  }

}


/* =========================================================
   LOGIN
========================================================= */

async function checkLogin() {

  const {
    data,
    error
  } =
    await DB.auth.getUser();


  if (error) {

    throw new Error(
      `ログイン確認に失敗しました: ${error.message}`
    );

  }


  if (!data?.user) {

    location.href =
      "login.html";

    return;

  }


  currentUser =
    data.user;


  /*
   * 先生・管理者だけ許可。
   */

  const {
    data: profile,
    error: profileError
  } =
    await DB
      .from(
        "profiles"
      )
      .select(
        "role,name"
      )
      .eq(
        "id",
        currentUser.id
      )
      .maybeSingle();


  if (profileError) {

    throw new Error(
      `プロフィール取得に失敗しました: ${profileError.message}`
    );

  }


  if (
    !profile ||
    (
      profile.role !== "teacher" &&
      profile.role !== "admin"
    )
  ) {

    location.href =
      "login.html";

    return;

  }

}


/* =========================================================
   EVENTS
========================================================= */

function setupEvents() {

  createButton.addEventListener(
    "click",
    createTest
  );

}


/* =========================================================
   LOAD TESTS
========================================================= */

async function loadTests() {

  rows.innerHTML = `

    <tr>

      <td colspan="4">
        読み込み中...
      </td>

    </tr>

  `;


  const {
    data,
    error
  } =
    await DB
      .from(
        "tests"
      )
      .select(
        `
        id,
        name,
        subject,
        grade,
        class_name,
        created_at
        `
      )
      .order(
        "created_at",
        {
          ascending:
            false
        }
      );


  if (error) {

    throw new Error(
      `テスト一覧取得エラー: ${error.message}`
    );

  }


  renderTests(
    data ||
    []
  );

}


/* =========================================================
   RENDER
========================================================= */

function renderTests(
  tests
) {

  rows.innerHTML =
    "";


  if (!tests.length) {

    rows.innerHTML = `

      <tr>

        <td colspan="4">
          テストがありません。
        </td>

      </tr>

    `;

    return;

  }


  tests.forEach(
    test => {

      const tr =
        document.createElement(
          "tr"
        );


      /*
       * HTML文字列ではなく
       * textContentを使用。
       */

      const name =
        document.createElement(
          "td"
        );


      name.textContent =
        test.name ||
        "";


      const subject =
        document.createElement(
          "td"
        );


      subject.textContent =
        test.subject ||
        "";


      const grade =
        document.createElement(
          "td"
        );


      grade.textContent =
        test.grade ||
        "";


      const actions =
        document.createElement(
          "td"
        );


      /*
       * 枠設定
       */

      const layout =
        document.createElement(
          "a"
        );


      layout.href =
        `teacher-test-layout.html?test=${encodeURIComponent(
          test.id
        )}`;


      layout.textContent =
        "解答・枠設定";


      layout.style.marginRight =
        "10px";


      /*
       * 配点設定
       *
       * 新しい別ファイルを必須にせず、
       * 枠設定画面内の配点設定へ進める。
       */

      const points =
        document.createElement(
          "a"
        );


      points.href =
        `teacher-test-layout.html?test=${encodeURIComponent(
          test.id
        )}&points=1`;


      points.textContent =
        "配点設定";


      points.style.marginRight =
        "10px";


      /*
       * 採点
       */

      const marking =
        document.createElement(
          "a"
        );


      marking.href =
        `teacher-marking.html?test=${encodeURIComponent(
          test.id
        )}`;


      marking.textContent =
        "採点";


      actions.append(
        layout,
        points,
        marking
      );


      tr.append(
        name,
        subject,
        grade,
        actions
      );


      rows.appendChild(
        tr
      );

    }
  );

}


/* =========================================================
   CREATE TEST
========================================================= */

async function createTest() {

  const name =
    document
      .getElementById(
        "testName"
      )
      .value
      .trim();


  const subject =
    document
      .getElementById(
        "subject"
      )
      .value
      .trim();


  const grade =
    document
      .getElementById(
        "grade"
      )
      .value
      .trim();


  if (!name) {

    showMessage(
      "テスト名を入力してください。",
      true
    );

    return;

  }


  createButton.disabled =
    true;


  createButton.textContent =
    "作成中...";


  try {

    const insertData = {

      name,

      subject:
        subject ||
        null,

      grade:
        grade ||
        null,

      created_by:
        currentUser.id

    };


    const {
      data,
      error
    } =
      await DB
        .from(
          "tests"
        )
        .insert(
          insertData
        )
        .select(
          "id"
        )
        .single();


    if (error) {

      throw new Error(
        `テスト作成エラー: ${error.message}`
      );

    }


    /*
     * 作成後は既存の
     * teacher-test-layout.htmlへ。
     */

    location.href =
      `teacher-test-layout.html?test=${encodeURIComponent(
        data.id
      )}`;

  } catch (error) {

    console.error(
      error
    );


    showMessage(
      error.message ||
      "テストを作成できませんでした。",
      true
    );


    createButton.disabled =
      false;


    createButton.textContent =
      "新しいテストを作成";

  }

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
  text,
  error = false
) {

  message.textContent =
    text;


  message.style.color =
    error
      ? "#b42318"
      : "#333";

}

</script>


</body>

</html>
