<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    採点対象選択 - テスト成績システム
  </title>

  <link
    rel="stylesheet"
    href="/css/common.css"
  >

</head>

<body>

<header class="topbar">

  <div class="system-name">
    テスト成績システム
  </div>

  <div class="topbar-space"></div>

  <span id="teacherName">
    -
  </span>

  <button
    id="logoutButton"
    class="logout-button"
  >
    ログアウト
  </button>

</header>


<div class="teacher-layout">

  <aside class="sidebar">

    <div class="sidebar-title">
      デジタル採点
    </div>

    <a
      href="/teacher/marking"
      class="menu-link active"
    >
      採点開始
    </a>

    <a
      href="/teacher/answers/matched"
      class="menu-link"
    >
      紐付け済み答案
    </a>

  </aside>


  <main class="main-content">

    <div class="page-header">

      <h1>
        採点対象選択
      </h1>

    </div>


    <div
      id="testInformation"
      class="card"
    >
      読み込み中...
    </div>


    <div class="card">

      <h3>
        採点する答案
      </h3>

      <p>
        採点したい答案を選択してください。
        採点画面では同じ問題を生徒2列で表示します。
      </p>


      <div
        id="answerList"
        style="
          display:grid;
          grid-template-columns:
            repeat(2,minmax(0,1fr));
          gap:10px;
        "
      >

        <div
          style="
            grid-column:1/-1;
            text-align:center;
            padding:30px;
            color:#777;
          "
        >
          読み込み中...
        </div>

      </div>

    </div>


    <div class="card">

      <h3>
        採点開始
      </h3>

      <p>
        問題を指定して採点画面を開きます。
      </p>


      <div
        id="questionList"
      >

        読み込み中...

      </div>

    </div>

  </main>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="/js/config.js"></script>

<script src="/js/auth.js"></script>

<script src="/js/teacher/marking-select.js"></script>

</body>
</html>
