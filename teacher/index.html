
<!doctype html>
<html lang="ja">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
  先生ダッシュボード - テスト成績システム
</title>

<link
  rel="stylesheet"
  href="/css/common.css"
>

<style>

.dashboard-main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 22px;
}

.dashboard-grid {
  display: grid;

  grid-template-columns:
    repeat(
      3,
      minmax(0, 1fr)
    );

  gap: 14px;
}

.dashboard-card {
  display: block;

  padding: 20px;

  background: #fff;

  border: 1px solid #d0d6dc;

  border-radius: 6px;

  color: inherit;

  text-decoration: none;
}

.dashboard-card:hover {
  background: #f7f9fb;
}

.dashboard-card h2 {
  margin:
    0
    0
    8px;

  font-size: 17px;
}

.dashboard-card p {
  margin: 0;

  color: #666;

  font-size: 13px;

  line-height: 1.7;
}

.dashboard-card .link {
  display: inline-block;

  margin-top: 14px;

  color: #1769aa;

  font-size: 13px;

  font-weight: 700;
}


@media (max-width: 900px) {

  .dashboard-grid {
    grid-template-columns:
      repeat(
        2,
        minmax(0, 1fr)
      );
  }

}


@media (max-width: 600px) {

  .dashboard-main {
    padding: 14px;
  }

  .dashboard-grid {
    grid-template-columns: 1fr;
  }

}

</style>

</head>


<body>


<header class="topbar">

  <div class="system-name">
    テスト成績システム
  </div>


  <div class="topbar-space"></div>


  <span id="teacherName">
    -
  </span>


  <button
    id="logoutButton"
    class="logout-button"
    type="button"
  >
    ログアウト
  </button>

</header>


<main class="dashboard-main">


  <div class="page-header">

    <h1>
      先生ダッシュボード
    </h1>

  </div>


  <div class="dashboard-grid">


    <!-- =================================================
         テスト管理
    ================================================== -->

    <a
      class="dashboard-card"
      href="/teacher/tests"
    >

      <h2>
        テスト管理
      </h2>

      <p>
        テスト作成、解答用紙、枠設定、配点設定を管理します。
      </p>

      <span class="link">
        テスト管理へ
      </span>

    </a>


    <!-- =================================================
         生徒QR
    ================================================== -->

    <a
      class="dashboard-card"
      href="/teacher/students/qr"
    >

      <h2>
        生徒QR発行
      </h2>

      <p>
        生徒番号から答案紐付け用QRを一括発行・印刷します。
      </p>

      <span class="link">
        QR発行へ
      </span>

    </a>


    <!-- =================================================
         答案アップロード
    ================================================== -->

    <a
      class="dashboard-card"
      href="/teacher/answers/upload"
    >

      <h2>
        答案アップロード
      </h2>

      <p>
        PDF・画像・ZIPの答案をアップロードし、QRで生徒を自動紐付けします。
      </p>

      <span class="link">
        答案アップロードへ
      </span>

    </a>


    <!-- =================================================
         採点
    ================================================== -->

    <a
      class="dashboard-card"
      href="/teacher/marking"
    >

      <h2>
        採点
      </h2>

      <p>
        テスト全体を設問ごとに全生徒採点します。
      </p>

      <span class="link">
        採点へ
      </span>

    </a>


    <!-- =================================================
         生徒管理
    ================================================== -->

    <a
      class="dashboard-card"
      href="/teacher/students"
    >

      <h2>
        生徒管理
      </h2>

      <p>
        生徒番号、氏名、在籍状態などを管理します。
      </p>

      <span class="link">
        生徒管理へ
      </span>

    </a>


    <!-- =================================================
         成績
    ================================================== -->

    <a
      class="dashboard-card"
      href="/teacher/results/summary"
    >

      <h2>
        成績・返却
      </h2>

      <p>
        成績、偏差値、順位、公開・返却状態を確認します。
      </p>

      <span class="link">
        成績・返却へ
      </span>

    </a>


  </div>


</main>


<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script src="/js/config.js"></script>

<script src="/js/auth.js"></script>


<script>

"use strict";


(async function () {

  try {

    const result =
      await requireRole(
        "teacher"
      );


    const profile =
      result?.profile ||
      result ||
      {};


    const teacherName =
      document.getElementById(
        "teacherName"
      );


    if (teacherName) {

      teacherName.textContent =
        profile.name ||
        "先生";

    }

  } catch (error) {

    console.error(
      error
    );

  }

})();


document
  .getElementById(
    "logoutButton"
  )
  ?.addEventListener(
    "click",
    async () => {

      if (
        typeof logout ===
        "function"
      ) {

        await logout();

        return;

      }


      if (
        typeof signOut ===
        "function"
      ) {

        await signOut();

      }

    }
  );

</script>


</body>

</html>
