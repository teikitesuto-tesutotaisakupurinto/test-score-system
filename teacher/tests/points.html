
<!doctype html>
<html lang="ja">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
  配点設定 - テスト成績システム
</title>

<link
  rel="stylesheet"
  href="/css/common.css"
>

<style>

.points-main {
  max-width:1200px;

  margin:0 auto;

  padding:22px;
}


.toolbar {
  display:flex;

  flex-wrap:wrap;

  gap:8px;

  margin-bottom:15px;
}


.status {
  padding:10px 12px;

  margin-bottom:15px;

  background:#f5f6f7;

  border:1px solid #d5dbe0;

  font-size:13px;

  white-space:pre-wrap;
}


.status.error {
  color:#b42318;
}


.test-info {
  margin-bottom:15px;

  padding:15px;

  background:#fff;

  border:1px solid #d0d6dc;

  border-radius:6px;
}


.test-name {
  font-size:18px;

  font-weight:700;
}


.test-meta {
  margin-top:5px;

  color:#666;

  font-size:13px;
}


.table-wrap {
  overflow-x:auto;

  background:#fff;

  border:1px solid #d0d6dc;
}


.points-table {
  width:100%;

  border-collapse:collapse;
}


.points-table th,
.points-table td {
  border:1px solid #d0d6dc;

  padding:9px 10px;

  font-size:13px;

  vertical-align:middle;
}


.points-table th {
  background:#f3f5f7;

  font-weight:700;

  text-align:left;
}


.points-input {
  width:110px;

  height:38px;

  padding:0 8px;

  border:1px solid #b8c1c9;

  border-radius:4px;

  text-align:right;

  background:#fff;
}


.points-input:focus {
  outline:none;

  border-color:#1769aa;
}


.total-row td {
  background:#f8fafb;

  font-weight:700;
}


.total-points {
  font-size:18px;
}


.empty {
  padding:50px;

  text-align:center;

  color:#777;
}


.next-area {
  display:flex;

  flex-wrap:wrap;

  gap:8px;

  margin-top:15px;

  padding-top:15px;

  border-top:1px solid #d0d6dc;
}

</style>

</head>


<body>


<header class="topbar">

  <div class="system-name">
    テスト成績システム
  </div>


  <div class="topbar-space"></div>


  <span id="teacherName">
    -
  </span>


  <button
    id="logoutButton"
    class="logout-button"
    type="button"
  >
    ログアウト
  </button>

</header>


<main class="points-main">


<div class="page-header">

<h1>
  配点設定
</h1>

</div>


<div
id="status"
class="status"
>
読み込み中...
</div>


<section
id="testInfo"
class="test-info"
>

<div
id="testName"
class="test-name"
>
-
</div>


<div
id="testMeta"
class="test-meta"
>
-
</div>

</section>


<div class="toolbar">


<a
id="layoutButton"
class="btn"
href="#"
>
枠設定へ戻る
</a>


<a
id="markingButton"
class="btn btn-primary"
href="#"
>
採点へ
</a>


<a
id="resultsButton"
class="btn"
href="#"
>
成績処理
</a>


</div>


<div
id="tableWrap"
class="table-wrap"
>

<div class="empty">
設問を読み込んでいます...
</div>

</div>


<div class="next-area">


<a
href="/teacher/tests"
class="btn"
>
テスト一覧へ戻る
</a>


<a
id="markingButtonBottom"
href="#"
class="btn btn-primary"
>
配点設定完了・採点へ
</a>


</div>


</main>


<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script
src="/js/config.js?v=20261116"
></script>


<script
src="/js/auth.js?v=20261116"
></script>


<script>

"use strict";


const DB =
  window.supabaseClient ||
  window.SB;


if (!DB) {

  throw new Error(
    "Supabase Clientが初期化されていません。"
  );

}


let testId =
  null;

let boxes =
  [];


const statusElement =
  document.getElementById(
    "status"
  );


const tableWrap =
  document.getElementById(
    "tableWrap"
  );


document.addEventListener(
  "DOMContentLoaded",
  initialize
);


async function initialize() {

  try {

    const result =
      await requireRole(
        "teacher"
      );


    if (!result) {

      return;

    }


    document.getElementById(
      "teacherName"
    ).textContent =
      result.profile?.name ||
      "先生";


    const params =
      new URLSearchParams(
        location.search
      );


    testId =
      params.get(
        "test"
      );


    if (!testId) {

      throw new Error(
        "テストIDがありません。"
      );

    }


    setLinks();

    await load();

  } catch (error) {

    console.error(
      "points:",
      error
    );


    showError(
      error.message ||
      "配点設定を読み込めませんでした。"
    );

  }

}


function setLinks() {

  const id =
    encodeURIComponent(
      testId
    );


  document.getElementById(
    "layoutButton"
  ).href =
    `/teacher/tests/layout?test=${id}`;


  document.getElementById(
    "markingButton"
  ).href =
    `/teacher/marking?test=${id}`;


  document.getElementById(
    "markingButtonBottom"
  ).href =
    `/teacher/marking?test=${id}`;


  document.getElementById(
    "resultsButton"
  ).href =
    `/teacher/results/summary?test=${id}`;

}


async function load() {

  setStatus(
    "テスト情報を取得しています..."
  );


  const {
    data:test,
    error:testError
  } =
    await DB
      .from(
        "tests"
      )
      .select(
        `
        id,
        name,
        subject,
        grade,
        class_name
        `
      )
      .eq(
        "id",
        testId
      )
      .maybeSingle();


  if (testError) {

    throw testError;

  }


  if (!test) {

    throw new Error(
      "指定されたテストが見つかりません。"
    );

  }


  document.getElementById(
    "testName"
  ).textContent =
    test.name ||
    "";


  document.getElementById(
    "testMeta"
  ).textContent =
    [
      test.subject,
      test.grade,
      test.class_name
    ]
      .filter(
        value =>
          value !== null &&
          value !== undefined &&
          String(
            value
          ).trim() !== ""
      )
      .join(
        " / "
      );


  setStatus(
    "解答欄を取得しています..."
  );


  const {
    data,
    error
  } =
    await DB
      .from(
        "layout_boxes"
      )
      .select(
        `
        id,
        page_no,
        box_type,
        label,
        question_id,
        points,
        sort_order
        `
      )
      .eq(
        "test_id",
        testId
      )
      .order(
        "page_no",
        {
          ascending:true
        }
      )
      .order(
        "sort_order",
        {
          ascending:true
        }
      );


  if (error) {

    throw error;

  }


  const excluded =
    new Set([
      "QR",
      "氏名",
      "合計",
      "小計"
    ]);


  boxes =
    (data || [])
      .filter(
        box =>
          String(
            box.box_type ||
            ""
          )
            .trim()
            .toLowerCase() ===
          "answer"
      )
      .filter(
        box =>
          !excluded.has(
            String(
              box.label ||
              ""
            ).trim()
          )
      );


  render();


  setStatus(
    `${boxes.length}問の配点を設定できます。`
  );

}


function render() {

  if (!boxes.length) {

    tableWrap.innerHTML = `

      <div class="empty">

        採点対象の解答欄がありません。

        <br><br>

        <a
          href="/teacher/tests/layout?test=${encodeURIComponent(
            testId
          )}"
          class="btn"
        >
          枠設定へ戻る
        </a>

      </div>

    `;

    return;

  }


  const table =
    document.createElement(
      "table"
    );


  table.className =
    "points-table";


  table.innerHTML = `

    <thead>

      <tr>

        <th>
          問
        </th>

        <th>
          ページ
        </th>

        <th>
          配点
        </th>

        <th>
          操作
        </th>

      </tr>

    </thead>

    <tbody></tbody>

    <tfoot>

      <tr class="total-row">

        <td colspan="2">
          合計配点
        </td>

        <td>

          <span
            id="totalPoints"
            class="total-points"
          >
            0
          </span>

          点

        </td>

        <td>
        </td>

      </tr>

    </tfoot>

  `;


  const tbody =
    table.querySelector(
      "tbody"
    );


  boxes.forEach(
    (
      box,
      index
    ) => {

      const row =
        document.createElement(
          "tr"
        );


      const number =
        document.createElement(
          "td"
        );


      number.textContent =
        box.label ||
        `問${index + 1}`;


      const page =
        document.createElement(
          "td"
        );


      page.textContent =
        `${Number(
          box.page_no
        ) || 1}ページ`;


      const points =
        document.createElement(
          "td"
        );


      const input =
        document.createElement(
          "input"
        );


      input.type =
        "number";


      input.className =
        "points-input";


      input.min =
        "0";


      input.step =
        "0.1";


      input.value =
        Number(
          box.points
        ) || 0;


      input.addEventListener(
        "input",
        updateTotal
      );


      points.appendChild(
        input
      );


      const action =
        document.createElement(
          "td"
        );


      const save =
        document.createElement(
          "button"
        );


      save.type =
        "button";


      save.className =
        "btn";


      save.textContent =
        "保存";


      save.addEventListener(
        "click",
        async () => {

          await savePoint(
            box,
            input,
            save
          );

        }
      );


      action.appendChild(
        save
      );


      row.append(
        number,
        page,
        points,
        action
      );


      tbody.appendChild(
        row
      );

    }
  );


  tableWrap.innerHTML =
    "";


  tableWrap.appendChild(
    table
  );


  updateTotal();

}


async function savePoint(
  box,
  input,
  button
) {

  const value =
    Number(
      input.value
    );


  if (
    !Number.isFinite(
      value
    ) ||
    value < 0
  ) {

    showError(
      "配点を正しく入力してください。"
    );

    return;

  }


  button.disabled =
    true;


  button.textContent =
    "保存中...";


  try {

    const {
      error
    } =
      await DB
        .from(
          "layout_boxes"
        )
        .update({
          points:value
        })
        .eq(
          "id",
          box.id
        );


    if (error) {

      throw error;

    }


    box.points =
      value;


    button.textContent =
      "保存済み";


    updateTotal();


    setStatus(
      `${box.label || "設問"}：${formatNumber(
        value
      )}点で保存しました。`
    );

  } catch (error) {

    button.textContent =
      "保存";

    showError(
      `配点保存エラー: ${error.message}`
    );

  } finally {

    button.disabled =
      false;

  }

}


function updateTotal() {

  const inputs =
    document.querySelectorAll(
      ".points-input"
    );


  let total =
    0;


  inputs.forEach(
    input => {

      const value =
        Number(
          input.value
        );


      if (
        Number.isFinite(
          value
        )
      ) {

        total +=
          value;

      }

    }
  );


  const totalElement =
    document.getElementById(
      "totalPoints"
    );


  if (totalElement) {

    totalElement.textContent =
      formatNumber(
        total
      );

  }

}


function setStatus(
  message,
  error = false
) {

  statusElement.textContent =
    message;


  statusElement.className =
    error
      ? "status error"
      : "status";

}


function showError(
  message
) {

  setStatus(
    message,
    true
  );

}


function formatNumber(
  value
) {

  const n =
    Number(
      value
    );


  if (
    !Number.isFinite(
      n
    )
  ) {

    return "0";

  }


  return Number.isInteger(
    n
  )
    ? String(n)
    : n.toFixed(1);

}


document
  .getElementById(
    "logoutButton"
  )
  ?.addEventListener(
    "click",
    async () => {

      await logout();

    }
  );

</script>


</body>

</html>
