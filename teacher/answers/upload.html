
<!doctype html>
<html lang="ja">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>
    答案アップロード - テスト成績システム
  </title>

  <link
    rel="stylesheet"
    href="/css/common.css"
  >

</head>


<body>


<!-- =====================================================
     上部バー
====================================================== -->

<header class="topbar">

  <div class="system-name">
    テスト成績システム
  </div>


  <div class="topbar-space"></div>


  <span id="teacherName">
    -
  </span>


  <button
    id="logoutButton"
    type="button"
    class="logout-button"
  >
    ログアウト
  </button>

</header>


<!-- =====================================================
     先生画面
====================================================== -->

<div class="teacher-layout">


  <!-- ===================================================
       サイドバー
  ==================================================== -->

  <aside class="sidebar">


    <div class="sidebar-title">
      メニュー
    </div>


    <a
      class="menu-link"
      href="/teacher"
    >
      ダッシュボード
    </a>


    <a
      class="menu-link"
      href="/teacher/students"
    >
      生徒管理
    </a>


    <a
      class="menu-link"
      href="/teacher/qr"
    >
      QR発行
    </a>


    <a
      class="menu-link"
      href="/teacher/tests"
    >
      テスト管理
    </a>


    <div class="sidebar-title">
      答案
    </div>


    <a
      class="menu-link active"
      href="/teacher/answers/upload"
    >
      答案アップロード
    </a>


    <a
      class="menu-link"
      href="/teacher/answers/matched"
    >
      答案一覧
    </a>


    <a
      class="menu-link"
      href="/teacher/marking"
    >
      デジタル採点
    </a>


    <div class="sidebar-title">
      成績
    </div>


    <a
      class="menu-link"
      href="/teacher/results/summary"
    >
      成績・返却
    </a>


  </aside>


  <!-- ===================================================
       メイン
  ==================================================== -->

  <main class="main-content">


    <div class="page-header">

      <h1>
        答案アップロード
      </h1>

    </div>


    <!-- =================================================
         アップロード
    ================================================== -->

    <div class="card">


      <!-- テスト -->

      <div class="form-group">

        <label for="test">
          テスト
        </label>


        <select
          id="test"
        >

          <option value="">
            テストを選択してください
          </option>

        </select>

      </div>


      <!-- 答案種類 -->

      <div class="form-group">

        <label for="answerType">
          答案種類
        </label>


        <select
          id="answerType"
        >

          <option value="student">
            生徒答案
          </option>


          <option value="model">
            解答用紙・模範解答
          </option>

        </select>

      </div>


      <!-- ファイル -->

      <div class="form-group">

        <label for="files">
          答案ファイル
        </label>


        <input
          id="files"
          type="file"
          multiple
          accept=".pdf,.jpg,.jpeg,.png,.webp,.gif,.bmp,.zip"
        >

      </div>


      <p class="small muted">

        PDF / JPG / JPEG / PNG / WEBP / GIF / BMP / ZIP

        <br>

        PDFはページ単位で処理します。

        <br>

        ZIPは内部のPDF・画像を展開して処理します。

        <br>

        QRがあるページを新しい答案として扱い、
        QRがない後続ページは直前の答案に追加します。

      </p>


      <!-- 選択ファイル -->

      <div
        id="fileList"
        hidden
      ></div>


      <!-- ボタン -->

      <div class="quick-actions">

        <button
          id="uploadButton"
          type="button"
          class="quick-button primary"
        >
          アップロード開始
        </button>


        <button
          id="clearButton"
          type="button"
          class="quick-button"
        >
          クリア
        </button>

      </div>


      <!-- 進捗 -->

      <div
        id="progressArea"
        hidden
      >

        <div
          class="progress-track"
          style="
            width:100%;
            height:7px;
            margin-top:14px;
            background:#e1e5e8;
            overflow:hidden;
          "
        >

          <div
            id="progressBar"
            class="progress-bar"
            style="
              width:0;
              height:100%;
              background:#1769aa;
            "
          ></div>

        </div>


        <p
          id="progressText"
          class="small muted"
        >
          待機中
        </p>

      </div>


      <!-- メッセージ -->

      <p
        id="message"
        class="small"
        aria-live="polite"
      ></p>


      <!-- 処理結果 -->

      <div
        id="result"
        hidden
      ></div>


      <!-- JSが処理結果を追加する場所 -->

      <div
        id="uploadList"
        hidden
      ></div>


    </div>


  </main>


</div>


<!-- =====================================================
     ライブラリ
====================================================== -->

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script
  src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"
></script>


<script
  src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"
></script>


<script
  src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"
></script>


<!-- =====================================================
     共通JS
====================================================== -->

<script src="/js/config.js"></script>

<script src="/js/auth.js"></script>


<!-- =====================================================
     答案アップロード
====================================================== -->

<script src="/js/teacher/answer-upload.js"></script>


</body>

</html>
