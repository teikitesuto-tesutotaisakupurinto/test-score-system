
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
  成績・答案公開 - テスト成績システム
</title>

<link
  rel="stylesheet"
  href="/css/common.css"
>

<style>

.publish-main {
  max-width:900px;

  margin:0 auto;

  padding:25px;
}


.publish-card {
  background:#fff;

  border:
    1px solid #d5dbe0;

  padding:20px;

  margin-bottom:15px;
}


#testSelect {
  width:100%;

  height:44px;

  padding:0 10px;
}


.status {
  margin-top:15px;

  padding:12px;

  border:
    1px solid #d5dbe0;

  background:#f5f6f7;

  line-height:1.7;
}


.status.public {
  background:#edf8ef;

  border-color:#b7d9c0;

  color:#176b35;
}


.status.private {
  background:#fff4f2;

  border-color:#efc2bc;

  color:#b42318;
}


.actions {
  display:flex;

  flex-wrap:wrap;

  gap:10px;

  margin-top:15px;
}


.info {
  margin-top:15px;

  padding:12px;

  background:#f5f6f7;

  border:
    1px solid #dfe3e6;

  color:#555;

  font-size:12px;

  line-height:1.8;
}

</style>

</head>


<body>


<header class="topbar">

<div class="system-name">
  テスト成績システム
</div>


<div class="topbar-space"></div>


<span id="teacherName">
  -
</span>


<button
id="logoutButton"
class="logout-button"
type="button"
>
  ログアウト
</button>

</header>


<div class="teacher-layout">


<aside class="sidebar">


<div class="sidebar-title">
  成績
</div>


<a
href="/teacher/results/summary"
class="menu-link"
>
結果総括表
</a>


<a
href="/teacher/results/return"
class="menu-link"
>
答案返却
</a>


<a
href="/teacher/tests/publish"
class="menu-link active"
>
公開状態
</a>


</aside>


<main class="main-content publish-main">


<div class="page-header">

<h1>
  成績・答案公開
</h1>

</div>


<section class="publish-card">


<label
for="testSelect"
style="
  display:block;
  margin-bottom:7px;
  font-size:13px;
  font-weight:700;
"
>
テスト
</label>


<select
id="testSelect"
>

<option value="">
テストを選択してください
</option>

</select>


<div
id="status"
class="status"
>
テストを選択してください。
</div>


<div class="actions">


<button
id="publishButton"
type="button"
class="btn btn-primary"
disabled
>
生徒へ公開
</button>


<button
id="unpublishButton"
type="button"
class="btn"
disabled
>
公開停止
</button>


<a
id="summaryButton"
href="#"
class="btn"
>
結果総括表
</a>


<a
id="returnButton"
href="#"
class="btn"
>
答案返却
</a>


</div>


<div class="info">

公開前は生徒画面に採点結果・点数・採点済み答案を表示しません。

<br>

全答案・全設問の採点が確定してから公開できます。

<br>

公開後は生徒本人の画面だけに、その生徒の成績と採点済み答案が表示されます。

</div>


</section>


</main>


</div>


<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script
src="/js/config.js?v=20261116"
></script>


<script
src="/js/auth.js?v=20261116"
></script>


<script
src="/js/teacher/test-publish.js?v=20261116"
></script>


<script>

"use strict";


const params =
  new URLSearchParams(
    location.search
  );


const testId =
  params.get(
    "test"
  ) ||
  params.get(
    "id"
  );


if (testId) {

  const encoded =
    encodeURIComponent(
      testId
    );


  document.getElementById(
    "summaryButton"
  ).href =
    `/teacher/results/summary?test=${encoded}`;


  document.getElementById(
    "returnButton"
  ).href =
    `/teacher/results/return?test=${encoded}`;

}

</script>


<script src="/js/common-sidebar.js?v=20261126"></script>
</body>

</html>
