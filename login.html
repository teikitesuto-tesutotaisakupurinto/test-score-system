<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ログイン - テスト成績システム</title>

  <link rel="stylesheet" href="/css/login.css">
</head>

<body>

<div class="login-page">

  <div class="login-card">

    <div class="system-title">
      テスト成績システム
    </div>

    <div class="login-title">
      ログイン
    </div>

    <form id="loginForm">

      <div class="form-group">

        <label for="email">
          メールアドレス
        </label>

        <input
          id="email"
          name="email"
          type="email"
          autocomplete="username"
          required
        >

      </div>

      <div class="form-group">

        <label for="password">
          パスワード
        </label>

        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        >

      </div>

      <button
        id="loginButton"
        type="submit"
        class="login-button"
      >
        ログイン
      </button>

      <div
        id="loginMessage"
        class="login-message"
      ></div>

    </form>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="/js/config.js"></script>
<script src="/js/auth.js"></script>

</body>
</html>
