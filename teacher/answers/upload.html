
<!doctype html>
<html lang="ja">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
  答案アップロード - テスト成績システム
</title>

<link
  rel="stylesheet"
  href="/css/common.css?v=20261126completefix"
>

</head>


<body>


<header class="topbar">

<div class="system-name">
  テスト成績システム
</div>


<div class="topbar-space"></div>


<span id="teacherName">
  -
</span>


<button
id="logoutButton"
type="button"
class="logout-button"
>
  ログアウト
</button>

</header>


<main class="main-content">


<div class="page-header">

<h1>
  答案アップロード
</h1>

</div>


<div class="card">


<div class="form-group">

<label for="test">
  テスト
</label>


<select
id="test"
style="
  width:100%;
"
>

<option value="">
  テストを選択してください
</option>

</select>


<p
class="small muted"
style="
  margin-top:6px;
"
>
テストを選択すると、そのテストの答案として登録されます。
</p>

</div>


<div class="form-group">

<label for="answerType">
  答案種類
</label>


<select
id="answerType"
style="
  width:100%;
"
>

<option value="student">
  生徒答案
</option>

<option value="model">
  解答用紙・模範解答
</option>

</select>

</div>


<div class="form-group">

<label for="files">
  答案ファイル
</label>


<input
id="files"
type="file"
multiple
accept=".pdf,.jpg,.jpeg,.png,.webp,.gif,.bmp,.docx,.xlsx,.xls,.pptx,.csv,.txt,.zip"
>


</div>


<p class="small muted">

PDF / JPG / JPEG / PNG / WEBP / GIF / BMP / DOCX / XLSX / XLS / PPTX / CSV / TXT / ZIP

<br>

PDFはページ単位で処理します。

<br>

ZIPは内部のPDF・画像・Office・CSV・TXTを展開して処理します。

<br>

生徒答案はQRコードを読み取り、生徒を自動特定します。

</p>


<div
id="fileList"
hidden
></div>


<div
class="quick-actions"
style="
  margin-top:15px;
"
>

<button
id="uploadButton"
type="button"
class="quick-button primary"
disabled
>
アップロード開始
</button>


<button
id="clearButton"
type="button"
class="quick-button"
>
クリア
</button>

</div>


<div
id="processingArea"
hidden
style="
  margin-top:18px;
  padding:14px;
  border:1px solid #d0d6dc;
  background:#f8fafb;
  border-radius:4px;
"
>

<div
id="processingTitle"
style="
  font-weight:700;
  margin-bottom:8px;
"
>
処理中
</div>


<div
style="
  height:7px;
  background:#dfe4e8;
  overflow:hidden;
  border-radius:4px;
"
>

<div
id="progressBar"
style="
  width:0;
  height:100%;
  background:#1769aa;
  transition:width .2s;
"
></div>

</div>


<p
id="progressText"
class="small muted"
>
待機中
</p>


<div
id="processingLog"
style="
  max-height:260px;
  overflow:auto;
  margin-top:10px;
  font-size:13px;
"
></div>


</div>


<p
id="message"
class="small"
aria-live="polite"
></p>


<div
id="uploadList"
hidden
></div>


</div>


</main>


<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script
src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"
></script>


<script
src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"
></script>


<script
src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"
></script>


<script
src="/js/config.js?v=20261117"
></script>


<script
src="/js/auth.js?v=20261117"
></script>


<script
src="/js/lib/pdf-loader.js?v=20261117"
></script>


<script
src="/js/lib/file-parser.js?v=20261128office1"
></script>


<script
src="/js/teacher/answer-upload.js?v=20261128office1"
></script>


<script src="/js/common-sidebar.js?v=20261126completefix"></script>
</body>

</html>
