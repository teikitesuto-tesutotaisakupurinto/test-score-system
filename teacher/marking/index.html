
<!doctype html>
<html lang="ja">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
  デジタル採点 - テスト成績システム
</title>

<link
  rel="stylesheet"
  href="/css/marking.css?v=20261116"
>

<style>

.marking-page {
  width:100%;
  min-height:100vh;
  background:#eef2f5;
}

.marking-header {
  position:sticky;
  top:0;
  z-index:20;

  display:flex;
  align-items:center;
  gap:10px;

  padding:8px 12px;

  background:#fff;

  border-bottom:1px solid #c8cfd5;
}

.marking-title {
  font-size:18px;
  font-weight:700;
}

.header-space {
  flex:1;
}

.test-select {
  min-width:330px;
  height:38px;

  padding:0 9px;

  border:1px solid #aeb7bf;
  border-radius:3px;

  background:#fff;
}

.marking-main {
  max-width:1500px;

  margin:0 auto;

  padding:18px;
}

.status {
  min-height:40px;

  margin-bottom:12px;

  padding:10px 12px;

  background:#fff;

  border:1px solid #d0d6dc;

  font-size:13px;

  white-space:pre-wrap;
}

.status.error {
  color:#b42318;

  background:#fff8f7;

  border-color:#efc2bc;
}

.test-card {
  padding:18px;

  background:#fff;

  border:1px solid #d0d6dc;

  border-radius:4px;
}

.test-title {
  font-size:20px;
  font-weight:700;
}

.test-meta {
  margin-top:5px;

  color:#666;

  font-size:13px;
}

.answer-summary {
  display:flex;

  flex-wrap:wrap;

  gap:20px;

  margin-top:15px;

  padding:12px;

  background:#f5f6f7;

  border:1px solid #d5dbe0;

  font-size:13px;
}

.test-actions {
  display:flex;

  flex-wrap:wrap;

  gap:8px;

  margin-top:16px;
}

.empty {
  padding:50px;

  background:#fff;

  border:1px solid #d0d6dc;

  color:#777;

  text-align:center;
}

.error-box {
  padding:20px;

  background:#fff4f2;

  border:1px solid #efc2bc;

  color:#b42318;
}

@media(max-width:800px) {

  .marking-header {
    flex-wrap:wrap;
  }

  .test-select {
    width:100%;
    min-width:0;
  }

}

</style>

</head>


<body>


<div class="marking-page">


<header class="marking-header">


<div class="marking-title">
  デジタル採点
</div>


<div class="header-space"></div>


<select
  id="testSelect"
  class="test-select"
>

<option value="">
  テストを選択してください
</option>

</select>


<span id="teacherName">
  -
</span>


<button
  id="logoutButton"
  class="btn"
  type="button"
>
  ログアウト
</button>


</header>


<main class="marking-main">


<div
  id="status"
  class="status"
>
  起動しています...
</div>


<section
  id="testArea"
>


<div class="empty">
  テストを選択してください。
</div>


</section>


</main>


</div>


<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script
  src="/js/config.js?v=20261116"
></script>


<script
  src="/js/auth.js?v=20261116"
></script>


<script>

"use strict";


const DB =
  window.supabaseClient ||
  window.SB;


if (!DB) {

  throw new Error(
    "Supabase Clientが初期化されていません。"
  );

}


const testSelect =
  document.getElementById(
    "testSelect"
  );


const testArea =
  document.getElementById(
    "testArea"
  );


const statusElement =
  document.getElementById(
    "status"
  );


const teacherName =
  document.getElementById(
    "teacherName"
  );


let tests =
  [];


document.addEventListener(
  "DOMContentLoaded",
  initialize
);


async function initialize() {

  try {

    const result =
      await requireRole(
        "teacher"
      );


    if (!result) {
      return;
    }


    teacherName.textContent =
      result.profile?.name ||
      "先生";


    setupEvents();

    await loadTests();


  } catch (error) {

    console.error(
      error
    );


    showError(
      error.message ||
      "採点画面を起動できませんでした。"
    );

  }

}


/* =====================================================
   EVENTS
===================================================== */

function setupEvents() {

  testSelect.addEventListener(
    "change",
    async () => {

      const testId =
        testSelect.value;


      if (!testId) {

        clearArea();

        return;

      }


      await loadTest(
        testId
      );

    }
  );


  document
    .getElementById(
      "logoutButton"
    )
    .addEventListener(
      "click",
      async () => {

        await logout();

      }
    );

}


/* =====================================================
   TEST LIST
===================================================== */

async function loadTests() {

  setStatus(
    "テスト一覧を読み込んでいます..."
  );


  const {
    data,
    error
  } =
    await DB
      .from(
        "tests"
      )
      .select(
        `
        id,
        name,
        subject,
        grade,
        class_name,
        created_at
        `
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if (error) {

    throw new Error(
      `テスト一覧取得エラー: ${error.message}`
    );

  }


  tests =
    data ||
    [];


  testSelect.innerHTML = `

    <option value="">
      テストを選択してください
    </option>

  `;


  tests.forEach(
    test => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        test.id;


      option.textContent =
        [
          test.name,
          test.subject,
          test.grade,
          test.class_name
        ]
          .filter(
            value =>
              value !== null &&
              value !== undefined &&
              String(
                value
              ).trim() !== ""
          )
          .join(
            " / "
          );


      testSelect.appendChild(
        option
      );

    }
  );


  const params =
    new URLSearchParams(
      location.search
    );


  const requestedTest =
    params.get(
      "test"
    );


  if (
    requestedTest &&
    tests.some(
      test =>
        test.id ===
        requestedTest
    )
  ) {

    testSelect.value =
      requestedTest;


    await loadTest(
      requestedTest
    );


    return;

  }


  setStatus(
    "テストを選択してください。"
  );

}


/* =====================================================
   LOAD TEST
===================================================== */

async function loadTest(
  testId
) {

  const test =
    tests.find(
      item =>
        item.id ===
        testId
    );


  if (!test) {

    showError(
      "テストが見つかりません。"
    );

    return;

  }


  try {

    setStatus(
      "採点対象を確認しています..."
    );


    const [
      answersResult,
      boxesResult
    ] =
      await Promise.all([

        DB
          .from(
            "answer_sheets"
          )
          .select(
            "id",
            {
              count:"exact",
              head:true
            }
          )
          .eq(
            "test_id",
            testId
          ),

        DB
          .from(
            "layout_boxes"
          )
          .select(
            `
            id,
            box_type,
            label,
            points
            `
          )
          .eq(
            "test_id",
            testId
          )

      ]);


    if (
      answersResult.error
    ) {

      throw answersResult.error;

    }


    if (
      boxesResult.error
    ) {

      throw boxesResult.error;

    }


    const excluded =
      new Set([
        "QR",
        "氏名",
        "合計",
        "小計"
      ]);


    const questions =
      (
        boxesResult.data ||
        []
      )
        .filter(
          box =>
            String(
              box.box_type ||
              ""
            )
              .toLowerCase() ===
            "answer"
        )
        .filter(
          box =>
            !excluded.has(
              String(
                box.label ||
                ""
              ).trim()
            )
        );


    renderTest(
      test,
      answersResult.count || 0,
      questions
    );


  } catch (error) {

    showError(
      error.message ||
      "採点対象を取得できませんでした。"
    );

  }

}


/* =====================================================
   RENDER
===================================================== */

function renderTest(
  test,
  answerCount,
  questions
) {

  const encoded =
    encodeURIComponent(
      test.id
    );


  const totalPoints =
    questions.reduce(
      (
        sum,
        question
      ) =>
        sum +
        (
          Number(
            question.points
          ) || 0
        ),
      0
    );


  testArea.innerHTML = `

    <section class="test-card">


      <div class="test-title">

        ${escapeHtml(
          test.name
        )}

      </div>


      <div class="test-meta">

        ${escapeHtml(
          [
            test.subject,
            test.grade,
            test.class_name
          ]
            .filter(
              value =>
                value !== null &&
                value !== undefined &&
                String(
                  value
                ).trim() !== ""
            )
            .join(
              " / "
            )
        )}

      </div>


      <div class="answer-summary">

        <span>
          答案：
          <strong>
            ${answerCount}件
          </strong>
        </span>

        <span>
          設問：
          <strong>
            ${questions.length}問
          </strong>
        </span>

        <span>
          合計配点：
          <strong>
            ${formatNumber(
              totalPoints
            )}点
          </strong>
        </span>

      </div>


      <div class="test-actions">

        <a
          class="btn btn-primary"
          href="/teacher/marking/mark?test=${encoded}"
        >
          採点開始
        </a>


        <a
          class="btn"
          href="/teacher/tests/layout?test=${encoded}"
        >
          枠設定
        </a>


        <a
          class="btn"
          href="/teacher/tests/points?test=${encoded}"
        >
          配点設定
        </a>

      </div>


    </section>

  `;


  setStatus(
    "採点開始を押すと、答案選択を経由せず串刺し採点を開始します。"
  );

}


/* =====================================================
   CLEAR
===================================================== */

function clearArea() {

  testArea.innerHTML = `

    <div class="empty">
      テストを選択してください。
    </div>

  `;


  setStatus(
    "テストを選択してください。"
  );

}


/* =====================================================
   STATUS
===================================================== */

function setStatus(
  message,
  error = false
) {

  statusElement.textContent =
    message;


  statusElement.className =
    error
      ? "status error"
      : "status";

}


function showError(
  message
) {

  setStatus(
    message,
    true
  );


  testArea.innerHTML = `

    <div class="error-box">

      ${escapeHtml(
        message
      )}

    </div>

  `;

}


/* =====================================================
   FORMAT
===================================================== */

function formatNumber(
  value
) {

  const number =
    Number(
      value
    );


  if (
    !Number.isFinite(
      number
    )
  ) {

    return "0";

  }


  return Number.isInteger(
    number
  )
    ? String(
        number
      )
    : number.toFixed(
        1
      );

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(
  value
) {

  return String(
    value ??
    ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}

</script>


</body>

</html>
