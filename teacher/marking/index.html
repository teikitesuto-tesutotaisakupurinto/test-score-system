<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>採点 - テスト成績システム</title>

<link
  rel="stylesheet"
  href="/css/common.css"
>

<style>

.marking-main {
  max-width: 1500px;
  margin: 0 auto;
  padding: 22px;
}

.page-header {
  margin-bottom: 20px;
}

.page-header h1 {
  margin: 0;
  font-size: 24px;
}

.page-header p {
  margin: 7px 0 0;
  color: #666;
  font-size: 13px;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  margin-bottom: 15px;
}

.toolbar select {
  min-width: 360px;
  height: 40px;
  padding: 0 10px;
}

.status {
  padding: 10px 12px;
  margin-bottom: 15px;
  background: #f5f6f7;
  border: 1px solid #d5dbe0;
  font-size: 13px;
}

.answer-panel {
  display: none;
  background: #fff;
  border: 1px solid #d0d6dc;
}

.answer-panel.show {
  display: block;
}

.answer-panel-header {
  padding: 15px;
  border-bottom: 1px solid #d0d6dc;
  font-size: 17px;
  font-weight: 700;
}

.answer-table-wrap {
  overflow-x: auto;
}

.answer-table {
  width: 100%;
  border-collapse: collapse;
  min-width: 750px;
}

.answer-table th,
.answer-table td {
  border: 1px solid #d0d6dc;
  padding: 9px 10px;
  font-size: 13px;
  text-align: left;
  white-space: nowrap;
}

.answer-table th {
  background: #f3f5f7;
}

.student-no {
  font-weight: 700;
}

.state-before {
  color: #666;
}

.state-marking {
  color: #1769aa;
  font-weight: 700;
}

.state-done {
  color: #1769aa;
  font-weight: 700;
}

.empty {
  padding: 50px;
  text-align: center;
  color: #777;
}

@media (max-width: 700px) {

  .marking-main {
    padding: 14px;
  }

  .toolbar select {
    width: 100%;
    min-width: 0;
  }

}

</style>

</head>


<body>


<header class="topbar">

  <div class="system-name">
    テスト成績システム
  </div>

  <div class="topbar-space"></div>

  <span id="teacherName">
    -
  </span>

  <button
    id="logoutButton"
    class="logout-button"
    type="button"
  >
    ログアウト
  </button>

</header>


<main class="marking-main">


  <div class="page-header">

    <h1>
      採点
    </h1>

    <p>
      テストを選択すると、そのテストの答案を確認できます。
    </p>

  </div>


  <div class="toolbar">

    <select id="testSelect">

      <option value="">
        テストを選択してください
      </option>

    </select>


    <button
      id="startButton"
      class="btn btn-primary"
      type="button"
      disabled
    >
      採点開始
    </button>


    <button
      id="refreshButton"
      class="btn"
      type="button"
    >
      更新
    </button>

  </div>


  <div
    id="status"
    class="status"
  >
    テストを選択してください。
  </div>


  <section
    id="answerPanel"
    class="answer-panel"
  >

    <div
      id="answerPanelHeader"
      class="answer-panel-header"
    >
      このテストの答案
    </div>


    <div class="answer-table-wrap">

      <table class="answer-table">

        <thead>

          <tr>

            <th>
              生徒番号
            </th>

            <th>
              生徒名
            </th>

            <th>
              ページ数
            </th>

            <th>
              状態
            </th>

          </tr>

        </thead>


        <tbody
          id="answerTableBody"
        ></tbody>

      </table>

    </div>

  </section>


  <div
    id="emptyArea"
    class="empty"
  >
    テストを選択してください。
  </div>


</main>


<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="/js/config.js"></script>

<script src="/js/auth.js"></script>

<script src="/js/teacher/marking-index.js"></script>


</body>

</html>
