
<!doctype html>
<html lang="ja">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
  答案アップロード - テスト成績システム
</title>

<link
  rel="stylesheet"
  href="/css/style.css"
>

</head>


<body>


<!-- =====================================================
     共通ヘッダー
====================================================== -->

<header class="topbar">

  <div class="system-name">
    テスト成績システム
  </div>


  <div class="topbar-space"></div>


  <span id="teacherName">
    -
  </span>


  <button
    id="logoutButton"
    type="button"
    class="logout-button"
  >
    ログアウト
  </button>

</header>


<!-- =====================================================
     MAIN
====================================================== -->

<main class="main">


  <div class="top">

    <div>

      <h1>
        答案アップロード
      </h1>

      <p class="small muted">
        生徒の答案をアップロードします。
        PDF、JPEG、JPG、PNG、WEBP、ZIPに対応しています。
      </p>

    </div>

  </div>


  <!-- ===================================================
       UPLOAD CARD
  ==================================================== -->

  <div class="card">


    <!-- テスト -->

    <div class="form-row">

      <label for="test">
        テスト
      </label>


      <select id="test">

        <option value="">
          テストを選択してください
        </option>

      </select>

    </div>


    <!-- 答案種類 -->

    <div class="form-row">

      <label for="answerType">
        答案種類
      </label>


      <select id="answerType">

        <option value="student">
          生徒答案
        </option>


        <option value="model">
          解答用紙・模範解答
        </option>

      </select>

    </div>


    <!-- ファイル -->

    <div class="form-row">

      <label for="files">
        ファイル
      </label>


      <input
        id="files"
        type="file"
        multiple
        accept=".pdf,.jpg,.jpeg,.png,.webp,.zip"
      >

    </div>


    <p class="small muted">

      PDFはページ単位で処理します。

      <br>

      JPEG / JPG / PNG / WEBPは画像答案として処理します。

      <br>

      ZIPは内部の対応ファイルを展開して処理します。

    </p>


    <!-- ファイル一覧 -->

    <div
      id="fileList"
      class="file-list"
      hidden
    ></div>


    <!-- 操作 -->

    <div class="actions">

      <button
        id="uploadButton"
        type="button"
        class="primary"
      >
        アップロード
      </button>


      <button
        id="clearButton"
        type="button"
      >
        クリア
      </button>

    </div>


    <!-- 進捗 -->

    <div
      id="progressArea"
      hidden
    >

      <div class="progress-track">

        <div
          id="progressBar"
          class="progress-bar"
        ></div>

      </div>


      <p
        id="progressText"
        class="small muted"
      >
        待機中
      </p>

    </div>


    <!-- メッセージ -->

    <p
      id="message"
      class="message"
      aria-live="polite"
    ></p>


    <!-- 結果 -->

    <div
      id="result"
      hidden
    ></div>


  </div>


</main>


<!-- =====================================================
     LIBRARIES
====================================================== -->

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script
  src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"
></script>


<script
  src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"
></script>


<script
  src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"
></script>


<!-- 共通 -->

<script src="/js/config.js"></script>

<script src="/js/auth.js"></script>


<!-- 答案アップロード -->

<script src="/js/teacher/answers-upload.js"></script>


</body>

</html>
