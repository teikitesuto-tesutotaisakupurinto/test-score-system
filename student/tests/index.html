
<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    テスト成績 - テスト成績システム
  </title>


  <link
    rel="stylesheet"
    href="/css/common.css?v=20261126layout"
  >


  <link
    rel="stylesheet"
    href="/css/student-tests.css"
  >

</head>


<body>


<header class="topbar">

  <div class="system-name">
    テスト成績システム
  </div>


  <div class="topbar-space"></div>


  <div
    class="student-header-info"
  >

    <span
      id="studentName"
    >
      -
    </span>

  </div>


  <button
    id="logoutButton"
    class="logout-button"
    type="button"
  >
    ログアウト
  </button>

</header>



<main
  class="student-main"
>


  <div
    class="page-header"
  >

    <div>

      <h1>
        テスト成績
      </h1>


      <p
        class="page-description"
      >
        公開されたテストの答案と成績を確認できます。
      </p>

    </div>

  </div>



  <section
    class="student-test-section"
  >

    <div
      class="section-header"
    >

      <h2>
        公開済みテスト
      </h2>


      <button
        id="refreshButton"
        class="btn"
        type="button"
      >
        更新
      </button>

    </div>



    <div
      id="testList"
      class="student-test-grid"
    >

      <div
        class="loading-state"
      >
        読み込み中...
      </div>

    </div>

  </section>


</main>



<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script
  src="/js/config.js"
></script>


<script
  src="/js/auth.js"
></script>


<script
  src="/js/student/tests.js"
></script>



<script src="/js/common-sidebar.js?v=20261126layout"></script>
</body>

</html>
