
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  テスト作成 - テスト成績システム
</title>

<link
  rel="stylesheet"
  href="/css/common.css?v=20261126layout"
>

</head>


<body>


<header class="topbar">

<div class="system-name">
  テスト成績システム
</div>


<div class="topbar-space"></div>


<span id="teacherName">
  -
</span>


<button
id="logoutButton"
class="logout-button"
type="button"
>
  ログアウト
</button>

</header>


<div class="teacher-layout">


<aside class="sidebar">

<div class="sidebar-title">
  テスト
</div>


<a
href="/teacher/tests"
class="menu-link"
>
  テスト一覧
</a>


<a
href="/teacher/tests/new"
class="menu-link active"
>
  テスト作成
</a>

</aside>


<main class="main-content">


<div class="page-header">

<h1>
  テスト作成
</h1>

</div>


<div class="card">


<form id="testForm">


<div
style="
  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));
  gap:15px;
"
>


<div class="form-group">

<label for="testName">
  テスト名
</label>


<input
id="testName"
type="text"
required
maxlength="200"
placeholder="第1回定期テスト"
autocomplete="off"
>

</div>


<div class="form-group">

<label for="subject">
  教科
</label>


<input
id="subject"
type="text"
maxlength="50"
placeholder="数学"
autocomplete="off"
>

</div>


<div class="form-group">

<label for="grade">
  学年
</label>


<input
id="grade"
type="text"
maxlength="30"
placeholder="中3"
autocomplete="off"
>

</div>


<div class="form-group">

<label for="className">
  クラス
</label>


<input
id="className"
type="text"
maxlength="50"
placeholder="1組"
autocomplete="off"
>

</div>


<div class="form-group">

<label for="testDate">
  実施日
</label>


<input
id="testDate"
type="date"
>

</div>


<div class="form-group">

<label for="maxScore">
  満点
</label>


<input
id="maxScore"
type="number"
min="0"
step="0.1"
value="100"
required
>

</div>


</div>


<div
id="message"
style="
  min-height:22px;
  margin-bottom:12px;
"
aria-live="polite"
>
</div>


<div
style="
  display:flex;
  gap:8px;
"
>

<button
id="saveButton"
type="submit"
class="btn btn-primary"
>
テストを作成
</button>


<a
href="/teacher/tests"
class="btn"
>
キャンセル
</a>

</div>


</form>


</div>


</main>


</div>


<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script
src="/js/config.js?v=20261116"
></script>


<script
src="/js/auth.js?v=20261126"
></script>


<script
src="/js/teacher/test-new.js?v=20261116"
></script>


<script src="/js/common-sidebar.js?v=20261126layout"></script>
</body>

</html>
