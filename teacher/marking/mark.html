
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
  テスト採点 - テスト成績システム
</title>

<link
  rel="stylesheet"
  href="/css/common.css"
>

<style>

/* =========================================================
   採点画面
========================================================= */

.marking-main {
  max-width: 1500px;
  margin: 0 auto;
  padding: 22px;
}


/* =========================================================
   上部操作
========================================================= */

.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-bottom: 15px;
}


/* =========================================================
   ステータス
========================================================= */

.status {
  padding: 10px 12px;
  margin-bottom: 15px;

  background: #f5f6f7;

  border: 1px solid #d5dbe0;

  font-size: 13px;
}


/* =========================================================
   進捗
========================================================= */

.progress {
  display: none;

  margin-bottom: 15px;
  padding: 14px;

  background: #fff;

  border: 1px solid #d0d6dc;
}

.progress.show {
  display: block;
}

.progress-track {
  width: 100%;
  height: 8px;

  background: #e1e5e8;

  border-radius: 4px;

  overflow: hidden;
}

.progress-bar {
  width: 0;
  height: 100%;

  background: #1769aa;

  transition:
    width .2s ease;
}

.progress-text {
  margin-top: 7px;

  color: #666;

  font-size: 12px;
}


/* =========================================================
   問題ヘッダー
========================================================= */

.question-header {
  display: flex;

  flex-wrap: wrap;

  justify-content: space-between;

  align-items: center;

  gap: 12px;

  padding: 15px;

  margin-bottom: 15px;

  background: #fff;

  border: 1px solid #d0d6dc;
}

.question-title {
  font-size: 20px;
  font-weight: 700;
}

.question-meta {
  margin-top: 5px;

  color: #666;

  font-size: 13px;
}

.navigation {
  display: flex;

  flex-wrap: wrap;

  gap: 8px;
}


/* =========================================================
   答案一覧
========================================================= */

.answer-table-wrap {
  overflow-x: auto;

  background: #fff;

  border: 1px solid #d0d6dc;
}

.answer-table {
  width: 100%;

  min-width: 1050px;

  border-collapse: collapse;
}

.answer-table th,
.answer-table td {
  border: 1px solid #d0d6dc;

  padding: 9px;

  vertical-align: top;

  font-size: 13px;
}

.answer-table th {
  background: #f3f5f7;

  font-weight: 700;

  white-space: nowrap;
}


/* =========================================================
   生徒
========================================================= */

.student-cell {
  width: 150px;
  min-width: 150px;
}

.student-no {
  font-weight: 700;
}

.student-name {
  margin-top: 4px;

  color: #555;
}


/* =========================================================
   答案画像
========================================================= */

.answer-cell {
  width: 520px;
  min-width: 520px;
}

.answer-viewer {
  position: relative;

  overflow: hidden;

  width: 100%;

  min-height: 160px;

  background: #f7f8f9;

  border: 1px solid #e0e3e6;
}

.answer-viewer img {
  position: absolute;

  max-width: none;
  max-height: none;

  margin: 0;

  user-select: none;

  -webkit-user-drag: none;
}

.answer-error {
  padding: 40px 10px;

  text-align: center;

  color: #b42318;
}


/* =========================================================
   得点
========================================================= */

.score-cell {
  width: 150px;
  min-width: 150px;

  text-align: center;
}

.score-input {
  width: 90px;

  height: 40px;

  padding: 0 8px;

  font-size: 17px;

  text-align: center;
}

.score-save {
  margin-top: 7px;
}

.score-state {
  margin-top: 7px;

  color: #666;

  font-size: 12px;
}

.score-state.marked {
  color: #1769aa;

  font-weight: 700;
}

.score-state.error {
  color: #b42318;

  font-weight: 700;
}


/* =========================================================
   警告
========================================================= */

.warning {
  display: none;

  margin-top: 7px;

  padding: 7px;

  color: #b42318;

  background: #fff4f2;

  border: 1px solid #efc2bc;

  font-size: 12px;
}

.warning.show {
  display: block;
}


/* =========================================================
   完了
========================================================= */

.complete {
  display: none;

  margin-top: 15px;

  padding: 18px;

  background: #fff;

  border: 1px solid #d0d6dc;
}

.complete.show {
  display: block;
}

.complete-title {
  margin-bottom: 8px;

  font-size: 18px;

  font-weight: 700;
}


/* =========================================================
   空表示
========================================================= */

.empty {
  padding: 50px;

  text-align: center;

  color: #777;
}


/* =========================================================
   スマホ
========================================================= */

@media (max-width: 700px) {

  .marking-main {
    padding: 14px;
  }

  .answer-cell {
    width: 400px;
    min-width: 400px;
  }

}

</style>

</head>


<body>


<!-- =====================================================
     共通上部バー
====================================================== -->

<header class="topbar">

  <div class="system-name">
    テスト成績システム
  </div>


  <div class="topbar-space"></div>


  <span id="teacherName">
    -
  </span>


  <button
    id="logoutButton"
    class="logout-button"
    type="button"
  >
    ログアウト
  </button>

</header>


<!-- =====================================================
     メイン
====================================================== -->

<main class="marking-main">


  <!-- ===================================================
       操作
  ==================================================== -->

  <div class="toolbar">

    <a
      href="/teacher/marking"
      class="btn"
    >
      採点一覧へ戻る
    </a>


    <button
      id="refreshButton"
      class="btn"
      type="button"
    >
      更新
    </button>

  </div>


  <!-- ===================================================
       状態
  ==================================================== -->

  <div
    id="status"
    class="status"
    aria-live="polite"
  >
    JavaScriptを起動しています...
  </div>


  <!-- ===================================================
       進捗
  ==================================================== -->

  <div
    id="progress"
    class="progress"
  >

    <div
      id="progressText"
      class="progress-text"
    >
      採点状況を取得しています...
    </div>


    <div class="progress-track">

      <div
        id="progressBar"
        class="progress-bar"
      ></div>

    </div>

  </div>


  <!-- ===================================================
       問題
  ==================================================== -->

  <section
    class="question-header"
  >

    <div>

      <div
        id="questionTitle"
        class="question-title"
      >
        -
      </div>


      <div
        id="questionMeta"
        class="question-meta"
      >
        -
      </div>

    </div>


    <div class="navigation">

      <button
        id="previousButton"
        class="btn"
        type="button"
        disabled
      >
        前の問題
      </button>


      <button
        id="nextButton"
        class="btn btn-primary"
        type="button"
      >
        次の問題
      </button>

    </div>

  </section>


  <!-- ===================================================
       答案
  ==================================================== -->

  <div
    id="answerTableWrap"
    class="answer-table-wrap"
  >

    <div class="empty">
      答案を読み込んでいます...
    </div>

  </div>


  <!-- ===================================================
       完了
  ==================================================== -->

  <div
    id="complete"
    class="complete"
  >

    <div class="complete-title">
      全答案・全設問の採点が完了しました。
    </div>


    <div>
      成績・偏差値・順位の処理がすべて完了するまで公開しません。
    </div>

  </div>


</main>


<!-- =====================================================
     Supabase
====================================================== -->

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<!-- =====================================================
     共通
====================================================== -->

<script src="/js/config.js"></script>

<script src="/js/auth.js"></script>


<!-- =====================================================
     採点
====================================================== -->

<script
  src="/js/teacher/marking.js?v=20261115"
></script>


</body>

</html>
