
<!doctype html>
<html lang="ja">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
  テスト管理 - テスト成績システム
</title>

<link
  rel="stylesheet"
  href="/css/common.css"
>

<style>

.tests-main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 22px;
}

.create-card {
  margin-bottom: 18px;
}

.form-grid {
  display: grid;

  grid-template-columns:
    2fr
    1fr
    1fr;

  gap: 10px;
}

.form-group label {
  display: block;

  margin-bottom: 6px;

  font-size: 13px;

  font-weight: 700;
}

.form-group input {
  width: 100%;

  padding: 9px 10px;

  border: 1px solid #b8c1c9;

  border-radius: 4px;

  background: #fff;

  outline: none;
}

.form-group input:focus {
  border-color: #1769aa;
}

.create-actions {
  margin-top: 14px;
}

.status {
  padding: 10px 12px;

  margin-bottom: 15px;

  background: #f5f6f7;

  border: 1px solid #d5dbe0;

  font-size: 13px;
}

.status.error {
  color: #b42318;
}

.table-wrap {
  overflow-x: auto;

  background: #fff;

  border: 1px solid #d0d6dc;
}

.tests-table {
  width: 100%;

  border-collapse: collapse;
}

.tests-table th,
.tests-table td {
  border: 1px solid #d0d6dc;

  padding: 9px 10px;

  font-size: 13px;

  text-align: left;

  vertical-align: middle;
}

.tests-table th {
  background: #f3f5f7;

  font-weight: 700;
}

.actions {
  display: flex;

  flex-wrap: wrap;

  gap: 6px;
}

.actions .btn {
  white-space: nowrap;
}

.empty {
  padding: 50px;

  text-align: center;

  color: #777;
}


@media (max-width: 800px) {

  .form-grid {
    grid-template-columns: 1fr;
  }

}


@media (max-width: 600px) {

  .tests-main {
    padding: 14px;
  }

}

</style>

</head>


<body>


<header class="topbar">

  <div class="system-name">
    テスト成績システム
  </div>


  <div class="topbar-space"></div>


  <span id="teacherName">
    -
  </span>


  <button
    id="logoutButton"
    class="logout-button"
    type="button"
  >
    ログアウト
  </button>

</header>


<main class="tests-main">


  <div class="page-header">

    <h1>
      テスト管理
    </h1>

  </div>


  <!-- =================================================
       新規テスト
  ================================================== -->

  <section class="card create-card">

    <h2>
      新しいテスト
    </h2>


    <div class="form-grid">


      <div class="form-group">

        <label for="testName">
          テスト名
        </label>

        <input
          id="testName"
          type="text"
          autocomplete="off"
        >

      </div>


      <div class="form-group">

        <label for="subject">
          教科
        </label>

        <input
          id="subject"
          type="text"
          autocomplete="off"
        >

      </div>


      <div class="form-group">

        <label for="grade">
          学年
        </label>

        <input
          id="grade"
          type="text"
          autocomplete="off"
        >

      </div>


    </div>


    <div class="create-actions">

      <button
        id="createButton"
        class="btn btn-primary"
        type="button"
      >
        新しいテストを作成
      </button>

    </div>

  </section>


  <!-- =================================================
       状態
  ================================================== -->

  <div
    id="status"
    class="status"
  >
    テスト一覧を読み込んでいます...
  </div>


  <!-- =================================================
       テスト一覧
  ================================================== -->

  <section class="table-wrap">

    <table class="tests-table">

      <thead>

        <tr>

          <th>
            テスト名
          </th>

          <th>
            教科
          </th>

          <th>
            学年
          </th>

          <th>
            操作
          </th>

        </tr>

      </thead>


      <tbody
        id="testRows"
      >

        <tr>

          <td
            colspan="4"
            class="empty"
          >
            読み込み中...
          </td>

        </tr>

      </tbody>

    </table>

  </section>


</main>


<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="/js/config.js"></script>

<script src="/js/auth.js"></script>


<script>

"use strict";


let DB =
  window.SB ||
  window.supabaseClient;


let currentProfile =
  null;


const teacherName =
  document.getElementById(
    "teacherName"
  );

const statusElement =
  document.getElementById(
    "status"
  );

const rowsElement =
  document.getElementById(
    "testRows"
  );

const createButton =
  document.getElementById(
    "createButton"
  );


/* =====================================================
   INIT
===================================================== */

(async function () {

  try {

    if (!DB) {

      throw new Error(
        "Supabase接続がありません。"
      );

    }


    const result =
      await requireRole(
        "teacher"
      );


    currentProfile =
      result?.profile ||
      result ||
      {};


    teacherName.textContent =
      currentProfile.name ||
      "先生";


    setupEvents();

    await loadTests();


  } catch (error) {

    showError(
      error.message ||
      "テスト管理を読み込めませんでした。"
    );

  }

})();


/* =====================================================
   EVENTS
===================================================== */

function setupEvents() {

  createButton.addEventListener(
    "click",
    createTest
  );


  document
    .getElementById(
      "logoutButton"
    )
    ?.addEventListener(
      "click",
      async () => {

        if (
          typeof logout ===
          "function"
        ) {

          await logout();

          return;

        }


        if (
          typeof signOut ===
          "function"
        ) {

          await signOut();

        }

      }
    );

}


/* =====================================================
   LOAD TESTS
===================================================== */

async function loadTests() {

  statusElement.textContent =
    "テスト一覧を読み込んでいます...";


  const {
    data,
    error
  } =
    await DB
      .from(
        "tests"
      )
      .select(
        `
        id,
        name,
        subject,
        grade,
        class_name,
        created_at
        `
      )
      .order(
        "created_at",
        {
          ascending:
            false
        }
      );


  if (error) {

    throw error;

  }


  renderTests(
    data ||
    []
  );


  statusElement.textContent =
    `${(
      data ||
      []
    ).length}件のテストがあります。`;

}


/* =====================================================
   RENDER
===================================================== */

function renderTests(
  tests
) {

  rowsElement.innerHTML =
    "";


  if (!tests.length) {

    rowsElement.innerHTML = `

      <tr>

        <td
          colspan="4"
          class="empty"
        >
          テストがありません。
        </td>

      </tr>

    `;

    return;

  }


  for (
    const test
    of tests
  ) {

    const row =
      document.createElement(
        "tr"
      );


    row.innerHTML = `

      <td>
        ${escapeHtml(
          test.name
        )}
      </td>


      <td>
        ${escapeHtml(
          test.subject ||
          ""
        )}
      </td>


      <td>
        ${escapeHtml(
          test.grade ||
          ""
        )}
      </td>


      <td>

        <div class="actions">


          <a
            class="btn"
            href="/teacher/tests/layout?test=${encodeURIComponent(
              test.id
            )}"
          >
            枠設定
          </a>


          <a
            class="btn"
            href="/teacher/tests/points?test=${encodeURIComponent(
              test.id
            )}"
          >
            配点設定
          </a>


          <a
            class="btn"
            href="/teacher/marking?test=${encodeURIComponent(
              test.id
            )}"
          >
            採点
          </a>


        </div>

      </td>

    `;


    rowsElement.appendChild(
      row
    );

  }

}


/* =====================================================
   CREATE TEST
===================================================== */

async function createTest() {

  const name =
    document
      .getElementById(
        "testName"
      )
      .value
      .trim();


  const subject =
    document
      .getElementById(
        "subject"
      )
      .value
      .trim();


  const grade =
    document
      .getElementById(
        "grade"
      )
      .value
      .trim();


  if (!name) {

    showError(
      "テスト名を入力してください。"
    );

    return;

  }


  createButton.disabled =
    true;


  createButton.textContent =
    "作成中...";


  try {

    /*
     * created_by がDBに存在する構成なら使用。
     * RLS等で問題になる場合は
     * nullで作成できる既存構成に合わせる。
     */

    const userId =
      currentProfile?.user?.id ||
      currentProfile?.id ||
      null;


    const insertData = {

      name,

      subject:
        subject ||
        null,

      grade:
        grade ||
        null

    };


    /*
     * created_by が分かっている場合だけ追加。
     */

    if (userId) {

      insertData.created_by =
        userId;

    }


    const {
      data,
      error
    } =
      await DB
        .from(
          "tests"
        )
        .insert(
          insertData
        )
        .select(
          "id"
        )
        .single();


    if (error) {

      throw error;

    }


    /*
     * 作成後はすぐ枠設定へ。
     */

    location.href =
      `/teacher/tests/layout?test=${encodeURIComponent(
        data.id
      )}`;


  } catch (error) {

    console.error(
      error
    );


    showError(
      error.message ||
      "テストを作成できませんでした。"
    );


    createButton.disabled =
      false;


    createButton.textContent =
      "新しいテストを作成";

  }

}


/* =====================================================
   ERROR
===================================================== */

function showError(
  message
) {

  statusElement.textContent =
    message;

  statusElement.classList.add(
    "error"
  );

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(
  value
) {

  return String(
    value ??
    ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}

</script>


</body>

</html>
