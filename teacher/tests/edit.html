
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>テスト編集 - テスト成績システム</title>

<link
  rel="stylesheet"
  href="/css/common.css"
>

<style>

.main {
  max-width:800px;
  margin:0 auto;
  padding:25px;
}

.card {
  background:#fff;
  border:1px solid #d5dbe0;
  padding:20px;
}

.field {
  margin-bottom:16px;
}

.field label {
  display:block;
  margin-bottom:6px;
  font-size:13px;
  font-weight:700;
}

.field input,
.field select {
  width:100%;
  height:42px;
  padding:0 10px;
  box-sizing:border-box;
}

.actions {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.message {
  margin-bottom:15px;
  padding:10px;
  display:none;
}

.message.error {
  display:block;
  background:#fff4f2;
  color:#b42318;
  border:1px solid #efc2bc;
}

</style>
</head>


<body>

<header class="topbar">

  <div class="system-name">
    テスト成績システム
  </div>

  <div class="topbar-space"></div>

  <span id="teacherName">-</span>

  <button
    id="logoutButton"
    class="logout-button"
    type="button"
  >
    ログアウト
  </button>

</header>


<main class="main">

  <h1 id="pageTitle">
    テスト作成
  </h1>


  <section class="card">

    <div
      id="message"
      class="message"
    ></div>


    <div class="field">

      <label for="name">
        テスト名
      </label>

      <input
        id="name"
        type="text"
        required
      >

    </div>


    <div class="field">

      <label for="subject">
        教科
      </label>

      <input
        id="subject"
        type="text"
      >

    </div>


    <div class="field">

      <label for="grade">
        学年
      </label>

      <input
        id="grade"
        type="text"
      >

    </div>


    <div class="field">

      <label for="className">
        クラス
      </label>

      <input
        id="className"
        type="text"
      >

    </div>


    <div class="actions">

      <button
        id="saveButton"
        class="btn btn-primary"
        type="button"
      >
        保存
      </button>


      <button
        id="pagesButton"
        class="btn"
        type="button"
        disabled
      >
        解答用紙・枠設定
      </button>


      <button
        id="backButton"
        class="btn"
        type="button"
      >
        戻る
      </button>

    </div>

  </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<script src="/js/auth.js"></script>


<script>

(async function () {

  const profile =
    await requireTeacher();

  if (!profile) {
    return;
  }


  document.getElementById(
    "teacherName"
  ).textContent =
    profile.name || "先生";


  document.getElementById(
    "logoutButton"
  ).addEventListener(
    "click",
    logout
  );


  const params =
    new URLSearchParams(
      window.location.search
    );


  const testId =
    params.get("id");


  const nameInput =
    document.getElementById("name");

  const subjectInput =
    document.getElementById("subject");

  const gradeInput =
    document.getElementById("grade");

  const classInput =
    document.getElementById("className");

  const message =
    document.getElementById("message");

  const pagesButton =
    document.getElementById("pagesButton");


  function showError(text) {

    message.textContent =
      text;

    message.className =
      "message error";

  }


  function clearError() {

    message.textContent =
      "";

    message.className =
      "message";

  }


  async function loadTest() {

    if (!testId) {
      return;
    }


    document.getElementById(
      "pageTitle"
    ).textContent =
      "テスト編集";


    const {
      data,
      error
    } =
      await supabaseClient
        .from("tests")
        .select(`
          id,
          name,
          subject,
          grade,
          class_name
        `)
        .eq(
          "id",
          testId
        )
        .single();


    if (error) {

      showError(
        error.message
      );

      return;

    }


    nameInput.value =
      data.name || "";

    subjectInput.value =
      data.subject || "";

    gradeInput.value =
      data.grade || "";

    classInput.value =
      data.class_name || "";


    pagesButton.disabled =
      false;

  }


  document.getElementById(
    "saveButton"
  ).addEventListener(
    "click",
    async () => {

      clearError();


      const name =
        nameInput.value.trim();


      if (!name) {

        showError(
          "テスト名を入力してください。"
        );

        return;

      }


      const payload = {

        name,

        subject:
          subjectInput.value.trim() ||
          null,

        grade:
          gradeInput.value.trim() ||
          null,

        class_name:
          classInput.value.trim() ||
          null

      };


      let result;


      if (testId) {

        result =
          await supabaseClient
            .from("tests")
            .update(payload)
            .eq(
              "id",
              testId
            )
            .select("id")
            .single();

      } else {

        result =
          await supabaseClient
            .from("tests")
            .insert(payload)
            .select("id")
            .single();

      }


      if (result.error) {

        showError(
          result.error.message
        );

        return;

      }


      const savedId =
        result.data.id;


      location.href =
        `/teacher/tests/edit?id=${encodeURIComponent(
          savedId
        )}`;

    }
  );


  pagesButton.addEventListener(
    "click",
    () => {

      if (!testId) {
        return;
      }


      location.href =
        `/teacher/tests/pages?test=${encodeURIComponent(
          testId
        )}`;

    }
  );


  document.getElementById(
    "backButton"
  ).addEventListener(
    "click",
    () => {

      location.href =
        "/teacher/tests";

    }
  );


  await loadTest();

})();

</script>

</body>
</html>
