
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  クラス管理 - テスト成績システム
</title>

<link
  rel="stylesheet"
  href="/css/common.css"
>

</head>


<body>


<header class="topbar">

  <div class="system-name">
    テスト成績システム
  </div>


  <div class="topbar-space"></div>


  <span id="teacherName">
    -
  </span>


  <button
    id="logoutButton"
    class="logout-button"
    type="button"
  >
    ログアウト
  </button>

</header>


<div class="teacher-layout">


<aside class="sidebar">


  <div class="sidebar-title">
    管理
  </div>


  <a
    href="/teacher/dashboard"
    class="menu-link"
  >
    ダッシュボード
  </a>


  <div class="sidebar-title">
    生徒
  </div>


  <a
    href="/teacher/students"
    class="menu-link"
  >
    生徒一覧
  </a>


  <a
    href="/teacher/students/new"
    class="menu-link"
  >
    生徒登録
  </a>


  <a
    href="/teacher/students/qr"
    class="menu-link"
  >
    QRシール発行
  </a>


  <div class="sidebar-title">
    クラス
  </div>


  <a
    href="/teacher/classes"
    class="menu-link active"
  >
    クラス管理
  </a>


  <a
    href="/teacher/classes/new"
    class="menu-link"
  >
    クラス作成
  </a>


  <div class="sidebar-title">
    テスト
  </div>


  <a
    href="/teacher/tests"
    class="menu-link"
  >
    テスト一覧
  </a>


  <a
    href="/teacher/tests/new"
    class="menu-link"
  >
    テスト作成
  </a>


  <div class="sidebar-title">
    答案
  </div>


  <a
    href="/teacher/answers/upload"
    class="menu-link"
  >
    答案アップロード
  </a>


  <div class="sidebar-title">
    採点
  </div>


  <a
    href="/teacher/marking"
    class="menu-link"
  >
    デジタル採点
  </a>


  <div class="sidebar-title">
    成績
  </div>


  <a
    href="/teacher/results/summary"
    class="menu-link"
  >
    結果総括表
  </a>


  <a
    href="/teacher/results/return"
    class="menu-link"
  >
    答案返却
  </a>


</aside>


<main class="main-content">


  <div class="page-header">

    <h1>
      クラス管理
    </h1>


    <div
      style="
        margin-left:auto;
      "
    >

      <a
        href="/teacher/classes/new"
        class="btn btn-primary"
      >
        クラス作成
      </a>

    </div>

  </div>


  <div
    id="classMessage"
    style="
      min-height:22px;
      margin-bottom:10px;
    "
    aria-live="polite"
  >
  </div>


  <div class="card">


    <div
      style="
        overflow:auto;
      "
    >


      <table class="table">


        <thead>

          <tr>

            <th>
              学年
            </th>

            <th>
              クラス
            </th>

            <th>
              生徒数
            </th>

            <th>
              操作
            </th>

          </tr>

        </thead>


        <tbody id="classRows">

          <tr>

            <td
              colspan="4"
              style="
                text-align:center;
              "
            >
              読み込み中...
            </td>

          </tr>

        </tbody>


      </table>


    </div>


  </div>


</main>


</div>


<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script
  src="/js/config.js?v=20261116"
></script>


<script
  src="/js/auth.js?v=20261126"
></script>


<script
  src="/js/teacher/classes.js?v=20261116"
></script>


<script src="/js/common-sidebar.js?v=20261126"></script>
</body>

</html>
