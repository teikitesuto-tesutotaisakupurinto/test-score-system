
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>解答用紙・枠設定 - テスト成績システム</title>

<link
  rel="stylesheet"
  href="/css/common.css"
>

<style>

.main {
  max-width:1400px;
  margin:0 auto;
  padding:20px;
}

.toolbar {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
  margin-bottom:15px;
}

.toolbar input {
  height:40px;
}

.viewer {
  background:#dfe3e8;
  padding:20px;
  overflow:auto;
  min-height:500px;
}

.page {
  position:relative;
  width:min(100%,1000px);
  margin:0 auto 25px;
  background:#fff;
  box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.page canvas {
  display:block;
  width:100%;
  height:auto;
}

.layer {
  position:absolute;
  inset:0;
}

.box {
  position:absolute;
  border:2px solid #d00000;
  background:rgba(208,0,0,.06);
  cursor:move;
}

.box.selected {
  border-color:#06c;
}

.box-label {
  position:absolute;
  top:-24px;
  left:0;
  padding:3px 6px;
  background:#333;
  color:#fff;
  font-size:12px;
  white-space:nowrap;
}

.resize {
  position:absolute;
  right:-5px;
  bottom:-5px;
  width:10px;
  height:10px;
  background:#333;
  cursor:nwse-resize;
}

.panel {
  position:fixed;
  right:20px;
  bottom:20px;
  width:300px;
  padding:15px;
  background:#fff;
  border:1px solid #ccc;
  box-shadow:0 4px 20px rgba(0,0,0,.18);
  z-index:20;
}

.panel[hidden] {
  display:none;
}

.panel label {
  display:block;
  margin-top:10px;
  font-size:12px;
  font-weight:700;
}

.panel input {
  width:100%;
  height:36px;
  box-sizing:border-box;
}

</style>
</head>


<body>

<header class="topbar">

<div class="system-name">
テスト成績システム
</div>

<div class="topbar-space"></div>

<span id="teacherName">-</span>

<button
id="logoutButton"
class="logout-button"
type="button"
>
ログアウト
</button>

</header>


<main class="main">

<h1>
解答用紙・枠設定
</h1>


<div class="toolbar">

<input
id="answerFile"
type="file"
accept=".pdf,.jpg,.jpeg,.png,.webp"
>


<button
id="uploadButton"
class="btn btn-primary"
type="button"
>
解答用紙を登録
</button>


<button
id="saveButton"
class="btn btn-primary"
type="button"
>
枠を保存
</button>


<button
id="deleteButton"
class="btn"
type="button"
>
選択枠を削除
</button>


<button
id="backButton"
class="btn"
type="button"
>
戻る
</button>

</div>


<div
id="status"
style="
padding:10px;
margin-bottom:15px;
background:#f5f6f7;
border:1px solid #d5dbe0;
"
>
読み込み中...
</div>


<div
id="viewer"
class="viewer"
></div>


<aside
id="panel"
class="panel"
hidden
>

<strong>
解答欄設定
</strong>


<label>
設問名
</label>

<input
id="label"
type="text"
placeholder="問1"
>


<label>
配点
</label>

<input
id="points"
type="number"
min="0"
step="0.1"
value="0"
>


<label>
設問ID
</label>

<input
id="questionId"
type="text"
>


<div
style="
display:flex;
gap:8px;
margin-top:15px;
"
>

<button
id="applyButton"
class="btn btn-primary"
type="button"
>
反映
</button>

<button
id="closeButton"
class="btn"
type="button"
>
閉じる
</button>

</div>

</aside>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<script src="/js/auth.js"></script>


<script>

(async function () {

  const profile =
    await requireTeacher();

  if (!profile) {
    return;
  }


  document.getElementById(
    "teacherName"
  ).textContent =
    profile.name || "先生";


  document.getElementById(
    "logoutButton"
  ).addEventListener(
    "click",
    logout
  );


  /*
    Clean URL:
    /teacher/tests/pages?test=UUID
  */

  const testId =
    new URLSearchParams(
      window.location.search
    ).get("test");


  if (!testId) {

    document.getElementById(
      "status"
    ).textContent =
      "テストIDが指定されていません。";


    return;

  }


  /*
    実際の枠設定処理は
    test-pages.js / answers-regions.js
    のどちらか一方だけを使用。

    新方式では
    test-pages.jsを使用。
  */

  window.__TEST_ID__ =
    testId;


  /*
    既存のtest-pages.jsが
    URLのtestを読む構成でない場合のため、
    グローバル値を設定。
  */

})();

</script>


<script src="/js/teacher/test-pages.js"></script>

</body>
</html>
