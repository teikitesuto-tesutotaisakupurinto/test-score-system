
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  枠設定 - テスト成績システム
</title>

<link
  rel="stylesheet"
  href="/css/common.css"
>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #eef2f5;
}

.app {
  min-height: 100vh;
  display: flex;
}

.side {
  width: 220px;
  flex-shrink: 0;
  background: #fff;
  border-right: 1px solid #d0d6dc;
  padding: 15px;
}

.side h2 {
  margin: 0 0 15px;
  font-size: 17px;
}

.side a {
  display: block;
  padding: 9px 10px;
  margin-bottom: 4px;
  color: #333;
  text-decoration: none;
  border-radius: 4px;
}

.side a:hover {
  background: #f0f3f5;
}

.side a.active {
  background: #e5edf4;
  font-weight: 700;
}

.main {
  flex: 1;
  min-width: 0;
}

.layout-main {
  padding: 18px;
}

.status {
  min-height: 40px;
  margin-bottom: 12px;
  padding: 10px 12px;
  background: #fff;
  border: 1px solid #d0d6dc;
  white-space: pre-wrap;
  font-size: 13px;
}

.card {
  margin-bottom: 14px;
  padding: 14px;
  background: #fff;
  border: 1px solid #d0d6dc;
  border-radius: 4px;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
}

.layout-canvas {
  min-height: 650px;
  overflow: auto;
  padding: 20px;
  background: #dfe5eb;
  border: 1px solid #c9d0d6;
}

.layout-page {
  position: relative;
  width: min(100%, 1100px);
  margin: 0 auto 25px;
  background: #fff;
  box-shadow: 0 2px 10px rgba(0,0,0,.14);
}

.layout-page img {
  display: block;
  width: 100%;
  height: auto;
}

.layout-layer {
  position: absolute;
  inset: 0;
  touch-action: none;
}

.layout-box {
  position: absolute;
  border: 2px solid #d00000;
  background: rgba(208,0,0,.06);
  cursor: move;
}

.layout-box.selected {
  border-color: #1769aa;
  background: rgba(23,105,170,.08);
}

.layout-box-label {
  position: absolute;
  left: 0;
  top: -23px;
  padding: 3px 6px;
  background: #333;
  color: #fff;
  font-size: 11px;
  line-height: 1.2;
  white-space: nowrap;
  pointer-events: none;
}

.resize-handle {
  position: absolute;
  right: -6px;
  bottom: -6px;
  width: 12px;
  height: 12px;
  background: #333;
  border: 1px solid #fff;
  cursor: nwse-resize;
}

.drag-preview {
  position: absolute;
  z-index: 999;
  border: 2px dashed #d00000;
  background: rgba(208,0,0,.08);
  pointer-events: none;
}

.question-list {
  display: grid;
  gap: 6px;
}

.question-row {
  display: grid;
  grid-template-columns: 1fr 120px 100px;
  gap: 8px;
  align-items: center;
  padding: 8px;
  border: 1px solid #d8dde1;
}

.question-row input {
  width: 100%;
  height: 34px;
}

.box-list {
  display: grid;
  gap: 5px;
}

.box-row {
  display: grid;
  grid-template-columns: 1fr 100px 100px;
  gap: 8px;
  align-items: center;
  padding: 7px 8px;
  border: 1px solid #d8dde1;
  font-size: 12px;
}

.box-row.selected {
  background: #edf5fb;
  border-color: #1769aa;
}

.total {
  font-weight: 700;
}

.empty {
  padding: 45px 20px;
  text-align: center;
  color: #777;
}

@media(max-width:900px) {

  .side {
    width: 180px;
  }

  .question-row {
    grid-template-columns: 1fr;
  }

  .box-row {
    grid-template-columns: 1fr;
  }

}

@media(max-width:650px) {

  .app {
    display: block;
  }

  .side {
    width: 100%;
    border-right: 0;
    border-bottom: 1px solid #d0d6dc;
  }

}

</style>

</head>


<body>


<div class="app">


<aside class="side">

  <h2>
    テスト設定
  </h2>


  <a
    href="/teacher/tests"
  >
    テスト一覧
  </a>


  <a
    id="pointsLink"
    href="#"
  >
    配点設定
  </a>


  <a
    href="/teacher/answers/regions"
  >
    答案クロップ
  </a>


  <a
    href="/teacher/marking"
  >
    デジタル採点
  </a>


  <a
    href="/teacher/results/summary"
  >
    成績処理
  </a>


  <button
    id="logoutButton"
    type="button"
    class="btn"
  >
    ログアウト
  </button>

</aside>


<main class="main layout-main">


<div
  id="status"
  class="status"
>
  枠設定を起動しています...
</div>


<div class="card">


<div class="toolbar">


<input
  id="file"
  type="file"
  accept=".pdf,.png,.jpg,.jpeg,.webp"
>


<button
  id="questionMode"
  type="button"
  class="btn btn-primary"
>
  解答欄
</button>


<button
  id="qrMode"
  type="button"
  class="btn"
>
  QR
</button>


<button
  id="nameMode"
  type="button"
  class="btn"
>
  氏名
</button>


<button
  id="saveButton"
  type="button"
  class="btn btn-primary"
>
  保存
</button>


<button
  id="nextPoints"
  type="button"
  class="btn btn-primary"
>
  配点設定へ
</button>


</div>


</div>


<div
  id="canvasWrap"
  class="layout-canvas"
>

<div class="empty">
  解答用紙を読み込んでください。
</div>

</div>


<div class="card">


<h2>
  解答欄一覧
</h2>


<div
  id="questionList"
  class="question-list"
>

<div class="empty">
  まだ解答欄がありません。
</div>

</div>


<button
  id="addQuestion"
  type="button"
  class="btn btn-primary"
>
  解答欄を追加
</button>


<div
  id="total"
  class="total"
>
  合計配点：0点
</div>


</div>


<div class="card">


<h2>
  枠一覧
</h2>


<div
  id="boxList"
  class="box-list"
>

<div class="empty">
  枠がありません。
</div>

</div>


</div>


</main>


</div>


<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script
  src="/js/config.js?v=20261116"
></script>


<script
  src="/js/auth.js?v=20261116"
></script>


<script
  src="/js/teacher/test-layout.js?v=20261116"
></script>


</body>

</html>
