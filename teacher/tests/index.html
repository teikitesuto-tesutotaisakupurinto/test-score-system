
<!doctype html>
<html lang="ja">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
  テスト管理
</title>

<link
  rel="stylesheet"
  href="/css/common.css"
>

<style>

.test-actions {

  display:flex;

  flex-wrap:wrap;

  gap:6px;

}


.test-actions .btn {

  white-space:nowrap;

}


.test-create-grid {

  display:grid;

  grid-template-columns:
    2fr
    1fr
    1fr;

  gap:10px;

}


@media(max-width:800px) {

  .test-create-grid {

    grid-template-columns:
      1fr;

  }

}


.test-status {

  font-size:12px;

  color:#666;

}


.test-empty {

  padding:30px;

  text-align:center;

  color:#777;

}


</style>

</head>


<body>


<header class="topbar">

  <div class="system-name">
    テスト成績システム
  </div>


  <div class="topbar-space"></div>


  <span id="teacherName">
    -
  </span>


  <button
    id="logoutButton"
    class="logout-button"
    type="button"
  >
    ログアウト
  </button>

</header>


<main class="main-content">


<div class="page-header">

<h1>
  テスト管理
</h1>

</div>


<!-- =====================================================
     CREATE
====================================================== -->

<section class="card">


<h2>
  新しいテスト
</h2>


<div class="test-create-grid">


<div class="form-group">

<label for="testName">
  テスト名
</label>


<input
  id="testName"
  type="text"
  autocomplete="off"
>

</div>


<div class="form-group">

<label for="subject">
  教科
</label>


<input
  id="subject"
  type="text"
  autocomplete="off"
>

</div>


<div class="form-group">

<label for="grade">
  学年
</label>


<input
  id="grade"
  type="text"
  autocomplete="off"
>

</div>


</div>


<div
  style="
    margin-top:12px;
  "
>


<button
  id="createButton"
  class="btn btn-primary"
  type="button"
>
  新しいテストを作成
</button>


</div>


</section>


<p
  id="message"
  class="small"
  aria-live="polite"
></p>


<!-- =====================================================
     LIST
====================================================== -->

<section class="card">


<h2>
  テスト一覧
</h2>


<table class="table">


<thead>

<tr>

<th>
  テスト名
</th>

<th>
  教科
</th>

<th>
  学年
</th>

<th>
  操作
</th>

</tr>

</thead>


<tbody id="rows">

<tr>

<td
  colspan="4"
>
  読み込み中...
</td>

</tr>

</tbody>


</table>


</section>


</main>


<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script
  src="/js/config.js?v=20261116"
></script>


<script
  src="/js/auth.js?v=20261116"
></script>


<script>

"use strict";


/* =========================================================
   DB
========================================================= */

const DB =
  window.supabaseClient ||
  window.SB;


if (!DB) {

  throw new Error(
    "Supabase Clientが初期化されていません。"
  );

}


/* =========================================================
   DOM
========================================================= */

const rows =
  document.getElementById(
    "rows"
  );


const message =
  document.getElementById(
    "message"
  );


const createButton =
  document.getElementById(
    "createButton"
  );


const teacherName =
  document.getElementById(
    "teacherName"
  );


/* =========================================================
   STATE
========================================================= */

let currentUser =
  null;


/* =========================================================
   INIT
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  initialize
);


async function initialize() {

  try {

    const result =
      await requireRole(
        "teacher"
      );


    if (!result) {

      return;

    }


    currentUser =
      result.user;


    teacherName.textContent =
      result.profile?.name ||
      "先生";


    setupEvents();


    await loadTests();


  } catch (error) {

    console.error(
      "teacher/tests:",
      error
    );


    showMessage(
      error.message ||
      "テスト管理を読み込めませんでした。",
      true
    );

  }

}


/* =========================================================
   EVENTS
========================================================= */

function setupEvents() {

  createButton.addEventListener(
    "click",
    createTest
  );


  document
    .getElementById(
      "logoutButton"
    )
    .addEventListener(
      "click",
      async () => {

        await logout();

      }
    );

}


/* =========================================================
   LOAD
========================================================= */

async function loadTests() {

  rows.innerHTML = `

    <tr>

      <td colspan="4">
        読み込み中...
      </td>

    </tr>

  `;


  const {
    data,
    error
  } =
    await DB
      .from(
        "tests"
      )
      .select(
        `
        id,
        name,
        subject,
        grade,
        class_name,
        results_published,
        results_published_at,
        created_at
        `
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if (error) {

    throw new Error(
      `テスト一覧取得エラー: ${error.message}`
    );

  }


  renderTests(
    data || []
  );

}


/* =========================================================
   RENDER
========================================================= */

function renderTests(
  tests
) {

  rows.innerHTML =
    "";


  if (!tests.length) {

    rows.innerHTML = `

      <tr>

        <td
          colspan="4"
          class="test-empty"
        >
          テストがありません。
        </td>

      </tr>

    `;

    return;

  }


  tests.forEach(
    test => {

      const row =
        document.createElement(
          "tr"
        );


      /* ---------------------------------------------------
         名前
      --------------------------------------------------- */

      const nameCell =
        document.createElement(
          "td"
        );


      nameCell.textContent =
        test.name ||
        "";


      /* ---------------------------------------------------
         教科
      --------------------------------------------------- */

      const subjectCell =
        document.createElement(
          "td"
        );


      subjectCell.textContent =
        test.subject ||
        "";


      /* ---------------------------------------------------
         学年
      --------------------------------------------------- */

      const gradeCell =
        document.createElement(
          "td"
        );


      gradeCell.textContent =
        test.grade ||
        "";


      /* ---------------------------------------------------
         操作
      --------------------------------------------------- */

      const actionCell =
        document.createElement(
          "td"
        );


      const actions =
        document.createElement(
          "div"
        );


      actions.className =
        "test-actions";


      /*
       * 枠設定
       */

      actions.appendChild(
        createActionLink(
          `/teacher/tests/layout?test=${encodeURIComponent(
            test.id
          )}`,
          "枠設定"
        )
      );


      /*
       * 配点
       */

      actions.appendChild(
        createActionLink(
          `/teacher/tests/points?test=${encodeURIComponent(
            test.id
          )}`,
          "配点設定"
        )
      );


      /*
       * クロップ
       */

      actions.appendChild(
        createActionLink(
          `/teacher/answers/regions?test=${encodeURIComponent(
            test.id
          )}`,
          "答案クロップ"
        )
      );


      /*
       * 採点
       *
       * select.htmlは経由しない。
       */

      actions.appendChild(
        createActionLink(
          `/teacher/marking?test=${encodeURIComponent(
            test.id
          )}`,
          "採点"
        )
      );


      /*
       * 結果
       */

      actions.appendChild(
        createActionLink(
          `/teacher/results/summary?test=${encodeURIComponent(
            test.id
          )}`,
          test.results_published
            ? "結果"
            : "成績処理"
        )
      );


      /*
       * 公開状態
       */

      const status =
        document.createElement(
          "span"
        );


      status.className =
        "test-status";


      status.textContent =
        test.results_published
          ? "公開済み"
          : "未確定";


      actions.appendChild(
        status
      );


      actionCell.appendChild(
        actions
      );


      row.append(
        nameCell,
        subjectCell,
        gradeCell,
        actionCell
      );


      rows.appendChild(
        row
      );

    }
  );

}


/* =========================================================
   ACTION LINK
========================================================= */

function createActionLink(
  href,
  text
) {

  const link =
    document.createElement(
      "a"
    );


  link.href =
    href;


  link.textContent =
    text;


  link.className =
    "btn";


  return link;

}


/* =========================================================
   CREATE
========================================================= */

async function createTest() {

  const name =
    document
      .getElementById(
        "testName"
      )
      .value
      .trim();


  const subject =
    document
      .getElementById(
        "subject"
      )
      .value
      .trim();


  const grade =
    document
      .getElementById(
        "grade"
      )
      .value
      .trim();


  if (!name) {

    showMessage(
      "テスト名を入力してください。",
      true
    );

    return;

  }


  if (!currentUser) {

    showMessage(
      "ログイン情報を取得できません。",
      true
    );

    return;

  }


  createButton.disabled =
    true;


  createButton.textContent =
    "作成中...";


  try {

    const {
      data,
      error
    } =
      await DB
        .from(
          "tests"
        )
        .insert({

          name,

          subject:
            subject ||
            null,

          grade:
            grade ||
            null

        })
        .select(
          "id"
        )
        .single();


    if (error) {

      throw error;

    }


    if (!data?.id) {

      throw new Error(
        "テストIDを取得できませんでした。"
      );

    }


    /*
     * 作成直後は枠設定。
     */

    location.href =
      `/teacher/tests/layout?test=${encodeURIComponent(
        data.id
      )}`;


  } catch (error) {

    console.error(
      "create test:",
      error
    );


    showMessage(
      error.message ||
      "テストを作成できませんでした。",
      true
    );


  } finally {

    createButton.disabled =
      false;


    createButton.textContent =
      "新しいテストを作成";

  }

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
  text,
  error = false
) {

  message.textContent =
    text;


  message.style.color =
    error
      ? "#b42318"
      : "";

}

</script>


</body>

</html>
