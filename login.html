
<!doctype html>
<html lang="ja">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>
    ログイン - テスト成績システム
  </title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <style>

    .login-page {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      background: #eef2f5;
    }


    .login-card {
      width: 100%;
      max-width: 420px;

      padding: 30px;

      background: #fff;

      border:
        1px solid #d0d6dc;

      border-radius: 6px;
    }


    .login-card h1 {
      margin:
        0
        0
        8px;

      font-size: 24px;
    }


    .login-subtitle {
      margin:
        0
        0
        22px;

      color: #666;

      font-size: 13px;
    }


    .login-label {
      display: block;

      margin:
        0
        0
        6px;

      font-size: 13px;

      font-weight: 700;
    }


    .login-input {
      width: 100%;

      height: 42px;

      margin:
        0
        0
        15px;

      padding:
        0
        10px;

      border:
        1px solid #b8c1c9;

      border-radius: 4px;

      background: #fff;

      outline: none;
    }


    .login-input:focus {
      border-color: #1769aa;

      box-shadow:
        0 0 0 2px
        rgba(
          23,
          105,
          170,
          .12
        );
    }


    .login-button {
      width: 100%;

      height: 42px;

      border:
        1px solid #1769aa;

      border-radius: 4px;

      background: #1769aa;

      color: #fff;

      font-size: 14px;

      font-weight: 700;

      cursor: pointer;
    }


    .login-button:hover {
      background: #12598f;
    }


    .login-button:disabled {
      opacity: .6;

      cursor: wait;
    }


    #loginMsg {
      min-height: 20px;

      margin:
        12px
        0
        0;

      color: #b42318;

      font-size: 13px;

      line-height: 1.6;
    }


    .system-name {
      margin-top: 22px;

      text-align: center;

      color: #777;

      font-size: 12px;
    }

  </style>

</head>


<body>


<main class="login-page">


  <section class="login-card">


    <h1>
      テスト成績システム
    </h1>


    <p class="login-subtitle">
      ログインしてください
    </p>


    <label
      class="login-label"
      for="email"
    >
      メールアドレス
    </label>


    <input
      id="email"
      class="login-input"
      type="email"
      autocomplete="username"
      placeholder="メールアドレス"
    >


    <label
      class="login-label"
      for="password"
    >
      パスワード
    </label>


    <input
      id="password"
      class="login-input"
      type="password"
      autocomplete="current-password"
      placeholder="パスワード"
    >


    <button
      id="loginBtn"
      class="login-button"
      type="button"
    >
      ログイン
    </button>


    <p
      id="loginMsg"
      aria-live="polite"
    ></p>


    <div class="system-name">
      テスト成績システム
    </div>


  </section>


</main>


<!-- =====================================================
     Supabase
====================================================== -->

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<!-- =====================================================
     Configuration
====================================================== -->

<script src="js/config.js?v=20261115"></script>


<!-- =====================================================
     Authentication
====================================================== -->

<script src="js/auth.js?v=20261115"></script>


<script>

"use strict";


/* =====================================================
   LOGIN
===================================================== */

const loginButton =
  document.getElementById(
    "loginBtn"
  );


const emailInput =
  document.getElementById(
    "email"
  );


const passwordInput =
  document.getElementById(
    "password"
  );


const loginMessage =
  document.getElementById(
    "loginMsg"
  );


/* =====================================================
   CHECK CLIENT
===================================================== */

if (
  !window.supabaseClient
) {

  loginMessage.textContent =
    "Supabaseを初期化できませんでした。ページを再読み込みしてください。";

}


/* =====================================================
   LOGIN ACTION
===================================================== */

loginButton.addEventListener(
  "click",
  loginUser
);


emailInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key ===
      "Enter"
    ) {

      event.preventDefault();

      loginUser();

    }

  }
);


passwordInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key ===
      "Enter"
    ) {

      event.preventDefault();

      loginUser();

    }

  }
);


/* =====================================================
   LOGIN
===================================================== */

async function loginUser() {

  const email =
    emailInput.value.trim();


  const password =
    passwordInput.value;


  loginMessage.textContent =
    "";


  if (!email) {

    loginMessage.textContent =
      "メールアドレスを入力してください。";

    emailInput.focus();

    return;

  }


  if (!password) {

    loginMessage.textContent =
      "パスワードを入力してください。";

    passwordInput.focus();

    return;

  }


  loginButton.disabled =
    true;


  loginButton.textContent =
    "ログイン中...";


  try {

    /*
     * auth.jsのloginを使用。
     */

    if (
      typeof window.login !==
      "function"
    ) {

      throw new Error(
        "認証機能を読み込めませんでした。js/auth.jsを確認してください。"
      );

    }


    await window.login(
      email,
      password
    );


    /*
     * ログイン成功後の移動。
     *
     * redirectAfterLoginが存在する
     * 最新auth.jsを使用。
     */

    if (
      typeof window.redirectAfterLogin ===
      "function"
    ) {

      await window.redirectAfterLogin();

      return;

    }


    /*
     * 念のためgoByRoleにも対応。
     */

    if (
      typeof window.goByRole ===
      "function"
    ) {

      await window.goByRole();

      return;

    }


    throw new Error(
      "ログイン後の移動処理を読み込めませんでした。"
    );


  } catch (error) {

    console.error(
      "LOGIN ERROR:",
      error
    );


    loginMessage.textContent =
      error?.message ||
      "ログインできませんでした。";


    loginButton.disabled =
      false;


    loginButton.textContent =
      "ログイン";

  }

}

</script>


</body>

</html>
