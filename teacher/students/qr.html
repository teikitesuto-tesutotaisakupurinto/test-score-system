
<!doctype html>
<html lang="ja">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
  生徒QR発行 - テスト成績システム
</title>

<link
  rel="stylesheet"
  href="/css/common.css"
>

<style>

.qr-main {
  max-width:1200px;
  margin:0 auto;
  padding:22px;
}


.page-header {
  margin-bottom:18px;
}


.page-header h1 {
  margin:0;
  font-size:24px;
}


.page-header p {
  margin:7px 0 0;
  color:#666;
  font-size:13px;
}


.toolbar {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:15px;
}


.status {
  padding:10px 12px;
  margin-bottom:15px;

  background:#f5f6f7;

  border:1px solid #d5dbe0;

  font-size:13px;
}


.status.error {
  color:#b42318;
}


.qr-grid {
  display:grid;

  grid-template-columns:
    repeat(
      4,
      minmax(0,1fr)
    );

  gap:14px;
}


.qr-card {
  min-height:250px;

  padding:15px;

  background:#fff;

  border:1px solid #d0d6dc;

  text-align:center;

  break-inside:avoid;
}


.qr-student-no {
  font-size:16px;
  font-weight:700;
}


.qr-student-name {
  margin-top:4px;
  color:#555;
  font-size:14px;
}


.qr-image {
  display:flex;

  justify-content:center;
  align-items:center;

  margin-top:12px;
}


.qr-value {
  margin-top:8px;

  color:#777;

  font-size:10px;

  word-break:break-all;
}


.empty {
  grid-column:1 / -1;

  padding:50px;

  text-align:center;

  color:#777;

  background:#fff;

  border:1px solid #d0d6dc;
}


@media(max-width:900px) {

  .qr-grid {
    grid-template-columns:
      repeat(
        2,
        minmax(0,1fr)
      );
  }

}


@media(max-width:600px) {

  .qr-main {
    padding:14px;
  }


  .qr-grid {
    grid-template-columns:1fr;
  }

}


/* =====================================================
   PRINT
===================================================== */

@media print {

  .topbar,
  .toolbar,
  .status,
  .page-header p {
    display:none !important;
  }


  .qr-main {
    max-width:none;
    padding:0;
  }


  .qr-grid {
    grid-template-columns:
      repeat(
        4,
        1fr
      );

    gap:8px;
  }


  .qr-card {
    min-height:0;
    padding:8px;
  }

}

</style>

</head>


<body>


<header class="topbar">

  <div class="system-name">
    テスト成績システム
  </div>


  <div class="topbar-space"></div>


  <span id="teacherName">
    -
  </span>


  <button
    id="logoutButton"
    class="logout-button"
    type="button"
  >
    ログアウト
  </button>

</header>


<main class="qr-main">


<div class="page-header">

  <h1>
    生徒QR発行
  </h1>


  <p>
    生徒番号をQRコードにして印刷します。
    答案アップロード時に読み取り、生徒を自動で紐付けます。
  </p>

</div>


<div class="toolbar">


<a
  href="/teacher/dashboard"
  class="btn"
>
  ホーム
</a>


<a
  href="/teacher/students"
  class="btn"
>
  生徒一覧
</a>


<button
  id="reloadButton"
  class="btn"
  type="button"
>
  更新
</button>


<button
  id="printButton"
  class="btn btn-primary"
  type="button"
>
  印刷
</button>


</div>


<div
  id="status"
  class="status"
>
  生徒一覧を取得しています...
</div>


<section
  id="qrGrid"
  class="qr-grid"
>

  <div class="empty">
    読み込み中...
  </div>

</section>


</main>


<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script
  src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"
></script>


<script
  src="/js/config.js?v=20261116"
></script>


<script
  src="/js/auth.js?v=20261116"
></script>


<script
  src="/js/teacher/qr.js?v=20261116"
></script>


</body>

</html>
