
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  答案クロップ設定 - テスト成績システム
</title>

<link
  rel="stylesheet"
  href="/css/common.css?v=20261126layout"
>

<style>

.regions-main {
  max-width:1500px;

  margin:0 auto;

  padding:20px;
}


.toolbar {
  display:flex;

  flex-wrap:wrap;

  align-items:center;

  gap:8px;

  margin-bottom:12px;

  padding:10px;

  background:#fff;

  border:
    1px solid #d0d6dc;
}


.toolbar select {
  min-width:250px;

  height:40px;

  padding:0 8px;
}


.status {
  min-height:38px;

  margin-bottom:12px;

  padding:9px 11px;

  background:#fff;

  border:
    1px solid #d0d6dc;

  font-size:13px;

  white-space:pre-wrap;
}


.status.error {
  color:#b42318;

  background:#fff8f7;

  border-color:#efc2bc;
}


.viewer {
  min-height:650px;

  overflow:auto;

  padding:20px;

  background:#dfe4e8;

  border:
    1px solid #cbd2d8;
}


.page {
  position:relative;

  width:min(
    100%,
    1100px
  );

  margin:0 auto 25px;

  background:#fff;

  box-shadow:
    0 2px 12px
    rgba(
      0,
      0,
      0,
      .15
    );
}


.page img {
  display:block;

  width:100%;

  height:auto;
}


.page-layer {
  position:absolute;

  inset:0;

  touch-action:none;
}


.region-box {
  position:absolute;

  border:
    2px solid #1769aa;

  background:
    rgba(
      23,
      105,
      170,
      .08
    );

  cursor:move;
}


.region-box.selected {
  border-color:#d00000;

  background:
    rgba(
      208,
      0,
      0,
      .08
    );
}


.region-label {
  position:absolute;

  top:-24px;

  left:0;

  padding:3px 6px;

  background:#222;

  color:#fff;

  font-size:11px;

  white-space:nowrap;

  pointer-events:none;
}


.region-handle {
  position:absolute;

  right:-6px;

  bottom:-6px;

  width:12px;

  height:12px;

  background:#222;

  border:1px solid #fff;

  cursor:nwse-resize;
}


.drag-preview {
  position:absolute;

  z-index:999;

  border:
    2px dashed #d00000;

  background:
    rgba(
      208,
      0,
      0,
      .08
    );

  pointer-events:none;
}


.region-list {
  display:grid;

  gap:6px;
}


.region-row {
  display:grid;

  grid-template-columns:
    1fr
    120px
    90px;

  gap:8px;

  align-items:center;

  padding:8px;

  background:#fff;

  border:
    1px solid #d5dbe0;
}


.region-row.selected {
  background:#edf5fb;

  border-color:#1769aa;
}


.empty {
  padding:50px 20px;

  color:#777;

  text-align:center;
}


@media(max-width:700px) {

  .regions-main {
    padding:8px;
  }


  .viewer {
    padding:8px;
  }


  .region-row {
    grid-template-columns:1fr;
  }

}

</style>

</head>


<body>


<header class="topbar">

<div class="system-name">
  テスト成績システム
</div>


<div class="topbar-space"></div>


<span id="teacherName">
  -
</span>


<button
id="logoutButton"
class="logout-button"
type="button"
>
  ログアウト
</button>

</header>


<main class="regions-main">


<div class="page-header">

<h1>
  答案クロップ設定
</h1>

</div>


<div
id="status"
class="status"
>
テストを選択してください。
</div>


<div class="toolbar">


<select
id="testSelect"
>

<option value="">
  テストを選択してください
</option>

</select>


<select
id="answerSelect"
disabled
>

<option value="">
  答案を選択してください
</option>

</select>


<button
id="loadButton"
class="btn btn-primary"
type="button"
disabled
>
表示
</button>


<button
id="saveButton"
class="btn btn-primary"
type="button"
disabled
>
クロップ保存
</button>


<button
id="deleteButton"
class="btn"
type="button"
disabled
>
選択クロップ削除
</button>


<a
href="/teacher/answers/upload"
class="btn"
>
答案アップロード
</a>


<a
href="/teacher/marking"
class="btn"
>
デジタル採点
</a>


</div>


<section
class="card"
>

<h3>
  クロップ範囲
</h3>


<p
style="
  margin-top:0;
  color:#666;
  font-size:12px;
  line-height:1.8;
"
>

青い枠が答案の切り出し範囲です。

<br>

既存の
<code>
layout_boxes
</code>
の解答欄を基準に、
答案画像から
<code>
answer_regions
</code>
を作成します。

</p>


<div
id="viewer"
class="viewer"
>

<div class="empty">
  答案を表示してください。
</div>

</div>


</section>


<section class="card">


<h3>
  クロップ一覧
</h3>


<div
id="regionList"
class="region-list"
>

<div class="empty">
  答案を表示するとクロップ一覧が表示されます。
</div>

</div>


</section>


</main>


<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script
src="/js/config.js?v=20261116"
></script>


<script
src="/js/auth.js?v=20261126"
></script>


<script
src="/js/teacher/answers-regions.js?v=20261127workflowfix2"
></script>


<script src="/js/common-sidebar.js?v=20261126layout"></script>
</body>

</html>
