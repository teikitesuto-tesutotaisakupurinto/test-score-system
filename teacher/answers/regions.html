<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>解答欄設定 - テスト成績システム</title>

  <link
    rel="stylesheet"
    href="/css/common.css"
  >

  <style>

    .regions-main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .toolbar select,
    .toolbar button {
      height: 40px;
    }

    .status {
      padding: 10px 12px;
      margin-bottom: 15px;
      background: #f5f6f7;
      border: 1px solid #d5dbe0;
      font-size: 13px;
    }

    .viewer {
      position: relative;
      width: 100%;
      min-height: 500px;
      padding: 20px;
      overflow: auto;
      background: #dfe3e8;
    }

    .page {
      position: relative;
      width: min(100%, 1000px);
      margin: 0 auto 25px;
      background: #fff;
      box-shadow: 0 2px 10px rgba(0,0,0,.15);
    }

    .page canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    .box-layer {
      position: absolute;
      inset: 0;
    }

    .box {
      position: absolute;
      border: 2px solid #d00000;
      background: rgba(208,0,0,.07);
      cursor: move;
      min-width: 20px;
      min-height: 20px;
    }

    .box.selected {
      border-color: #0066cc;
      background: rgba(0,102,204,.08);
    }

    .box-label {
      position: absolute;
      left: 0;
      top: -25px;
      padding: 3px 7px;
      background: #333;
      color: #fff;
      font-size: 12px;
      white-space: nowrap;
    }

    .resize {
      position: absolute;
      right: -5px;
      bottom: -5px;
      width: 10px;
      height: 10px;
      background: #333;
      cursor: nwse-resize;
    }

    .panel {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 20;
      width: 310px;
      padding: 16px;
      background: #fff;
      border: 1px solid #ccc;
      box-shadow: 0 4px 20px rgba(0,0,0,.18);
    }

    .panel[hidden] {
      display: none;
    }

    .panel label {
      display: block;
      margin-top: 10px;
      font-size: 12px;
      font-weight: 700;
    }

    .panel input {
      width: 100%;
      height: 36px;
      margin-top: 4px;
      padding: 0 8px;
      box-sizing: border-box;
    }

    .panel-actions {
      display: flex;
      gap: 8px;
      margin-top: 15px;
    }

    .panel-actions button {
      flex: 1;
    }

    @media(max-width:700px) {

      .regions-main {
        padding: 10px;
      }

      .viewer {
        padding: 10px;
      }

      .panel {
        right: 10px;
        bottom: 10px;
        width: calc(100vw - 20px);
      }

    }

  </style>

</head>


<body>

<header class="topbar">

  <div class="system-name">
    テスト成績システム
  </div>

  <div class="topbar-space"></div>

  <span id="teacherName">-</span>

  <button
    id="logoutButton"
    class="logout-button"
    type="button"
  >
    ログアウト
  </button>

</header>


<main class="regions-main">


  <div class="toolbar">

    <select id="testSelect">

      <option value="">
        テストを選択してください
      </option>

    </select>


    <button
      id="saveButton"
      class="btn btn-primary"
      type="button"
    >
      解答欄を保存
    </button>


    <button
      id="deleteButton"
      class="btn"
      type="button"
    >
      選択枠を削除
    </button>

  </div>


  <div
    id="status"
    class="status"
  >
    解答用紙を登録したテストを選択してください。
  </div>


  <div
    id="viewer"
    class="viewer"
  ></div>


  <aside
    id="panel"
    class="panel"
    hidden
  >

    <strong>
      解答欄設定
    </strong>


    <label for="label">
      設問名
    </label>

    <input
      id="label"
      type="text"
      placeholder="問1"
    >


    <label for="points">
      配点
    </label>

    <input
      id="points"
      type="number"
      min="0"
      step="0.1"
      value="0"
    >


    <label for="questionId">
      設問ID
    </label>

    <input
      id="questionId"
      type="text"
      placeholder="任意"
    >


    <div class="panel-actions">

      <button
        id="applyButton"
        class="btn btn-primary"
        type="button"
      >
        反映
      </button>


      <button
        id="closeButton"
        class="btn"
        type="button"
      >
        閉じる
      </button>

    </div>

  </aside>


</main>


<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="/js/config.js"></script>

<script src="/js/auth.js"></script>

<script src="/js/teacher/answers-regions.js"></script>


</body>

</html>
