
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>
  解答用紙・枠設定 - テスト成績システム
</title>

<link
  rel="stylesheet"
  href="/css/common.css"
>

<style>

* {
  box-sizing:border-box;
}


body {
  margin:0;
  background:#f3f5f7;
}


.main {
  max-width:1500px;
  margin:0 auto;
  padding:20px;
}


.toolbar {
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;

  padding:12px;
  margin-bottom:12px;

  background:#fff;

  border:1px solid #d5dbe0;
}


.toolbar-status {
  width:100%;

  padding:8px 10px;

  background:#f5f6f7;

  border:1px solid #e1e5e8;

  color:#555;

  font-size:12px;
}


.viewer {
  min-height:650px;

  padding:25px;

  background:#dfe3e8;

  border:1px solid #ccd2d7;

  overflow:auto;
}


.page {
  position:relative;

  width:min(
    100%,
    1000px
  );

  margin:0 auto 30px;

  background:#fff;

  box-shadow:
    0 2px 12px
    rgba(
      0,
      0,
      0,
      .15
    );
}


.page img {
  display:block;

  width:100%;

  height:auto;
}


.page-layer {
  position:absolute;

  inset:0;

  user-select:none;

  touch-action:none;
}


.layout-box {
  position:absolute;

  min-width:8px;

  min-height:8px;

  cursor:move;

  z-index:20;

  border:2px solid #1769aa;

  background:
    rgba(
      23,
      105,
      170,
      .08
    );
}


.layout-box.selected {
  outline:3px solid #111;

  outline-offset:1px;
}


.layout-box-label {
  position:absolute;

  top:-25px;

  left:0;

  padding:3px 7px;

  background:#222;

  color:#fff;

  font-size:11px;

  white-space:nowrap;

  pointer-events:none;
}


.resize-handle {
  position:absolute;

  right:-6px;

  bottom:-6px;

  width:12px;

  height:12px;

  background:#222;

  border:1px solid #fff;

  cursor:nwse-resize;
}


.drag-preview {
  position:absolute;

  border:2px dashed #d00000;

  background:
    rgba(
      208,
      0,
      0,
      .10
    );

  pointer-events:none;

  z-index:9999;
}


.empty-view {
  padding:80px 20px;

  text-align:center;

  color:#666;
}


.box-panel {
  position:fixed;

  top:64px;

  left:0;

  right:0;

  z-index:1000;

  display:none;

  background:#fff;

  border-bottom:1px solid #cbd1d6;

  box-shadow:
    0 3px 14px
    rgba(
      0,
      0,
      0,
      .14
    );
}


.box-panel.open {
  display:block;
}


.box-panel-header {
  display:flex;

  align-items:center;

  padding:7px 15px;

  background:#f4f6f8;

  border-bottom:1px solid #e0e4e7;
}


.box-panel-title {
  margin:0;

  font-size:15px;
}


.box-panel-close {
  margin-left:auto;

  border:0;

  background:transparent;

  cursor:pointer;
}


.box-panel-body {
  display:flex;

  align-items:center;

  flex-wrap:wrap;

  gap:10px;

  padding:9px 15px;
}


#boxRole {
  width:170px;

  height:36px;

  padding:0 8px;

  border:1px solid #c8ced4;

  background:#fff;
}


#parentInfo {
  min-width:250px;

  padding:7px 10px;

  background:#f5f6f7;

  border:1px solid #e0e4e7;

  color:#666;

  font-size:11px;
}


.box-panel-actions {
  display:flex;

  gap:7px;
}


.delete-box {
  border:1px solid #c94b43;

  background:#fff;

  color:#b42318;
}


@media(max-width:700px) {

  .main {
    padding:10px;
  }


  .viewer {
    padding:8px;
  }


  .box-panel-body {
    align-items:stretch;

    flex-direction:column;
  }


  #boxRole,
  #parentInfo {
    width:100%;
  }

}

</style>

</head>


<body>


<header class="topbar">

<div class="system-name">
  テスト成績システム
</div>

<div class="topbar-space"></div>

<span id="teacherName">
  -
</span>

<button
id="logoutButton"
class="logout-button"
type="button"
>
  ログアウト
</button>

</header>


<section
id="boxPanel"
class="box-panel"
>

<div class="box-panel-header">

<h2 class="box-panel-title">
  枠設定
</h2>


<button
id="closePanelButton"
class="box-panel-close"
type="button"
>
閉じる
</button>

</div>


<div class="box-panel-body">


<strong>
枠種類
</strong>


<select id="boxRole">

<option value="answer">
  解答欄
</option>

<option value="qr">
  QR
</option>

<option value="name">
  氏名
</option>

<option value="student_no">
  生徒番号
</option>

<option value="other">
  その他
</option>

</select>


<div id="parentInfo">
  解答欄をドラッグして作成します。
</div>


<div class="box-panel-actions">

<button
id="applyButton"
type="button"
class="btn btn-primary"
>
反映
</button>


<button
id="deleteSelectedButton"
type="button"
class="delete-box"
>
選択枠を削除
</button>

</div>


</div>

</section>


<main class="main">


<div class="page-header">

<h1>
  解答用紙・枠設定
</h1>

</div>


<section class="toolbar">


<input
id="answerFile"
type="file"
accept=".pdf,.jpg,.jpeg,.png,.webp"
>


<button
id="uploadButton"
type="button"
class="btn btn-primary"
>
解答用紙を登録
</button>


<button
id="saveButton"
type="button"
class="btn btn-primary"
>
枠を保存
</button>


<a
id="pointsLink"
href="#"
class="btn"
>
配点設定
</a>


<a
id="modelAnswerLink"
href="#"
class="btn"
>
模範解答
</a>


<a
id="previewLink"
href="#"
class="btn"
>
テスト確認
</a>


<button
id="backButton"
type="button"
class="btn"
>
戻る
</button>


<div
id="status"
class="toolbar-status"
>
解答用紙を登録してください。
</div>


</section>


<section
id="viewer"
class="viewer"
>

<div class="empty-view">

<strong>
解答用紙がありません
</strong>

PDFまたは画像を登録してください。

</div>

</section>


</main>


<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script
src="/js/config.js?v=20261116"
></script>


<script
src="/js/auth.js?v=20261116"
></script>


<script
src="/js/lib/pdf-loader.js?v=20261116"
></script>


<script
src="/js/lib/file-parser.js?v=20261116"
></script>


<script
src="/js/teacher/test-pages.js?v=20261116"
></script>


</body>

</html>
