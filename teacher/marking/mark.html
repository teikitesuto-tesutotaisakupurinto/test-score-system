
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>テスト採点 - テスト成績システム</title>

<link
  rel="stylesheet"
  href="/css/common.css"
>

<style>

.marking-main {
  max-width:1500px;
  margin:0 auto;
  padding:22px;
}

.toolbar {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
  margin-bottom:15px;
}

.status {
  padding:10px 12px;
  margin-bottom:15px;
  background:#f5f6f7;
  border:1px solid #d5dbe0;
  font-size:13px;
}

.progress {
  display:none;
  margin-bottom:15px;
  padding:14px;
  background:#fff;
  border:1px solid #d0d6dc;
}

.progress.show {
  display:block;
}

.progress-track {
  height:8px;
  background:#e1e5e8;
  border-radius:4px;
  overflow:hidden;
}

.progress-bar {
  height:100%;
  width:0;
  background:#1769aa;
  transition:width .2s;
}

.progress-text {
  margin-top:7px;
  color:#666;
  font-size:12px;
}

.question-header {
  display:flex;
  flex-wrap:wrap;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:15px;
  margin-bottom:15px;
  background:#fff;
  border:1px solid #d0d6dc;
}

.question-title {
  font-size:20px;
  font-weight:700;
}

.question-meta {
  margin-top:5px;
  color:#666;
  font-size:13px;
}

.navigation {
  display:flex;
  gap:8px;
}

.answer-table-wrap {
  overflow-x:auto;
  background:#fff;
  border:1px solid #d0d6dc;
}

.answer-table {
  width:100%;
  border-collapse:collapse;
  min-width:1050px;
}

.answer-table th,
.answer-table td {
  border:1px solid #d0d6dc;
  padding:9px;
  vertical-align:top;
  font-size:13px;
}

.answer-table th {
  background:#f3f5f7;
}

.student-cell {
  width:150px;
  min-width:150px;
}

.student-no {
  font-weight:700;
}

.student-name {
  margin-top:4px;
  color:#555;
}

.answer-cell {
  width:520px;
  min-width:520px;
}

.answer-viewer {
  position:relative;
  overflow:hidden;
  width:100%;
  min-height:160px;
  background:#f7f8f9;
  border:1px solid #e0e3e6;
}

.answer-viewer img {
  position:absolute;
  max-width:none;
  max-height:none;
  margin:0;
}

.answer-error {
  padding:40px 10px;
  text-align:center;
  color:#b42318;
}

.score-cell {
  width:150px;
  min-width:150px;
  text-align:center;
}

.score-input {
  width:90px;
  height:40px;
  padding:0 8px;
  font-size:17px;
  text-align:center;
}

.score-save {
  margin-top:7px;
}

.score-state {
  margin-top:7px;
  font-size:12px;
  color:#666;
}

.score-state.marked {
  color:#1769aa;
  font-weight:700;
}

.score-state.error {
  color:#b42318;
}

.warning {
  display:none;
  margin-top:7px;
  padding:7px;
  color:#b42318;
  background:#fff4f2;
  border:1px solid #efc2bc;
  font-size:12px;
}

.warning.show {
  display:block;
}

.complete {
  display:none;
  margin-top:15px;
  padding:18px;
  background:#fff;
  border:1px solid #d0d6dc;
}

.complete.show {
  display:block;
}

.complete-title {
  font-size:18px;
  font-weight:700;
  margin-bottom:8px;
}

.empty {
  padding:50px;
  text-align:center;
  color:#777;
}

</style>

</head>


<body>


<header class="topbar">

<div class="system-name">
テスト成績システム
</div>

<div class="topbar-space"></div>

<span id="teacherName">
-
</span>

<button
id="logoutButton"
class="logout-button"
type="button"
>
ログアウト
</button>

</header>


<main class="marking-main">


<div class="toolbar">

<a
href="/teacher/marking"
class="btn"
>
採点一覧へ戻る
</a>


<button
id="refreshButton"
class="btn"
type="button"
>
更新
</button>

</div>


<div
id="status"
class="status"
>
起動しています...
</div>


<div
id="progress"
class="progress"
>

<div
id="progressText"
class="progress-text"
>
-
</div>

<div class="progress-track">

<div
id="progressBar"
class="progress-bar"
></div>

</div>

</div>


<div class="question-header">

<div>

<div
id="questionTitle"
class="question-title"
>
-
</div>

<div
id="questionMeta"
class="question-meta"
>
-
</div>

</div>


<div class="navigation">

<button
id="previousButton"
class="btn"
type="button"
disabled
>
前の問題
</button>


<button
id="nextButton"
class="btn btn-primary"
type="button"
>
次の問題
</button>

</div>

</div>


<div
id="answerTableWrap"
class="answer-table-wrap"
>

<div class="empty">
答案を読み込んでいます...
</div>

</div>


<div
id="complete"
class="complete"
>

<div class="complete-title">
全答案・全設問の採点が完了しました。
</div>

<div>
成績・偏差値・順位の処理が完了するまで公開しません。
</div>

</div>


</main>


<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="/js/config.js"></script>

<script src="/js/auth.js"></script>


<script>

(function () {

"use strict";


/* =====================================================
   DOM
===================================================== */

const statusEl =
document.getElementById(
"status"
);

const teacherName =
document.getElementById(
"teacherName"
);

const answerTable =
document.getElementById(
"answerTableWrap"
);

const questionTitle =
document.getElementById(
"questionTitle"
);

const questionMeta =
document.getElementById(
"questionMeta"
);

const previousButton =
document.getElementById(
"previousButton"
);

const nextButton =
document.getElementById(
"nextButton"
);

const refreshButton =
document.getElementById(
"refreshButton"
);

const progress =
document.getElementById(
"progress"
);

const progressBar =
document.getElementById(
"progressBar"
);

const progressText =
document.getElementById(
"progressText"
);

const complete =
document.getElementById(
"complete"
);


/* =====================================================
   STATE
===================================================== */

let DB = null;

let testId = null;

let test = null;

let answers = [];

let students = new Map();

let pages = new Map();

let questions = [];

let scores = [];

let questionIndex = 0;

let saving = false;


/* =====================================================
   START
===================================================== */

if (
document.readyState ===
"loading"
) {

document.addEventListener(
"DOMContentLoaded",
start
);

} else {

start();

}


/* =====================================================
   START
===================================================== */

async function start() {

try {

setStatus(
"Supabase接続を確認しています..."
);


/* -----------------------------------------------------
   Supabase
----------------------------------------------------- */

DB =
window.SB ||
window.supabaseClient ||
window.sb ||
null;


if (!DB) {

throw new Error(
"Supabaseクライアントがありません。config.js / auth.js の読み込みを確認してください。"
);

}


/* -----------------------------------------------------
   URL
----------------------------------------------------- */

const params =
new URLSearchParams(
window.location.search
);


testId =
params.get(
"test"
);


if (!testId) {

throw new Error(
"テストIDがありません。採点一覧から「採点開始」を押してください。"
);

}


testId =
String(
testId
).trim();


/* -----------------------------------------------------
   Auth
   認証が5秒以上止まった場合も画面を止めない。
----------------------------------------------------- */

setStatus(
"ログイン状態を確認しています..."
);


await checkAuth();


/* -----------------------------------------------------
   Events
----------------------------------------------------- */

setupEvents();


/* -----------------------------------------------------
   Main
----------------------------------------------------- */

await loadAll();


} catch (error) {

console.error(
"MARKING START ERROR",
error
);


showFatal(
error.message ||
"採点画面を起動できませんでした。"
);

}

}


/* =====================================================
   AUTH
===================================================== */

async function checkAuth() {

try {

if (
!DB.auth ||
typeof DB.auth.getSession !==
"function"
) {

return;

}


const result =
await withTimeout(
DB.auth.getSession(),
5000,
"認証サーバーへの接続がタイムアウトしました。"
);


const session =
result?.data?.session;


if (!session) {

throw new Error(
"ログインセッションがありません。ログインし直してください。"
);

}


if (teacherName) {

try {

const {
data,
error
} =
await withTimeout(
DB
.from("profiles")
.select(
"name,role"
)
.eq(
"id",
session.user.id
)
.maybeSingle(),
5000,
"プロフィール取得がタイムアウトしました。"
);


if (!error && data) {

if (
data.role !==
"teacher" &&
data.role !==
"admin"
) {

throw new Error(
"先生・管理者権限がありません。"
);

}


teacherName.textContent =
data.name ||
"先生";

}

} catch (profileError) {

console.warn(
"profile:",
profileError
);

/*
 * プロフィール取得だけ失敗しても
 * 採点データ取得自体は続行する。
 */

}

}

}


/* =====================================================
   EVENTS
===================================================== */

function setupEvents() {


previousButton.addEventListener(
"click",
async () => {

if (
questionIndex <=
0
) {

return;

}


questionIndex--;

await renderQuestion();

}
);


nextButton.addEventListener(
"click",
nextQuestion
);


refreshButton.addEventListener(
"click",
async () => {

try {

setStatus(
"更新しています..."
);

await loadAll();

} catch (error) {

showFatal(
error.message
);

}

}
);


document
.getElementById(
"logoutButton"
)
?.addEventListener(
"click",
async () => {

if (
typeof window.signOut ===
"function"
) {

await window.signOut();

return;

}


if (
typeof window.logout ===
"function"
) {

await window.logout();

}

}
);

}


/* =====================================================
   LOAD ALL
===================================================== */

async function loadAll() {

setStatus(
"テスト情報を取得しています..."
);


const {
data: testData,
error: testError
} =
await query(
DB
.from("tests")
.select(
`
id,
name,
subject,
grade,
class_name
`
)
.eq(
"id",
testId
)
.maybeSingle(),
"テスト情報取得"
);


if (testError) {

throw new Error(
`テスト取得エラー: ${testError.message}`
);

}


if (!testData) {

throw new Error(
"指定されたテストが見つかりません。"
);

}


test =
testData;


/* -----------------------------------------------------
   Answers
----------------------------------------------------- */

setStatus(
"答案を取得しています..."
);


const {
data: answerData,
error: answerError
} =
await query(
DB
.from("answer_sheets")
.select(
`
id,
test_id,
student_id,
page_count,
qr_value,
status,
uploaded_at
`
)
.eq(
"test_id",
testId
)
.order(
"uploaded_at",
{
ascending:true
}
),
"答案取得"
);


if (answerError) {

throw new Error(
`答案取得エラー: ${answerError.message}`
);

}


answers =
answerData ||
[];


if (!answers.length) {

throw new Error(
`「${test.name}」には答案が登録されていません。`
);

}


/* -----------------------------------------------------
   Students
----------------------------------------------------- */

setStatus(
"生徒情報を取得しています..."
);


await loadStudents();


/* -----------------------------------------------------
   Pages
----------------------------------------------------- */

setStatus(
"答案ページを取得しています..."
);


await loadPages();


/* -----------------------------------------------------
   Boxes
----------------------------------------------------- */

setStatus(
"採点枠を取得しています..."
);


const {
data: boxes,
error: boxesError
} =
await query(
DB
.from("layout_boxes")
.select(
`
id,
test_id,
page_no,
box_type,
label,
x,
y,
width,
height,
question_id,
points,
created_at
`
)
.eq(
"test_id",
testId
)
.order(
"page_no",
{
ascending:true
}
)
.order(
"created_at",
{
ascending:true
}
),
"採点枠取得"
);


if (boxesError) {

throw new Error(
`採点枠取得エラー: ${boxesError.message}`
);

}


/* -----------------------------------------------------
   Questions
----------------------------------------------------- */

questions =
(boxes || [])
.filter(
box => {

const type =
String(
box.box_type ||
""
)
.trim()
.toLowerCase();


return (
type ===
"answer" &&
Boolean(
box.question_id
)
);

}
)
.map(
box => ({

id:
box.id,

label:
box.label ||
"設問",

pageNo:
Number(
box.page_no
),

x:
Number(
box.x
) || 0,

y:
Number(
box.y
) || 0,

width:
Number(
box.width
) || 1,

height:
Number(
box.height
) || 1,

questionId:
box.question_id,

points:
Number(
box.points
) || 0

})
);


if (!questions.length) {

throw new Error(
"採点対象の設問がありません。layout_boxes の box_type=answer / question_id を確認してください。"
);

}


/* -----------------------------------------------------
   Scores
----------------------------------------------------- */

setStatus(
"既存の採点結果を取得しています..."
);


await loadScores();


/* -----------------------------------------------------
   Render
----------------------------------------------------- */

questionIndex =
0;


progress.classList.add(
"show"
);


await renderQuestion();


setStatus(
`${test.name} / 答案 ${answers.length}件 / 設問 ${questions.length}問`
);

}


/* =====================================================
   STUDENTS
===================================================== */

async function loadStudents() {

students =
new Map();


const ids =
[
...new Set(
answers
.map(
item =>
item.student_id
)
.filter(Boolean)
)
];


if (!ids.length) {

return;

}


const {
data,
error
} =
await query(
DB
.from("students")
.select(
`
id,
student_no,
name
`
)
.in(
"id",
ids
),
"生徒情報取得"
);


if (error) {

throw new Error(
`生徒情報取得エラー: ${error.message}`
);

}


for (
const item
of data || []
) {

students.set(
item.id,
item
);

}

}


/* =====================================================
   PAGES
===================================================== */

async function loadPages() {

pages =
new Map();


const ids =
answers.map(
item =>
item.id
);


const {
data,
error
} =
await query(
DB
.from("answer_sheet_pages")
.select(
`
answer_sheet_id,
page_no,
file_path,
file_type,
original_name,
width_px,
height_px
`
)
.in(
"answer_sheet_id",
ids
)
.order(
"page_no",
{
ascending:true
}
),
"答案ページ取得"
);


if (error) {

throw new Error(
`答案ページ取得エラー: ${error.message}`
);

}


for (
const page
of data || []
) {

if (
!pages.has(
page.answer_sheet_id
)
) {

pages.set(
page.answer_sheet_id,
[]
);

}


pages
.get(
page.answer_sheet_id
)
.push(
page
);

}

}


/* =====================================================
   SCORES
===================================================== */

async function loadScores() {

scores =
[];


const ids =
answers.map(
item =>
item.id
);


const {
data,
error
} =
await query(
DB
.from("scores")
.select(
`
id,
answer_sheet_id,
layout_box_id,
question_id,
score,
status,
marked_at
`
)
.in(
"answer_sheet_id",
ids
),
"採点結果取得"
);


if (error) {

throw new Error(
`採点結果取得エラー: ${error.message}`
);

}


scores =
data ||
[];


}


/* =====================================================
   RENDER QUESTION
===================================================== */

async function renderQuestion() {

const question =
questions[
questionIndex
];


if (!question) {

return;

}


questionTitle.textContent =
question.label;


questionMeta.textContent =
`${test.name} / 配点 ${formatNumber(
question.points
)}点 / 問題 ${
questionIndex + 1
} / ${
questions.length
}`;


previousButton.disabled =
questionIndex <=
0;


nextButton.textContent =
questionIndex >=
questions.length - 1
? "採点完了確認"
: "次の問題";


answerTableWrap.innerHTML = `

<div class="empty">
答案を表示しています...
</div>

`;


const table =
document.createElement(
"table"
);


table.className =
"answer-table";


table.innerHTML = `

<thead>

<tr>

<th class="student-cell">
生徒
</th>

<th class="answer-cell">
答案
</th>

<th class="score-cell">
得点
</th>

<th>
状態
</th>

</tr>

</thead>

<tbody></tbody>

`;


const tbody =
table.querySelector(
"tbody"
);


for (
const answer
of answers
) {

const row =
await createRow(
answer,
question
);


tbody.appendChild(
row
);

}


answerTableWrap.innerHTML =
"";


answerTableWrap.appendChild(
table
);


updateProgress();

}


/* =====================================================
   ROW
===================================================== */

async function createRow(
answer,
question
) {

const row =
document.createElement(
"tr"
);


/* Student */

const studentCell =
document.createElement(
"td"
);

studentCell.className =
"student-cell";


const student =
students.get(
answer.student_id
);


const no =
document.createElement(
"div"
);

no.className =
"student-no";

no.textContent =
student?.student_no ||
"未紐付け";


const name =
document.createElement(
"div"
);

name.className =
"student-name";

name.textContent =
student?.name ||
"";


studentCell.append(
no,
name
);


/* Answer */

const answerCell =
document.createElement(
"td"
);

answerCell.className =
"answer-cell";


try {

answerCell.appendChild(
await createViewer(
answer,
question
)
);

} catch (error) {

const box =
document.createElement(
"div"
);

box.className =
"answer-error";

box.textContent =
error.message;

answerCell.appendChild(
box
);

}


/* Score */

const scoreCell =
document.createElement(
"td"
);

scoreCell.className =
"score-cell";


const existing =
findScore(
answer.id,
question.id
);


const input =
document.createElement(
"input"
);

input.type =
"number";

input.step =
"0.1";

input.min =
"0";

input.max =
String(
question.points
);

input.className =
"score-input";

input.value =
existing
? existing.score
: "";


const save =
document.createElement(
"button"
);

save.type =
"button";

save.className =
"btn btn-primary score-save";

save.textContent =
"保存";


const state =
document.createElement(
"div"
);

state.className =
"score-state";

state.textContent =
existing &&
existing.status ===
"marked"
? "採点済み"
: "未採点";


if (
existing &&
existing.status ===
"marked"
) {

state.classList.add(
"marked"
);

}


const warning =
document.createElement(
"div"
);

warning.className =
"warning";


input.addEventListener(
"input",
() => {

validateScore(
input,
warning,
question.points
);

}
);


save.addEventListener(
"click",
async () => {

await saveScore(
answer,
question,
input,
warning,
state
);

}
);


scoreCell.append(
input,
document.createElement("br"),
save,
state,
warning
);


/* Status */

const statusCell =
document.createElement(
"td"
);

if (
existing &&
existing.status ===
"marked"
) {

statusCell.textContent =
"採点済み";

statusCell.style.color =
"#1769aa";

} else {

statusCell.textContent =
"未採点";

statusCell.style.color =
"#b42318";

}


row.append(
studentCell,
answerCell,
scoreCell,
statusCell
);


return row;

}


/* =====================================================
   VIEWER
===================================================== */

async function createViewer(
answer,
question
) {

const list =
pages.get(
answer.id
) ||
[];


const page =
list.find(
item =>
Number(
item.page_no
) ===
Number(
question.pageNo
)
);


if (!page) {

throw new Error(
`答案ページ ${question.pageNo} がありません。`
);

}


if (!page.file_path) {

throw new Error(
"答案ページのfile_pathがありません。"
);

}


const {
data,
error
} =
await query(
DB
.storage
.from(
"answer-files"
)
.createSignedUrl(
page.file_path,
600
),
"答案画像URL取得"
);


if (error) {

throw new Error(
`答案画像取得エラー: ${error.message}`
);

}


if (!data?.signedUrl) {

throw new Error(
"答案画像の署名URLを取得できませんでした。"
);

}


const viewer =
document.createElement(
"div"
);

viewer.className =
"answer-viewer";


const image =
document.createElement(
"img"
);

image.src =
data.signedUrl;

image.alt =
"答案";


await waitImage(
image
);


const pageWidth =
Number(
page.width_px
) ||
image.naturalWidth;


const pageHeight =
Number(
page.height_px
) ||
image.naturalHeight;


const scaleX =
image.naturalWidth /
pageWidth;


const scaleY =
image.naturalHeight /
pageHeight;


const x =
Number(
question.x
) ||
0;


const y =
Number(
question.y
) ||
0;


const width =
Math.max(
1,
Number(
question.width
) ||
1
);


const height =
Math.max(
1,
Number(
question.height
) ||
1
);


const cropWidth =
width *
scaleX;


const cropHeight =
height *
scaleY;


const displayWidth =
Math.min(
500,
Math.max(
350,
cropWidth
)
);


const displayScale =
displayWidth /
cropWidth;


viewer.style.height =
`${Math.max(
150,
cropHeight *
displayScale
)}px`;


image.style.width =
`${image.naturalWidth *
displayScale}px`;


image.style.height =
`${image.naturalHeight *
displayScale}px`;


image.style.left =
`${-x *
scaleX *
displayScale}px`;


image.style.top =
`${-y *
scaleY *
displayScale}px`;


viewer.appendChild(
image
);


return viewer;

}


/* =====================================================
   SAVE
===================================================== */

async function saveScore(
answer,
question,
input,
warning,
state
) {

if (saving) {

return;

}


const value =
Number(
input.value
);


if (
input.value === ""
) {

showWarning(
warning,
"点数を入力してください。"
);

return;

}


if (
!Number.isFinite(
value
)
) {

showWarning(
warning,
"点数が不正です。"
);

return;

}


if (
value < 0 ||
value > question.points
) {

showWarning(
warning,
`0〜${question.points}点で入力してください。`
);

return;

}


saving =
true;


try {

const {
data: existing,
error: findError
} =
await query(
DB
.from("scores")
.select("id")
.eq(
"answer_sheet_id",
answer.id
)
.eq(
"layout_box_id",
question.id
)
.maybeSingle(),
"既存採点確認"
);


if (findError) {

throw new Error(
`既存採点確認エラー: ${findError.message}`
);

}


if (existing?.id) {

const {
error
} =
await query(
DB
.from("scores")
.update({

question_id:
question.questionId,

score:
value,

status:
"marked",

marked_at:
new Date().toISOString()

})
.eq(
"id",
existing.id
),
"採点更新"
);


if (error) {

throw new Error(
`採点更新エラー: ${error.message}`
);

}


updateLocalScore(
existing.id,
answer.id,
question,
value
);

} else {

const {
data,
error
} =
await query(
DB
.from("scores")
.insert({

answer_sheet_id:
answer.id,

layout_box_id:
question.id,

question_id:
question.questionId,

score:
value,

status:
"marked",

marked_at:
new Date().toISOString()

})
.select("id")
.single(),
"採点登録"
);


if (error) {

throw new Error(
`採点登録エラー: ${error.message}`
);

}


updateLocalScore(
data.id,
answer.id,
question,
value
);

}


state.textContent =
"採点済み";

state.className =
"score-state marked";

warning.classList.remove(
"show"
);


updateProgress();


showStatus(
`${getStudentLabel(
answer
)} / ${question.label} を保存しました。`
);


} catch (error) {

console.error(
error
);


state.textContent =
"保存失敗";

state.className =
"score-state error";


showWarning(
warning,
error.message ||
"採点保存に失敗しました。"
);

} finally {

saving =
false;

}

}


/* =====================================================
   NEXT
===================================================== */

async function nextQuestion() {

const question =
questions[
questionIndex
];


if (
!isComplete(
question
)
) {

const ok =
confirm(
"この問題には未採点の答案があります。このまま次へ進みますか？"
);


if (!ok) {

return;

}

}


if (
questionIndex >=
questions.length - 1
) {

finish();

return;

}


questionIndex++;

await renderQuestion();

}


/* =====================================================
   FINISH
===================================================== */

function finish() {

const all =
questions.every(
question =>
isComplete(
question
)
);


if (!all) {

showStatus(
"まだ未採点の答案があります。",
true
);

return;

}


complete.classList.add(
"show"
);


showStatus(
"全答案・全設問の採点が完了しました。成績処理待ちです。"
);


nextButton.disabled =
true;


updateProgress();

}


/* =====================================================
   COMPLETE
===================================================== */

function isComplete(
question
) {

return answers.every(
answer => {

const score =
findScore(
answer.id,
question.id
);


return Boolean(
score &&
score.status ===
"marked"
);

}
);


}


/* =====================================================
   PROGRESS
===================================================== */

function updateProgress() {

const total =
answers.length *
questions.length;


let done =
0;


for (
const answer
of answers
) {

for (
const question
of questions
) {

const score =
findScore(
answer.id,
question.id
);


if (
score &&
score.status ===
"marked"
) {

done++;

}

}

}


const percent =
total
? Math.round(
done /
total *
100
)
: 0;


progressBar.style.width =
`${percent}%`;


progressText.textContent =
`${done} / ${total} 設問答案を採点済み (${percent}%)`;

}


/* =====================================================
   FIND SCORE
===================================================== */

function findScore(
answerId,
questionId
) {

return scores.find(
score =>
score.answer_sheet_id ===
answerId &&
score.layout_box_id ===
questionId
) ||
null;

}


/* =====================================================
   LOCAL SCORE
===================================================== */

function updateLocalScore(
id,
answerId,
question,
value
) {

const existing =
findScore(
answerId,
question.id
);


if (existing) {

existing.id =
id;

existing.score =
value;

existing.status =
"marked";

return;

}


scores.push({

id,

answer_sheet_id:
answerId,

layout_box_id:
question.id,

question_id:
question.questionId,

score:
value,

status:
"marked"

});

}


/* =====================================================
   VALIDATE
===================================================== */

function validateScore(
input,
warning,
max
) {

if (
input.value === ""
) {

warning.classList.remove(
"show"
);

return;

}


const value =
Number(
input.value
);


if (
!Number.isFinite(
value
) ||
value < 0 ||
value > max
) {

showWarning(
warning,
`0〜${max}点で入力してください。`
);

return;

}


warning.classList.remove(
"show"
);

}


/* =====================================================
   QUERY TIMEOUT
===================================================== */

async function query(
promise,
label
) {

return await withTimeout(
promise,
10000,
`${label}が10秒以上応答しません。Supabaseの接続・RLS・権限を確認してください。`
);

}


async function withTimeout(
promise,
ms,
message
) {

let timer;


const timeout =
new Promise(
(
resolve,
reject
) => {

timer =
setTimeout(
() => {

reject(
new Error(
message
)
);

},
ms
);

}
);


try {

return await Promise.race(
[
promise,
timeout
]
);

} finally {

clearTimeout(
timer
);

}

}


/* =====================================================
   IMAGE
===================================================== */

function waitImage(
image
) {

return new Promise(
(
resolve,
reject
) => {

if (
image.complete &&
image.naturalWidth > 0
) {

resolve();

return;

}


image.onload =
resolve;


image.onerror =
() =>
reject(
new Error(
"答案画像を読み込めませんでした。"
)
);

}
);


/* =====================================================
   STATUS
===================================================== */

function showStatus(
message,
error = false
) {

statusEl.textContent =
message;

statusEl.style.color =
error
? "#b42318"
: "#333";

}


function showFatal(
message
) {

showStatus(
message,
true
);


answerTable.innerHTML = `

<div class="empty">

${escapeHtml(
message
)}

<br><br>

<a
href="/teacher/marking"
class="btn"
>
採点一覧へ戻る
</a>

</div>

`;

}


/* =====================================================
   HELPERS
===================================================== */

function showWarning(
element,
message
) {

element.textContent =
message;

element.classList.add(
"show"
);

}


function getStudentLabel(
answer
) {

const student =
students.get(
answer.student_id
);


if (!student) {

return "未紐付け";

}


return `${student.student_no || ""} / ${student.name || ""}`;

}


function formatNumber(
value
) {

const n =
Number(
value
);


if (
!Number.isFinite(
n
)
) {

return "0";

}


return Number.isInteger(n)
? String(n)
: n.toFixed(1);

}


function setStatus(
message,
error = false
) {

statusEl.textContent =
message;

statusEl.style.color =
error
? "#b42318"
: "#333";

}


function escapeHtml(
value
) {

return String(
value ??
""
)
.replaceAll(
"&",
"&amp;"
)
.replaceAll(
"<",
"&lt;"
)
.replaceAll(
">",
"&gt;"
)
.replaceAll(
'"',
"&quot;"
)
.replaceAll(
"'",
"&#039;"
);

}

})();

</script>
